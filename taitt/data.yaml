text:
- body:
  - chapter[n=1]:
    - paragraph[n=1]:
      - p:
        - Taittirīyopaniṣat //
      - verse[n=1]:
        - p:
          - s[n=a]: āūṃ śrī gurubʰyo namaḥ /
          - s[n=b]: hariḥ āūṃ /
          - s[n=c]: āūṃ śaṃ no mitraḥ śaṃ varuṇaḥ /
          - s[n=d]: śaṃ no bʰavatvaryamā /
          - s[n=e]: śaṃ na indro br̥haspatiḥ /
          - s[n=f]: śaṃ no viṣṇururukramaḥ /
          - s[n=g]: namo brahmaṇe /
          - s[n=h]: namaste vāyo /
          - s[n=i]: tvameva pratyakṣaṃ brahmāsi /
          - s[n=j]: tvāmevapratyakṣaṃ brahma vadiṣyāmi /
          - s[n=k]: r̥taṃ vadiṣyāmi /
          - s[n=l]: satyaṃ vadiṣyāmi /
          - s[n=m]: tanmāmavatu /
          - s[n=n]: tadvaktāramavatu /
          - s[n=o]: avatu mām /
          - s[n=p]: avatu vaktāram /
          - s@colophon[n=q]: āūṃ śāntiḥ śāntiḥ śāntiḥ // 1//
          - s@colophon[n=r]: iti pratʰamo 'nuvākaḥ //
    - paragraph[n=2]:
      - verse[n=1]:
        - p:
          - s[n=a]: āūṃ śīkṣāṃ vyākʰyāsyāmaḥ /
          - s[n=b]: varṇaḥ svaraḥ /
          - s[n=c]: mātrā balam /
          - s[n=d]: sāma santānaḥ /
          - s[n=e]: ityuktaḥ śīkṣādʰyāyaḥ // 1//
          - s@colophon[n=f]: iti dvitīyo 'nuvākaḥ //
    - paragraph[n=3]:
      - verse[n=1]:
        - p:
          - s[n=a]: saha nau yaśaḥ /
          - s[n=b]: saha nau brahmavarcasam /
          - s[n=c]: atʰātaḥ sam̐hitāyā upaniṣidam vyākʰyāsyāmaḥ /
          - s[n=d]: pañcasvadʰikaraṇeṣu /
          - s[n=e]: adʰilokamadʰijyautiṣamadʰividyamadʰiprajamadʰyātmam /
          - s[n=f]: tā mahāsam̐hitāyā ityācakṣate /
          - s[n=g]: atʰādʰilokam /
          - s[n=h]: pr̥tʰivī pūrvarūpam /
          - s[n=i]: dyauruttararūpam /
          - s[n=j]: ākāśaḥ sandʰiḥ // 1//
      - verse[n=2]:
        - p:
          - s[n=a]: vāyuḥ sandʰānam /
          - s[n=b]: ityadʰilokam /
          - s[n=c]: atʰādʰijautiṣam /
          - s[n=d]: agniḥ pūrvarūpam /
          - s[n=e]: āditya uttararūpam /
          - s[n=f]: āpaḥ sandʰiḥ /
          - s[n=g]: vaidyutaḥ sandʰānam /
          - s[n=h]: ityadʰijyautiṣam /
          - s[n=i]: atʰādʰividyam /
          - s[n=j]: ācāryaḥ pūrvarūpam // 2//
      - verse[n=3]:
        - p:
          - s[n=a]: antevāsyuttararūpam /
          - s[n=b]: vidyā sandʰiḥ /
          - s[n=c]: pravacanam̐ sandʰānam /
          - s[n=d]: ityadʰividyam /
          - s[n=e]: atʰādʰiprajam /
          - s[n=f]: mātā pūrvarūpam /
          - s[n=g]: pitottararūpam /
          - s[n=h]: prajā sandʰiḥ /
          - s[n=i]: prajananam̐ sandʰānam /
          - s[n=j]: ityadʰiprajam // 3//
      - verse[n=4]:
        - p:
          - s[n=a]: atʰādʰyātmam /
          - s[n=b]: adʰarā hanuḥ pūrvarūpam /
          - s[n=c]: uttarā hanuruttara rūpam /
          - s[n=d]: vāksandʰiḥ /
          - s[n=e]: jihvāsandʰānam /
          - s[n=f]: ityadʰyātmam /
          - s[n=g]: itīmā mahāsam̐hitāḥ /
          - s[n=h]: ya evametā mahāsam̐hitā vyākʰyātā veda /
          - s[n=i]: sandʰīyate prajayā paśubʰiḥ /
          - s[n=j]: brahmavarcasenānnādyena suvargyeṇa lokena // 4//
          - s@colophon[n=k]: iti tr̥tīyo 'nuvākaḥ //
    - paragraph[n=4]:
      - verse[n=1]:
        - p:
          - s[n=a]: yaścʰandasāmr̥ṣabʰo viśvarūpaḥ /
          - s[n=b]: cʰandobʰyo 'dʰyamr̥tātsaṃbabʰūva /
          - s[n=c]: sa mendro medʰayā spr̥ṇotu /
          - s[n=d]: amr̥tasya deva dʰāraṇo bʰūyāsam /
          - s[n=e]: śarīraṃ me vicarṣaṇam /
          - s[n=f]: jihvā me madʰumattamā /
          - s[n=g]: karṇābʰyāṃ bʰūri viśruvam /
          - s[n=h]: brahmaṇaḥ kośo 'si medʰayā pihitaḥ /
          - s[n=i]: śrutaṃ me gopāya /
          - s[n=j]: āvahantī vitanvānā // 1//
      - verse[n=2]:
        - p:
          - s[n=a]: kurvāṇā 'cīramātmanaḥ /
          - s[n=b]: vāsām̐si mama gāvaśca /
          - s[n=c]: annapāne ca sarvadā /
          - s[n=d]: tato me śriyamāvaha /
          - s[n=e]: lomaśāṃ paśubʰiḥ saha svāhā /
          - s[n=f]: āmāyantu brahmacāriṇaḥ svāhā /
          - s[n=g]: vimā ' 'yantu brahmacāriṇaḥ svāhā /
          - s[n=h]: pramayantu brahmacāriṇaḥ svāhā /
          - s[n=i]: damāyantu brahmacāriṇaḥ svāhā /
          - s[n=j]: śamāyantu brahmacāriṇaḥ svāhā // 2//
      - verse[n=3]:
        - p:
          - s[n=a]: yaśo jane 'sāni svāhā /
          - s[n=b]: śreyān vasyaso 'sāni svāhā /
          - s[n=c]: taṃ tvā bʰaga praviśāni svāhā /
          - s[n=d]: sa mā bʰaga praviśa svāhā /
          - s[n=e]: tasmin sahasraśākʰe nibʰagāhaṃ tvayi mr̥je svāhā /
          - s[n=f]: yatʰā ' 'paḥ pravatā yanti yatʰā māsā aharjaram /
          - s[n=g]: evaṃ māṃ brahmacāriṇaḥ /
          - s[n=h]: dʰātarāyantu sarvataḥ svāhā /
          - s[n=i]: prativeśo 'si pra mā bʰāhi pra mā padyasva // 3//
          - s@colophon[n=j]: iti caturtʰo 'nuvākaḥ //
    - paragraph[n=5]:
      - verse[n=1]:
        - p:
          - s[n=a]: bʰūrbʰuvaḥ suvariti vā etāstisro vyāhr̥tayaḥ /
          - s[n=b]: tāsāmu ha smaitāṃ caturtʰīm /
          - s[n=c]: māhācamasyaḥ pravedayate /
          - s[n=d]: maha iti /
          - s[n=e]: tat brahma /
          - s[n=f]: sa ātmā /
          - s[n=g]: aṅgānyanyā devatāḥ /
          - s[n=h]: bʰūriti vā ayaṃ lokaḥ /
          - s[n=i]: bʰuva ityantarikṣam /
          - s[n=j]: suvarityasau lokaḥ // 1//
      - verse[n=2]:
        - p:
          - s[n=a]: maha ityādityaḥ /
          - s[n=b]: ādityena vāva sarve loka mahīyante /
          - s[n=c]: bʰūriti vā agniḥ /
          - s[n=d]: bʰuva iti vāyuḥ /
          - s[n=e]: suvarityādityaḥ /
          - s[n=f]: maha iti candramāḥ /
          - s[n=g]: candramasā vāva
          - s[n=h]: sarvāṇi jyotim̐ṣi mahīyante /
          - s[n=i]: bʰūriti vā r̥caḥ /
          - s[n=j]: bʰuva iti sāmāni /
          - s[n=k]: suvariti yajūm̐ṣi // 2//
      - verse[n=3]:
        - p:
          - s[n=a]: maha iti brahma /
          - s[n=b]: brahmaṇā vāva sarve vedā mahīyante /
          - s[n=c]: bʰūriti vai prāṇaḥ /
          - s[n=d]: bʰuva ityapānaḥ /
          - s[n=e]: suvariti vyānaḥ /
          - s[n=f]: maha ityannam /
          - s[n=g]: annena vāva sarve prāṇa mahīyante /
          - s[n=h]: tā vā etāścatasraścaturdʰa /
          - s[n=i]: catasraścatasro vyāhr̥tayaḥ /
          - s[n=j]: tā yo veda /
          - s[n=k]: sa veda brahma /
          - s[n=l]: sarve 'smai devā balimāvahanti // 3//
          - s@colophon[n=m]: iti pañcamo 'nuvākaḥ //
    - paragraph[n=6]:
      - verse[n=1]:
        - p:
          - s[n=a]: sa ya eṣo 'ntarahr̥daya ākāśaḥ /
          - s[n=b]: tasminnayaṃ puruṣo manomayaḥ /
          - s[n=c]: amr̥to hiraṇmayaḥ /
          - s[n=d]: antareṇa tāluke /
          - s[n=e]: ya eṣa stana ivāvalaṃbate /
          - s[n=f]: sendrayoniḥ /
          - s[n=g]: yatrāsau keśānto vivartate /
          - s[n=h]: vyapohya śīrṣakapāle /
          - s[n=i]: bʰūrityagnau pratitiṣṭʰati /
          - s[n=j]: bʰuva iti vāyau // 1//
      - verse[n=2]:
        - p:
          - s[n=a]: suvarityāditye /
          - s[n=b]: maha iti brahmaṇi /
          - s[n=c]: āpnoti svārājyam /
          - s[n=d]: āpnoti manasaspatim /
          - s[n=e]: vākpatiścakṣuṣpatiḥ /
          - s[n=f]: śrotraptirvijñānapatiḥ /
          - s[n=g]: etattato bʰavati /
          - s[n=h]: ākāśaśarīraṃ brahma /
          - s[n=i]: satyātma prāṇārāmaṃ mana ānandam /
          - s[n=j]: śānti samr̥ddʰamamr̥tam /
          - s[n=k]: iti prācīnayogyopāssva // 2//
          - s@colophon[n=l]: iti ṣaṣṭʰo 'nuvākaḥ //
    - paragraph[n=7]:
      - verse[n=1]:
        - p:
          - s[n=a]: pr̥tʰivyantarikṣaṃ dyaurdiśo 'vāntaradiśāḥ /
          - s[n=b]: agnirvāyurādityaścandramā nakṣatrāṇi /
          - s[n=c]: āpa oṣadʰayo vanaspataya ākāśa ātmā /
          - s[n=d]: ityadʰibʰūtam /
          - s[n=e]: atʰādʰyātmam /
          - s[n=f]: prāṇo vyāno 'pāna udānaḥ samānaḥ /
          - s[n=g]: cakṣuḥ śrotraṃ mano vāk tvak /
          - s[n=h]: carma mām̐sam̐ snāvāstʰi majjā /
          - s[n=i]: etadadʰividʰāya r̥ṣiravocat /
          - s[n=j]: pāṅktaṃ vā idam̐ sarvam /
          - s[n=k]: pāṅktenaiva pāṅktam̐ spr̥ṇotīti // 1//
          - s@colophon[n=l]: iti saptamo 'nuvākaḥ //
    - paragraph[n=8]:
      - verse[n=1]:
        - p:
          - s[n=a]: omiti brahma /
          - s[n=b]: omitīdam̐ sarvam /
          - s[n=c]: omityetadanukr̥tirha sma vā apyo śrāvayetyāśrāvayanti /
          - s[n=d]: omiti sāmāni gāyanti /
          - s[n=e]: om̐śomiti śastrāṇi śam̐santi /
          - s[n=f]: omityadʰvaryuḥ pratigaraṃ pratigr̥ṇāti /
          - s[n=g]: omiti brahmā prasauti /
          - s[n=h]: omityagnihotramanujānāti /
          - s[n=i]: omiti brāhmaṇaḥ pravakṣyannāha brahmopāpnavānīti /
          - s[n=j]: brahmaivopāpnoti // 1//
          - s@colophon[n=k]: ityaṣṭamo 'nuvākaḥ //
    - paragraph[n=9]:
      - verse[n=1]:
        - p:
          - s[n=a]: r̥taṃ ca svādʰyāyapravacane ca /
          - s[n=b]: satyaṃ ca svādʰyāyapravacane ca /
          - s[n=c]: tapaśca svādʰyāyapravacane ca /
          - s[n=d]: damaśca svādʰyāyapravacane ca /
          - s[n=e]: śamaśca svādʰyāyapravacane ca /
          - s[n=f]: agnayaśca svādʰyāyapravacane ca /
          - s[n=g]: agnihotraṃ ca svādʰyāyapravacane ca /
          - s[n=h]: atitʰayaśca svādʰyāyapravacane ca /
          - s[n=i]: mānuṣaṃ ca svādʰyāyapravacane ca /
          - s[n=j]: prajā ca svādʰyāyapravacane ca /
          - s[n=k]: prajanaśca svādʰyāyapravacane ca /
          - s[n=l]: prajātiśca svādʰyāyapravacane ca /
          - s[n=m]: satyamiti satyavacā rātʰītaraḥ /
          - s[n=n]: tapa iti taponityaḥ pauruśiṣṭiḥ /
          - s[n=o]: svādʰyāyapravacane eveti nāko maudagalyaḥ /
          - s[n=p]: taddʰi tapastaddʰi tapaḥ // 1//
          - s@colophon[n=q]: iti navamo 'nuvākaḥ //
    - paragraph[n=10]:
      - verse[n=1]:
        - p:
          - s[n=a]: ahaṃ vr̥kṣasya rerivā /
          - s[n=b]: kīrtiḥ pr̥ṣṭʰaṃ gireriva /
          - s[n=c]: ūrdʰvapavitro vājinīva svamr̥tamasmi /
          - s[n=d]: draviṇam̐ savarcasam /
          - s[n=e]: sumedʰa amr̥tokṣitaḥ /
          - s[n=f]: iti triśaṅkorvedānuvacanam // 1//
          - s@colophon[n=g]: iti daśamo 'nuvākaḥ //
    - paragraph[n=11]:
      - verse[n=1]:
        - p:
          - s[n=a]: vedamanūcyācāryontevāsinamanuśāsti /
          - s[n=b]: satyaṃ vada /
          - s[n=c]: dʰarmaṃ cara /
          - s[n=d]: svādʰyāyānmā pramadaḥ /
          - s[n=e]: ācāryāya priyaṃ dʰanamāhr̥tya prajātantuṃ mā vyavaccʰetsīḥ /
          - s[n=f]: satyānna pramaditavyam /
          - s[n=g]: dʰarmānna pramaditavyam /
          - s[n=h]: kuśalānna pramaditavyam /
          - s[n=i]: bʰūtyaina pramaditavyam /
          - s[n=j]: svādʰyāyapravacanābʰyāṃ na pramaditavyam // 1//
      - verse[n=2]:
        - p:
          - s[n=a]: devapitr̥kāryābʰyāṃ na pramaditavyam /
          - s[n=b]: mātr̥devo bʰava /
          - s[n=c]: pitr̥devo bʰava /
          - s[n=d]: ācāryadevo bʰava /
          - s[n=e]: atitʰidevo bʰava /
          - s[n=f]: yānyanavadyāni karmāṇi /
          - s[n=g]: tāni sevitavyāni /
          - s[n=h]: no itarāṇi /
          - s[n=i]: yānyasmākam̐ sucaritāni /
          - s[n=j]: tāni tvayopāsyāni // 2//
      - verse[n=3]:
        - p:
          - s[n=a]: no itarāṇi /
          - s[n=b]: ye ke cārumaccʰreyām̐so brāhmaṇāḥ /
          - s[n=c]: teṣāṃ tvayā ' 'sanena praśvasitavyam /
          - s[n=d]: śraddʰayā deyam /
          - s[n=e]: aśraddʰayā 'deyam /
          - s[n=f]: śriyā deyam /
          - s[n=g]: hriyā deyam /
          - s[n=h]: bʰiyā deyam /
          - s[n=i]: sam̐vidā deyam /
          - s[n=j]: atʰa yadi te karmavicikitsā vā vr̥ttavicikitsā vā syāt // 3//
      - verse[n=4]:
        - p:
          - s[n=a]: ye tatra brāhmaṇāḥ saṃmarśinaḥ /
          - s[n=b]: yuktā āyuktāḥ /
          - s[n=c]: alūkṣā dʰarmakāmāḥ syuḥ /
          - s[n=d]: yatʰā te tatra varteran /
          - s[n=e]: tatʰā tatra vartetʰāḥ /
          - s[n=f]: atʰābʰyākʰyāteṣu /
          - s[n=g]: ye tatra brāhmaṇāḥ saṃmarśinaḥ /
          - s[n=h]: yuktā āyuktāḥ /
          - s[n=i]: alūkṣā dʰarmakāmāḥ syuḥ /
          - s[n=j]: yatʰā te teṣu varteran /
          - s[n=k]: tatʰā teṣu vartetʰāḥ /
          - s[n=l]: eṣa ādeśaḥ /
          - s[n=m]: eṣa upadeśaḥ /
          - s[n=n]: eṣā vedopaniṣat /
          - s[n=o]: etadanuśāsanam /
          - s[n=p]: evamupāsitavyam /
          - s[n=q]: evamu caitadupāsyam // 4//
          - s@colophon[n=r]: ityekādaśa 'nuvākaḥ //
    - paragraph[n=12]:
      - verse[n=1]:
        - p:
          - s[n=a]: śaṃ no mitraḥ śaṃ varuṇaḥ /
          - s[n=b]: śaṃ no bʰavatvaryamā /
          - s[n=c]: śaṃ na indro br̥haspatiḥ /
          - s[n=d]: śaṃ no viṣṇururukramaḥ /
          - s[n=e]: namo brahmaṇe /
          - s[n=f]: namaste vāyo /
          - s[n=g]: tvameva pratyakṣaṃ brahmāsi /
          - s[n=h]: tvāmeva pratyakṣaṃ brahmāvādiṣam /
          - s[n=i]: r̥tamavādiṣam /
          - s[n=j]: satyamavādiṣam /
          - s[n=k]: tanmāmāvīt /
          - s[n=l]: tadvaktāramāvīt /
          - s[n=m]: āvīnmām /
          - s[n=n]: āvīt vaktāram /
          - s[n=o]: āūṃ śāntiḥ śāntiḥ śāntiḥ // 1//
          - s@colophon[n=p]: iti dvādaśo 'nuvākaḥ //
          - s@colophon[n=q]: iti śīkṣāvallī samāptā //
  - chapter[n=2]:
    - paragraph[n=1]:
      - verse[n=1]:
        - p:
          - s[n=a]: āūṃ saha nāvavatu /
          - s[n=b]: saha nau bʰunaktu /
          - s[n=c]: saha vīryaṃ karavāvahai /
          - s[n=d]: tejasvi nāvadʰītamastu mā vidviṣāvahai /
          - s[n=e]: āūṃ śāntiḥ śāntiḥ śāntiḥ //
          - s[n=f]: āūṃ brahmavidāpnoti param /
          - s[n=g]: tadeṣā 'bʰuktā /
          - s[n=h]: satyaṃ jñānamanantaṃ brahma /
          - s[n=i]: yo veda nihitaṃ guhāyāṃ parame vyoman /
          - s[n=j]: so 'śnute sarvān kāmān saha /
          - s[n=k]: brahmaṇā vipaściteti //
          - s[n=l]: tasmādvā etasmādātmana ākāśaḥ saṃbʰūtaḥ /
          - s[n=m]: ākāśādvāyuḥ /
          - s[n=n]: vāyoragniḥ /
          - s[n=o]: agnerāpaḥ /
          - s[n=p]: adabʰyaḥ pr̥tʰivī /
          - s[n=q]: pr̥tʰivyā oṣadʰayaḥ /
          - s[n=r]: oṣadʰībʰyonnam /
          - s[n=s]: annātpuruṣaḥ /
          - s[n=t]: sa vā eṣa puruṣo 'nnnarasamayaḥ /
          - s[n=u]: tasyedameva śiraḥ /
          - s[n=v]: ayaṃ dakṣiṇaḥ pakṣaḥ /
          - s[n=w]: ayamuttaraḥ pakṣaḥ /
          - s[n=x]: ayamātmā /
          - s[n=y]: idaṃ puccʰaṃ pratiṣṭʰā /
          - s[n=z]: tadapyeṣa śloko bʰavati // 1//
          - s@colophon[n=aa]: iti pratʰamo 'nuvākaḥ //
    - paragraph[n=2]:
      - verse[n=1]:
        - p:
          - s[n=a]: annādvai prajāḥ prajāyante /
          - s[n=b]: yāḥ kāśca pr̥tʰivīm̐śritāḥ /
