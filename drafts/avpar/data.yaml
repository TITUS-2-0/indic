          | draviṇam | balasya ||53 ||
    - section[n=104]:
      - p: vidyut | vidyut | nemiḥ | paviḥ | vajraḥ | sr̥kaḥ | [yataḥ |] vadʰaḥ |
          arkaḥ | śambaḥ | kuliśaḥ | kutsaḥ | sāyakaḥ | trapuṣī | vajrasya ||54 ||
    - section[n=105]:
      - p: raṇaḥ | raṇaḥ | vivāk | vadanuḥ | vikʰādaḥ | bʰare | krandaḥ | āhāvaḥ |
          sam[an]īke | mamasatyam | nemadʰitiḥ | saṅkā | samanam | spr̥dʰaḥ | pr̥tsu
