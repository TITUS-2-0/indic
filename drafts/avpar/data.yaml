    - section[n=20,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tryaktodumbarasamidʰo dogdʰrī dʰenv aṣṭakapradāḥ | ekāhaṃ bʰaikṣabʰug
          bʰūtvā māsāṣṭakayutasya vā ||
    - section[n=21,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: prādeśāntaṃ bilvavr̥kṣaṃ mūlaśākʰāsamanvitam | kr̥ṣṇāṣṭamyāṃ
