          | madʰu | kaśā |] virāṭ | vācaḥ ||52 ||
    - section[n=103]:
      - p: ojaḥ | ojaḥ | pājaḥ | śavaḥ | śardʰaḥ | tvakṣaḥ | bādʰaḥ | nr̥mṇam | taraḥ
