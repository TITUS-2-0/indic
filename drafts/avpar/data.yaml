    - section[n=31]:
      - ab@verse[n=1]: atʰa rājño 'bʰiprayāṇasyānayanti pradakṣiṇamukʰaṃ śvetam ajaṃ
          brāhmaṇaṃ śuklavāsasam ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: supratiṣṭʰitam avibʰrāntaṃ
