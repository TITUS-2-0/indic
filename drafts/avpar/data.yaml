          yaḥ śānto dvijasattamaḥ | bʰr̥gvaṅgirovid atyartʰaṃ śuciḥ syāt sādʰusaṃmataḥ
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: brahmāṇaṃ taṃ nr̥paḥ kuryād
          dʰotāraṃ sarvavedinam | evam ukte bʰr̥guṃ viprāḥ procur vigatakalmaṣam ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: hotāro bʰūmibʰartr̥̄ṇāṃ
          mahāśānteḥ prakīrtitāḥ | nanu kṣīṇe vidvan svadʰarmapracyute 'pi vā ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: tatra śāntau prayuktāyāṃ
          kasya śāntipʰalaṃ bʰavet | nr̥po 'py adʰārmikaḥ kuryād brahmaṇas tarpaṇaṃ
          purā ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: tataḥ kr̥tā mahāśāntī
          rājānaṃ pāti sarvataḥ | sa vr̥taḥ pāvanaṃ gaccʰed dvijānāṃ pāvanāya vai
          ||
      - ab@verse[n=11]: dvādaśāhaṃ vrataṃ tatra payomūlapʰalāśanaiḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: trīṇi tryahāṇi kurvīta payomūlapʰalaiḥ śubʰaiḥ | anaśnaṃś ca
          tryahaṃ dʰīraḥ sa puraścaraṇo bʰavet ||
      - ab@verse[n=2]: tatʰaikonaṃ śataṃ nr̥̄ṇāṃ śuśrūṣūṇām akalmaṣam | anuktavac
          ca tryahaṃ tat karmaṇaḥ karaṇe kṣamam ||
      - ab@verse[n=3]: kr̥ccʰraṃ cāpi hitaṃ kr̥tvā kuryuḥ karma samāhitāḥ | śuddʰātmāno
          japair homair vaidikair vītamatsarāḥ ||
      - ab@verse[n=4]: tataḥ paraṃ purodʰaḥsu divyaṃ tatram avāpnuyāt | grahātitʰyaṃ
          ca saṃrabʰya diśāṃ yāgaṃ ca sarvataḥ ||
      - ab@verse[n=5]: nakṣatreṣu ca sarveṣu yāgaṃ kr̥tvā vidʰānataḥ | tato 'mr̥tamahāśāntyā
          stʰāpayet padmasaṃbʰavam ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: sāvitryā lakṣahomaṃ tu bʰaume tiṣṭʰed viśāradāḥ | kuryur deyaṃ
          ca dānānāṃ viprebʰyo yasya yat priyam ||
      - ab@verse[n=2]: gobʰūmikāñcanāśvānāṃ ratnānāṃ dʰānyavāsasām | ratʰānāṃ vāraṇānāṃ
          ca dānaṃ kāmam ataḥ param ||
      - ab@verse[n=3]: tuṣyeyur yena vā viprāḥ saṃbʰavo yasya yasya hi | tat tat sarvam
          upādeyam eṣa dānavidʰiḥ smr̥taḥ ||
      - ab@verse[n=4]: dadyāc ca gurave grāmaṃ dʰenuṃ vāsoyugaṃ tatʰā | alaṃkāraiś
          ca saṃpūjya prīṇayet prītamānasaḥ ||
      - ab@verse[n=5]: anena vidʰinā bʰaumam adbʰutaṃ śamayed guruḥ | eṣa eva vidʰir
          jñeyo viyatye 'py adbʰutāśraye ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: viśeṣo 'yaṃ tu sāvitryā daśalakṣāṃs tu homayet | homasamāhitamanāḥ
          kuryāc ca gʰr̥takambalam ||
      - ab@verse[n=2]: dʰenūnāṃ dvādaśaṃ deyaṃ śataniṣkasamanvitam | gurave dīyamānaṃ
          tac cʰamayaty ambarādbʰutam ||
      - ab@verse[n=3]: divyādbʰuteṣu kartavyaḥ koṭihomasamanvitaiḥ | gosahasraṃ ca
          dātavyaṃ gurave dakṣiṇāvidʰiḥ ||
      - ab@verse[n=4]: eṣa prokto vidʰiḥ samyag divyāniṣṭavipatkare | subʰikṣakṣemasaṃpattyā
          prajānāṃ puṣṭivardʰanaḥ ||
      - ab@verse[n=5]: koṭihomeṣu sarveṣu dravyabʰedāśrayaṃ pʰalam | śāntipuṣṭyabʰicārārtʰaṃ
          tan me nigadataḥ śr̥ṇu ||
      - ab@verse[n=6]: saumyavr̥kṣāśrayāḥ kāryāḥ samidʰaḥ śāntim iccʰatā | arkakāśmaryanimbānāṃ
          samidbʰiḥ śatruśātanam ||
      - ab@verse[n=7]: durnāmakaṇṭakambūnāṃ samidbʰiś ca viśeṣataḥ | bʰagnaspʰuṭitavr̥kṣāṇāṃ
          pʰalaṃ śatrunibarhaṇam ||
      - ab@verse[n=8]: bilvapadmotpalānāṃ tu śucideśaprarohiṇām | sarvadā sarvakāmāṃs
          tu homaiḥ prāpnoti mānavaḥ ||
      - ab@verse[n=9]: tilavrīhiyavādīnāṃ dadʰno madʰugʰr̥tasya ca | payogodʰūmaśālīnāṃ
          hotā śāntiṃ samārabʰet ||
      - ab@verse[n=10]: sarveṣāṃ haviṣāṃ caiva gʰr̥taṃ śāntikaraṃ smr̥tam | sarvadravye
          gʰr̥taṃ tasmād dʰome prakṣepam arhati ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yajñopavītinā kāryaṃ śāntikarma vipaścitā | upavītaṃ tu pitryeṣu
          sarveṣv eva samārabʰet ||
      - ab@verse[n=2]: madʰvājyadadʰidugdʰeṣu bʰakṣyamāṇe vilepane | yantravāhanaśastreṣu
          bʰavaneṣv āyudʰeṣu ca ||
      - ab@verse[n=3]: darpaṇe bʰaktapātre ca maṇimuktāpʰaleṣu ca | bʰūṣaṇeṣu tatʰānyeṣu
          śayyāyām āsaneṣu ca ||
      - ab@verse[n=4]: kākolūkakapotānāṃ madʰor vā darśanaṃ bʰavet | anyeṣāṃ cāpraśastānām
          āgamo mr̥gapakṣiṇām ||
      - ab@verse[n=5]: aśvetānāṃ ca puṣpāṇāṃ sarīsr̥pagaṇasya ca | vasālohitamāṃsānām
          astʰimajjāśiroruhām ||5 ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: akasmāc caiva saṃgʰāte darśane nakʰabʰasmanām | rasānyatve
          rasānāṃ ca durgandʰe vānimittaje ||
      - ab@verse[n=2]: padmapuṣpākr̥tir yatra dr̥śyate madʰusarpiṣi | kr̥sarāpāyase
          caiva kṣayas tasya dʰanāyuṣoḥ ||
      - ab@verse[n=3]: gʰr̥te vā madʰudadʰni vā yadā padmākr̥tir bʰavet | svastiko
          vāpi dr̥śyeta tadā maraṇam ādiśet ||
      - ab@verse[n=4]: vikāro yatra dr̥śyeta kṣīrodanahavihṣu vā | śrotriyāya tu tad
          dadyād bʰāvaiva śamayen naraḥ ||
      - ab@verse[n=5]: yatrastʰaṃ cādbʰutaṃ paśyet tatrāpi pratipādayet | kuryād vā
          vāruṇīṃ śāntiṃ parameṇa samādʰinā ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: anyākr̥tiṣu vāpy etad ye stʰāne śāntikārakāḥ | teṣām atʰākṣayaṃ
          vidyād āyuṣārtʰadʰanena vā ||
      - ab@verse[n=2]: calite jvalite pāte spʰurita utpatite tatʰā | mahājanagajāśvānāṃ
          stʰāne vidyān mahad bʰayam ||
      - ab@verse[n=3]: tatra yudʰyanti jātīnāṃ bʰayaṃ tat syād asaṃśayam | tatrāpi
          cārtʰanicayaiḥ paśubʰir vidyayāpi vā ||
      - ab@verse[n=4]: utpātaśamanārtʰaṃ tu ye kriyā na prayuñjate | narāḥ kṣipraṃ
          vinaśyante sānvayāḥ sapariccʰadāḥ ||
      - ab@verse[n=5]: viprāṇāṃ bʰojanaṃ kāryaṃ sahasrasyāyutasya vā | balipuṣpopahāraiś
          ca devatānāṃ prasādanam ||
      - ab@verse[n=6]: kartavyaṃ ca yatʰānyāyaṃ śāntikarma vipaścitā | evaṃ kr̥te
          bʰayaṃ sarvaṃ tatkṣaṇād eva naśyati ||
    - section[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: śubʰāśubʰastʰitaṃ caiva munayo bʰr̥gum abruvan | sa pratyuvāca
          puruṣu saṃvatsarasamāśraye ||
      - ab@verse[n=2]: śītoṣṇavr̥ṣṭikāleṣu vītadoṣeṣu sarvadā | saṃvatsarākʰyaḥ puruṣo
          nirupadrava ucyate ||
      - ab@verse[n=3]: yadi nirgʰātabʰūkampadigdāhādivivarjitaḥ | ketubʰiś caiva yujyeta
          yadi vādityakīlakaiḥ ||
      - ab@verse[n=4]: anyair vā lokanāśārtʰair adbʰutair nāśanākulaiḥ | tata eṣa
          viśuddʰātmā puruṣaḥ sukʰam edʰate ||
      - ab@verse[n=5]: atʰa cet sa bahuvidʰair adbʰutaiḥ parisaṃyutaḥ | saṃvatsaraṃ
          bʰavec cʰīgʰraṃ kuryus taccʰamanaṃ budʰāḥ ||
    - section[n=9]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: tatra śāntiṃ pravakṣyāmi
          sarvapāpapraṇāśinīm | divyatantravid ācāryo yayā pʰalam avāpnuyāt ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: pūrvaṃ tāvad viśuddʰātmā
          sa puraścaraṇo bʰavet | devatānāṃ tato yāgaṃ yatʰāśruti samācaret ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: yāgaṃ kr̥tvā grahāṇāṃ
          tu nakṣatrāṇāṃ tataḥ param | r̥tūn atʰārtavāṃś caiva mahādevagaṇādʰipān
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: diśaś ca vidiśaś caiva
          yamendravaruṇāṃs tatʰā | viśveśvaraṃ ca viṣṇuṃ ca yajetādbʰutakarma ca ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: sūryācandramasāv agniṃ
          sarvān grahagaṇāṃs tatʰā | vāyuṃ tatʰāśvinau caiva mahāśāntiṃ vidʰānataḥ
          ||
      - ab@verse[n=6]: kuryād devādr̥to dʰīmān evaṃ doṣaḥ praśāmyati ||
    - section[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: śvetaṃ vā bʰavati payo vilohitaṃ vā pītaṃ vā bʰavati hi kr̥ṣṇapiṅgalaṃ
          vā | utpātaḥ pʰalati yatʰā catuḥprakāras tat sarvaṃ śr̥ṇuta samāsato mayoktam
          ||
      - ab@verse[n=2]: viprāṇāṃ bʰavati hi śuklam ambudoṣe rājānaṃ sapadi nihanti
          lohitaṃ ca | pītaṃ ced bʰavati nihanti vaiśyavargaṃ śūdrāṇāṃ bʰavati hi
          kr̥ṣṇapiṅgadoṣe ||
      - ab@verse[n=3]: bījaṃ yatra praroheta pʰalam atʰa pramādataḥ | etad atyadbʰutaṃ
          nāma dampatyos tu vināśanam ||
      - ab@verse[n=4]: apūjanāt tu pūjyasya tatʰāpūjyasya pūjanāt | antaḥkaraṇadoṣāc
          ca hetoḥ śāntir na jāyate ||
      - ab@verse[n=5]: tasmād vedārtʰaśāstrajñān vītarāgān amatsarān | paricārakamukʰyāṃś
          ca kārayet kuśalān dvijān ||
    - section[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: vicāritaṃ ca vidvadbʰir niścitaṃ sudʰiyā punaḥ | deśakālasamāyuktaṃ
          karma kuryād vicakṣaṇaḥ ||
      - ab@verse[n=2]: codite karmaṇy anyasmin nānyat kuryād vidʰānavit | na ca prārabʰya
          karmāṇi stʰātavyaṃ kva cid antare ||
      - ab@verse[n=3]: nāpi kurvīta matimān kadā cit karmasaṃkaram | kurvaṃs tu na
          tatʰā karma doṣam utpādayed bʰr̥śam ||
      - ab@verse[n=4]: anyatʰākaraṇe doṣān samīkṣya tu bahūn iha | saṃkalpavān na
          samāptiḥ [sāvīryākr̥tikarmaṇī] ||
      - ab@verse[n=5]: dr̥ṣṭvādbʰutaṃ tu kārtsnyena tataḥ śāntiṃ samārabʰet | asamīkṣya
          tu kurvāṇo na śāntiṃ labʰate naraḥ ||
    - section[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: vātikasya yatʰā vaidyaḥ paittikasya ca niścaye | rogasya bʰaiṣaje
          datte karmasiddʰim avāpnuyāt ||
      - ab@verse[n=2]: tasmāt tāvat parīkṣeta yāvan niṣpannam adbʰutam | asadasyasadasyānāṃ
          kartuḥ kārayitus tatʰā ||
      - ab@verse[n=3]: viguṇaṃ kriyamāṇaṃ tu karma kuryād upadravam | viśeṣato nihanyeta
          kartāraṃ sapariccʰadam ||
      - ab@verse[n=4]: hetuśrutaṃ ca dr̥ṣṭaṃ ca tasmāt sāguṇyam ācaret | saguṇe ca
          kr̥te tasmin sarvasaṃpad bʰaved dʰruvam ||
      - ab@verse[n=5]: aśokapuṣpair home tu madʰukṣīrasamanvitaiḥ | prāpnoti sukr̥tair
          vipro gandʰarvapadam uttamam ||
      - ab@verse[n=6]: brahmādistambaparyantaṃ yaṃ yaṃ kāmaṃ samīhate | tat tat prāpnoty
          ayatnena satyam etad dvijottamāḥ ||
  - pariśiṣṭa[n=70b]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: gārgyāṇi
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ praṇamya viṣṭarāsīnāṃ brahmāṇaṃ kavisattamam | praṇamya
          śirasā devaṃ gautamaḥ paryapr̥ccʰata ||
      - ab@verse[n=2]: adbʰutāni suraśreṣṭʰa prajānām ahitāya vai | śamanaṃ ca tatʰā
          teṣāṃ prabrūhi vinayena me ||
      - ab@verse[n=3]: tasya tad vacanaṃ śrutvā brahmā lokapitāmahaḥ | abravīt paramaḥ
          prītaḥ sarvotpātapratikriyām ||
      - ab@verse[n=4]: śr̥ṇu vatsa yatʰānyāyaṃ dvādaśādʰyāyasaṃgraham | pracyamānam
          aśeṣaṃ taṃ vātavaikr̥tanoditam ||
      - ab@verse[n=5]: yasmāc ca vāyur valavāñ śreṣṭʰaḥ sarvādbʰutodbʰavaḥ | tasmāt
          tam eva pratʰamaṃ pravakṣyāmi yatʰāvidʰi ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yānti yānāny ayuktāni vinā nr̥bʰis tatʰā | yuktāni vā na gaccʰanti
          narendrāṇāṃ mahad bʰayam ||
      - ab@verse[n=2]: bʰeryo mr̥daṅgāḥ paṭahā vādyante vāpy anāhatāḥ | āhatāś ca
          na vādyante acalāni calanti vā ||
      - ab@verse[n=3]: araṇye tūryanirgʰoṣo yadi śrūyeta nābʰasaḥ | śarīraṃ vyatʰate
          tatra yadi vā veśmani śrutaḥ ||
      - ab@verse[n=4]: śrūyante ca mahāśabdā gītagāndʰarvanisvanāḥ | śarīraṃ bādʰyate
          tatra vyādʰir vā sumahān bʰavet ||
      - ab@verse[n=5]: koṣṭʰe vā patate yatra hastād darvī kadā cana | patate musalaṃ
          cāpi śūrpaṃ vā dʰūyate yadi ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: golāṅgalānāṃ saṃsargo vikāraś candrasūryayoḥ | nārīṃ vā dʰayate
          nārī jāyate tumulaṃ bʰayam ||
      - ab@verse[n=2]: pratyāharanti sarpanti stambʰaprāsādapādapāḥ | śayanāsanayānāni
          niyataṃ nr̥pater vadʰaḥ ||
      - ab@verse[n=3]: vāti cākālilo vāyur gʰoraḥ śarkarakarṣaṇaḥ | pātayan vr̥kṣaveśmāni
          kalpānta iva bʰīṣaṇaḥ ||
      - ab@verse[n=4]: saptāham atʰa vā pakṣaṃ nibadʰnāty atidāruṇam | tryahād yadi
          na varṣeta gʰoraṃ śastrabʰayaṃ bʰavet ||
      - ab@verse[n=5]: vāyavyeṣv eva nr̥patir vāyuṃ saptabʰir arcayet | dvāv imāv
          iti tisro hi japtavyāḥ prayatair dvijaiḥ ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: bahvannadakṣiṇo homaḥ kartavyo 'tiprayatnataḥ | vāyavyām eva
          śāntau ca vāyoḥ savitur āvapet ||
      - ab@verse[n=2]: ādāv ante ca madʰye ca tatʰaivam anuyojayet | gurave dakṣiṇāṃ
          dadyād vāyavīśāntisiddʰaye ||
      - ab@verse[n=3]: yamakaṃ jāyate puṣpaṃ pʰalaṃ vā yamakaṃ yadi | kumudotpalapadmāni
          ekanāle bahūny api ||
      - ab@verse[n=4]: bahuśīrṣā dviśīrṣā vā tatʰānyaprasavā api | yavā vā vrīhayo
          vāpi svāmino maraṇāya te ||
      - ab@verse[n=5]: ekavr̥kṣe ca saṃpaśyen nānātvaṃ pʰalapuṣpayoḥ | vyatyāsam anyatʰātvaṃ
          vā paracakrāgamo bʰavet ||
    - section[n=5]:
      - p: '[The manuscripts contain no kʰaṇḍikā five.]'
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: anr̥tu pʰalapuṣpaṃ vā na yatʰartu pʰalanti vā | oṣadʰīvīrudʰo
          vāpi janamārabʰayaṃ bʰavet ||
      - ab@verse[n=2]: atʰa dʰānyaviparyāse abʰadraṃ cāpi śaṃsati | tilā vā samatailāḥ
          syuḥ surātailā bʰavanti vā ||
      - ab@verse[n=3]: agrāmyaṃ kārayet puṣpaṃ pʰalaṃ vā vikr̥taṃ nr̥paḥ | dʰānyānāṃ
          vaikr̥te kṣetraṃ saha sasyena dāpayet ||
      - ab@verse[n=4]: sauryaṃ caruṃ puṣpapʰale vikr̥te paśum eva ca | kṣaitrapatyaṃ
          ca bʰaumaṃ ca nirvapet sasyavaikr̥te ||
      - ab@verse[n=5]: sauryī śāntiḥ prayoktavyā sauryair mantrair yatʰāvidʰi | uccā
          patantam ity r̥gbʰyāṃ garbʰaṃ tu parikīrtitam ||
    - section[n=7]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰaumena cānuvākena garbʰayet
          sasyavaikr̥te | sadakṣiṇair dvijair bʰuktaiḥ kartāraṃ cārcayet tataḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: pureṣu yeṣu dr̥śyante
          pādapā devacoditāḥ | rudanto vā hasanto vā sravanto vā bahūn rasān ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: arogā vā nivāte ca śākʰā
          muñcanty asaṃbʰrame | pʰalaṃ puṣpaṃ tatʰā bālā darśayantīti hāsanam ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: sarvāvastʰāṃ darśayantaḥ
          pʰalapuṣpam anārtavam | [kṣipraṃ tatra bʰayaṃ gʰoraṃ gʰoraṃ pravaryteta
          caturvidʰam ||
