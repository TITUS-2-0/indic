          | antarikṣasya ca | parāṇi tadāyatanānām ||57 ||
    - section[n=109]:
      - p: '[hiruk | hiruk |] āke | parācaiḥ | āre | parāvate | iti dūrasya ||58 ||'
    - section[n=110]:
      - p: vibʰāvarī | vibʰāvari | sūnarī | [bʰāvatī | sunarī] bʰāsvarī | ahanā |
          dyotanā | śvetyā | aruṣī | sūnr̥tāvarī | uṣasaḥ ||59 ||
    - section[n=111]:
      - p: vastoḥ | vastoḥ | bʰānuḥ | vāsaram | svasarāṇi | gʰraṃsaḥ | gʰarmaḥ | gʰr̥ṇiḥ
          | divā | dinam | dive<dive> | dyavidyavi | ahnaḥ ||60 ||
