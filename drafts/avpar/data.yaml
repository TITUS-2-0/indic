      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: purohitaṃ puraskr̥tya
          suhr̥do mantriṇas tatʰā | evaṃ prayāto labʰate vijayaṃ nātra saṃśayaḥ ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: kalyāṇanāmadʰeyaṃ ca gajam
          avyaṅgadarśanam | kumārīṃ dadʰipātreṇa gr̥hītena svalaṃkr̥tām ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: yadi ced adʰigo jālmi
          sūryācandramasor gr̥he | aśvinā rāsabʰendreṇa yānaṃ kuryāt pradakṣiṇam ||
    - section[n=32]:
      - ab@verse[n=1]: prādakṣiṇyam agner gavāṃ brāhmaṇānāṃ rājño ratʰasya [naravāhanasya
          śakaṭasya] caturyuktasya ṣaḍyuktāṣṭayuktasya ca
