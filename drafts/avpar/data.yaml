          | mahādʰane | pr̥tanā | jyeṣṭʰaḥ | saṃgrāmasya ||55 ||
    - section[n=106]:
      - p: '[kʰare | svāram | suṣṭi |] nu | nu | makṣu | dravat | oṣam | jīrāḥ | jūrṇiḥ
          | śūrtāḥ | śūgʰanāḥ | śībʰam | tr̥ṣu | tūyam | tūrṇiḥ | ajiram | bʰuraṇyuḥ
          | āśu | prāśu | tūtujānaḥ | tūtujiḥ | tujyamānāsaḥ | ajrāḥ | sācīvit | dyugat
          | tājat | taraṇiḥ | vātaraṃhā | kṣiprasya ||56 ||'
