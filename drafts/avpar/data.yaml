      - ab@verse[n=2]: pāyasaṃ sarpiṣā miśraṃ dvijātīn bʰojayet tataḥ | tebʰya eva
          yatʰāśaktyā dakṣiṇāṃ dāpayen nr̥paḥ ||
      - ab@verse[n=3]: agnir bʰūmyām iti tribʰir āgneyaṃ tatra kārayet | gurave dakṣiṇāṃ
          dadyān niṣkam aśvaṃ ca sundaram ||
    - section[n=23]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: gārgyeṇoktaṃ pravakṣyāmi
          kr̥tsnam utpātalakṣaṇam | bʰūmikampo bʰaved yatra devatāpratimā haset ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: devatā bʰramate yatra
          mr̥tyus tatra vinirdiśet | garjanaṃ vāpi kūpānām upasargas tu jāyate ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: pratisrotavahā nadyo bʰavanti
          ca katʰaṃ cana | ṣaḍbʰir māsair vijānīyāt paracakrābʰimarśanam ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: akālajaṃ pʰalaṃ puṣpaṃ
          śītoṣṇatvam akālajam | anyaṃ svāminam iccʰanti nadyaś cākālasaṃbʰavāḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: acalaṃ ca calaṃ yatra
          calaṃ vā<py> acalaṃ bʰavet | rājā vinaśyate tara deśo vāpi vinaśyati ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: divā tārā yatra paśyec
          cʰvetaḥ pakṣy atʰa vā bʰavet | rātrau cendrāyudʰaṃ paśyed deśabʰaṅgaṃ vinirdiśet
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: śaśakaṃ jambukaṃ vāpi
          sūkaraṃ hariṇaṃ tatʰā | stʰānamadʰye yadā paśyec cʰūnyaṃ bʰavati niścayam
          ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: araṇyamr̥gajātīyāḥ svayaṃ
          yānti nr̥pālayam | tat stʰānaṃ tu bʰavec cʰūnyaṃ bʰagnaprākāratoraṇam ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: prākāraveśmabʰiṭṭīṣu toraṇe
          gokule 'pi vā | madʰūni yatra dr̥śyante tatra vai kasya kiṃ pʰalam ||........................
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: kālanaṣṭapatʰaṃ sīmāṃ
          tr̥ṇavallīsamākulām | sa deśo mānuṣair mukto mr̥gāṇāṃ gocaro bʰavet ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: pratyādityaṃ yadā paśyet
          pure devakule 'pi vā | api śakrasamo rājā abdamadʰye vinaśyati ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: vāpīkūpataḍāgeṣu nadyāṃ
          vā tarate śilā | rājabʰaṅgaṃ bʰavec caiva cauravyādʰibʰayaṃ tatʰā ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: rājagāmiṣu puṣpeṣu vastreṣv
          ābʰaraṇeṣu ca | anagninā yadi dahet parigʰaṃ tatra vai dʰruvam ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: tat pātaparityakta kadā
          cid api budʰasyādayaṃ bʰavati | dahanaṃ pavanajalamaraṇarogarakṣakṣayāya
          buddʰivāk karoti budʰaḥ ||
      - ab@verse[n=15]: tatra kuryān mahāśāntim amr̥tāṃ viśvabʰeṣajīm ||
  - pariśiṣṭa[n=70c]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: bārhaspatyāni
    - section[n=22,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om āsīnaṃ tu himavati br̥haspatiṃ sukʰāvaham | gautamaḥ paripr̥ccʰati
          vinayāt saṃśitavrataḥ ||
      - ab@verse[n=2]: katʰam agniḥ parīkṣyo 'yaṃ mantrakarmaṇi śobʰanaḥ | svarūpaṃ
          jñāpaya tvaṃ hi śubʰāśubʰanibodʰane ||
    - section[n=23,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: br̥haspatiḥ pratyāha taṃ gautam || śvetaḥ sugandʰiḥ padmābʰo
          nirbʰūmo dundubʰisvanaḥ | asakto 'muṭitaśikʰaḥ snigdʰottʰāyī pradakṣiṇaḥ
          ||
      - ab@verse[n=2]: hūyamānaḥ pradīptaḥ syād dīptatejāḥ sukʰapradaḥ | śāntikarmaṇi
          yatrāgnir niyataṃ siddʰilakṣaṇam ||
      - ab@verse[n=3]: svastikā vardʰamānā ca śrīvatsā ca pradakṣiṇā | jvālārūpeṇa
          dr̥śyeta sā vai śrīḥ sarvatomukʰī ||
      - ab@verse[n=4]: yadā hotra prasannena hūyamāno yatʰā śikʰī | gʰoṣam utpādayan
          snigdʰaṃ kalyāṇaṃ tad vinirdiśet ||
      - ab@verse[n=5]: dīptaś ca ratnasaṃkāśaḥ kṣemo dundubʰivad gʰanaḥ | dʰūmaḥ praśasto
          bʰavati svārtʰasiddʰikaro nr̥ṇam ||
    - section[n=24,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: snigdʰagʰoṣo 'lpadʰūmaś ca gauravarṇo mahān bʰavet | piṇḍitārcir
          vapuṣmān vā pāvakaḥ siddʰikārakaḥ ||
      - ab@verse[n=2]: yadā tv agniḥ sarvadiktʰā jvālāgraiḥ spr̥śate haviḥ | tadāsya
          nr̥patiḥ śīgʰraṃ pararāṣṭraṃ ca mardati ||
      - ab@verse[n=3]: tiṣṭʰantaṃ stʰāvaraṃ snigdʰaṃ śrūyate yatra gītakam | vācaḥ
          prasannā homeṣu maṅgalyāś caiva siddʰaye ||
      - ab@verse[n=4]: kokilasya māyurasya bʰāsasya kuralasya ca | homeṣu śravaṇaṃ
          caiva prādakṣiṇyaṃ ca śasyate ||
      - ab@verse[n=5]: śatapattrā rudantī ca cāṣasya nandanaṃ tatʰā | rambʰaṇaṃ caiva
          dʰenūnāṃ havaneṣu praśasyate ||
    - section[n=25,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: padmavaiḍūryanikāśā vāditrāṇāṃ ca nisvanāḥ | gāvaḥ savarṇavatsā
          ca dr̥ṣṭā home praśasyate ||
      - ab@verse[n=2]: vikāsipadmasadr̥śaḥ prasannārcir hutāśanaḥ | susamānābʰir arcābʰiḥ
          snigdʰābʰir anupūrvaśaḥ ||
      - ab@verse[n=3]: gambʰīraṃ nardate yatra tad agryaṃ siddʰilakṣaṇam | akṣatān
          pʰalapuṣpāṇi vardʰamānam apāṃ gʰaṭam ||
      - ab@verse[n=4]: dr̥ṣṭvā vā yadi vā śrutvā karmasiddʰiṃ samādiśet | pīṭʰacʰattradʰvajanibʰā
          jvālā vāraṇasaṃnibʰāḥ ||
      - ab@verse[n=5]: praśastā ujjvalāś caiva vajrakuṇḍalasaṃnibʰāḥ | pradakṣiṇagatiḥ
          śrīmān agniḥ kartur manoharaḥ | yasya syād vijayaṃ kuryāt kṣipraṃ narapater
          dʰruvam ||
    - section[n=26,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: bʰūmyāṃ megʰābʰivr̥ṣṭānāṃ madʰupāyasasarpiṣām | kr̥ṣṇavartmā
          sugandʰiḥ syāj jayaṃ kṣitipater vadet ||
      - ab@verse[n=2]: śaṅkʰasvastikarūpāṇi cakrarūpaṃ tatʰā gadā | śiromālā ca dr̥śyeta
          tad vai vijayalakṣaṇam ||
      - ab@verse[n=3]: gʰr̥tavarṇanibʰas tv agniḥ snigdʰagʰoṣo mahāsvanaḥ | citrabʰānuḥ
          prasanno vā niyataṃ siddʰilakṣaṇam ||
      - ab@verse[n=4]: mr̥gapakṣiṇa āraṇyāḥ praviśanti yadā puram | grāmyā vā tyaktvā
          nagaram araṇyaṃ yānti nirbʰayāḥ ||
      - ab@verse[n=5]: divā rātricarā vāpi rātrau vāpi divācarāḥ | divā vā puramadʰyastʰā
          gʰoraṃ vāśyanti nirbʰayāḥ ||
    - section[n=27,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: rājadvāre puradvāre śivā vāpy aśubʰaṃ vadet | [tyaktvāraṇyaṃ
          ca tiṣṭʰanti nagaraṃ mr̥gapakṣiṇaḥ] ||
      - ab@verse[n=2]: āṣāḍʰe śrāvaṇe vāpi śūnyaṃ bʰavati tatpuram | [tyaktvā siṃhāḥ
          sahariṇā mūṣikaṃ sūkaraṃ rurum ||
      - ab@verse[n=3]: dr̥ṣṭvā praviṣṭān nagare śūnyaṃ bʰavati tatpuram] | abʰivācaṃ
          vadante ca paśavyā mr̥gapakṣiṇaḥ ||
      - ab@verse[n=4]: śyenā gr̥dʰrā bakāḥ kākāḥ sarve maṇḍalacāriṇaḥ | vāśante bʰairavaṃ
          yatra tad apy āśu vinaśyati ||
      - ab@verse[n=5]: niśāyāṃ bahavaḥ śvāno roruvanti yadā tu te | hanyamānā na gaccʰanti
          tatra vāso na rocate ||
      - ab@verse[n=6]: prāsādadʰvajaśālāsu prākāradvāratoraṇaiḥ | gardabʰar̥śyabʰāsānāṃ
          piṇḍān dr̥ṣṭvā puraṃ tyajet ||
      - ab@verse[n=7]: pūrvamukʰaś ca saṃdʰyāyām apraśāntasvaro mr̥gaḥ | grāmīṇagʰātaṃ
          śaṃset sa grāmaṇyapraticārataḥ ||
      - ab@verse[n=8]: grāmadvāre ca vāśyeta vanād āgatya jambukaḥ | tīkṣṇasvareṇa
          mahatā diṣṭo grāmavadʰo hi saḥ ||
      - ab@verse[n=9]: yad yāti veśma kapotaḥ praviśeta viśeṣataḥ | rājaveśmany ulūko
          vā tat tyājyam acirād gr̥ham ||
      - ab@verse[n=10]: akasmād veśmaprākāre prāsāde toraṇe dʰvaje | patanti bahavo
          gr̥dʰrāḥ kākolūkā bakaiḥ saha ||
    - section[n=28,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: atʰāpy eteṣu stʰāneṣu madʰu saṃjāyate yadā | nalinī caiva valmīkaḥ
          ṣaṇmāsair mriyate nr̥paḥ ||
      - ab@verse[n=2]: mr̥gaḥ paśur vā pakṣī vā sūkaro vāpi vāśyate | yadi cottʰāya
          śr̥ṇute sa manuṣyo vinaśyati ||
      - ab@verse[n=3]: kākamūṣikamārjārāñ śvapataṃgān bʰayāvahān | atīva bahuśo dr̥ṣṭvā
          durbʰikṣeṇa kṣayaṃ vadet ||
      - ab@verse[n=4]: śvānaḥ śivābʰir vāśyanto bʰramantaḥ puramadʰyataḥ | astʰīni
          vā mr̥tādīnāṃ janamārabʰayaṃkarāḥ ||
      - ab@verse[n=5]: kāṣṭʰaṃ vā yadi vā śr̥ṅgaṃ gr̥hītvā śunakaḥ svayam | grāmamadʰyena
          dʰāvan syāt tatʰaivāhur mahad bʰayam ||
    - section[n=29,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: purohitas tu kurvīta kāpotīṃ śāntim uttamām | devāḥ kapota
          iti ca sūktaṃ tatra samādiśet ||
      - ab@verse[n=2]: āvāpe vyatiṣaṅge ca upariṣṭāc ca hūyate | kāmikāṃ dakṣiṇāṃ
          dadyād gurur vā yena tuṣyati ||
      - ab@verse[n=3]: devatārcāḥ pranr̥tyanti dīpyanti prajvalanti vā | udvijanti
          rudante vā prasvidyante hasanti vā ||
      - ab@verse[n=4]: uttiṣṭʰanti niṣīdanti pradʰāvanti pibanti vā | ejanti vikṣipante
          vā gātrapraharaṇadʰvajān ||
      - ab@verse[n=5]: avāṅmukʰā vadante vā stʰānāt stʰānaṃ vrajanti vā | vapante
          vāgnim udakaṃ snehaṃ raktaṃ payo vasām ||
    - section[n=30,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: jalpanti vā niśvasanti viceṣṭante rudanti vā | citraṃ saṃvīkṣyate
          yatra gātrair vāpi viceṣṭitaiḥ ||
      - ab@verse[n=2]: yatraite saṃpradr̥śyante vikārāḥ sahasottʰitāḥ | liṅgāyatanacaityeṣu
          tatra vāso na rocate ||
      - ab@verse[n=3]: rājño vā vyasanaṃ tatra sa vā deṣaḥ pralīyate | kṣucśastramaraṇair
          vāpi kiṃ cit tatrābʰiśasyate ||
      - ab@verse[n=4]: devatāyatanair vāpi prayātāḥ sumahotsavaiḥ | japahomaś ca kalpantā
          sīdatāṃ ca same patʰi ||
      - ab@verse[n=5]: same pātam akasmāc ca udāsīnāṃ tatʰaiva ca | dr̥śyate tad vināśāya
          rājño janapadasya vā ||
    - section[n=31,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yatra prastʰāni bʰūtāni liṅgasyāyatanāni ca | tatra śāmyanti
          gʰorāṇi japahomaś ca kalpate ||
      - ab@verse[n=2]: prasādaḥ puṇḍarīkaṃ vā viśīryeta pateta vā | vātavajrahato
          vāpi puramukʰye bʰayaṃ bʰavet ||
      - ab@verse[n=3]: pitāmahasya dʰarmeṣu yan nimittaṃ dvijeṣu tat | aśvakrāntāgniyāneṣu
          yāni tāni purohite ||
      - ab@verse[n=4]: paśūnāṃ rudrajaṃ jñeyaṃ nr̥pāṇāṃ lokapālajam | jñeyaṃ māṇḍalikānāṃ
          ca yat tat skandaviśākʰayoḥ ||
      - ab@verse[n=5]: laukikaṃ vaiṣṇavaṃ jñeyaṃ vaiśvadevaṃ ca sarvadā | senāpatau
          gaṇeśānāṃ gāndʰarvaṃ saciveṣu ca ||
      - ab@verse[n=6]: devapreṣyaṃ nr̥papreṣye devastrīṇāṃ nr̥pastriyām | kāśyapaṃ
          yantraprāsāde vāstoṣpatyaṃ pure stʰitam ||
      - ab@verse[n=7]: kumārīṣu kumārījaṃ kumāreṣu kumārajam | yakṣarākṣasanāgaiś
          ca yatʰoktaiḥ pānakarma ca ||
    - section[n=32]:
      - ab@verse[n=1]: atʰātaḥ sarvasarvasamuccʰayaḥ ekam adʰyāyaṃ vyākʰyāsyāmo yatʰovāca
          bʰagavān br̥haspatiḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yad dvādaśabʰir adʰyāyair
          vyākʰyānaṃ parikīrtitam | tat samāsena bʰūyo 'pi śr̥ṇu paryāyam āgatam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: parājito rāhunipīḍitamaṇḍalo
          vivarṇaḥ saṃdʰyāvikr̥to niḥprabʰo yadā | astamanaṃ yāti divākaraḥ tadāśu
          vidyāt subrahmajanakṣayam ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: gr̥hīto rāhuṇā sārdʰam
          uttiṣṭʰati divākaraḥ | tadā dʰarmapʰalaṃ kṣīṇaṃ kalim āviśate prajā ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: amukto rāhuṇā sārdʰam
          uttiṣṭʰati yadā śaśī | tadā dʰarmapʰalaṃ kṣīṇaṃ kalim āviśate prajā ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: amukto rāhuṇā sārdʰam
          astaṃ gaccʰati candramāḥ | tadā tato bʰayaṃ vidyān mr̥tyum āviśate prajā
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: avādyamānāḥ paṭahāḥ pravadanti
          muhurmuhuḥ | śastrāṇi vāhanāni ca jvalanty aśubʰadāruṇam ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: vātaprakopo rajasānuviddʰā
          diśaś ca saṃdʰyā ca gʰanānuyātā | drakṣanti saṃdʰyā yadi pañcavarṇā bʰayāni
          rājñaḥ prativedayanti ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: anabʰre stanate yatra
          nabʰogulma gulmāyate | kṣipraṃ vidravate rāṣṭraṃ daśavarṣāṇi pañca ca ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: anabʰre patate vidyud
          darśayed vāgʰanottʰitām | anabʰre vāpi nirgʰātaḥ patito rājamr̥tyave ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: yady ahni vāteṣu mahendrarekʰā
          mahendracāpaḥ samudeti rātrau | tadā bʰayaṃ pārtʰivamaṇḍalānāṃ vadanti śāstrārtʰavido
          dvijendrāḥ ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: nikalkayukto niśi sendracāpo
          vivardʰamānaḥ samudeti rātrau | viśīryamāṇā patate tatʰolkā tadā bʰayaṃ
          pārtʰivamaṇḍalānām ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: muñcanti nāgā rudʰiraṃ
          karaiś ca lomāni dīpyanti turaṃgamāṇām | dīpyanti kʰaḍgāni ca kʰecarāṇi
          cihnāni rājñaḥ prativedayanti ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: girivarapatanaṃ svabʰūmicālaḥ
          pratibʰayatā ca tatʰaiva mānuṣāṇām | vikr̥tajananam uktim ugravācā mahati
          bʰaye mr̥gapakṣiṇo vadanti ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: cʰattre gr̥he vāsaratʰe
          dʰvaje ca dʰūmaḥ samuttiṣṭʰati yasya cāgniḥ | sa pārtʰivaḥ kṣīnamanuṣyakośaḥ
          prāpnoti nāśaṃ ca janakṣayaṃ ca ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: mahormibʰiḥ svair vitatair
          jalogʰair nadyaḥ svakūlāc ca haranti vr̥kṣān | yadi pratisrotavahās tadā
          syur vināśanā deśaparā nr̥pasya ||
      - ab@verse[n=17,lg=san-Latn-x-vedic-metric-unacc-tld]: yadā tu gʰāte ca divākaraprabʰāḥ
          svareṇubʰir vāpi vidʰūmasaṃbʰramāḥ | na tasya vāsaṃ viṣaye vadanti āhur
          gaṇānāṃ ca vivr̥ddʰināśaḥ ||
      - ab@verse[n=18,lg=san-Latn-x-vedic-metric-unacc-tld]: hutāśanasy jvalanaṃ niredʰaṃ
          tatʰā na caiva jvalate ca sedʰmā | .......... bʰayāni rājñaḥ prativedayanti
          ||
      - ab@verse[n=19,lg=san-Latn-x-vedic-metric-unacc-tld]: śiloccayānāṃ ca śilānipātaḥ
          puradrumāṇāṃ ca viṣāṇapātaḥ | caityadrumāṇāṃ ca tatʰaiva pāto bʰayāni rājñaḥ
