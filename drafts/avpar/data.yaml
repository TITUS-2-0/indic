          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃmukʰaṃ mānasaṃ dʰyāyañ
          śubʰaṃ karma prayojayet | vimukʰaṃ bʰañjanādau tu naraḥ karmaṇi siddʰibʰāk
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: aṣṭottaras trisāhasro
