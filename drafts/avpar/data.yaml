          sahasram aṣṭakādʰikam | hutvā dʰanāyuṣor hānir jvareṇa sa ca śuṣyati ||
      - ab@verse[n=3]: kṣipraṃ śāntir bʰavet tasya kṣīrahomāt tu tāvataḥ ||
    - section[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]:
