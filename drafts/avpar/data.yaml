  - pariśiṣṭa[n=37]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: samuccayaprāyaścittāni)
    - section[n=1]:
      - ab@verse[n=1]: oṃ bʰr̥gvaṅgirorūpadʰāriṇe śivāya namaḥ || atʰa yatraitad apahanyamāne
          musalaṃ patati tad gʰoraṃ bʰavati tad apy etad r̥coktam ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: ulūlhalān musalaṃ patitaṃ
          hinasti patnīṃkule jyeṣṭʰam | kr̥ṣīḥ prajāḥ paśavaḥ saṃviśeante yatʰendrasr̥ṣṭaṃ
          prapateta vajram iti ||
      - ab@verse[n=3]: tad vajraṃ śāntyudakena saṃprokṣya arātīyor ity ullikʰya yat
          tvā śikva iti prakṣālya barhiṣy ādʰāya juhoti ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: vajraḥ patitas tu varaṃ
          hinasti taṃ tvā vayam apahanma gʰoram | sa naḥ śivo 'stu dviṣatāṃ vadʰāya
          sapatnān me dviṣato hantu sarvān ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: yadvat prajāḥ papanayad
          dʰastād yadi volūkʰalāt | sapatnān me paripāhi māṃ tv evaṃ paripāhi naḥ
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: yady antarikṣe yadi vāsi
          soccair vajraḥ sr̥ṣṭo yadi vā pārtʰivair uta | mantrāḥ prayuktā vitatā mahānto
          'gʰoro vajro musalaprapātaḥ ||
      - ab@verse[n=7]: vajro 'si sapatnaheti tisraḥ ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: vajro 'si sapatnahā tvayādya
          vr̥traṃ sākṣīya | tvām adya vanaspate vr̥kṣāṇām ud ayuṣmahi ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: sa na indrapurohito viśvataḥ
          pāhi rakṣasaḥ | abʰi gāvo anūṣatābʰi dyumnaṃ br̥haspate ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: prāṇa prāṇaṃ trāyasvāso
          asave mr̥ḍa | nirr̥te nirr̥tyā naḥ pāśebʰyo muñca iti ||
      - ab@verse[n=11]: tyam ū ṣu trātāram indraḥ sutrāmā sa sutrāmā ā mandrair indra
          marmāṇi te varmaṇā cʰādayāmīti ulūkʰalamusale saṃpātān ānīya saṃstʰāpya
          homān ulūkʰalam annenaiva pūrayitvā pratipravartayed ulūkʰalamusalaṃ vasanaṃ
          ca gāṃ ca kartre dadyāt sā tatra prāyaścittiḥ ||
    - section[n=2]:
      - ab@verse[n=1]: atʰa yat kāko 'bʰimr̥śati tan mr̥tyum āśaṅkyaṃ bʰavati || tad
          apy etad r̥coktam ||....antakāya mr̥tyava ā rabʰasva prāṇāya nama iti svāheti
          agnau hutvā sā tatra prāyaścittiḥ ||
    - section[n=3]:
      - ab@verse[n=1]: atʰāta ājyastʰālī cyavate pracalati vā kā tatra prāyaścittiḥ
          || saṃnatimahāvyāhr̥tisāvitrīkūṣmāṇḍyaḥ sa sarvābʰir juhuyāt sā tatra prāyaścittiḥ
          ||
    - section[n=4]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: atʰa pavitram <cet> praṇaśyeta
          karmamadʰyāt pramādataḥ | anyac cʰittvā mantrayeta karmaśeṣam upakramet
          | ātmendriyasamāyuktaṃ tena mantreṇa kārayet ||
      - ab@verse[n=2]: vāyoḥ pūtaḥ pavitreṇa yan me cʰidraṃ punar maitv indriyaṃ mā
          na āpo medʰāṃ mā no medʰāṃ mā naḥ piparid aśvineti saṃnatibʰir ājyaṃ juhuyād
          vyāhr̥tibʰiś ca gāṃ ca kartre dadyāt sā tatra prāyaścittiḥ ||
    - section[n=5]:
      - ab@verse[n=1]: atʰa yasyāsamāpte karmaṇi barhir ādīpyeta tatas tan nirvāpya
          juhuyāt ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yad agnir barhir adahad
          vedyā vāso apāṃ tataḥ | tvam eva no jātavedo duritāt pāhi tasmāt ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: nirdagdʰā no amitrās tu
          yatʰedaṃ barhis tatʰā | amitrāṇāṃ śriyaṃ bʰūtiṃ tām eṣāṃ pari nir jahi ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: yatkāmās te juhumas tan
          no astu viśāmpate | ye devā yajñam āyānti te no rakṣantu sarvataḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: avadagdʰaṃ duḥsvapnyam
          avadagdʰā arātayaḥ | sarvāś ca yātudʰānyaḥ ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: mā tvā dabʰan yātudʰānā
          mā bradʰnaḥ śamyum iccʰata | darbʰo rājā samudriyaḥ pari naḥ pātu viśvataḥ
          ||
      - ab@verse[n=7]: ato 'nyad barhir upakalpyodakena saṃprokṣya punaḥ str̥ṇāti
          ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: idaṃ barhir amr̥teneha
          siktaṃ hiraṇmayaṃ haritaṃ te str̥ṇāmi | tad vai purāṇam abʰinavaṃ str̥ṇīṣva
          vāsaḥ praśastaṃ prati me gr̥hāṇety anyena ca barhiṣābʰipracʰādaye ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: āhutyāṃ tu gr̥hītāyāṃ hutoccʰiṣṭaṃ pramādataḥ | tam āhutiṃ
          pratiṣṭʰāpya śaṃ no devīr ity ācamya brahmāparam ity ardʰarcenemāṃ hutvā
          brahmajyeṣṭʰeti hutvā sā tatra prāyaścittiḥ ||
    - section[n=7]:
      - ab@verse[n=1]: keśakīṭāvapannā cec cʰaṃbʰuvāya svāheti bʰasmani hutvā havir
          utpūyānyāṃ juhuyāt sā tatra prāyaścittiḥ ||
    - section[n=8]:
      - ab@verse[n=1]: atʰa cec calitadantaṃ patitadantaṃ vopanayet tatra prāyaścittam
          āha gr̥he vā barhiḥ [vā] pitā vācāryo vā dvādaśarātraṃ dīkṣeyātāṃ kartā
          trirātraṃ gaurasarṣapasarpiḥpayobʰiḥ snātaḥ prayataḥ śuciḥ śuklavāsāḥ paurṇamāsaṃ
          tantram ājyabʰāgānte sāvitrīm anuyojayet tena śāntyudakenainam ācāmayati
          saṃprokṣati ca ||
      - ab@verse[n=2]: sāvitrī śāntir brahma jajñānaṃ ye triṣaptā agniṃ brūma āyuṣyavarcasyasvastyayanābʰayāparājitaśarmavarmabʰir
          juhuyāt taṃ saṃpātya yaḥ śramāt tapaso yo vetasaṃ yo bʰūtam ūrdʰvā asyedāvatsarāya
          yady antarikṣe punar maitv indriyam ity āplāvayati sā tatra prāyaścittiḥ
          ||
    - section[n=9]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: naśyec cen madugʰamaṇiḥ
          śāmyed vāgnir vivāhajaḥ | atyadbʰutaṃ dvayam idaṃ dampatyos tu vināśanam
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: pūtudārumaṇis tatra bandʰyo
          mantrāś ca mādugʰāḥ | pūtudāru na vindyāc ced yavaṃ tatra niyojayet ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: āyuṣmantau suprajasau
          suvīrau dʰātā pūṣā draviṇe nau dadʰātu | vimuñcatāṃ śamalaṃ kilbiṣaṃ nau
          dīrgʰam āyuś ca savitā kr̥ṇotv iti śāntyudakenāṅguliṃ saṃprokṣya badʰnīyāt
      - ab@verse[n=4]: samidʰo 'bʰyādadʰyād upatiṣṭeta saṃnatibʰir vyāhr̥tibʰir juhuyād
          gāṃ ca kartre dadyāt sā atra prāyaścittḥ ||
    - section[n=10]:
      - ab@verse[n=1]: om atʰa yasya tantre 'praṇīto 'huto 'gnir upaśāmyati || punas
          tvādityā ity agniṃ prāṇīya saṃnatibʰir vyāhr̥tibʰiḥ samās tvāgne 'bʰy arcateti
          ca sūktābʰyāṃ juhuyāt parisaṃkʰyāhomāṃś ca ||
    - section[n=11]:
      - ab@verse[n=1]: atʰa yatraitad vivāhagnir upaśāmyati agnipraṇayanamantraiḥ
          prājāpatyaṃ praṇīya prāktantraṃ praṇīya yad devā yad vidvāṃso 'pamityam
          apratītaṃ yad dʰastābʰyaṃ yad adīvyann ity etaiḥ sūktair ājyaṃ juhuyāt samidʰo
          'bʰyādadʰyād upatiṣṭʰeta vāsaḥ kartre dadyāt ||
    - section[n=12]:
      - ab@verse[n=1]: atʰa yatraitat kālātītāsu kriyāsv atīta uttarāyaṇe ājyabʰāgānte
          yan me skannaṃ yad asmr̥tīty anumantrayet tasmai prācyā diśo antardeśād
          iti paryāyān ekaviṃśatiṃ juhuyāt saṃskārātīte ca karmaṇi ||
    - section[n=13]:
      - ab@verse[n=1]: atʰa yatraitat prāṇīto 'gnir upaśāmyati || yady antarikṣe punar
          maitv indriyaṃ punas tvādityā ity agniṃ praṇīya prajvālya mamāgne varca
          iti samidʰam ādʰāya śeṣaṃ karma samāpayet ||
    - section[n=14]:
      - ab@verse[n=1]: atʰa yasyopayāmo 'vapated dʰastāt sa yan me upayāma ity ādadīta,
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yan me upayāmo 'patad
          dʰastād ya āyuṣā pariṣkr̥taḥ | tam ahaṃ punar ādade ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: punar indraḥ punar bʰagaḥ
          punar me brahmaṇaspatiḥ | brahma jīvitu dād ity [ādadīta]
      - ab@verse[n=4]: yan me cʰidraṃ yad asmr̥tīti juhuyāt ||
    - section[n=15]:
      - ab@verse[n=1]: yan me sruvo 'patad dʰastād ity upayāmena vyākʰyātam ||
    - section[n=16]:
      - ab@verse[n=1]: mekʰalādīni cet plaveran punar upanayeta || vimocanīyān homān
          hutvānyaṃ brāhmaṇam anūcānam upaveśyodapātraṃ cāparājitena niṣkramya vāso
          yajñopavītādi dattvābʰyukṣyācamyāpāṃ sūktaiḥ pavitraiś ca saṃprokṣya priyaṃ
          mā kr̥ṇu deveṣv iti yajñopavītaṃ dattvā vimr̥gvarīṃ mā naḥ paścād iti dvābʰyāṃ
          prāṅmukʰa upaviśya mahāvyāhr̥tibʰiḥ sāvitrī śāntisūktaṃ brahma jajñānaṃ
          yad asmr̥ty anumatiḥ sarvam iti juhuyād abʰyātānaiś ca ||
    - section[n=17]:
      - ab@verse[n=1]: atʰa yatraitan mekʰalā prapatati jīrṇā vā syāt tāṃ sāvitryoddʰr̥tyāntaṃ
          kr̥tvā śāntyudakena saṃprokṣya mahāvyāhr̥tibʰiḥ sāvitrī śāntisūktaṃ brahma
          jajñānaṃ ye triṣaptā idāvatsarāya gʰr̥tena tvāgniṃ brhūma iti ||
    - section[n=18]:
      - ab@verse[n=1]: caturtʰyām ahutāyāṃ yadi gʰaṭodakaṃ naśyeta tatʰaiva punar
          ānīya śaṃ no devīr iheta devīr ity anumantryāmbayo yanty āpo hi ṣṭʰā śaṃ
          no devīr iti saṃpātya vyāhr̥tyā saṃnatyā ca juhuyāt āpo bʰr̥gvaṅgirorūpam
          apāṃ puṣpam ity udakumbʰam abʰimantrayet || vāso dakṣiṇā ||
    - section[n=19]:
      - ab@verse[n=1]: atʰa yasyāsamāpte karmaṇy udapātraṃ pravarteta tad anumantrayate
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yad udapātraṃ pravartate
          brahmaṇāstʰāpitaṃ mahat | stʰānāc cyutaṃ pravartitaṃ tan me vahatu kilbiṣam
          || ity āstʰāpayati ||
      - ab@verse[n=3]: pūraṇena pūrayitvā punaḥ pūrṇam ity etayā |
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: punaḥ pūrṇam idaṃ pātraṃ
          brahmaṇāstʰāpayāmasi | viśvais [tad] devair abʰiṣṭutam ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: ūrjaṃ puṣṭaṃ dadʰātu no
          rāyas poṣaṃ śriyam āyuḥ | mayi karma samr̥dʰyatām iti ||
    - section[n=20]:
      - ab@verse[n=1]: atʰa cet prabʰajyeta bʰūmir bʰūmim agād ity anumantryānyataram
          āhr̥tya yady antarikṣe punar maitv indriyam ity anumantrya vaiśvānaro na
          ūtaya ud enaṃ vaiśvānaro raśmibʰir iti juhuyāt sā tatra prāyaścittiḥ ||
  - pariśiṣṭa[n=38]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: brahmakūrcavidʰiḥ
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ brahmakūrcavidʰiṃ puṇyaṃ
          saṃkṣepād vacmy asaṃśayam | pāvanānāṃ paraṃ yo hi pāvanaṃ tapasāṃ tapaḥ
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: snātvā śuciḥ śucau deśe
          gomayenāvasecite | vastreṇa saṃhite cāpi sitapuṣpaiḥ prapūjite ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: ahorātrositaḥ kṣāntaḥ
          pavitrātmā prapāvanaḥ | śuklavāsāḥ sugandʰiḥ prāg upaviṣṭaḥ kuśāsane ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: gomūtraṃ gomayaṃ kṣīraṃ
          dadʰi sarpiḥ kuśodakam | āharet tāmrapātre tu śakr̥n mūtraṃ tv abʰūgatam
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: gomūtraṃ nīlavarṇāyāḥ
          kr̥ṣṇāyā gomayaṃ tatʰā | payas tu tāmravarṇāyāḥ śvetāya āhared dadʰi ||
      - ab@verse[n=6]: kapilāyā gʰr̥taṃ grāhyam alābʰe syāt tu pañcamam ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: gomūtraikapalaṃ dadyād aṅguṣṭʰāgraṃ tu gomayam | kṣīrasya sapta
          dadʰnas tu trīṇy ekaikaṃ gʰr̥tāmbʰasoḥ ||
      - ab@verse[n=2]: gāyatryāhr̥tya gomūtraṃ gandʰadvāreti gomayam | ā pyāyasveti
          ca kṣīraṃ dadʰikrāvṇeti vai dadʰi ||
      - ab@verse[n=3]: tejo 'si śukram ity ajyaṃ devasya tvā kuśodakam | saptapattrās
          tu ye darbʰā acʰinnāgrāḥ samāyutāḥ ||
      - ab@verse[n=4]: taiḥ samuddʰr̥tya hotavyaṃ devatābʰyo yatʰākarmam | agnaye
          svāhā somāya prajāpataya ity api ||
      - ab@verse[n=5]: br̥haspate ati yad idaṃ viṣṇur itīti ca | mānastokena gāyatryā
          etaiś ca juhuyāt tataḥ ||
      - ab@verse[n=6]: praṇavena praṇavenaiva pibec ca praṇavena tu | hotavyaṃ praṇavenaiva
          pibec ca praṇavena tu ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: madʰyamena palāśasya padmapattreṇa vā pibet | api vā tāmrapātreṇa
          hutaśeṣaṃ viśuddʰaye ||
      - ab@verse[n=2]: yat tvagastʰigataṃ pāpaṃ dehe tiṣṭʰati dehinām | brahmakūrco
          dahet sarvaṃ pradīpto 'gnir ivendʰanam ||
      - ab@verse[n=3]: trayodaśyādicaturṣu triḥsnānākṣārabʰojanam | pañcadaśyāṃ pañcagavyaṃ
          sopavāsaṃ mahāpʰalam ||
      - ab@verse[n=4]: abʰojyābʰakṣyaśūdrānnabʰakṣaṇe vedavikraye | pratigrahe kālamantrahīne
          home dyumaitʰune ||
      - ab@verse[n=5]: bālatve yat kr̥taṃ caiva yuvā vr̥ddʰavayās tatʰā | mātāpitr̥kr̥taṃ
          caiva tat kṣaṇād eva nirdahet ||
      - ab@verse[n=6]: māsemāse prayuñjānodevalokam avāpnuyāt | ardʰamāseardʰamāse
          ca r̥ṣīṇāṃ lokam uttamam ||
      - ab@verse[n=7]: ṣaḍrātre caiva ṣaḍrātre brahmalokam anāmayam | aharahaḥ prayuñjānaḥ
          paraṃ brahmādʰigaccʰati ||
      - ab@verse[n=8]: anena vidʰinaiveṣṭvā devatarpaṇapūrvakam | brahmaṇā nirmitaṃ
          hy etat pavitraṃ paramaṃ hitam ||
  - pariśiṣṭa[n=39]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: taḍāgādividʰiḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ pippalādaṃ mahāprājñam idam ūcur maharṣayaḥ | bʰūmikʰātasya
          śuddʰyartʰaṃ vidʰiṃ prabrūhi tattvataḥ ||
      - ab@verse[n=2]: kūpavāpītaḍāgeṣu puṣkariṇyāṃ ca veśmasu | ahorātroṣito bʰūtvā
          tataḥ karma samārabʰet ||
      - ab@verse[n=3]: śāntyudakena tad brahmā pūrvoktaṃ yad agastinā | pari prāgād
          iti dvābʰyām abʰimantrayate tataḥ ||
      - ab@verse[n=4]: carutantreṇa vidʰinā caruṃ bʰaumaṃ tu nirvapet | prāktantram
          ājyabʰāgāntaṃ satyaṃ br̥had iti smr̥tam ||
      - ab@verse[n=5]: havir ājyaṃ samidʰaś ca upastʰānaṃ yatʰākramam | kūpādīnāṃ
          samīpe tu japen mantrān samāhitaḥ ||
      - ab@verse[n=6]: ambayo yanty āpo hi ṣṭʰā śaṃ no devīr iti trayam | hiraṇyavarṇāḥ
          punantu mā sasruṣīr himavato 'psu te ||
      - ab@verse[n=7]: japtvā tu dʰenum ānītāṃ pibantīm anumantrayet | ā gāva iti
          sūktena tārayet tu tatʰaiva gām ||
      - ab@verse[n=8]: kūpavāpītaḍāgānāṃ samīpe cābʰimantrayet | upa hvaye sūyavasāt
          kartre dadyāt tu gāṃ śubʰām ||
      - ab@verse[n=9]: kāmasūktena gr̥hṇīyāt karma saṃstʰāpayet tataḥ | hiraṇyarajatādīnāṃ
          matsyādīn kārayed budʰaḥ ||
      - ab@verse[n=10]: sauvarṇau kūrmamakarau rājatau matsyamudgarau | tāmrau kulīrakarkaṭāv
          āyasaḥ śiśumārakaḥ ||
      - ab@verse[n=11]: śāntyudakaṃ pañcagavyaṃ tasminn eva jale kṣipet | kartr̥dātārau
          snāyetāṃ drupadād iva śumbʰanī ||
      - ab@verse[n=12]: brāhmaṇān bʰojayitvā tu puṇyāhaṃ vācayet tataḥ | samyag vidʰānam
          etad dʰi kūpādeḥ saṃprakīrtitam | puṇyaṃ karma dvijātīnāṃ svargasyākṣayyam
          iccʰatām ||
  - pariśiṣṭa[n=40]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: pāśupatavratam
    - section[n=1]:
      - ab@verse[n=1]: om atʰa pāśupatavratādeśo
      - ab@verse[n=2]: nāśrotriyāya nācaritavedavratāya nākr̥tavapanāya dadīta ||
      - ab@verse[n=3]: māsadvitricatuṣpañcasaṃvatsaradvādaśasaṃvatsaraparimitaṃ naiṣṭʰikaṃ
          vā
      - ab@verse[n=4]: atʰāsyāyatanāni ||
      - ab@verse[n=5]: mahādevāyatane 'pāṃ samīpe ||
      - ab@verse[n=6]: giriguhāyāṃ gavāṃ goṣṭʰe 'gnyāgāre vā
      - ab@verse[n=7]: nadīnāṃ bahūnāṃ pratiśraye
      - ab@verse[n=8]: anusavanam ||
      - ab@verse[n=9]: bʰasmanā snānaṃ raudrahomasnapanaṃ ca sarpiḥkṣīragandʰodakair
      - ab@verse[n=10]: gandʰapuṣpadʰūpadīpodanapāyasayāvakalājādi pradakṣiṇāntaṃ
          ca ||
      - ab@verse[n=11]: nivedya nirmālyagandʰahārīhāsagītavādanādyupahārān
      - ab@verse[n=12]: dakṣiṇena tr̥tīyam upatiṣṭʰate
      - ab@verse[n=13]: kaṭakakeyūradʰāriṇe namo vr̥ṣāya namo vr̥ṣabʰadʰvajāya namo
      - ab@verse[n=14]: vānaraṃ te mukʰaṃ raudram anindyaṃ śubʰaṃ paśum evājananevājanakaṃ
          gʰoraṃ jīvaṃ jātyam eva rukmaṃ dadāmīti ekavāsā vivāsā vā virāgāṇi vastrāṇi
          dadīta ||
    - section[n=2]:
      - ab@verse[n=1]: gocarmamātraṃ stʰaṇḍilam upalipya gomayenollikʰyābʰyukṣyāgne
          prehīty agniṃ praṇīyopasamādʰāya paristīrya brahmāṇaṃ kalpayitvā nānyadevatādiśi
          rudrasya dakṣiṇodapātraṃ stʰāpayitvā mahāvyāhr̥tibʰir agnyāyatane nidʰāya
          rudram āvāhayati ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: rudraṃ kruddʰāśanimukʰaṃ
          devānām īśvaraṃ param | śvetapiṅgalaṃ devānām <mahādevam> prapadye śaraṇāgataḥ
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: yasya yuktā ratʰe siṃhā
          vyāgʰrāś ca viṣamānanāḥ | tam ahaṃ pauṇḍarīkākṣaṃ devam āvāhaye śivam ity
          āvāhyābʰyarcya ||
      - ab@verse[n=4]: na taṃ yakṣmaitu deva iti gugguluṃ dʰūpaṃ ca dadyāt ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: tat puruṣāya vidmahe mahādevāya
          dʰīmahi | tan no rudraḥ pracodayāt ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: tasmai devāya vidmahe
          mahādevāya dʰīmahi | tan no rudro 'numanyatām || iti rudrasāvitrīṃ japtvā
          ||
      - ab@verse[n=7]: yo agnau rudra ity anumantrayen namo astu yāvad āvāhane devadevasyāvāhayāmy
          aham iti ||
      - ab@verse[n=8]: pramardane sarvāsuravināśāya oṃ pʰaṭkāraṃ karoti ||
      - ab@verse[n=9]: nivedane 'ham amukaṃ nivedayāmīti jaṭī muṇḍī pañcaśikʰī vā
          ||
    - section[n=3]:
      - ab@verse[n=1]: brāhmaṇo ha vā aham amukasagotro bʰagavato maheśvarasya vrataṃ
          cariṣyāmīti vācayitvā ||
      - ab@verse[n=2]: tato 'sya mauñjīṃ prayaccʰati || sāvitryā tu daṇḍaṃ pālāśaṃ
          bailvam āśvattʰaṃ vā asiṃ lakuṭaṃ kʰaṭvāṅgaṃ paraśuṃ vā ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: agʰorebʰyo 'tʰa gʰorebʰyo
          'gʰoragʰoratarebʰyaś ca | sarvataḥ śarvaśarvebʰyo namas te rudra rūpebʰya
          ity ādau śarvaṃ namaskr̥tyopaviśyājyaṃ niratiśāyitvedʰmān ādīpayaty antara
          iti
      - ab@verse[n=4]: idʰmā jātavedasaḥ samiddʰasya tebʰyo vardʰayasva prajayā paśubʰiḥ
          śriyā gr̥hair dʰaneneti ||
      - ab@verse[n=5]: yavāgʰārau ājyabʰāgau juhuyād
      - ab@verse[n=6]: vāyave svāhā || śarvāya rudrāya svāhā || paśupataye bʰīmāya
          svāhā || śāntāyādʰipataye devāya svāheti ||
      - ab@verse[n=7]: evam eva patnīnāṃ tūṣṇīm adʰipasya juhuyād
      - ab@verse[n=8]: evaṃ sarveṣu vratanivedaneṣu vrātapatīr juhoti ||
      - ab@verse[n=9]: vratena tvam ity ubʰayīruham iti pañcabʰī raudrān homān hutvā
          homāvasānena bʰasmanā snānaṃ karoti ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: bʰasmasnānam [tāvad] grahīṣyāmi sarvapāpapraṇāśanam | bʰasmasnānena
          rudro hi snāto 'bʰūt pūta ātmanā ||
      - ab@verse[n=2]: bʰasmanā snāyate rudro viṣṇuḥ snāyate bʰasmanā | tena snānena
          snāmy ahaṃ yena snāto maheśvaraḥ ||
      - ab@verse[n=3]: yena snātā umā devī rudro bʰartā maheśvaraḥ | yena snātā gaṇāḥ
          sarve yena snātā dvijātayaḥ ||
      - ab@verse[n=4]: yena snātā śivaḥ śarvaḥ śaṃkaraś ca vr̥ṣadʰvajaḥ | snātāni
          sarvabʰūtāni gaṅgāyamunayāgame ||
      - ab@verse[n=5]: snāto 'haṃ sarvatīrtʰeṣu nadīprasravaṇeṣu ca | vāruṇāgneyasaumyānāṃ
          bʰasmanā snānam uttamam | tena snānena snāmy ahaṃ yena snāto maheśvaraḥ
          ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: bʰūtis tu piṅgalo babʰrur bʰūtir viṣṇuḥ sanātanaḥ | bʰūtir
          brahmā mahendraś ca bʰūtir devāḥ saha rṣibʰiḥ ||
      - ab@verse[n=2]: bʰūtir me 'lakṣmīṃ nirṇuded bʰūtir me śriyam āvahet | bʰūtir
          ma āyuṣā vittaṃ varco brahma prayaccʰatu ||
      - ab@verse[n=3]: bʰasmanā caranto nityaṃ dʰyāyinaḥ paricintakāḥ | yānti pāśupataṃ
          stʰānaṃ punarāvr̥ttidurlabʰam ||
      - ab@verse[n=4]: vācā tu yat kr̥taṃ karma manasā ca vicintitam | alakṣmīś cāpad
          duḥsvapnaṃ bʰasmanā tat praṇaśyatu ||
      - ab@verse[n=5]: mokṣaṇaṃ mokṣakāle ca bʰasmaśeṣaṃ visarjayet | mukto 'haṃ sarvapāpebʰyo
          rudralokaṃ vrajāmy aham ||
    - section[n=6]:
      - ab@verse[n=1]: etat snānaṃ vāruṇaṃ parvasu śarīralepena yatʰākāmaṃ parvasūpavaset
          ||
      - ab@verse[n=2]: strīśūdraṃ nābʰibʰāṣeta ||
      - ab@verse[n=3]: tadā sāvitrīṃ japet ||
      - ab@verse[n=4]: yadi bʰāṣeta tadā rudrasāvitrīṃ japet ||
      - ab@verse[n=5]: kamaṇḍalukapāle bʰinne bʰūmir bʰūmim agād ity apsu praveśayet
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: retaḥskande yan me retas
          tejasā saṃniṣadya dehāt praskandet punar na bʰavāya | tad agnir vāyuḥ...
          ...api ceyaṃ pr̥tʰivī kañcakʰanteti ||
      - ab@verse[n=7]: samyak kva cit karoti
      - ab@verse[n=8]: vratam upādʰyāyācʰando vartayet ||
      - ab@verse[n=9]: tata udīkṣaṇam ||
      - ab@verse[n=10]: vrātapatīr juhoti ||
      - ab@verse[n=11]: samāso 'haṃ vratasviṣṭakr̥ta iti hutvādityābʰimukʰas tiṣṭʰeta
          ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: yan me duruktaṃ durhutaṃ
          durdʰyātaṃ durvicintitam | tan me bʰagavān īśānaḥ sarvaṃ tvaṃ kṣantum arhasi
          ||
      - ab@verse[n=13]: navonavo bʰavasi jāyamāna ity apsu pravāhayed
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: ye śraddʰayedaṃ paśupater
          vrataṃ caranti | teṣāṃ madʰu viśakṣe he dadate na punargamanaṃ madʰurivādyehaiva
          ca | te rudrā viratau paśupatisāyujyaṃ gaccʰa<n>ti
      - ab@verse[n=14]: tad eṣa ślokaḥ ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: vilīnapāśapañjarāḥ samāptatattvagocarāḥ
          | prayānti śaṃkaraṃ paraṃ patiṃ vibʰuṃ sadāśivam ||
  - pariśiṣṭa[n=41]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: saṃdʰyopāsanavidʰiḥ
    - section[n=1]:
      - ab@verse[n=1]: om atʰātaḥ saṃdʰyopāsanavidʰiṃ vyākʰyāsyāmaḥ ||
      - ab@verse[n=2]: prāṅ vodaṅ vā grāmān niṣkramya śuciḥ śucau deśe guptatīrtʰāyataneṣu
          vā
      - ab@verse[n=3]: suprakṣālitapāṇipādavadanaḥ prāg vīrāsanenopaviśya jīvā stʰety
          ācamyāpo hi ṣṭʰety abʰyukṣya prāṇāyāmān kr̥tvācamyottiṣṭʰan dakṣiṇahastastʰā
          āpo ayojālā ity apa utsr̥jed bahudʰā ||
      - ab@verse[n=4]: hariḥ suparṇa iti prātar
      - ab@verse[n=5]: ud u tyaṃ citraṃ devānām iti madʰyaṃdine
      - ab@verse[n=6]: atʰa sauramantrān yatʰākāmaṃ japed
      - ab@verse[n=7]: ud vayaṃ tamasas parīti ca
      - ab@verse[n=8]: ud gʰed abʰi śrutāmagʰam ity astamita āsīnaḥ
      - ab@verse[n=9]: sāvitryante vāñjalayo japaś ca ||
    - section[n=2]:
      - ab@verse[n=1]: atʰordʰvajānur āsīna iti vīrāsanī
      - ab@verse[n=2]: pratyuttʰāyābʰayaṃ paścād abʰayaṃ purastād ity upatiṣṭʰate
      - ab@verse[n=3]: tiṣṭʰan prātaḥ prāṅmukʰa
      - ab@verse[n=4]: āyātu varadety āvāhya
      - ab@verse[n=5]: gāyatraṃ cʰandaḥ savitā devatā viśvāmitra r̥ṣir
      - ab@verse[n=6]: yatʰākṣaraṃ daivataṃ rūpaṃ ca manasi samādʰāya mahāvyāhr̥tibʰiḥ
          saṃdʰāya gāyatrīṃ japet ||
      - ab@verse[n=7]: aṣṭakr̥tva ekādaśakr̥tvo dvādaśakr̥tvaḥ pañcadaśakr̥tvaḥ śatakr̥tvaḥ
          sahasrakr̥tva iti ||
      - ab@verse[n=8]: aṣṭakr̥tvaḥ prayuktā gāyatrī gāyatreṇa cʰandasā saṃmitā bʰūlokam
          abʰijayati ||
      - ab@verse[n=9]: ekādaśakr̥tvaḥ prayuktā traiṣṭubʰena cʰandasā saṃmitāntarikṣalokam
          abʰijayati ||
      - ab@verse[n=10]: dvādaśakr̥tvaḥ prayuktā jāgatena cʰandasā saṃmitā divaṃ lokam
          abʰijayati ||
      - ab@verse[n=11]: pañcadaśakr̥tvaḥ prayuktā pañcadaśena vajreṇa saṃmitā brahmalokam
          abʰijayati ||
      - ab@verse[n=12]: śatakr̥tvaḥ prayuktā śataparvaṇā vajreṇa saṃmitā sarvāṇl lokān
          abʰijayati ||
      - ab@verse[n=13]: sahasrakr̥tvaḥ prayuktāgniṣṭomāptoryāmādīnāṃ kratūnāṃ pʰalam
          avāpnoti ||
    - section[n=3]:
      - ab@verse[n=1]: ato yatʰākāmaṃ japitvā paśyema śaradaḥ śatam indra jīvety āśiṣaḥ
          prārtʰayate ||
      - ab@verse[n=2]: stutā mayā varadeti visr̥jyodīrāṇā uta sūryasyāvr̥tam asapatnaṃ
          purastād yasmāt kośād iti yatʰārtʰam upatiṣṭʰate ||
      - ab@verse[n=3]: ya imāṃ na vindanti nādʰīyate saṃdʰyākāle nopāsate te hy aśrotriyā
          bʰavanty anupanītāḥ kriyāhīnāś cʰedanabʰedanabʰojanamaitʰunāny abʰicarantaḥ
          ||
      - ab@verse[n=4]: saṃdʰyākāle hy ajapantaḥ śvasūkarasr̥gālakukkuṭasarpayoniṣu
          varṣasahasrāṇi jāyante ||
      - ab@verse[n=5]: samās tasyaivopajāyante ||
      - ab@verse[n=6]: tasmād yatʰoktāṃ sāyaṃ prātaḥ saṃdʰyām upāsīta ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: araṇyacarito guptaḥ śuklabrāhmaṇakarmasu
          | prāyeṇa labʰate lokān yatʰoktāṃs tāṃ samācaran ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: sāyaṃ saṃdʰyām upāsīta
          kr̥tavīrāsano dvijaḥ | kr̥tottānas tatʰā prātaḥ prāñjaliḥ susamāhitaḥ ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: etad vīrāsanaṃ stʰānaṃ
          brahmaṇā nirmitaṃ purā | dvijānaṃ bālavr̥ddʰānāṃ puraścaraṇam uttamam ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: sāyaṃ prātas tu yaḥ saṃdʰyām
          askannām upatiṣṭʰate | sa tayā pāvito devyā brāhmahaḥ pūtakilbiṣaḥ ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: na sīdet pratigr̥hṇānaḥ
          pr̥tʰvīm api sasāgarām | ye cāsya viṣamāḥ ke cid divi sūryādayo grahāḥ ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: te cāsya saumyā jāyante
          śivāḥ sukʰakarāḥ sadā | stʰānaṃ vīrāsanaṃ caeṣāṃ pr̥tʰivī ca pradakṣiṇā
          | agnihotraṃ hutaṃ caiṣāṃ ye vai saṃdʰyām upāsate ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: ardʰāstamita āditye ardʰodite divākare | gāyatryās tatra sāṃnidʰyaṃ
          saṃdʰyākālaḥ sa ucyate ||
      - ab@verse[n=2]: bʰūmyādityāntaraṃ yas tu cʰādayec caturaṅgulam | tāṃ tu saṃdʰyāṃ
          parāṃ vidyāc cʰāyāsaṃbʰedane pare ||
      - ab@verse[n=3]: yāvantas tu karād bʰraṣṭāḥ patanti jalabindavaḥ | bʰūtvā vajrāṇi
          te sarve patanti hy asureṣu vai ||
      - ab@verse[n=4]: tato vibʰāvasus teṣāṃ prītātmāpyāyate varam | yair ahaṃ mokṣito
          viprais teṣāṃ loko tatʰā mama ||
      - ab@verse[n=5]: gāyatryā akṣamālāyāṃ sāyaṃ prātaḥ śataṃ japet | caturṇāṃ kʰalu
          vedānāṃ samagraṃ labʰate pʰalam ||
      - ab@verse[n=6]: saṃdʰyāṃ ye nopatiṣṭʰanti brāhmaṇyaṃ nopapadyate | upapadyeta
          vā bʰūyo yadi syus tīrtʰamr̥tyavaḥ ||
      - ab@verse[n=8]: r̥ṣayo dīrgʰasaṃdʰyatvād dīrgʰāṇy āyumṣy adʰārayan | tasmād
          dīrgʰām upāsīta samiccʰan vr̥ddʰim āyuṣaḥ ||
    - section[n=5]:
      - ab@verse[n=1]: tad yatʰāgnir devānāṃ brāhmaṇo manuṣyāṇāṃ vasanta r̥tūnām evaṃ
          gāyatrī cʰandasām ||
      - ab@verse[n=2]: tad yatʰā gāyatrī katyakṣarā katipadā kiṃ vāsyā gotraṃ kiṃ
          vāsya rūpaṃ kīdr̥śaṃ tasyāḥ śarīraṃ bʰavati ||
      - ab@verse[n=3]: yad vai bʰūḥ sa r̥gvedo yad bʰuva iti so 'tʰarvaveda iti
      - ab@verse[n=4]: tad yatʰedam akṣaram om ity akṣaraṃ tat paramaṃ śam ity akṣaraṃ
          guhyaṃ tat paramaṃ pavitram ||
      - ab@verse[n=5]: ādityo vai sāvitry ādityena saha sāvitrī stauti suvati prātaḥ
          prasuvati tasmāt sāvitrīt<v>am ||
      - ab@verse[n=6]: akṣaradaivataṃ vyākʰyāsyāmaḥ
      - ab@verse[n=7]: pratʰamam āgneyaṃ dvitīyam āśvinaṃ tr̥tīyaṃ saumyaṃ caturtʰaṃ
          vaiṣṇavaṃ sāvitraṃ pañcamaṃ ṣaṣṭʰaṃ pauṣṇaṃ saptamaṃ mārutam aṣṭamaṃ bārhaspatyaṃ
          navamaṃ maitraṃ daśamaṃ vāruṇam ekādaśam aindraṃ dvādaśaṃ vaiśvadevaṃ vasūnāṃ
          trayodaśaṃ caturdaśaṃ rudrāṇāṃ pañcadaśam ādityānām aditeḥ ṣoḍaśaṃ vāyavyaṃ
          saptadaśamaṃ bʰaumam aṣṭādaśam ekonaviṃśam āntarikṣaṃ divyaṃ viṃśaṃ digdevatāni
          catvāry akṣarāṇi ||
    - section[n=6]:
      - ab@verse[n=1]: atʰa yat pūrvāṃ saṃdʰyām upāste tad gāyatryāḥ śiras tena pr̥tʰivīṃ
          jayati ||
      - ab@verse[n=2]: atʰa yan madʰyāhne tīkṣṇaṃ rudras tapati <tad> dvitīyaṃ śiras
          tenāntarikṣaṃ jayati ||
      - ab@verse[n=3]: atʰa yad astamiyāt tat tr̥tīyaṃ śiras tena divaṃ jayati ||
      - ab@verse[n=4]: tasyā oṃkāraḥ śiraḥ saha vyāhr̥tibʰir darbʰāḥ keśā oṣadʰīvanaspatayo
          lomāni cakṣuṣī sūryācandramasau vidyud dʰasitaṃ viṣṇuvaruṇau urasī rudro
          hr̥daye paurṇamāsī cāmāvāsyā ca stanau ahaś ca rātrī ca pārśve
      - ab@verse[n=5]: daśa diśaḥ kukṣī sarvajñānāni vyākaraṇam udaraṃ pr̥tʰivī śroṇī
          vāyuḥ stʰānaṃ bʰūṣaṇaṃ nakṣatrāṇi śrīsarasvatīrūpā padakramamantrabrāhmaṇakalpaśarīrā
          sāvitrī gotreṇa brahmadeyā bʰavati brahmadeyā bʰavatīti brāhmaṇam ||
  - pariśiṣṭa[n=42]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: snānavidʰiḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: atʰa snānavidʰiṃ puṇyaṃ vakṣyamāṇaṃ nibodʰata | yena snātā
          divaṃ lokaṃ prāpnuvanti dvijottamāḥ ||
      - ab@verse[n=2]: saritsu vā taḍāge vā devakʰāte hrade 'pi vā | gartaprasravaṇe
          vāpi puṇyaṃ snānaṃ samācaret ||
      - ab@verse[n=3]: pārakye tu tāḍāge hi snānaṃ naiva vidʰīyate | taḍāgakartur
          duṣkr̥tair lipyate snānam ācāran ||
      - ab@verse[n=4]: saritāṃ sarasāṃ caiva aprāptau nirjʰarasya ca | uddʰr̥tya caturaḥ
          piṇḍān snāyāt tu parakʰātake ||
      - ab@verse[n=5]: anvīkṣyamāṇaḥ pārśvāni kuśahastaḥ samāhitaḥ | dvijo madʰyaṃdinād
          arvāg arogī snānam ācaret ||
      - ab@verse[n=6]: yat te bʰūma iti mr̥daṃ saṃgr̥hya rcā samāhitaḥ | yas te gandʰa
          iti tribʰir mr̥dʰir ātmānam ālabʰet ||
      - ab@verse[n=7]: agʰadviṣṭeti sūktena dūrvāṃ śirasi vinyaset | agramagram ity
          etayā gomayenānulepayet ||
      - ab@verse[n=8]: agramagraṃ carantīnām oṣadʰīnāṃ vanevane | yan me rogaṃ ca
          śokaṃ ca tan me tvaṃ nuda gomaya ||
      - ab@verse[n=9]: praṇavādyā vyāhr̥tīs tu gāyatrīṃ ca śiroyutām | paṭʰet trir
          anavānaṃ hi prāṇāyāmaḥ sa ucyate ||
      - ab@verse[n=10]: ambayo yantīty ādīni trīṇi sūktāni hi kramāt | hiraṇyavarṇā
          yad ado vāyoḥ pūtaḥ punantu mā ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: vaiśvānaro raśmibʰiś ca tatʰāpsu ta iti smr̥tam | etaiḥ saṃplāvayet
          sūktais tato 'gʰamarṣaṇam ||
