          ||
      - ab@verse[n=5]: ājyabʰāgāntājyatantram abʰyātānāni caiva hi ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: namojñāya sureśāya namas
          te viśvatomukʰa | namaḥ kālāya tīkṣṇāya [jaṭilāya] sarvabʰūtahitāya ca ||
    - section[n=3]:
      - ab@verse[n=1]: tataḥ sarṣapatilalājā ūrdʰvāḥ samidʰaś ca dadʰimadʰugʰr̥tāktā
          juhuyāt ||
      - ab@verse[n=2]: yajāmi || kālāya svāhā || piṅgalāya tīkṣṇāya jaṭilāya babʰrave
          oṃ bʰūr oṃ bʰuva oṃ svar oṃ bʰūr bʰuvaḥ svar jayavijayāya jayādʰipataye
          kapardine karālāya vikaṭāya kaṭiramāṭarāyāṅgirasabārhaspatyakakapilamaṇḍalamuṇḍajaṭilakapāleśvarādʰipataye
          kapardine svāheti ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: eṣa karmasu tu gośānteḥ
          saṃsr̥ṣṭa r̥ṣibʰiḥ purā | proktā svayaṃbʰuvā caiṣā gośāntis tu hitāya vai
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: yo vipraḥ paṭʰatīmāṃ hi
          gokule cāpi hitāya vai | gāvas tasya pravardʰante mahatīṃ cāśnute śriyam
          ||
  - pariśiṣṭa[n=67]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: adbʰutaśāntiḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ puruṣas putradāraṃ vā dʰanadʰānyam atʰa api vā | nimittair
          yair vinaśyeta śāntiṃ tatra nibodʰata ||
      - ab@verse[n=2]: indrāyudʰaṃ bʰavet rātrau dr̥śyate yasya kasya cit | darvī
          kare vā bʰidyeta maṇis kumbʰas tatʰā eva ca ||
      - ab@verse[n=3]: cʰattraṃ śayyā āsanaṃ ca eva anyat vā api svayaṃ kva cit |
          strī hanyāt ca striyaṃ vā api gaur avagʰret ulūkʰalam ||
      - ab@verse[n=4]: śvā pidet gām anaḍvāhaṃ kalis saṃpadyate kule | gajavājino
          mriyante vivādo rājakīyakas ||
      - ab@verse[n=5]: kuṭumbam aśubʰaṃ sarvam aindrāṇi etāni nirdiśet | śāmyanti
          yena sarvāṇi nirvapet pāyasaṃ carum ||
      - ab@verse[n=6]: samāvaoya gʰr̥taṃ tatra āhutiṃ jihuyāt imām | indram id devatātaye
          stʰālīpākasya homayet ||
      - ab@verse[n=7]: indras śacīpatis śakro vajrapāṇis sureāśvaras | sarvādbʰutānāṃ
          śamano mahāvyāhr̥tayas tatʰā ||
      - ab@verse[n=8]: hutvā sviṣṭakr̥taṃ ca eva carutantraṃ samāpayet | vimuktotpātadoṣas
          tu jīvet tu śaradas śatam ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: uddīpikā gr̥he yasya valmīkā
          madʰujālakam | abjānāṃ maṇike śabde tailaṃ stʰīyata eva vā ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: aśubʰā vikr̥tir dadʰnāṃ
          dugdʰānāṃ vā yadā bʰavet | akasmāt ca praroheyur bījāni kr̥mayas tatʰā ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: kāryo varuṇayāgas tu vāruṇīvidʰipūrvakas
          | ud uttamaṃ pradʰānaṃ syāt pañcājyāhutayas tatʰā ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: varuṇas pāśapāṇis ca yadāsāṃ
          patir eva ca | śe.aṃ tu pūrvavat ca eva carutantraṃ samāpayet ||
      - ab@verse[n=5]: vimuktotpātadoṣas tu jīvet tu śaradas śatam ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: gr̥he yasya patet gr̥dʰra ulūko vā katʰaṃ cana | kapotas praviśet
          ca eva jīvā vā araṇyasaṃbʰavās ||
      - ab@verse[n=2]: dʰuryau ca patato yuktau gostrījanma ca vaikr̥tam | jāyante
          yamalāni eva gʰoras svapnas ca dr̥śyate ||
      - ab@verse[n=3]: abʰidravanti rakṣāṃsi yatra ca eva kumārakān | unnidrako atunidro
          vā atyalpam atibʰojanam ||
      - ab@verse[n=4]: ālasya ca evam eteṣāṃ devatā yama ucyate | nāke suparṇam iti
          etat stʰālīpākasya homayet ||
      - ab@verse[n=5]: yamas pretapatis ca eva daṇḍapāṇis tatʰā īśvaras | śamanaḥ
          sarvādbʰutānām... ||
    - section[n=4]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: anagnir uttʰito yasya
          dʰūmo vā api gr̥he kva cit | āmaṃ vā jvalate māṃsaṃ bʰaveyur vispʰuliṅgakās
          ||
      - ab@verse[n=2]: cʰattradʰvajapatākās ca jvalante toraṇāni ca || āsanaṃ ca eva
          áyyā ca vastrāṇi kusumāni ca ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: hastyaśvānāṃ ca puccʰāni
          varṣatyaṅgāravarṣaṇam | akāle ca diśāṃ dāha oṣadʰīnāṃ ca pācanam ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: hastinyas ca eva madyante
          agnirūpaṃ tad adbʰutam | agniṃ dūtaṃ vr̥ṇīmahe stʰālīpākasya homayet ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: agnir hiraṇyapatis ca
          arciṣpāṇis tatʰā īśvaras | śamanas sarvādbʰutānām... ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: suvarṇaṃ rajataṃ vajraṃ vaiḍūryaṃ mauktikāni ca | pravālavastranāśas
          ca mitrāṇāṃ ca viparyayas ||
      - ab@verse[n=2]: ārambʰās ca vipadyante na soddʰis karmaṇām api | carur vaiśravaṇas
          tatra abʰi tyaṃ devam r̥k smr̥tā ||
      - ab@verse[n=3]: vaiśravaṇo yakṣapatis artʰapāṇis tatʰā īśvaras | śamanas sarvādbʰutānām...
          ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: atʰa yasya svanakṣatre ulkā nirgʰāta eva vā | rāhur grasati
          candrārkau kabandʰaṃ darpaṇe bʰavet ||
      - ab@verse[n=2]: patet svayaṃ vā musalaṃ devatā vā katʰaṃ cana | unmīlate ca
          eva yadā tatʰā ca api nimīlate ||
      - ab@verse[n=3]: pracʰidyate ca yadi vā tatʰā vā api prakampate | prayāto vā
          api dr̥śyeta pratisroto nadī vahet ||
      - ab@verse[n=4]: vimale na eva arkacʰāyā pratīpā vā api tu sāyakās | pariveṣas
          tu anabʰreṣu dr̥śyate candrasūryayos ||
      - ab@verse[n=5]: kośāt kʰaḍgā nirgirante tūṇāt ca eva tu sāyakās | anāhatāni
          vādyante nadante śabdam āturam ||
      - ab@verse[n=6]: caruṇā vaiṣṇavena eṣāṃ yāgas kartavyas eva tu | idaṃ viṣṇus
          pradʰānaṃ syāt pañcājyāhutayas tatʰā ||
      - ab@verse[n=7]: sarvabʰūtapatis viṣnus cakrapāṇis tatʰā īśvaras | śamanas sarvādbʰutānām...
          ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: ativāto yatra bʰavet rūpaṃ vā yatra vaikr̥tam | kʰarakarabʰamahiṣā
          varāhā vyāgʰrasiṃhakās ||
      - ab@verse[n=2]: gr̥dʰrās ca tatʰā gomāyus kr̥kalāsā vadanti ca | māṃsapeśaṃ
          ca rudʰiraṃ pāṃsuvr̥ṣṭis tatʰā eva ca ||
      - ab@verse[n=3]: vāyurūpam idaṃ sarvam adbʰutaṃ parikīrtitam | vāta ā vātu bʰeṣajaṃ
          vāyau ā yāhi darśata iti stʰālīpākasya homayet ||
      - ab@verse[n=4]: vāyur mahān nabʰapatir vajrapāṇis tatʰā īśvaras | śamanas sarvādbʰutānāṃ
          mahāvyāhr̥tayas tatʰā ||
      - ab@verse[n=5]: hutvā sviṣṭakr̥taṃ ca eva carutantraṃ samāpayet | vimuktotpātadoṣas
          tu jīvet tu śaradas śatam ||
    - section[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: atʰa ced anyaśākʰasu kartā bʰavati vedavit | japtvā sa r̥gyajuḥsāmnaṃ
          śatamātraṃ samāhitas ||
      - ab@verse[n=2]: gāyatryaṣṭaśataṃ japtvā yayajamānas samāhitas | vācayet tam
          upādʰyāyaṃ vastreṇa kanakena vā ||
      - ab@verse[n=3]: dr̥ṣṭāṃ ca eva adbʰutaṃ yasmins tat ca api pratipādayet | etās
          tu dakṣiṇās sarvās śaktiyukto na hāpayet ||
      - ab@verse[n=4]: yajamānas tatsuto vā yas svayaṃ kartum arhati | brāhmaṇāya
          viśeṣeṇa dadyāt tāṃ dakṣiṇāṃ śubʰām ||
      - ab@verse[n=5]: japtvā atʰarvaśiras ca eva kuryāt vipreṣu pūjanam | śaktyā
          atʰa bʰojanaṃ ca eva kuryāt vipreṣu pūjanam ||
      - ab@verse[n=6]: etad evaṃ samākʰyātam adbʰutānāṃ viśodʰanam | caturṇām api
          varṇānāṃ yas kuryāt śraddʰayā anvitas ||
      - ab@verse[n=7]: maraṇaṃ na bʰavet tasya na duḥkʰaṃ na daridratā | sidʰyanti
          sarvakāryāṇi dʰarme ca asya matir bʰavet ||
      - ab@verse[n=8]: etat puṇyaṃ paritraṃ ca devatāyāgapūjanam | sarvaśāntikaṃ ca
          eva pratipuruṣaṃ nibodʰata || pratipuruṣaṃ nibodʰata iti ||
  - pariśiṣṭa[n=68]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: svapnādʰyāyaḥ
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: om atʰātaḥ saṃpravakṣyāmi
          yad uktaṃ padmayoninā | upāṅgaṃ śukracārasta śubʰāśubʰanivedakam ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: svapnādʰyāyaṃ pravakṣyāmi
          kroṣṭuker vacanaṃ yatʰā | śaśaṃsire purā yaṃ hi śaunakāya mahātmane ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: nimittajñānakuśalāḥ sarvaṃ
          tasya tu pr̥ccʰataḥ | grahā bʰārgavabʰaumārkāḥ paittikā dīptitejasaḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: kapʰaprakr̥tayo madʰyā
          br̥haspatibudʰendavaḥ | vātaprakr̥tayaḥ krūrā rāhuketuśanaiścarāḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: teṣāṃ tatʰā pʰalaṃ vidyāt
          saṃnipāte yatʰākramam | ete nava grahā jñeyā vātapittakapʰātmakāḥ ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: eṣāṃ prakr̥titulyānāṃ
          niṣiktānāṃ tu teṣu vai | saṃyogeṣu ca jātānāṃ tulya prakr̥titā bʰavet ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: arkenduprabʰavā deham
          upatiṣṭʰanti dehinaḥ | tasmān niṣicyamāneṣu vātapittakapʰeṣu yaḥ ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: eṣām anyatamo deho yātiriktaḥ
          prakāśate | pracakṣate sā prakr̥tiḥ prakr̥tijñānakovidāḥ ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: tatra ye mānisvāṅgāni
          r̥javaḥ kalahapriyāḥ | uṣṇāḥ kapilaromāṇāaḥ svedanā anavekṣaṇāḥ ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: bahvāśidurbʰagāś caiva
          mr̥dvaṅgāḥ śiśirapriyāḥ | lālanāḥ śitʰilāṅgāś ca priyāś ca priyāś ca lavaṇās
          tatʰā ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: tanutvaṅnakʰaromāṇas
          tv ācāryās tīkṣṇa eva ca | valīpalitabʰūyiṣṭʰās tatʰā kʰalatino narāḥ ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: glayate śuṣyate caiṣām
          āśu mālyānulepanam | dāhātmikāḥ śaśāṅke 'pi pittaprakr̥tayas tu te ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: svapne caiva prapaśyanti
          diśaḥ kanakapiṅgalāḥ | maṇḍalāni samūhāṃś ca dikṣu pītāruṇaprabʰān ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: śr̥ṅgārimadirān deśāñ
          śuṣkāṃ malajalāṃ mahīm | śuṣkagulmadrumalatā dahyamānaṃ mahad vanam ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: viśuṣkāṇi ca vastrāṇi
          rudʰirāṅgāṃs tatʰaiva ca | dahanādīṃś ca devāṃś ca raktam induṃ sugandʰikān
          ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: palāśāni ca puṣpāṇi karṇikāravanāni
          ca | digdāhavidyuccʰulkāś ca dīpyamānaṃ ca pāvakam ||
      - ab@verse[n=17,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰūyiṣṭʰaṃ bʰūṣitāś cāpi
          pibanti subahūdakam | saritsaravanānteṣu kūpaprasravaṇeṣu ca ||
      - ab@verse[n=18,lg=san-Latn-x-vedic-metric-unacc-tld]: uṣṇārtāḥ śītakāmās tu
          nimajjanti pibanti ca | kalahaṃ caiva kurvanti duḥkʰāny anubʰavanti ca ||
      - ab@verse[n=19,lg=san-Latn-x-vedic-metric-unacc-tld]: strībʰiś caiva vimānyante
          kṣayante klāmayanti ca | ity evaṃ paittikā jñeyāḥ prakr̥tisvapnalakṣaṇe
          ||
      - ab@verse[n=20,lg=san-Latn-x-vedic-metric-unacc-tld]: prakr̥tisvapnabʰāvaiś
          ca śleṣmikāṇy api me śr̥ṇu | snigdʰakeśanakʰaśmaśrutatatvagroma[bʰāṣiṇaḥ]
          ||
      - ab@verse[n=21,lg=san-Latn-x-vedic-metric-unacc-tld]: mahodarabʰojoraskadīrgʰakeśanakʰa[dvijāñ]
          | vaiḍūryopalabaddʰe tu saṃnibʰair niyamaiḥ śubʰaiḥ ||
      - ab@verse[n=22,lg=san-Latn-x-vedic-metric-unacc-tld]: stʰiropacitasarvāṅgā
          bʰavanti sukʰabʰāginaḥ | śirodarakaṭiskandʰapakṣayor vimalekṣaṇāḥ ||
      - ab@verse[n=23,lg=san-Latn-x-vedic-metric-unacc-tld]: priyāḥ priyamvadāḥ śūrāḥ
          kr̥tajñā dr̥ḍʰabʰaktayaḥ | cirād gr̥hṇanti suciraṃ gr̥hītaṃ dʰārayanti ca
          ||
      - ab@verse[n=24,lg=san-Latn-x-vedic-metric-unacc-tld]: na krudʰyanti cirāt kruddʰāḥ
          saṃbʰavanty antakopamāḥ | pūjābʰir vipulāṃ bʰūmim āvahanti kulasya ca ||
      - ab@verse[n=25,lg=san-Latn-x-vedic-metric-unacc-tld]: kʰyāpayanti ca sarvatra
          guṇaiś ca vipulair yaśaḥ | māṃśoṣṇatātimadʰurapayohārātʰa suprajāḥ ||
      - ab@verse[n=26,lg=san-Latn-x-vedic-metric-unacc-tld]: na cirāc cʰuṣyate caiṣāṃ
          toyamālyānulepanam | nimīlitāsyanayanā niḥśabdā niḥprakampinaḥ ||
      - ab@verse[n=27,lg=san-Latn-x-vedic-metric-unacc-tld]: svapanty ekena pārśvena
          ciraṃ sukʰanibodʰanāḥ | nātiduḥkʰena jīvanti votpadyante sukʰena tu ||
      - ab@verse[n=28,lg=san-Latn-x-vedic-metric-unacc-tld]: śyāmāḥ śyāmāvadātāś ca
          śrīmanto 'dr̥ḍʰarogiṇaḥ | alpāśidīrgʰakāmās tu bʰavanty artʰasahiṣṇavaḥ
          ||
      - ab@verse[n=29,lg=san-Latn-x-vedic-metric-unacc-tld]: kṣutpipāsāsahāś cāpi
          kapʰaprakr̥tayo narāḥ | svapneṣu caiva paśyanti ramyaṃ candanakānanam ||
      - ab@verse[n=30,lg=san-Latn-x-vedic-metric-unacc-tld]: vikuḍmalapalāśāni pauṇḍarīkavanāni
          ca | śubʰāś ca śiśiraprāyā nadyaḥ śubʰajalāvahāḥ ||
      - ab@verse[n=31,lg=san-Latn-x-vedic-metric-unacc-tld]: tuṣāreṇāvr̥tāś cāpi himavāgʰapaṭalāni
          ca | muktāmaṇisuvāśr̥ṅgā mr̥ṇālapʰalakāni ca ||
      - ab@verse[n=32,lg=san-Latn-x-vedic-metric-unacc-tld]: varāhakʰaḍgamahiṣā mr̥gāś
          ca ratʰakuñjarāḥ | spaṣṭatāraṃ tu haṃsāś ca vyopoḍʰanti nabʰastalam ||
      - ab@verse[n=33,lg=san-Latn-x-vedic-metric-unacc-tld]: kundagokṣīragaurābʰir
          indoḥ kīrṇagabʰastiṣu | protpʰullakumudākārā vyomni sudʰāmbusaprabʰaiḥ ||
      - ab@verse[n=34,lg=san-Latn-x-vedic-metric-unacc-tld]: rājahaṃsapratīkāśaṃ śaśāṅkaṃ
          cāmaladyutim | śubʰrāṇi ca vimānāni pʰalāni madʰurāṇi ca ||
      - ab@verse[n=35,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥tapuṣpopahārāṇi mahānti
          bʰavanāni ca | brāhmaṇān yajñavādāṃś ca dadʰikṣīrāmr̥tāni ca ||
      - ab@verse[n=36,lg=san-Latn-x-vedic-metric-unacc-tld]: striyaś ca paramodāktāḥ
          suveṣāḥ svabʰyalaṃkr̥tāḥ | madʰuraśvetapītāni prāyaśaś ciram eva tu ||
      - ab@verse[n=37,lg=san-Latn-x-vedic-metric-unacc-tld]: svapneṣu caivaṃ paśyanti
          kapʰaprakr̥tayo narāḥ | prakr̥tisvapnabʰāveṣu vātikāny api lakṣayet ||
      - ab@verse[n=38,lg=san-Latn-x-vedic-metric-unacc-tld]: calāś ca calavikrāntāḥ
          kṣipramkṣipraṃ pralāpinaḥ | suptāḥ pralāpinas tv anye kaṣāyakaṭukapriyāḥ
          ||
      - ab@verse[n=39,lg=san-Latn-x-vedic-metric-unacc-tld]: tvagromanakʰadantoṣṭʰapāṇipādatalādiṣu
          | rūkṣaspʰuṭitadurdarśā durbalā duḥkʰabʰāginaḥ ||
      - ab@verse[n=40,lg=san-Latn-x-vedic-metric-unacc-tld]: kaṭʰinopacitāṅgāś ca
          bʰrāntacittāpʰutekṣaṇāḥ | lāpino mr̥davaḥ krūrā vidyād astʰirabuddʰayaḥ
          ||
      - ab@verse[n=41,lg=san-Latn-x-vedic-metric-unacc-tld]: nr̥tyagītakatʰāśīla jambʰino
          duḥkʰabʰāginaḥ | hrasvalomāḥ suvapuṣo durbalā dʰamanās tatʰā ||
      - ab@verse[n=42,lg=san-Latn-x-vedic-metric-unacc-tld]: kṣāmā bʰinnāḥ sadoṣāś
          ca satataṃ vānavastʰitāḥ | hastanakʰatvagoṣṭʰānāṃ pādānāṃ ca vikāriṇaḥ ||
      - ab@verse[n=43,lg=san-Latn-x-vedic-metric-unacc-tld]: akasmāt kopanāś cāpi
          rodanā dʰamānās tatʰā | paraprakr̥tiśīlāś ca valganāspʰoṭanapriyāḥ ||
      - ab@verse[n=44,lg=san-Latn-x-vedic-metric-unacc-tld]: durbalāḥ śiśirāś cāpi
          vātaprakr̥tayo naraḥ | svapneṣu caiva paśyanti vātābʰravimalā diśaḥ ||
      - ab@verse[n=45,lg=san-Latn-x-vedic-metric-unacc-tld]: mārutavegatuṅgāni bʰuvanāni
          vānāni ca | śyāmatārāgrahagaṇaṃ vidʰvastārkendumaṇḍalam ||
      - ab@verse[n=46,lg=san-Latn-x-vedic-metric-unacc-tld]: dʰārācaradbʰir viśvābʰaiḥ
          saṃkulaṃ gaganaṃ gʰanaiḥ | bʰramantaḥ pakṣisaṃgʰāś ca mr̥gāś codbʰrāntayūtʰapāḥ
          ||
      - ab@verse[n=47,lg=san-Latn-x-vedic-metric-unacc-tld]: anyāś cāpu śambarāś ca
          girigahvarakānanāḥ | bʰramanti gʰnanti dʰāvanti ūrdʰvebʰyaḥ prapatanti ca
          ||
      - ab@verse[n=48,lg=san-Latn-x-vedic-metric-unacc-tld]: svapneṣv etāni paśyanti
          vātaprakr̥tayo narāḥ | miśrasvapnasvabʰāveṣu saṃnipātātmakāḥ viduḥ ||
      - ab@verse[n=49]: etās tisraḥ prakr̥tayaḥ saṃsr̥ṣṭāś ca sarvaśaḥ ||
      - ab@verse[n=50,lg=san-Latn-x-vedic-metric-unacc-tld]: samyak karaṇavijñānaṃ
          tatʰā svapnād bʰavet pʰalam | śubʰaṃ vāpi aśubʰaṃ vāpi nirdeṣṭavyam aśeṣataḥ
          ||
      - ab@verse[n=51,lg=san-Latn-x-vedic-metric-unacc-tld]: yenayenendriyārtʰena
          viddʰaḥ svapiti mānavaḥ | tasyatasyendriyārtʰasya suptaḥ karmāṇi paśyati
          ||
      - ab@verse[n=52,lg=san-Latn-x-vedic-metric-unacc-tld]: prakr̥tyākr̥tasaṃkalpasaṃbʰavā
          devatāsv api | svapnamālāṃ tu yaḥ paśyed yāṃ tu dr̥ṣṭvā na tu smaret ||
      - ab@verse[n=53,lg=san-Latn-x-vedic-metric-unacc-tld]: naite pʰalaṃ prayaccʰanti
          gargasya vacanaṃ yatʰā | prakr̥tyānūkajān āhur eke śubʰapʰalodayān ||
      - ab@verse[n=54,lg=san-Latn-x-vedic-metric-unacc-tld]: sārasvataṃ yatʰānūkaṃ
          saṃgʰātasaṃśrayaṃ śr̥ṇu | dr̥ṣṭvā bʰogam asuptavyaṃ tataḥ prāpya śubʰaṃ
          pʰalam ||
      - ab@verse[n=55]: svapnaprakr̥tibʰāvaṃ tu jñātvā tattvaṃ samādiśet ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: gr̥hṇīta samudgendvindravāyvagnyarkanadīṃ
          kṣitim | samudraṃ vāhinīṃ dvīpaṃ laṅgʰayed vā vasuṃdʰarām ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: vāhinīṃ caturaṅgāṃ ca
          jīvacʰattrapatākinīm | dorbʰyāṃ ca pratigr̥hṇīyāt tatʰāketuvasuṃdʰarām ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: ekapuṣkariṇīparṇe sauvarṇe
          bʰāhane 'pi vā | sarpiṣā pāyasaṃ bʰuṅkte gāṃ duhan yaś ca budʰyati ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: pariveṣaḥ svayaṃ candre
          yo 'navastravasuṃdʰarām | parvatāgraṃ samāruhya kṣitiṃ yaś cāvalokayet ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: ā kaṇṭʰaṃ majjate yo hi
          mānavaḥ śoṇitārṇave | ratʰena siṃhayuktena parvataṃ cādʰirohati ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: mahīṃ vā kampayed yas
          tu cālayed vā punar girīm | śvetam aśvam atʰāruhya pāṇḍuraṃ vāpu yo gajam
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰuṅkte puṣkariṇīparṇe
          pāyasaṃ vāpi sarpiṣā | aṅgavr̥ddʰiṃ śirovr̥ddʰiṃ prāpnuyād yas tu mānavaḥ
          ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: brāhmaṇo vāpi rājā vā
          svapne yad abʰiṣecayet | rājā tu pārtʰivo jñeyaḥ kroṣṭuker vacanaṃ yatʰā
          ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: śiro vā cʰidyate yasya
          vimānaṃ śoṇitaṃ tatʰā | senāpatyaṃ mahac cāyur artʰalābʰaṃ tatʰaiva ca ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: vibʰūṣaṇaṃ ca vidyāṃ
          ca karṇacʰedam avāpnuyāt | hastacʰede labʰet putraṃ bāhucʰede dʰanāgamam
          ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: uraḥ sahasralābʰaḥ syāt
          pādacʰede tatʰaiva ca | uraḥprajananacʰede atyantaṃ sukʰaṃ dedʰate ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: cʰatrādarśapʰaloṣṇīṣaśuklamālyāgame
          tatʰā | matsyamāṃsadadʰikṣīrarudʰirāgama eva ca ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: śaktyaṅkuśapatākānāṃ
          cʰattrāsidʰanuṣāṃ tatʰā | vimalānāṃ jalānāṃ ca pūrvoktaṃ tu nidarśanam ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: sūkarakʰaravāhyānāṃ vadʰaś
          caikapaśor api | narayuktasya yānasya nikṣiptasya gavasya ca ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: darśanaṃ cāpy adr̥ṣṭānām
          agamyāgamanaṃ tatʰā | kṣīriṇāṃ pʰalamvr̥kṣāṇāṃ darśanārohaṇāni ca ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: viṣadarśanadaṃsparśo
          dʰānyenotsaṅgapūraṇam | dasyubʰir hanyamānasya rudataḥ pratibodʰanam ||
      - ab@verse[n=17,lg=san-Latn-x-vedic-metric-unacc-tld]: dvijebʰyo dadʰimāṃsasya
          lābʰaḥ piśitabʰakṣane | abʰakṣyabʰakṣaṇe cāpu śvetamālyānulepanam ||
      - ab@verse[n=18,lg=san-Latn-x-vedic-metric-unacc-tld]: gʰātanaṃ śvāpadānāṃ ca
          pāṇau ca rudʰirāgamaḥ | artʰalābʰāya boddʰavyaḥ suhr̥nmitrasamāgamaḥ ||
      - ab@verse[n=19,lg=san-Latn-x-vedic-metric-unacc-tld]: labʰate nātra saṃdeho
          bʰārgavasya vaco tatʰā | śuklāḥ sumanasaḥ kanyā dadʰi gobrāhmaṇaṃ vr̥ṣam
          ||
      - ab@verse[n=20,lg=san-Latn-x-vedic-metric-unacc-tld]: daivatāni nr̥pādʰyakṣāḥ
          pāṇḍurāṇi gr̥hāṇi ca | suhr̥daḥ sapʰalā vr̥kṣā nakṣatrāṇy amalaṃ jalam ||
      - ab@verse[n=21,lg=san-Latn-x-vedic-metric-unacc-tld]: iṣṭakalyāṇaśabdāś ca
          śuklāmbaradʰarāḥ striyaḥ | nabʰo vimalanakṣatraṃ pāvakaṃ viṣamārciṣam ||
      - ab@verse[n=22,lg=san-Latn-x-vedic-metric-unacc-tld]: dr̥ṣṭvā yas tatkṣaṇaṃ
          budʰyet tasya kalyāṇam ādiśet | vr̥kṣān gulmāṃś ca vallīś ca svagr̥he puṣpitā
          naraḥ ||
      - ab@verse[n=23,lg=san-Latn-x-vedic-metric-unacc-tld]: śuklavāsāḥ striyaś cāpi
          yaḥ paśyec cʰrīs tu taṃ bʰajet | viṣaśoṇitadigdʰāṅgaḥ prītīm āpnoti mānavaḥ
          ||
      - ab@verse[n=24,lg=san-Latn-x-vedic-metric-unacc-tld]: dīptāṅgo labʰate bʰūmiṃ
          vardʰamānāṅga eva ca | parivāryābʰirudito bāndʰavaiḥ karuṇaṃ naraḥ ||
      - ab@verse[n=25,lg=san-Latn-x-vedic-metric-unacc-tld]: śokārto labʰate tuṣṭiṃ
          mr̥taś cāyur avāpnuyāt | śuklamālyāmbaradʰaro dahyamānaḥ pralīyate ||
      - ab@verse[n=26,lg=san-Latn-x-vedic-metric-unacc-tld]: yaḥ svapne saṃbʰayed
          ugraṃ pārakyaṃ so 'rtʰam āpnuyāt | nāgadantakamudrāṃ ca vīṇāṃ mālāñjanaṃ
          tatʰā ||
      - ab@verse[n=27,lg=san-Latn-x-vedic-metric-unacc-tld]: kāñcanaṃ paśyate yas
          tu tatʰā strīṃ labʰate naraḥ | uḍḍīyamānān vihagān tatʰā puṣkariṇīgatān
          ||
      - ab@verse[n=28,lg=san-Latn-x-vedic-metric-unacc-tld]: mattaṃ kareṇum āruhya
          parastrīṃ labʰate naraḥ | kumārīṃ labʰate nārīm āyasair nigaḍair naraḥ ||
      - ab@verse[n=29,lg=san-Latn-x-vedic-metric-unacc-tld]: baddʰvā navāṃ tu yo mālām
          utpālānāṃ vibudʰyate | kavāṭale ca saṃyukte tatʰaivotpalahastake ||
      - ab@verse[n=30,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰr̥ṅgāro darpaṇo vāpi
          labdʰvā putrāgamaṃ vadet | taḍāgārāmakūpānāṃ purārañjanayor api ||
      - ab@verse[n=31,lg=san-Latn-x-vedic-metric-unacc-tld]: pūrṇakumbʰasya cādeśyaṃ
          varṣam uttaraṇād bʰruvam | cipiṭaḥ kālako nagnaḥ śravaṇo mehate yadi ||
      - ab@verse[n=32,lg=san-Latn-x-vedic-metric-unacc-tld]: vidiktʰaḥ sravate cārmiḥ
          svapne varṣaṃ samādiśet | sūkarīṃ mahiṣīṃ vāpi hastinīṃ śakunīṃ tatʰā ||
      - ab@verse[n=33,lg=san-Latn-x-vedic-metric-unacc-tld]: svapne yadā prasūyeta
          subʰikṣaṃ nirdiśet tadā | śayanāsanayānāni gr̥hagrāmapurāṇi ca ||
      - ab@verse[n=34,lg=san-Latn-x-vedic-metric-unacc-tld]: yeṣāṃ svapne pralīyante
          teṣāṃ vr̥ddʰim atʰādiśet | govr̥ṣaṃ puruṣaṃ vr̥kṣaṃ hastinaṃ parvataṃ gr̥ham
          ||
      - ab@verse[n=35,lg=san-Latn-x-vedic-metric-unacc-tld]: narasyārohaṇād vr̥ddʰiḥ
          pāṇḍurāṇi viśeṣataḥ | daivatāni dvijā gāvaḥ pitaro liṅgino grahāḥ ||
      - ab@verse[n=36,lg=san-Latn-x-vedic-metric-unacc-tld]: yad vadanti naraṃ svapne
          tat tatʰaiva vinirdiśet | saritsarasamudrāṇāṃ taraṇe śokatāraṇam ||
      - ab@verse[n=37,lg=san-Latn-x-vedic-metric-unacc-tld]: narasya śoṇitaṃ pītvā
          prakr̥tāṇl labʰate naraḥ | candrendradʰvajasūryāṇāṃ patane nr̥pater bʰayam
          ||
      - ab@verse[n=38,lg=san-Latn-x-vedic-metric-unacc-tld]: mahārṇavamahendrāṇāṃ
          kṣobʰe kṣobʰaṃ vinirdiśet | keśaśmaśrunakʰānāṃ ca patane śokasaṃbʰavaḥ ||
      - ab@verse[n=39,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥miṇatvaṃ bʰaved dʰanyaṃ
          kroṣṭuker vacanaṃ yatʰā | kravyādair damṣṭribʰiś cāpi vināśo bʰūtavigrahe
          ||
      - ab@verse[n=40,lg=san-Latn-x-vedic-metric-unacc-tld]: śastramuṣṭiprahāreṣu
          vijānīyāj jvarāgamam | yadyad ujjvalavad dravyaṃ tattat sukʰakaraṃ bʰavet
          ||
      - ab@verse[n=41,lg=san-Latn-x-vedic-metric-unacc-tld]: yadyad virudʰyate vāpi
          svapne tat tasya nirdiśet | [nopānena] prajātānāṃ darśane stʰānam ādiśet
          ||
      - ab@verse[n=42,lg=san-Latn-x-vedic-metric-unacc-tld]: upānahabalacʰattradarśane
          ca grhe tatʰā | hasadbʰir vā parivr̥to nr̥tyadbʰiḥ svajanair api ||
      - ab@verse[n=43,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃyuktaṃ sūkarakʰarair
          uṣṭraiḥ kr̥ṣṇacatuṣpadaiḥ | ratʰam āruhya yo yāyād akṣatas tu yugaṃdʰaraḥ
          ||
      - ab@verse[n=44,lg=san-Latn-x-vedic-metric-unacc-tld]: prakīrṇakeśo hriyate
          dakṣiṇenāpareṇa vā | dakṣiṇenāgatā kanyā kālikākulavāsinī ||
      - ab@verse[n=45,lg=san-Latn-x-vedic-metric-unacc-tld]: nīyate puruṣair yaś ca
          pāśahastair viśeṣataḥ | nirastānāṃ viṣamāṇāṃ pretenākuśalaṃ bʰavet ||
      - ab@verse[n=46,lg=san-Latn-x-vedic-metric-unacc-tld]: piṇyākasya tilānāṃ ca
          karṣāsu lavaṇasya ca | rūḍʰaśmaśrunakʰānāṃ ca duścelānāṃ ca vāsasām ||
      - ab@verse[n=47,lg=san-Latn-x-vedic-metric-unacc-tld]: virāgavāsasāṃ vāpi vikr̥tānāṃ
          tatʰaiva ca | sarīsr̥pāṇāṃ vyālānāṃ śatrūṇāṃ cāpi darśanam ||
      - ab@verse[n=48,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥ṣṇānāṃ vāpi sarveṣāṃ
          rājadvijavr̥ṣād r̥te | darśanaṃ gamanaṃ vāpi śokam āyāsavedanam ||
      - ab@verse[n=49,lg=san-Latn-x-vedic-metric-unacc-tld]: padmair vā jalabʰāṇḍair
          vā krīḍitāyāsadarśanam | padmāni vāharet svapne hastacʰedam avāpnuyāt ||
      - ab@verse[n=50,lg=san-Latn-x-vedic-metric-unacc-tld]: prasanne tu dʰruvaṃ śoko
          rajjucʰede mriyeta saḥ | rūḍʰasya srotasā śoko mr̥tyuḥ sriotasi naśyataḥ
          ||
      - ab@verse[n=51,lg=san-Latn-x-vedic-metric-unacc-tld]: dantā bāhuṃ tatʰā śīrṣṇo
          cʰinnāṃśadravyadarśanam | bʰrātaraṃ pitaraṃ vāpi putraṃ vā nāśayanti te
          ||
      - ab@verse[n=52,lg=san-Latn-x-vedic-metric-unacc-tld]: dvāre vā sārgale vāpi
          śayyāṃ śakʰāṃ tatʰaiva ca | svapne yasya pranaśyanti bʰāryā tasya vinaśyati
          ||
      - ab@verse[n=53,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥kalāso vr̥ko vāpi
          puruṣo vāpi piṅgalaḥ | śayyāṃ yasyādʰirohanti bʰāryā tasyāpi duṣyati ||
      - ab@verse[n=54,lg=san-Latn-x-vedic-metric-unacc-tld]: svapne yo mārayet sarpaṃ
          śvetapītakalohitam | kr̥ṣṇasya vā śiraś cʰindyāt putras tasya vinaśyati
          ||
      - ab@verse[n=55,lg=san-Latn-x-vedic-metric-unacc-tld]: rājaputraś ca coraś ca
          rājabʰr̥ṭyaś ca yo bʰavet | tasya svapnāḥ pʰalaṃ dadyur eteṣu yad udāhr̥tam
          ||
      - ab@verse[n=56,lg=san-Latn-x-vedic-metric-unacc-tld]: yeṣāṃ lābʰe bʰaved vr̥ddʰis
          teṣāṃ nāśe guṇo bʰavet | yeṣāṃ lābʰe bʰaved dʰānis teṣāṃ lābʰe guṇo bʰavet
          ||
      - ab@verse[n=57,lg=san-Latn-x-vedic-metric-unacc-tld]: śubʰaṃ dr̥ṣṭvā tu yaḥ
          svapne punaḥ paśyaty apūjitam | śubʰaṃ vāpy aśubʰaṃ vāpi yat paścāt tatpʰalaṃ
          labʰet ||
      - ab@verse[n=58,lg=san-Latn-x-vedic-metric-unacc-tld]: svapnās tu pratʰame yāme
          saṃvatsaravipākinaḥ | dvitīye 'ṣṭasu māseṣu tr̥tīye tu tadardʰabʰāk ||
      - ab@verse[n=59]: māsiko govisarge tu sadyaḥpākaḥ prabʰātike. kālaḥ pañcasv
          avastʰāsu śarvaryāḥ kīrtitaḥ pr̥tʰak ||
      - ab@verse[n=60,lg=san-Latn-x-vedic-metric-unacc-tld]: viprebʰyaḥ śaktito dānaṃ
          śāntiḥ svaṣṭyayanādayaḥ | vināśayanti duḥsvapnaṃ prātaś cāśvattʰasevanam
          ||
      - ab@verse[n=61,lg=san-Latn-x-vedic-metric-unacc-tld]: aśvattʰasevā tilapātradānaṃ
          gosparśanaṃ brāhmaṇatarpaṇaṃ ca | śāntikriyā svastyayanakriyā ca duḥsvapnam
          etāni vināśayanti ||
      - ab@verse[n=62,lg=san-Latn-x-vedic-metric-unacc-tld]: vasnakanakadānadevapūjāgurugoṣṭʰaniṣevitāni
          kuryuḥ | dvijavr̥ṣabḥgavāśvapārtʰivānāṃ darśanam itihāsamaṅgalāḥ syuḥ ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: imān dr̥ṣṭvāśubʰān svapnān prātar uttʰāya satvaraḥ | nadīsaṃgamatoyena
          mukʰaṃ saṃmārjya tattvataḥ ||
      - ab@verse[n=2]: hiraṇyavarṇābʰir udakaṃ śaṃtātīyamayobʰuvā | abʰimantrya prayatnena
          mukʰaṃ saṃmārjya tattvataḥ ||
      - ab@verse[n=3]: yo na jīvaḥ paro 'pehi vidma te svapna vedanam | rocanā sarṣapā
          mr̥dā samit sakusumaṃ dadʰi ||
      - ab@verse[n=4]: gām ajaṃ kanakaṃ sattvaṃ kumārīṃ brāhmaṇaṃ śubʰam | abʰivandya
          nr̥po yāyāt suhr̥dāṃś ca manoharān ||
      - ab@verse[n=5]: yadā tu yātrāṃ nr̥patiḥ kartum iccʰed vidʰānavit | atʰa svastyayanaiḥ
          [saumyaiḥ saumyais tam abʰimantrayet ||
      - ab@verse[n=6]: tataḥ śuklāmbaradʰaro vāgyataḥ saṃyatendriyaḥ | tāṃ niśaṃ saṃviśed
          rājā bʰūmau caivābʰimantrayet ||
