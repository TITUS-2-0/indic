  - pariśiṣṭa[n=71]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: auśanasādbʰutāni
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: papraccʰośanasaṃ kāvyaṃ nāradaḥ paryavastʰitaḥ | divyāṃś caivāntarikṣāṃś
