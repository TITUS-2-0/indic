text:
- body:
  - preface:
    - ab@verse: śrīgaṇeśāya namaḥ || oṃ namo 'tʰarvātmane vāmadevāya śivāya || śrīsarasvatyai
        namaḥ ||
  - pariśiṣṭa[n=1]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: nakṣatrakalpaḥ
    - section[n=1]:
      - ab@verse[n=1]: atʰa nakṣatrakalpaṃ vyākʰyāsyāmaḥ ||
      - ab@verse[n=2]: kr̥ttikā rohiṇī mr̥gaśira ārdrā punarvasū puṣyāśleṣā magʰā(ḥ)
          pʰālgunī pʰalgunyau hasta(ś) citrā svāti(r) viśākʰe anurādʰā jyeṣṭʰā mūla(m)
          pūrvāṣāḍʰā uttarāṣāḍābʰijic cʰravaṇaḥ śraviṣṭʰā śatabʰiṣaḥ pūrvaproṣṭʰapadottaraproṣṭʰapadau
          revaty aśvayujau bʰaraṇyaḥ ||
    - section[n=2]:
      - ab@verse[n=1]: ṣaṭ kr̥ttikā ekā rohiṇī tisro mr̥gaśira ekārdrā dve punarvasū
          ekaḥ puṣyaḥ ṣaḍ āśleṣāḥ ṣaṇ magʰāḥ catasraḥ pʰalgunyaḥ pañca hasta ekā citrā
          ekā svātir dve viśākʰe catasro 'nurādʰā ekā jyeṣṭʰā sapta mūlam aṣṭāv aṣāḍʰā
          eko 'bʰijit tisraḥ śravaṇaḥ pañca śraviṣṭʰā ekā śatabʰiṣā catasraḥ proṣṭʰapadau
          ekā revatī dve aśvayujau tisro bʰaraṇyaḥ ||
      - ab@verse[n=2]: iti saṃkʰyāparimitaṃ brahma ||
    - section[n=3]:
      - ab@verse[n=1]: āgniveśyaḥ kr̥ttikā rohiṇy ānurohiṇī śvetāyinaṃ mr̥gaśira ārdrā
          bārhadgavī vātsyāyanau punarvasū bʰāradvājaḥ puṣyo jātūkarṇyo 'śleṣā vaiyāgʰrapadyo
          magʰā(ḥ) pārāśaryau pūrve pʰālguṇyāv aupaśivyā uttare māṇḍavyāyano hastaś
          citrā gautamī kauṇḍinyāyanaḥ svātiḥ kāpile viśākʰe maitreyy anurādʰā kauśikī
          jyeṣṭʰā kautsaṃ mūlaṃ hāritayajñī pūrvāṣāḍʰā kāśyapy uttarā śaunako 'bʰijid
          ātreyaḥ śravaṇo gārgyaḥ śraviṣṭʰā dākṣāyaṇī śatabʰiṣag vātsyāyanyau pūrve
          proṣṭʰapade āgastyāv uttare śāṅkʰāyanī revatī kātyāyan(y)āv aśvayujau mātr̥bʰyo
          bʰaraṇyaḥ vasiṣṭʰaḥ kaśyapa ādityaś candramā brahmāṇo nakṣatreṣu ||
    - section[n=4]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥ttikā agnidevatyā rohiṇyāṃ
          tu prajāpatiḥ | saumyaṃ mr̥gaśiraṃ vidyān marutaś cātra daivatam ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: rudrasyārdrāditeḥ punarvasū
          puṣye vidyād br̥haspatim | aśleṣā{ḥ} sarpadaivatyā magʰāsu pitaraḥ smr̥tāḥ
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰagas [tu] pūrvayoḥ pʰalgunyor
          aryamottarayor api | haste ca savitā daivaṃ citrā tu tvaṣṭr̥daivatā ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: svātau tu daivataṃ vāyur
          indrāgnī tu viśākʰayoḥ | anurādʰāsu mitro vai jyeṣṭʰāyām indramahādevau
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: ahir budʰnyaś ca mūlasya
          nirr̥tiś cātra daivatam | āpaḥ pūrvāsv aṣāḍʰāsu viśve devās tatʰottare ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: abʰijid brahmadevatyaḥ
          śravaṇe viṣṇur ucyate | śraviṣṭʰā vasudevatyā śatabʰiṣag varuṇendrayoḥ ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: aja ekapād diśaś ca ādityaś
          ca tatʰottare | revatī pūṣadaivatyā aśvinyām aśvinau smr̥tau ||
      - ab@verse[n=8]: bʰaraṇyo yamadevatyā devatāḥ saṃprakīrtitāḥ ||
    - section[n=5]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥ttikā magʰā mūlaṃ {ca
          tatʰā} pūrvāṇi dvandvinām | etāni purastādbʰāgāny ahaḥpūrvāṇi jānīyāt ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: ārdrāṃ śatabʰiṣajaṃ svātim
          āśleṣā bʰaraṇīr api | naktaṃbʰāgāni bruvate jyeṣṭʰayā saha brahmāṇam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: punarvasū viśākʰe ca uttarāṇi
          ca dvandvinām | rātrīm ubʰayataḥ pakṣau bʰajante yā ca rohiṇī ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: mr̥gaśiraḥ puṣyo hastaś
          citrā tu sahānurādʰaiḥ | śravaṇaś ca śraviṣṭʰāś ca revaty aśvayujau nava
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: etāny upariṣṭādbʰāgāni
          rātrīpūrvāṇi jānīyāt | muhūrto 'bʰijid ucyate ||
      - ab@verse[n=6]: purastādbʰāgāny anāgatenopariṣṭādbʰāgāny atikrāntena ubʰayatobʰāgāni
          vartamāne{na} naktaṃbʰāgāni samaṃ candreṇa vā ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: '{ṣaḍ a}nāgatayogīni stʰitayogīni
          dvādaśa | navātikrāntayogīni tatʰā yogaḥ pradr̥śyate ||'
    - section[n=6]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: bahūni jātāni graho hinasti
          kr̥ttikāsu tiṣṭʰann uta dīrgʰam āyuḥ | ajāvayo mūṣikāś ca vyatʰante viśo
          brahmaṇaḥ saha mleccʰavāṃś ca ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: kaliṅgānāṃ vyatʰate nanu
          rājā hiraṇyakārāṃś ca nihanti kr̥tsnam | ayaskārā lohakārā āhitāgniś ca
          kr̥tsnaṃ niyanti sahāgnitaptaiḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: ayo lohaṃ rajataṃ jātarūpaṃ
          hiraṇyamiśraṃ [yac] ca patanti sāram | kāśāḥ kuśā yac ca suvarṇavarṇaṃ yac
          cāgnivarṇaṃ pʰalamūlapuṣpam ||
      - ab@verse[n=4]: '[ye tatra jātāḥ] sarāṃsi śuṣyanty apayanti nadyaḥ prajā vyatʰante
          paśavo mr̥gāś ca || prajāpater hr̥daye pīḍyamāne sarvaṃ jagad vyatʰate sapradeśam
          ||'
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: mahābʰaumo rājā mariṣyatīti
          vidyād ekāriṇāṃ cʰavakām invakāsu | nakṣatrabʰāge niyanti yojadʰānāḥ tatʰā
          hi nūnaṃ triṇavena sr̥ṣṭam ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: tatʰā sa ninye nidʰānadarśanāya
          tatra teṣāṃ sahākṣemaṃ tasya vidyāt | paritya ye pūrvapadān balena uttiṣṭʰanti
          vīryavanto mr̥gānām ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰagena devy upayanti
          divyam ārdrābʰāge sahino bʰavanti | tatra daivān mānuṣyāṃś ca punarvasvor
          nakṣatra bʰāge niniyoja dʰānāḥ ||
      - ab@verse[n=8]: tatʰā hi nūnaṃ puṣyo bʰāga ekadʰā brāhmaṇānāṃ tatʰā vidur nakṣatraveditāraḥ
          tatʰā hi nūnam ||
      - ab@verse[n=9]: śatadrayaḥ kaiśikā dakṣiṇārdʰā āndʰrāś ca yogahāsayā pravr̥ddʰāḥ
          || aśleṣābʰāge sahino bʰavanti tatra ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: veṇūn pitr̥̄ṃs trirujāhur
          devatām | magʰābʰāge aṣṭame devasr̥ṣṭam | saṃyujyante devaprasādanena tatra
          ||
    - section[n=7]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: rājñāṃ rākāyām atʰa madrakaikayā
          manomāpāyanasahaparisunniyojasahāntau | tunyam atʰa saptamātraṃ pūrvabʰāge
          navake pʰalgunīṣu ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: matsyā māgadʰāś cedayaś
          ca śālvā matsyā ubʰe pʰalgunīṣu | saṃyujyante devaprasādanena tatra ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: pūrvācāryā iccʰamānāś
          ca sarve yakr̥t kloma saha bʰāgena haste | saṃyujyante devaprasādanena tatra
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: ye pūrvārdʰe nijīhate
          carantaḥ śāntā mr̥gā [jantu]paśavo apagāminas te | paśavo bʰavatāś ca sarve
          citrāyā bʰāge sahino bʰavanti || tatrā-
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: -cyutakeśaṃ vāhanaṃ jayārtʰaṃ
          kumāryo anaḍvān sahate atra ye | vijñāyate devasr̥ṣṭaṃ purāṇaṃ svātiṃ bʰajante
          tr̥ṇavaś ca sarve ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: vr̥kṣā vr̥kṣamūlam ikṣvākavaś
          ca viśākʰāyāṃ yojitāḥ sāṃpadena | tasmin gr̥hīte bʰayam eva teṣāṃ daivopasr̥ṣṭe
          tu balena kāryam || ye tatra jātāḥ ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: ye paścārdʰe nijīhate
          caranta āsavo mr̥gā uttarārdʰāś cāndʰrāḥ | anūrādʰāsu magadʰavaṅgamatsyāḥ
          sarve samagrāḥ sahino bʰavanti tatra ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: pañcaikadʰā janapadā bʰavanti
          sayujaḥkāsaubaladādauṣyadʰāḥ | bāhlīkā jyeṣṭʰā upayanti bʰaktyā tatra ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: ikṣvākūṇāṃ nirmatʰyā mūlam
          āhuḥ | tatʰā vidur nakṣatraveditāras tatʰā hi nūnam
      - ab@verse[n=10]: kāmbojāḥ kālamr̥ṣāś ca krandā uccʰuṣmāṇaḥ śvānaś cāvadʰūmamarkaṭāś
          ca pūrvāṣāḍʰā upayanti bʰaktyā tatra ||
    - section[n=8]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: viśve devāḥ saha pañcālajyeṣṭʰā
          āpaś ca yāḥ pāntu bʰūtaṃ bʰaviṣyat | uttarāṣāḍʰā upayanti bʰaktyā tatra
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: nārkavindā nārvvidālā
          nasr̥ṅgāvau naiṣadʰā jantavo mataṅgāḥ | abʰijitaṃ hārtʰavijñāya bʰejire
          tatra ||
      - ab@verse[n=3]: pāñcālāḥ śravaṇam upaiti bʰaktyā sunvantaś cobʰe vidvān bʰūtā
          niniyoja devaḥ || pūrvakartā bʰūtabʰaviṣyakālas tatʰā ni nūnam
      - ab@verse[n=4]: kurūn śraviṣṭʰās tatʰā śivās tatʰāhur nakṣatrabʰāge niniyoja
          dʰānāḥ || tatʰā hi nūnam
      - ab@verse[n=5]: aṅgādayo janapadā guhāśayā apsu ca ye kṣipanti śatabʰiṣaji
          bʰeṣajasya bʰejire tatra ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: kʰaḍgā hastino gavayā
          varāhā ahīnarā kuntayaś cāpi sarve | pūrvau proṣṭʰapadā upayanti bʰaktyā
          tatra ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: uśīnarā uttarayoḥ proṣṭʰapadayor
          nakṣatrabʰāge niniyoja dʰānāḥ | tatʰā hi nūnam
      - ab@verse[n=8]: āvr̥tāḥ śūdrāḥ saha kāravaś ca dakṣiṇapūrve yūkabʰiḥ saha revatīṃ
          hārtʰavijñāya bʰejire tatra ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: acyutakeśaṃ vāhanaṃ ca
          padārtʰam ucāvacajanapadā mahāntaḥ | aśvayujau hārtʰavijñāya bʰejire tatra
          ||
      - ab@verse[n=10]: ubʰaye kīkaṭāḥ kauśalāś ca rahaś ca[vo] ye ca prasuptāś caranti
          bʰaraṇīḥ sahārtʰavijñāya bʰejire tatra teṣāṃ sahākṣayam asya vidyāt ||
    - section[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kariṣyamāṇaḥ saṃgrāmaṃ pratirājena kṣatriyaḥ | brāhmaṇaṃ pūrvam
          anviccʰed vidvāṃsaṃ śāstravittamam ||
      - ab@verse[n=2]: utpātān yas tu yān vidyād divyāntarikṣapārtʰivān | taṃ vai
          lipsitum arhati rājā rāṣṭre jijīviṣuḥ ||
      - ab@verse[n=3]: grahāṇāṃ yaḥ stʰitiṃ vidyān nakṣatrāṇāṃ ca sāṃpadam | anabʰyaktam
          upāsīta nakṣatrasamatāṃ ca yat ||
      - ab@verse[n=4]: āyudʰīyān bibʰrad rājā kr̥ttikāsu na riṣyati | tad dʰi tejasvi
          nakṣatraṃ bahulaṃ divi rocate ||
      - ab@verse[n=5]: atʰo hi kr̥ttikā iti nakṣatraṃ bʰānumattamam | āgneyam agninakṣatraṃ
          rājā hy asmin pravardʰate ||
      - ab@verse[n=6]: rohiṇyā[ṃ] sārdʰam āsīta rajjupalyāni kārayet | mr̥gaśirasy
          aśvān bibʰr̥yāt sāsya senā na riṣyati ||
      - ab@verse[n=7]: saumyaṃ somasya nakṣatraṃ rājā hy asmin pravardʰate | ārdrāyāṃ
          mr̥gayāṃ yāyād amitrebʰyaś ca hāvayet ||
      - ab@verse[n=8]: punarvasvābʰiyuñjīta puṣyenaitāṃ prayojayet | iṣīkāṃ cʰedayan
          rājā aśleṣāsu na riṣyati ||
      - ab@verse[n=9]: magʰābʰiḥ sārdʰam āsīta na yāyād uccʰrayaṃ cana | pʰalgu dvārāṇi
          kārayet paricārāṃś ca vāhayet ||
      - ab@verse[n=10]: toraṇāni ca saṃhanyuḥ pʰalakāni ca takṣayet | ..... uttarābʰyāṃ
          ca hāvayet ||
    - section[n=10]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: hastena citrām ākāṅkṣen
          nakṣatrasya parigraham | anekadarśī syāc citrāyāṃ purā svāter abʰiplavāt
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: svātau śiśūn niyojayej
          javārtʰān ratʰavāhinaḥ | atʰāsmin [kanyām] upavāsayet kṣipraṃ sā labʰate
          patim ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: pradatīn kārayan rājā
          viśākʰāyāṃ na riṣyati | lepayet pradatī rājā anūrādʰāsu kṣatriyaḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: jyeṣṭʰāyāṃ hastinaṃ paśyed
          abʰiṣekāṃś ca kārayet | ..... rājaputrāṃś ca yodʰayet ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: mūlena parikʰāṃ kʰānayet
          puraṃ citena yojayet | nairr̥taṃ rājanakṣatraṃ vadʰyān anena gʰātayet ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: trirātraṃ sārdʰaṃ dīkṣayitvā
          āṣāḍʰāsu vrataṃ caret | abʰijity abʰiyuñjīta śravaṇena cikīrṣatu ||
      - ab@verse[n=7]: śraviṣtʰābʰiḥ sr̥jed rasān ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: śatabʰiṣaji bʰiṣakkarma
          bʰaiṣajyaṃ cātra kārayet | prācīnaproṣṭʰapadayor yāyād ...
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: uttarābʰyām abʰiyuñjīta
          gr̥heṣu revatyāṃ vaset | vi senāṃ kārayed rājā aśvinyāṃ bʰaraṇīṣu ca ||
    - section[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: citrāṇi sākaṃ divi rocanāni sarīsr̥pāṇi bʰuvane javāni | turmiśaṃ
          sumatim iccʰamāno ahāni gīrbʰiḥ saparyāmi nākam ||
      - ab@verse[n=2]: suhavam agne kr̥ttikā rohiṇī castu bʰadraṃ mr̥gaśiraḥ śam ārdrā
          | punarvasū sūnr̥tā cāru puṣyo bʰānur āśleṣā ayanaṃ magʰā me ||
      - ab@verse[n=3]: puṇyaṃ pūrvā pʰalgunyau cātra hastaś citrā śivā svāti sukʰo
          me astu | rādʰe viśākʰe suhavā anurādʰā jyeṣṭʰā sunakṣatram ariṣṭamūlam
          ||
      - ab@verse[n=4]: annaṃ pūrvā rāsatāṃ me aṣāḍʰā ūrjaṃ dehy uttarā ā vahantu |
          abʰijin me rāsatāṃ puṇyam eva śravaṇaḥ śraviṣṭʰāḥ kurvatāṃ supuṣṭim ||
      - ab@verse[n=5]: ā me mahac cʰatabʰisag varīya āme dvayā proṣṭʰapadā suśarma
          | ā revatī cāśvayujau bʰagaṃ ma ā me rayiṃ bʰaraṇya ā vahantu ||
    - section[n=12]:
      - ab@verse[n=1]: kr̥ttikā rohiṇī mr̥gaśira ārdrā punarvasū puṣyāśleṣā magʰāḥ
          pūrve pʰalgunyau tan navamam agnir daśamam ahorātre edādaśadvādaśe ||
      - ab@verse[n=2]: etāny evāsmai nakṣatrāṇi śriyaṃ bʰūtiṃ puṣṭiṃ prajāṃ paśūn
          annam annādyaṃ samindʰata iti veda
      - ab@verse[n=3]: atʰa yaṃ kāmayaty etāny evāsmai nakṣatrāṇi śriyaṃ bʰūtiṃ puṣṭiṃ
          prajāṃ paśūn annam annādyaṃ samindʰīrann iti tasmād etasmin nakṣatra evaṃvidvān
          kuryāt
      - ab@verse[n=4]: prāñcam idʰmam upasamādʰāya {parisamuhya paryukṣya} paristīrya
          barhī rasān barhiṣy ādʰāyānvālabʰyātʰa juhuyāc citrāṇi sākaṃ divi rocanāni
