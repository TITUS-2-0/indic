          tvātisr̥jāmi gaṇatvāyai tvātisr̥jāmi sahasrapoṣāyai tva7atisr̥jāmi aparimitapoṣāyai
          tvātisr̥jāmīti paryukṣyaikarūpaṃ dvirūpaṃ bahurūpaṃ vā yo vā yūtʰaṃ cʰādayati
          yūtʰena tejasvinālaṃkr̥tenālaṃkr̥tam aparājitāṃ diśaṃ niṣkrāmayeyuḥ saha
          vatsatarībʰis tantraṃ saṃstʰāpayeyur
      - ab@verse[n=12]: atʰa brahmaṇe gāṃ payasvinīṃ dadyāt pāyasena brāhmaṇān bʰojayitvotsr̥jya
          sarvān kāmān āpnoti akṣayāṇ ca lokān āpnotīti
  - pariśiṣṭa[n=19]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: indramahotsavaḥ
    - section[n=1]:
      - ab@verse[n=1]: atʰa rājñam indramahotsavasya upacārakalpaṃ vyākʰyāsyāmaḥ ||
      - ab@verse[n=2]: prauṣṭʰapade śuklapakṣe ||
      - ab@verse[n=3]: saṃbʰr̥teṣu saṃbʰāreṣu brahmā rājā ca ubʰau snātau ahatavasanau
          surabʰisujātānulepanau karmaṇyau vratavantau upavasataḥ
      - ab@verse[n=4]: '[vratavantau] śvo bʰūte śamnodevyāḥ pādair ardʰarcābʰyām r̥cā
          ṣakr̥tvodakaṃ pari vācam ācānto'
      - ab@verse[n=5]: barhir upakalpayitvā rājānam anvālabʰya juhuyāt ||
      - ab@verse[n=6]: arvāñcam indraṃ trātāram indram indraḥ sutrāmā imam indra vardʰaya
          kṣatriyaṃ me hantāya vr̥ṣa indrasya indro jayāti iti ca hutvā rāṣṭrasaṃvargaiś
          cā
      - ab@verse[n=7]: atʰa indram uttʰāpayanti ā tvā ahārṣam antar dʰruvādyaur viśas
          tvā sarvā vāñcʰantu iti sarvato 'pramattā dʰārayerann
      - ab@verse[n=8]: adbʰutaṃ hi savanānayet samuttʰitaṃ bʰavati || yadi prācyām
          agnibʰayam || yadi dakṣiṇasyāṃ yamabʰayam || yadi pratīcyāṃ varuṇabʰayam
          || yadi udīcyāṃ kṣudbʰayam || yadi antardeśebʰyobʰayato vidyād
      - ab@verse[n=9]: agnir mā pātu agniṃ te vasumantam r̥ccʰantv iti || yatʰāsvaliṅgaṃ
          dvābʰyāṃ-dvābʰyāṃ pradakṣiṇaṃ pratidiśam upastʰāpayet ||
      - ab@verse[n=10]: gr̥dʰraś ced asmin nipatati mr̥tyor bʰayaṃ bʰavati || yad
          vā kr̥ṣṇaśakunir antarikṣrṇa patati iti japed yas tvā gr̥dʰraḥ kapota iti
          antato japet
      - ab@verse[n=11]: sarvatra anājñāteṣu trirātraṃ gʰr̥takambalam ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: śirobʰaṅge tu rājānaṃ
          madʰyabʰaṅge tu mantriṇam | ādibʰaṅge janapadaṃ mūlabʰaṅge tu nāgarān ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: indrāṭako yadā bʰidyād
          rājakośo vilupyate | rajjucʰede parijāte nr̥patis tu vinaśyati ||
    - section[n=2]:
      - ab@verse[n=1]: sāvitryā abʰimantritaṃ kr̥tvā pradakṣiṇam āvartayed rājānam
          abʰibʰūr yajña iti etais tribʰiḥ sūktair anvārabdʰe rājani pūrṇahomaṃ juhuyāt
          ||
    - section[n=3]:
      - ab@verse[n=1]: atʰa paśūnām upācāram ||
      - ab@verse[n=2]: indradevatāḥ syur ye rājño bʰr̥tyāḥ syuḥ sarve dīkṣitā brahmacāriṇaḥ
          syur
      - ab@verse[n=3]: indraṃ copasadya yajeran || trirātraṃ saptarātraṃ vā
      - ab@verse[n=4]: trir ayanam ahnām upatiṣṭʰante havisā ca yajante ||
      - ab@verse[n=5]: āvr̥ta indram aham iti indra kṣatram iti haviṣo hutvā
      - ab@verse[n=6]: brāhmaṇān svastivācya indram avabʰr̥tʰāya vrajanti
      - ab@verse[n=7]: apāṃ sūktair āplutya pradakṣiṇam āvr̥tya apa upaspr̥śya anapekṣamāṇāḥ
          pratyetya brāhmaṇān bʰaktyā yad īpsitaṃ varapradānaiḥ paritoṣayet ||
      - ab@verse[n=8]: atʰa haiṣamitikam iti ||
      - ab@verse[n=9]: śvaḥśvo 'sya rāṣṭraṃ jyāyo bʰavati eko 'syāṃ pr̥tʰivyāṃ rājā
          bʰavati na purā jarasaḥ pramīyate ya evaṃ veda yaś caivaṃvidvān indramaheṇa
          carati iti brāhmaṇam ||
  - pariśiṣṭa[n=19b]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: brahmayāgaḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ bʰārgavaṃ praṇipatyātʰa bʰagavāñ śaunako 'vadat | brahmayāgavidʰiṃ
          kr̥tsnaṃ vistareṇa vadasva me ||
      - ab@verse[n=2]: paripr̥ṣṭaḥ sa tena atʰa atʰarvā yajatāṃ varaḥ | vidʰiṃ kr̥tsnaṃ
          pratiṣṭʰāya ākʰyātum upacakrame ||
      - ab@verse[n=3]: sarveṣām eva yāgānāṃ paramo 'yam udāhr̥taḥ | brahmayāgaṃ prayatnena
          śr̥ṇu etaṃ tad yatʰākramam ||
      - ab@verse[n=4]: hr̥dye manohare śubʰre sarvābādʰāvivarjite | śleṣmāntakākṣagr̥dʰrādiparityakte
          same śubʰe ||
      - ab@verse[n=5]: maṇḍapaṃ kārayet tatra yatʰoktavidʰinā guruḥ | patākātoraṇir
          yuktaṃ dvāraiś ca api pr̥tʰagvidʰaiḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: abʰyukṣya śāntitoyena pañcagavyena vā sakr̥t | gomayena pralipya
          ādau pūjayed varṇakiḥ pr̥tʰak ||
      - ab@verse[n=2]: puṣpaiś ca vividʰaiḥ śubʰraiḥ pʰalaiś ca api arcayed budʰaḥ
          | tato baliṃ hared rātrau caturdikṣu vidʰānavit ||
      - ab@verse[n=3]: pradīpān gʰr̥tapūrṇāṃś ca pradadyād vividʰān tatʰā | ttato
          maṇḍapamadʰye tu vartayed divyamaṇḍalam || [caturaśraṃ caturdvāraṃ vr̥ttākāram
          atʰa api vā] ||
      - ab@verse[n=4]: sitacūrṇena tanmadʰye likʰet padmaṃ suśobʰanam | bahiś ca varṇaiḥ
          śubʰrair nānā śobʰāṃ prakalpayet ||
      - ab@verse[n=5]: madʰye padmaṃ tu saṃstʰāpya brahmāṇaṃ parameśvaram | brahmajajñānasūktena
          yatʰoktam upakalpayet ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tatʰa imā āpa ityā dyair yatʰāvad adʰivāsayet | rocanācandanādyaiś
          ca puṣpair dʰūpaiś ca pūjayet ||
      - ab@verse[n=2]: gʰr̥tapradīpamālyaiś ca vastrair bʰakṣaiś ca śobʰanaiḥ | sitacandanakarpūraṃ
          dadyād vā api hi guggulam ||
      - ab@verse[n=3]: pradakṣiṇaṃ tataḥ kr̥tvā namet sarvāṅgakair naraḥ | dakṣiṇe
          paścime vā api bʰāge vediḥ praśasyate ||
      - ab@verse[n=4]: kr̥tvājyabʰāgaparyantaṃ tataḥ śāntyudakaṃ punaḥ | brahmajajñānasūktena
          kuryāc caivātra pūjanam | tatʰaiva raudramantraiś ca abʰiṣekāya kalpayet
          ||
      - ab@verse[n=5]: hutvābʰyātānamantrāṃś ca tato rudragaṇena ca | nīlarudraiś
          caruṃ vidvān vidʰinā śrapayed budʰaḥ ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: homayet kutsasūktena uccʰuṣmaiś ca yatʰāvidʰi | japen mantrān
          tatʰāyuṣyān maṅgalyāṃś cāpi yatnataḥ ||
      - ab@verse[n=2]: hutvā ca cātanaṃ tatra mātr̥nāmagaṇena ca | snāpayet pañcagavyena
          tatʰā śāntyudakena ca ||
      - ab@verse[n=3]: pʰalasnānaṃ ca kurvīta yukto maṅgalavādibʰiḥ | bandibʰir vedavidbʰiś
          ca strīsaṇgītair manoramaiḥ ||
      - ab@verse[n=4]: cārucāmarahastābʰiś citradaṇḍaiḥ sadarpaṇaiḥ | snāpayed brahmasūktena
          raudreṇāpi tatʰārcayet ||
      - ab@verse[n=5]: tataḥ pradakṣiṇaṃ kr̥tvā jānubʰyāṃ dʰaraṇīṃ gataḥ | āśāsyeṣṭapʰalaṃ
          tatra yukto maṅgalapāṭʰakaiḥ ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tūryagʰoṣeṇa saṃyuktaḥ kr̥tasvastyayanas tatʰā | kuryād dundubʰinādaṃ
          tu śaṅkʰabʰeriprapūritam ||
      - ab@verse[n=2]: kuryād uttaratantraṃ ca sadasyān vācayet tataḥ | bʰojayec cʰaktitas
          tatra brāhmaṇān vedapāragān ||
      - ab@verse[n=3]: dīnānātʰāndʰakr̥paṇān bʰakṣabʰojyair anekadʰā | annapānavihīnāṃś
          ca viśeṣeṇa prapūjayet ||
      - ab@verse[n=4]: dattvā ca dakṣiṇāṃ śaktyā dadyād gaṇabaliṃ niśi | gr̥hadevās
          tu saṃpūjyāḥ kāryaś cāpy utsavo gr̥he ||
      - ab@verse[n=5]: yogino bʰojayet paścād gr̥hesu gr̥hamedʰinaḥ | acʰedyās taravaḥ
          kāryāḥ prāṇihiṃsāṃ ca varjayet ||
      - ab@verse[n=6]: bandʰanastʰāś ca moktavyā baddʰāḥ krodʰāc ca śatravaḥ | abʰayaṃ
          gʰoṣayed deśe guruṃ ca paripūjayet ||
      - ab@verse[n=7]: abʰayaṃ sarvato dattvā iṣṭe ca parameśvare | dīrgʰam āyur avāpnoti
          kr̥tsnāṃ bʰuṅkte vasuṃdʰarām ||
      - ab@verse[n=8]: brahmayāgavidʰiḥ kr̥tsno bʰaktānāṃ tu mayoditaḥ | atʰarvaṇā
          surendrāya praṇatāya śubʰeccʰayā ||
      - ab@verse[n=9]: kr̥tābʰiṣekaḥ kr̥tayāga eṣa kr̥tāhhnikaḥ kr̥tarakṣaḥ sureśaḥ
          | atʰarvaṇo 'nugraham āśu labdʰvā triviṣṭapaṃ virarājāsapatnam || iti ||
  - pariśiṣṭa[n=20]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: skandayāgaḥ or dʰūrtakalpaḥ
    - section[n=1]:
      - ab@verse[n=1]: atʰāto dʰūrtakalpaṃ vyākʰyāsyāmaḥ ||
      - ab@verse[n=2]: caturṣucaturṣu māseṣu pʰālguṇāṣāḍʰakārttikapūrvapakṣeṣu nityaṃ
          kurvīta ||
      - ab@verse[n=3]: śvo bʰūte ṣaṣṭʰyām upavāsaṃ kr̥tvā prāgudīcīṃ diśaṃ niṣkramya
          śucau deśe manohare noṣare maṇḍalaṃ trayodaśaratniṃ kr̥tvā madʰye maṇḍapasya
          sarvavānaspatyāṃ mālāṃ kr̥tvā gʰaṇṭāpatākāsrajaḥ pratisaraṃ ca mālāpr̥ṣṭʰe
          kr̥tvā madʰye darpaṇāṃś copakalpayitvā tatra yaṃ vahanti hayāḥ śvetā ity
          āvāhayet ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: yaṃ vahanti hayāḥ śvetā
          nityayuktā manojavāḥ | tam ahaṃ śvetasaṃnāhaṃ dʰūrtam āvāhayāmy aham ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yaṃ vahanti gajāḥ siṃhā
          vyāgʰrāś cāpi viṣāṇinaḥ | tam ahaṃ siṃhasaṃnāhaṃ dʰūrtam āvāhayāmy aham
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: yaṃ vahanti mayūrāś ca
          citrapakṣā vihaṃgamāḥ | tam ahaṃ citrasaṃnāhaṃ dʰūrtam āvāhayāmy aham ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: yaṃ vahanti sarvavārṇāḥ
          sadāyuktā manojavāḥ | tam ahaṃ sarvasaṃnāhaṃ dʰūrtam āvāhayāmy aham ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: yasyāmogʰā sadā śaktir
          nityaṃ gʰaṇtāpatākinī | tam ahaṃ śaktisaṃnāhaṃ dʰūrtam āvāhayāmy aham ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: yaś ca mātr̥gaṇair nityaṃ
          sadā parivr̥to yuvā | tam ahaṃ mātr̥bʰiḥ sārdʰaṃ dʰūrtam āvāhayāmy aham
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: yaś ca kanyāsahasreṇa
          sadā parivr̥to mahān | tam ahaṃ siṃhasaṃnāhaṃ dʰūrtam āvāhayāmy aham ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: āyātu devaḥ sagaṇaḥ sasainyaḥ
          savāhanaḥ sānucaraḥ pratītaḥ | ṣaḍānano 'ṣṭādaśalocanaś ca suvarṇavarṇo
          lagʰupūrṇabʰāsaḥ ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: āyātu devo mama kārttikeyo
          brahmaṇyapitraiḥ saha mātr̥bʰiś ca | bʰrātrā viśākʰena ca viśvarūpa imaṃ
          baliṃ sānucara juṣasva ||
      - ab@verse[n=10]: saṃviśasveti saṃveśayet ||
    - section[n=3]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃviśasva varagʰaṇṭāpsaraḥstave
          yatra subʰujo hi nirmitāḥ | saṃviṣṭo me dʰehi dīrgʰam āyuḥ prajāṃ paśūṃś
          caiva vināyakasena ||
      - ab@verse[n=2]: imā āpa iti gandʰodakaṃ pādyaṃ dadyāt || pratigr̥hṇātu bʰagavān
          devo dʰūrta iti || ṣat caiva hiraṇyavarṇā itīme divyo gandʰarva iti gandʰān
          yas te gandʰa iti cemāḥ sumanasa iti sumanasaḥ || priyaṃ dʰātur iti... ||
      - ab@verse[n=3]: vanaspatir aso medʰya iti dʰūpam || yakṣyeṇa te divā agniḥ
          śukraś ceti dīpam || yo viśvataḥ supratīka iti parṇāni ||
      - ab@verse[n=4]: prakṣālya haviṣy upasādayed dadʰyodanaṃ kṣīrodanaṃ guḍodanaṃ
          mudgapayasamiśradʰānyamodakāni sarvagandʰān sarvarsān udakapūrṇaṃ mūlapurṇaṃ
          puṣpapūrṇaṃ pʰalapūrṇaṃ rasapūrṇaṃ copakalpayitvā
      - ab@verse[n=5]: indraḥ sītam ity ullikʰya agne prety agniṃ praṇīya prajvalya
          prāñcam idʰmam upasamādʰāya bʰaga etam idʰmam iti tisr̥bʰir etam idʰmaṃ
          sugārhaspatya ity upasamādʰāya samiddʰo agnir iti samiddʰam anumantrayate
          ||
    - section[n=4]:
      - ab@verse[n=1]: bʰadram iccʰanto hiraṇyagarbʰo mamāgne varcas tvayā manyo yas
          te manyo yad devā devaheḍanam iti ṣat kāmasūktādayo daśa mahīpataye svāhā
          ||
      - ab@verse[n=2]: dʰūrtāya skandāya viśākʰāya pinākasenāya bʰrātr̥strīkāmāya
          svaccʰandāya varagʰaṇtāya nirmilāya lohitagātrāya śalakaṭaṅkaṭāya svāheti
          hutvā agnaye prajāpataye ye devā divy ekādaśa stʰeti anumataye agnaye sviṣṭakr̥ta
          iti ca ||
    - section[n=5]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: śivāgnikr̥ttikānāṃ tu
          stoṣyāmi varadaṃ śubʰam | sa me stuto viśvarūpaj sarvān artʰān prayaccʰatu
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: dʰanadʰānyakulān bʰogān
          sa me vacanavedanam | dāsīdāsaṃ tatʰā stʰānaṃ maṇiratnaṃ surāñjanam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: ye bʰaktyā bʰajante dʰūrtaṃ
          brahmaṇyaṃ ca yaśasvinam | sarve te dʰanavantaḥ syuḥ prajāvanto yaśasvinaḥ
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: yatʰendras tu varān labdʰvā
          prītas tu bʰagavān purā | dehi me vipulān bʰogān bʰaktānāṃ ca viśeṣata iti
          ||
      - ab@verse[n=5]: kāmasūktenopahāram upaharet ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: upahāram imaṃ deva mayā
          bʰaktyā niveditam | pratigr̥hya yatʰānyāyam akruddʰaḥ sumanā bʰava ||
    - section[n=6]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: sadyojātaṃ prapadyāmi
          sadyojātāya vai namaḥ | bʰavebʰave nādibʰave bʰajasva māṃ bʰavodbʰaveti
          bʰavāya namaḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: devaṃ prapadye varadaṃ
          prapadye skandaṃ prapadye ca kumāram ugram | ṣaṇṇāṃ sutaṃ kr̥ttikānāṃ ṣaḍāsyam
          agneḥ putraṃ sādʰanaṃ gopatʰoktaiḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: raktāni yasya puṣpāṇi
          raktaṃ yasya vilepanam | kukkuṭā yasya raktākṣāḥ sa me skandaḥ prasīdatu
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: āgneyaṃ kr̥ttikāputram
          aindraṃ ke cid adʰīyate | ke cit pāśupataṃ raudraṃ yo 'si so 'si namo 'stu
          ta iti ||
      - ab@verse[n=5]: svāmine namaḥ śaṅkarāyāgniputrāya kr̥ttikāputrāya namaḥ ||
      - ab@verse[n=6]: bʰagavān kva cid apratirūpaḥ svāhā bʰagavān kva cid apratirūpaḥ
          ||
      - ab@verse[n=7]: maṇiratnavarapratirūpaḥ || kāñcanaratnavarapratirūpa iti ||
      - ab@verse[n=8]: ete [te] deva gandʰā etāni puṣpāṇy eṣa dʰūpa etāṃ mālāṃ triḥ
          pradakṣiṇāṃ kr̥tvā ādityakartitaṃ sūtram iti pratisaram ābadʰnīyāt ||
    - section[n=7]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: ādityakartitaṃ sūtram
          indreṇa trivr̥tīkr̥tam | aśvibʰyāṃ gratʰito grantʰir brahmaṇā pratisaraḥ
          kr̥taḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: dʰanyaṃ yaśasyam āyuṣyam
          aśubʰasya ca gʰātanam | badʰnāmi pratisaram imaṃ sarvaśatrunibarhanam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: rakṣobʰyaś ca piśācebʰyo
          gandʰarvebʰyas tatʰaiva ca | manuṣyebʰyo bʰayaṃ nāsti yac ca syād duṣkr̥taṃ
          kr̥tam ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: svakr̥tāt parakr̥tāc ca
          duṣkr̥tāt pratimucyate | sarvasmāt pātakān mukto bʰaved vīras tatʰaiva ca
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: abʰicārāc ca kr̥tyātaḥ
          strīkr̥tād aśubʰaṃ ca yat | tāvat tasya bʰataṃ nāsti yāvat sūtraṃ sa dʰārayet
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: yāvad āpaś ca gāvaś ca
          yāvat stʰāsyanti parvatāḥ | tāvat tasya bʰayaṃ nāsti yaḥ sūtraṃ dʰārayiṣyatīti
          ||
      - ab@verse[n=7]: anvāyaṃ bʰuktvā devaṃ visarjayet ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: pramodo nāma gandʰarvaḥ
          pradoṣo paridʰāvati | muñca śailamayāt pāpan muñcamuñca pramuñca ca ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: '[yāvat] imā āpaḥ pavanena
          pūtā hiraṇyavarṇā anavadyarūpāḥ | tāvad imaṃ dʰūrtaṃ pravāhayāmi pravāhito
          me dehi varān yatʰoktān ||'
      - ab@verse[n=10]: uditeṣu nakṣatreṣu gr̥hān praviṣṭo gr̥hiṇīṃ paśyet dʰanavati
          dʰanaṃ me dehīti ||
      - ab@verse[n=11]: yad bʰoktuṃ kāmajātaṃ jagatyāṃ manasā saṃhīhate tattad dvijanmā
          pinākasenayajamānāt kāmam upabʰukto bʰuktvāmr̥tatvaṃ tadvad evābʰyupaiti
          ||
  - pariśiṣṭa[n=21]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: saṃbʰāralakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ saṃbʰārān kīrtayiṣyāmo
          yatʰālakṣaṇasaṃyutān | yaiḥ karma kriyamāṇaṃ hi pʰalavat syād dvijanmanām
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: acʰinnāgrān kuśān ārdrān
          indranīlasamaprabʰān | śuṣkān api śvetavarṇān āhuḥ śāntikarān budʰāḥ ||
      - ab@verse[n=3]: surabʰīṇi ca puṣpāṇi susvādūni pʰalāni ca manoharāṇi vāsāṃsi
          saṃbʰāreṣūpakalpayet ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: surabʰīṇy eva bījāni anyavastūni
          yāni ca | argʰacandanadʰūpādi hemaratnādi cottamam ||
      - ab@verse[n=7cd]: gāvaś ca dakṣiṇārtʰaṃ hi payasvinyaḥ sulakṣaṇāḥ |
      - ab@verse[n=8ab]: ṣoḍaśāṣṭau ca catvāraś caturṇāṃ vedavittamāḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: r̥tvijas tu samākʰyātā
          vayaḥśīlaguṇānvitāḥ | dvātriṃśat ṣoḍaśāṣṭau vā śāntikārye tatʰādbʰute ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: sahiraṇyāḥ savastrāś ca
          sālaṃkārāḥ savatsakāḥ | te sadasyā iti proktā vācane yajñakarmaṇi ||
      - ab@verse[n=7ab]: sarve te 'pi hy atʰarvāṇa r̥tvijaḥ ṣoḍaśa smr̥tāḥ |
      - ab@verse[n=8cd]: śuddʰātmāno japair homair vaidikair vītamatsarāḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tāmrarājatahaimānāṃ mr̥nmayānām atʰāpi vā | acʰidrāṇāṃ savarṇānāṃ
          kalaśānāṃ ca saṃgrahaḥ ||
      - ab@verse[n=2]: carūṇām atʰa pātrāṇām indʰanānāṃ viśeṣataḥ | yavavrīhitila''ādīnām
          ājyasyāharaṇaṃ tatʰā ||
      - ab@verse[n=3]: acʰidrāspʰātitāvakrā dīrgʰaparvāḥ sumadʰyamāḥ | śamīdūrvātarūṇāṃ
          tu jñeyāḥ śāntau śabʰāvāḥ ||
      - ab@verse[n=4]: puṣkaratantugovālatruṭisarṣapayavasya tu | ṣaḍguṇitaḥṣaḍguṇito
          [bʰavati] narasyāṅgulamāne ||
      - ab@verse[n=5]: gopuccʰasadr̥śo daṇḍaḥ samaḥ ślakṣṇo manoharaḥ | sruvaś ca
          śāntuke jñeyaḥ srug uktā yajñalakṣaṇā ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: sauvarṇaḥ śāntike proktaḥ pālaśo vātʰa kʰādiraḥ | abʰicāre
          viśeṣeṇa kuryāt sruvam ayomayam ||
      - ab@verse[n=2]: kāṃsyaṃ yccāṭane kuryād āśvattʰaṃ vaśyakarmaṇi | viśeṣeṇa tu
          vidveṣe sruvo nimbamayaḥ smr̥taḥ ||
      - ab@verse[n=3]: pauṣṭike rājataṃ vidyāt tāmraṃ ca vijayāvaham | amr̥tādau tu
          vijñeyaś cāndanaḥ siddʰidaḥ sruvaḥ ||
      - ab@verse[n=4]: sruvāṇāṃ viṣayaṃ jñātvā kīlakānāṃ vidʰiṃ tatʰā | gr̥hasyāśmavidʰiṃ
          dikṣu karmasiddʰim avāpnuyāt ||
      - ab@verse[n=5]: śleṣmātakārkakaṇṭakikaṭutiktādivarjite | ariṣṭagr̥dʰrakauśikavihaṃgaiś
          ca vivarjite ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: gulmavallīlatāyukte hr̥dyaiś ca madʰurair drumaiḥ | taruṇaiḥ
          pʰalavadbʰiś ca śmaśānāstʰivivarjite ||
      - ab@verse[n=2]: mayūracakravākādihaṃsakāraṇḍavādibʰiḥ | susvarair nādite deśe
          hr̥dyāṅkurasamanvite ||
      - ab@verse[n=3]: nadītaṭe samudrasya saṃgame vā viśeṣataḥ | anindye digvibʰāge
          ca uttare vāparājite ||
      - ab@verse[n=4]: bʰūmiṃ saṃśodʰayet kartā prāgudakppravaṇe śubʰe | prācīṃ saṃśodʰya
          yatnena maṇḍapaṃ tatra kārayet ||
      - ab@verse[n=5]: navakoṣṭʰaṃ samaṃ vāpi hastaiḥ ṣoṣaśabʰir mitam | caturaśraṃ
          caturdvāram ekordʰvadvāram eva vā ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tata īśānakoṇe tu snānavediṃ samācaret | daśadvādaśahastaṃ
          vā yatʰāvitānam eva vā ||
      - ab@verse[n=2]: caturguṇoccʰrayāś caiva mūlastambʰās tu ye tataḥ | upastambʰās
          tu ye pārśve tadardʰena prakīrtitāḥ ||
      - ab@verse[n=3]: kumbʰāḥ stambʰais tatʰā deyāḥ kāmair dvāraṃ diśāṃ smr̥tam |
          yajamānoccʰrayaṃ vāpi tadardʰena prakīrtitāḥ ||
      - ab@verse[n=4]: kuṇḍākr̥ti gr̥haṃ kuryād dviguṇaṃ pariveṣtitam | sarvadikṣu
          plavaṃ caiva kuṇḍasyordʰvaṃ na cʰādayet ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: parito dvādaśastʰūnaṃ catu[ḥ]stambʰaṃ tu madʰyataḥ | arcitaṃ
          pūjitaṃ nityaṃ śāntau śāntigr̥haṃ smr̥tam ||
      - ab@verse[n=2]: netrādyullocaśobʰiṣṭʰaṃ nānāvarṇadʰvajākulam | raktā pītā ca
          dʰūmrā ca kr̥ṣṇā nīlātʰa pāṇḍurā ||
      - ab@verse[n=3]: vicitrā hīndranīlābʰā patākāḥ ṣoḍaśa smr̥tāḥ | [aindrāyudʰadʰūmrakr̥ṣṇanīlapāṇḍuravarṇakāḥ]
          ||
      - ab@verse[n=4]: '[pītaraktasitāḥ śyāmā patākāḥ ṣoḍaśa smr̥tāḥ] | kalaśān ṣoḍaśān
          tatra upariṣṭān mahādʰvajaḥ ||'
      - ab@verse[n=5]: vastreṇācʰāditān kuryāt sahiraṇyān pr̥tʰakpr̥tʰak | maṇimuktāpʰalaiḥ
          puṣpair hr̥dyaiś ca madʰuraiḥ pʰalaiḥ ||
      - ab@verse[n=6]: samantād dikṣu vinyastaiḥ pradīpaiś cāpy alaṃkr̥tam | dʰūpair
          balyupahāraiś ca jayagʰoṣaiś ca bandinām ||
      - ab@verse[n=7]: śaṅkʰatūryaninādais tu vīṇādundubʰisasmitaiḥ | pūjyamāno hi
          nr̥patiḥ praviśet sapurohitaḥ ||
      - ab@verse[n=8]: tataḥ śāntyudakaṃ kr̥tvā cātanenānuyojitam | saṃprokṣya vidʰivan
          mantrair ānayed araṇī tataḥ ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: matʰite 'gnau vidʰānena śāntyudakena samantrakam | homaṃ kr̥tvā
          yatʰoktaṃ tu nimittāny upalakṣayet ||
      - ab@verse[n=2]: megʰadundubʰinirgʰoṣaiḥ prajvalan sarvatas tatʰā | avyavacʰinnadīrgʰārciḥ
          susnigdʰaḥ siddʰikārakaḥ ||
      - ab@verse[n=3]: kiṃśukāśokapadmābʰo nīlotpalanibʰas tatʰā | vahniḥ siddʰikaro
          jñeyaḥ saptarātrān na saṃśayaḥ ||
      - ab@verse[n=4]: hutamātre prajvalati vihasann iva dr̥śyate | taṃ vidyāt siddʰidaṃ
          vahniṃ padmavarṇanibʰaṃ tatʰā ||
      - ab@verse[n=5]: asnigdʰārciḥ sadʰūmo yaḥ kr̥ṣṇavarṇo 'pradakṣiṇaḥ | yatʰoktaviparītas
          tu na vahniḥ syāt prayaṃkaraḥ ||
      - ab@verse[n=6]: yasmin prasannatām eti hūyamāne hutāśane | tatra nityaṃ mahāsiddʰir
          asamāpte vinirdiśet || asamāpte vinirdiśet || iti saṃbʰāralakṣaṇaṃ samāptam
          ||
  - pariśiṣṭa[n=22]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: araṇilakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om atʰātaḥ saṃpravakṣyāmi araṇyoś caiva lakṣaṇam | rūpam atʰā
          pramāṇaṃ ca guṇadoṣān tatʰaiva ca ||
      - ab@verse[n=2]: coditān śabdaśāstreṇa ācāryeṇa tu dʰīmatā | purā kalpe ca yad
          dr̥ṣṭam r̥ṣibʰiś caiva lakṣaṇam ||
      - ab@verse[n=3]: gr̥hyāgniṃ parisaṃgr̥hya dʰarmapatnyā sahaiva tu | vaitānikās
          tataḥ kuryād ādʰānādyā yatʰoditāḥ ||
      - ab@verse[n=4]: titʰau śubʰāyāṃ nakṣatre diśaṃ gatvā tv aninditām | aśvattʰāt
          tu śamīgarbʰād uktam āharaṇaṃ śruteḥ ||
      - ab@verse[n=5]: śamīvr̥kṣe tu yo 'śvattʰo nānyavr̥kṣeṇa saṃyutaḥ | madʰye mūlaṃ
          na bāhye tu sa garbʰaḥ parikīrtitaḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: abʰāve tu śamīgarbʰe aśvattʰād eva vāharet | prāpte caiva śamīgarbʰe
          samāropya visarjayet ||
      - ab@verse[n=2]: caturviṃśāṅgulā dīrgʰā vistareṇa ṣaḍaṅgulā | caturaṅguloccʰrayā
          ca araṇiś cottarāraṇiḥ ||
      - ab@verse[n=3]: ā skandʰād uraso vāpi iti staudāyanaiḥ smr̥tā | bāhumātrā devadarśair
          jājalair ūrumātrikā ||
      - ab@verse[n=4]: cāraṇavaidyair jaṅgʰe ca maudenāṣṭāṅgulāni ca | jaladāyanair
          vitastir vā ṣoḍaśeti tu bʰārgavaḥ ||
      - ab@verse[n=5]: śiraḥpramāṇe nābʰau tu caturviṃśatikaiva hi | śaunakādibʰir
          ācāryair etan mānaṃ prakīrtitam ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tasyās tu piṇḍaḥ ṣaḍbʰāge caturbʰāge tu vistare | caturaśrā
          ca ślakṣṇā ca cʰidragrantʰivivarjitā ||
      - ab@verse[n=2]: klinnā bʰinnāgnisaṃspr̥ṣṭā spʰuṭitā vidyutā hatā | anyaiś ca
          doṣaiḥ saṃyuktā varjanīyā prayatnataḥ ||
      - ab@verse[n=3]: śirograntʰir harec cakṣuś cʰidrā patnīvināśinī | klinnā vināśayet
          putrān spʰuṭitā śokam āvahet ||
      - ab@verse[n=4]: ūrdʰvaśuṣke na kartavyā kr̥ṣṇe rūkṣe tatʰaiva ca | ubʰe apy
          ekavr̥kṣe ca araṇiś cottarāraṇiḥ ||
      - ab@verse[n=5]: tatpramāṇā tadardʰā vā bʰūyasī vā yatʰeccʰayā | anenaiva tu
          mantʰavyo na kuryād yonisaṃkaram ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yonisaṃkarasaṃkīrṇe mahān doṣaḥ prapadyate | sa yajñas tāmaso
          nāma pʰalaṃ tatra na vidyate ||
      - ab@verse[n=2]: piṇḍe tv ayanaviṣuvau pr̥tʰutve r̥tavaḥ stʰitāḥ | ardʰamāsāś
          ca dīrgʰatve kālaś cātra pratiṣṭʰitaḥ ||
      - ab@verse[n=3]: yajamāno 'raṇir iti vadanty eke vipaścitaḥ | tatpradʰānāḥ kriyāḥ
          sarvā yajñaś cāpi tatʰaiva hi ||
      - ab@verse[n=4]: pratʰame mūlaṣaḍbʰāge pādau jaṅgʰeti kīrtyate | dvitīye jānunī
          ūrū tr̥tīye śroṇir ucyate ||
      - ab@verse[n=5]: caturtʰe jaṭʰaraṃ sāṅgaṃ grīvā caiva tu pañcame | ṣaṣtʰe śiraḥ
          samākʰyātam aṅgāny etāni nirdiśet ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: matʰite pādajaṅgʰe ca piśācaḥ saṃprajāyate | jānunoś ca tatʰā
          corvo rākṣastvaṃ prayāti hi ||
      - ab@verse[n=2]: śroṇyāṃ ca sarvakāmā[ḥ] syur jaṭʰare kṣut tatʰā smr̥tā | urasy
          amitrā grīvāyāṃ mr̥tyuḥ śirasi vedanā ||
      - ab@verse[n=3]: śroṇyām evāta aiccʰanti nirdoṣā kīrtitā yataḥ | tatʰā vittapaśūn
          putrān svargam āyuḥ priyaṃ sukʰam ||
      - ab@verse[n=4]: pratʰamaṃ mantʰanaṃ śroṇyām ādʰāne ca viśeṣataḥ | itarāṇi yatʰeṣtaṃ
          hi grīvāṃ sarvatra varjayet ||
      - ab@verse[n=5]: trīṇy aṅgulāni tyaktvādau tatʰā catvāri cāntataḥ | madʰye devāḥ
          stʰitās tasmād vahniṃ tatraiva mantʰayet ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: anulomā bʰaved yoniḥ pārśvabʰedo na vidyate | ānulomyena matʰitaḥ
          sarvān kāmān prayaccʰati ||
      - ab@verse[n=2]: mūlād aṅgulam utsr̥jya trīṇitrīṇi ca pārśvayoḥ | devayonis
          tu vijñeyā tatra matʰyo hutāśanaḥ ||
      - ab@verse[n=3]: '[mūlāt tyaktvāṅgulāny aṣṭau agrāt tu dvādaśaiva hi | antare
          devayoniḥ syāt tatra matʰyo hutāśanaḥ] ||'
      - ab@verse[n=4]: vedā yajñāya saṃbʰūtā yajñā agnau pratiṣṭʰitāḥ | araṇyor jāyate
          cāgnis tayos tasmāt pradʰānatā ||
      - ab@verse[n=5]: araṇyardʰena caiva syuḥ kʰādirau cātrapīḍakau | netraṃ tu ṣaḍguṇaṃ
          cātrād uttaro 'ṣṭāṅgulaḥ smr̥taḥ ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: aṣṭāṅgulaḥ pramantʰaḥ syāc cātraṃ syād dvādaśāṅgulam | ovīlī
          dvādaśāṅgulā eṣa yajñavidʰiḥ smr̥taḥ ||
      - ab@verse[n=2]: vyāmamantraṃ vadanty eke anye hastatrayaṃ viduḥ | trivr̥taṃ
          muṣṭisaṃyuktaṃ yajñavr̥kṣajavalkalaiḥ ||
      - ab@verse[n=3]: cātre ca bʰāskarāḥ proktā uttare vasavas tatʰā | netre devagaṇāḥ
          sarve viṣṇuś caiva tu pīḍake ||
      - ab@verse[n=4]: araṇir yā dvitīyā tu uttarā sā prakīrtitā | tatraikadeśaṃ saṃgr̥hya
          uttaraḥ sa ca kīrtitaḥ ||
      - ab@verse[n=5]: prāṅmukʰodaṅmukʰo vāpi bʰrāmakaḥ paścimāmukʰaḥ | pāṇibʰyāṃ
          pīḍanaṃ śubʰram uttarāgraṃ pragr̥hya tu ||
    - section[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: mūle mūlaṃ tu saṃyojya cātrasyaivottarasya ca | araṇyupari
          saṃstʰāpya pīḍakena tu pīḍayed ||
      - ab@verse[n=2]: netreṇa bʰrāmayec cātraṃ yāvad vahniḥ prajāyate | sarvair hi
          devaiḥ saṃpannas tena sarvasukʰaḥ smr̥taḥ ||
      - ab@verse[n=3]: brahmādyair daivataiś caiva vidvadbʰiś ca tapodʰanaiḥ | eṣa
          yantraprayogas tu dr̥ṣṭo yajñārtʰahetubʰiḥ ||
      - ab@verse[n=4]: yajamānena mantʰavyaḥ svaśākʰāśrotriyeṇa vā | tanmantrena dvijāgryair
          vā smr̥tam etad dʰi mantʰanam ||
    - section[n=9]:
      - ab@verse[n=1]: (atʰa) yady araṇī jīrṇe syātāṃ jantubʰir mantʰanena vā || samānīte
          nave araṇī āhr̥tya śve bʰūte darśenāṣṭvā tasmin pūrve śakalīkr̥tya gārhapatye
          prakṣipyopary agnau dʰārayan japati ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: ud budʰyasvāgne pra viśasya
          yonyāṃ devayajyāyai voḍʰave jātavedaḥ | araṇyor araṇī saṃ carasva jīrṇāṃ
          tvacam ajīrṇayā nir ṇudasvety
      - ab@verse[n=3]: ājyaṃ saṃskr̥tyāhavanīye manasvatīṃ juhoti || [putrārtʰī śrāvayet]
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: mano jyotir juṣatām ājyasya
          vicʰinnaṃ yajñaṃ sam imaṃ dadʰātu | yā iṣṭā uṣaso yā aniṣṭās tāḥ saṃ cinomi
          haviṣā gʰr̥tena svāheti agnaye 'gnimate 'ṣṭākapālaṃ puroḍāśaṃ nirvapati
          || śarāv odanaṃ sadakṣiṇaṃ dadāti || sā prakr̥teṣtiḥ saṃgr̥hyate ||
    - section[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: prasaṅgenaiva katʰitam agnimantʰanam atra vai | araṇyoś cāṅgasaṃbʰūtaṃ
          netraṃ cātraṃ ca pīḍakaḥ ||
      - ab@verse[n=2]: ya idaṃ dʰārayiṣyati araṇyor iha lakṣaṇam | na tasya durlabʰaṃ
          kiṃ cid loke paratra ca ||
      - ab@verse[n=3]: putrārtʰī śrāvayen nityam acirāl labʰate sutam | śrutaśīlaṃ
          vr̥ttavantaṃ dīrgʰāyur vipulāṃ prajām ||
      - ab@verse[n=4]: etad evaṃ samākʰyātaṃ pippalādena dʰīmatā | dvijānāṃ bālavr̥ddʰānāṃ
          puraścaraṇam uttamam ||
      - ab@verse[n=5]: adʰītyaitac ca dehānte paraṃ brahmādʰigaccʰati | na tasya mr̥tyur
          na jarā nidrā vyādʰir na caiva hi | kṣutpipāsābʰayaṃ nāsti brahmabʰūtaḥ
          sa tiṣṭʰati ||
  - pariśiṣṭa[n=23]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: yajñapātralakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om atʰāto yajñapātrāṇāṃ lakṣaṇaṃ yonir eva ca | rūpaṃ tatʰā
          pramāṇaṃ ca kramenaiva prakatʰyate ||
      - ab@verse[n=2]: camasagrahapātrāṇi homapātrāṇi yāni ca | yajñavr̥kṣās tatʰā
          śākʰā brahmavede pradarśitāḥ ||
      - ab@verse[n=3]: pitr̥piṇḍeṣu darvyādyam agniṣvāttaṃ ca yājñikam | sāyaṃhomeṣu
          nityāni tatʰā naimittikāni ca ||
      - ab@verse[n=4]: bilvākr̥tiś caruḥ proktas tāmro vā mr̥nmayo 'pi vā | grīvāyāṃ
          mukʰavistīrṇaś carustʰālīti kīrttitaḥ ||
      - ab@verse[n=5]: kuśasyāmrasya vā parṇair veṇor vā balbajasya vā | catuṣkoṇārdʰavītaṃ
          ca loke śūrpaṃ tad ucyate ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: asiḥ kʰaḍgaṃ ca nistriṃśaḥ paryāyāḥ parikīrttitāḥ | tadākr̥ṭy
          eva yad rūpaṃ yajñe spʰyaṃ ca vadanti tam ||
      - ab@verse[n=2]: idʰmoccʰrayam ardʰakʰātaṃ kʰātenaiva tu vistaraḥ | madʰye hīnaṃ
          tatʰordʰvāgraṃ vāraṇaṃ tad ulūkʰalam ||
      - ab@verse[n=3]: stʰūlatvān muṣṭimātraṃ ca skandʰamātraṃ pramāṇataḥ | vāraṇaṃ
          musalaṃ caiva adʰastāl lohaveṣṭitam ||
      - ab@verse[n=4]: sruvas tu mūladaṇḍaś ca bilaṃ cāṅguṣṭʰaparvaṇaḥ | samavete
          pr̥tʰagbʰūte bilārdʰe daṇḍavr̥ttatā ||
      - ab@verse[n=5]: vaikaṅkatī dʰruvā proktā sarvayajñeṣu yā smr̥tā | tatʰāgnihotrahavaṇī
          sruvaś cāpi tatʰā smr̥taḥ ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: mūladaṇḍā tvagbilā ca puṣkaraṃ caturaṅgulam | puṣkarād dviguṇaṃ
          cāgraṃ gajoṣṭʰaṃ paripaṭʰyate ||
      - ab@verse[n=2]: '[netrādikaraṇair hīnaṃ nāsikābʰyāṃ dvijais tatʰā | dvyaṅgulaḥ
          kʰātā ca bilād aṅgulaṃ caiva piṇḍikā | vr̥ttā vā caturaśrā vā sādʰastāc
          cʰobʰanā smr̥tā] ||'
      - ab@verse[n=3]: ardʰāṅgulaṃ pr̥tʰutvena bilabāhyaṃ samantataḥ | bilaṃ vr̥ttaṃ
          sruco madʰye daṇḍastʰaulyaṃ bilārdʰataḥ ||
      - ab@verse[n=4]: caturviṃśatyaṅgulaṃ daṇḍaṃ vadanty eke manīṣiṇaḥ | saptatriṃśad
          aṅgulāni sā sruk caiva prakīrtitā ||
      - ab@verse[n=5]: bʰinnā viśīrṇā vakrā ca klinnā ca spʰuṭitā tatʰā | suṣirā grantʰibʰir
          yuktā cakṣurādivināśinī ||
    - section[n=4]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: dagdʰaśeṣe 'rdʰaśuṣke
          ca vidyutā caiva pātite | unmūlye patite bʰagne manasāpi na cintayet ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: śubʰanakṣatrātitʰiṣu śubʰāṃ
          gatvā diśaṃ budʰaḥ | sruvārtʰaṃ pātayed vr̥kṣaṃ prātaḥ prāgraṃ ca saumyavāk
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: mr̥go hariṇaruruś ca kr̥ṣṇapr̥ṣṭʰaśiras
          tatʰā | yat tasya carma tvak caiva tat kr̥ṣṇājinam ucyate ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: vāmamuṣṭigr̥hītās tu pracʰidyante
          sakr̥t kuśāḥ | paraśunāsinā vā tat sakr̥dācʰinnam ucyate ||
      - ab@verse[n=5]: aṅguṣṭʰaparvāgramukʰaṃ darvyākr̥ti tu mekṣaṇam. vaikaṅkate
          pālāśe vā prādeśas tu pramāṇataḥ ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: alābu vaiṇavaṃ vāpi dārvyaṃ vaiṇavam eva vā | akṣāv amaṇḍalau
          proktau yatʰā dr̥ṣṭaṃ pura rṣibʰiḥ ||
      - ab@verse[n=2]: cakrābʰyāṃ kāṣṭʰasaṃgʰātaiḥ śilpibʰiś caiva yat kr̥tam | loke
          prasiddʰaṃ śakaṭam agniṣṭʰaṃ yājñike vidʰau ||
      - ab@verse[n=3]: ājyaṃ gʰr̥taṃ vijānīyān navanītaṃ susaṃskr̥tam | sauvīrādy
          añjanaṃ caiva atʰa vā daivikaṃ tatʰā ||
      - ab@verse[n=4]: abʰyañjanaṃ ca tat praktaṃ tilatailaṃ ca yad viduḥ | āsanaṃ
          kaśipu proktaṃ kāyastʰaṃ copabarhaṇam ||
      - ab@verse[n=5]: yavodarair aṣṭabʰis tu aṅgulaṃ paripaṭʰyate | carutviṃśatyaṅgulaṃ
          tu yājñikair hasta ākr̥taḥ ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: hastamātraṃ sruvaḥ kʰaḍgaṃ sakr̥dācʰinnam eva ca | bāhumātrā
          juhūḥ proktā dʰruvā barhis tatʰaiva ca ||
      - ab@verse[n=2]: tāmraś caiva sruvaḥ proktaḥ kʰaḍgaṃ kʰādiram eva ca | pālāśī
          ca juhūḥ kāryā idʰmāś caiva viśeṣataḥ ||
      - ab@verse[n=3]: grahāḥ pātrāṇi camasā daṇḍayūpāsanāni ca | vr̥kṣeṣu yājñikeṣu
          syur yatʰālābʰeṣu nānyataḥ ||
      - ab@verse[n=4]: samidʰaḥ prādeśamātryo nityahome prakīrtitāḥ | samillakṣaṇadr̥ṣṭāni
          pramāṇāni yatʰākramam ||
      - ab@verse[n=5]: śamy aśvattʰa[ḥ] palāśaś ca kʰādiro 'tʰa vikaṅkataḥ | kāśmaryodumbaro
          bilvo yajñavr̥kṣāḥ prakīrtitāḥ ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: eṣām alābʰe vr̥kṣāṇām anye grāhyās tu yājñikaiḥ | yajñāṅgakārye
          draṣṭavyāḥ samidartʰaṃ viśeṣataḥ ||
      - ab@verse[n=2]: yavavrīhimahāvrīhiprayaṅgūṇāṃ hi taṇḍulāḥ | śyāmākataṇḍulatilā
          āsādyāḥ śruticoditāḥ ||
      - ab@verse[n=3]: sāyaṃhomeṣu yad dravyaṃ prātarhomeṣu tad bʰavet | bʰinnadravyahutaṃ
          yat tu na hutaṃ tasya tad bʰavet ||
      - ab@verse[n=4]: udite 'nudite caiva samayādʰyuṣite tatʰā | kṣudʰākāle tatʰāpy
          keke pakṣahomaṃ tu kārayet ||
      - ab@verse[n=5]: yāyāvarāṇāṃ munibʰiḥ pakṣahomas tu taiḥ smr̥taḥ | yatʰā katʰaṃ
          cid vacanaṃ śrutyuktaṃ dvija ācāret ||
    - section[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: āturaḥ patʰikaś caiva rājopadravapīḍitaḥ | pakṣahomaṃ tadā
          kuryān nistīrya satataṃ caret ||
      - ab@verse[n=2]: caturdaśagr̥hītaṃ tu sakr̥d unnayate haviḥ | ekā samit sakr̥d
          dʰomaḥ so 'rdʰamāsāya kalpate ||
      - ab@verse[n=3]: caturdaśaguṇaṃ kr̥tvā srucā pātreṇa pūrvavat | evaṃ gārhapatye
          ca dakṣiṇāgnau ca juhvati ||
      - ab@verse[n=4]: pūrvā hutvāhutīḥ sāyaṃ vyuṣṭāyām apare 'hni | etenaiva vidʰānena
          juhvati prātarāhutīḥ ||
      - ab@verse[n=5]: r̥ṣibʰiś ca purā dr̥ṣṭam āpatkāleṣu sarvataḥ | araṇyoś ca samāropya
          śrutidr̥ṣṭena karmaṇā ||
    - section[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: homārtʰeṣv etad draṣṭavyam āhitāgnigr̥heṣv api | tatprayojanamātraṃ
          tu na doṣaḥ sūtakeṣu ca ||
      - ab@verse[n=2]: sadyaḥśaucādikaṃ proktaṃ sūtakaṃ ca dvijātibʰiḥ | svayaṃhomīti
          vacanān na doṣaḥ śruticodanāt ||
      - ab@verse[n=3]: vratināṃ sattriṇāṃ caiva mahārājāhitāgnayaḥ | eṣāṃ doṣo na
          vidyeta sāyamprātaḥ kriye stʰite ||
      - ab@verse[n=4]: pālāśyaḥ samidʰo 'doṣā nityaṃ home prakīrtitāḥ | atʰa vā kauśikoktānāṃ
          yajñiyānāṃ mahīruhām ||
      - ab@verse[n=5]: aṅgulatrayam āvartya uccʰraye 'py aṅgulatrayam | puroḍāśapramāṇaṃ
          tu sarvatra katʰitaṃ nr̥ṇām ||
    - section[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: ṣoḍaśāṅgulam āvartya tribʰāgaṃ cottaram r̥ju | dakṣiṇasyāṃ
          diśi stʰānaṃ dakṣiṇāgneḥ prakīrtitam ||
      - ab@verse[n=2]: aṣṭāviṃśaty aṅgulāni gārhapatyaṃ prakīrtitam | āhavanīyam [catur]viṃśatiś
          caturaśraṃ tu kārayet ||
      - ab@verse[n=3]: aṅgulāni tu ṣaṭtriṃśad dʰnvākr̥tyā tu kārayet | dakṣiṇāgnes
          tu vai kuṇḍaṃ vidvadbʰij parikatʰyate ||
      - ab@verse[n=4]: īśānyāṃ diśi sabʰyasya gārhapatyavidʰānataḥ | sabʰyaṃ neccʰanti
          śālāgnau māhakiḥ kauśikas tatʰā ||
      - ab@verse[n=5]: maudāyanās tatʰeccʰanti śaunakeyās tatʰaiva ca | mantād eva
          tatʰā proktaṃ dravyaṃ yatra na dr̥śyate ||
      - ab@verse[n=6]: ājyaṃ tatra vijānīiyād dʰomas tatra sruveṇa ca | abʰyukṣaṇaṃ
          haviḥkarma kartavyaṃ vajrapāṇinā ||
      - ab@verse[n=7]: kuśahastena kartavyā japahomapitr̥kriyāḥ | yajñe caiva aṅgabʰūtāś
          ca pātramantrahavirdvijāḥ | carutbʰiś ca kriyāḥ sarvāś cāturhotraṃ tad ucyate
          ||
    - section[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yājñikās tu vadanty anye caturbʰir yac ca hūyate | brahmaṇādʰvaryuhotr̥bʰyāṃ
          tribʰir agnicaturtʰakaiḥ ||
      - ab@verse[n=2]: durbʰikṣe cākule bʰaṅge r̥tvijāṃ cāpy asaṃbʰave | ekaś cāturhotraṃ
          kuryād āpastambe prapaṭʰyate ||
      - ab@verse[n=3]: r̥tvijāṃ ca7apy asāmnidʰye adʰvaryus tat paṭʰet svayam | astʰānapaṭʰite
          kuryur r̥tvig ityādi coditam ||
      - ab@verse[n=4]: kʰāte lūne tu yac coktaṃ saṃskāraśrutihetubʰiḥ | dravyāṇāṃ
          yajñakLptyartʰaṃ kuryāt pūrveṇa saṃgraham ||
      - ab@verse[n=5]: pātrāsādaṃ dvitīyaṃ ca prokṣaṇena vivarjitam | ubʰayoś caiva
          kurvīta pākayajñeṣṭikarmavat ||
    - section[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kr̥ṣṇājinaṃ tilā darbʰā mantrā ājyaṃ dvijottamāḥ | doṣo na
          vidyate hy eṣāṃ yatʰārtʰaṃ saṃniyojayet ||
      - ab@verse[n=2]: ājyaṃ dʰūmahavir jvālā paripākaḥ spʰuliṅgakaiḥ | dāvāgnikāṣṭʰasaṃsparśe
          agner doṣo na vidyate ||
      - ab@verse[n=3]: japādʰyāyatapodānaiḥ sopavāsaiḥ sahomakaiḥ | śrāddʰādipitr̥kāryais
          ca na doṣaḥ parivedane ||
      - ab@verse[n=4]: pitr̥bʰrātr̥sapatnaiś ca patitonmattaṣaṇḍʰakaiḥ | jātyandʰamūkabadʰirair
          na doṣaḥ parivedane ||
      - ab@verse[n=5]: atyantakāminā caiva patnīhīnena caiva hi | eṣām anujñām ādāya
          kuryād vaitānikī[ḥ] kriyāḥ ||
    - section[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: raudrarākṣasapaiśācān āsurāṃś cābʰicārikān | mantāṃś ca pitr̥karmaivaṃ
          kr̥tvālabʰyodakaṃ spr̥śet ||
      - ab@verse[n=2]: sruk sruvaś ca dʰruvā kʰaḍgaṃ musalolūkʰalaṃ caruḥ | udakenaiva
          soṣṇena saṃprakṣālya viśudʰyati ||
      - ab@verse[n=3]: pātraṃ grahāś ca camasā haviḥ śūrpaṃ kuśāsanam | somaspr̥ṣṭaṃ
          ca yad bʰāṇḍaṃ vāriśaucena śudʰyati ||
      - ab@verse[n=4]: vedoktaṃ sarvamantoktaṃ śaunakena mahātmanā | avaśyaṃ tad dvijaiḥ
          kāryaṃ śreyaskāmais tu nityaśaḥ ||
      - ab@verse[n=5]: pātrānāṃ tu prasāṅgena yad anyat parikīrtitam | sāyaṃ prātas
          tu homāṅgaṃ purā dr̥ṣṭaṃ maharṣibʰiḥ ||
    - section[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: guruṇā bʰāṣitenaiva yājñikānumatena ca | sadāpadiṣṭadravyāṇāṃ
          lakṣaṇaṃ parikīrtitam ||
      - ab@verse[n=2]: nityaṃ ye 'nusmariṣyanti yajñapātreṣu lakṣaṇam | rājasūyāśvamedʰābʰyāṃ
          pʰalaṃ prāpsyanti te dʰruvam ||
      - ab@verse[n=3]: pippalādena mahatā samākʰyātam idaṃ śubʰam | brāhmaṇānāṃ hitārtʰāya
          putraśiṣyahitāya ca ||
      - ab@verse[n=4]: niṣkāmo vā sakāmo vā vedoktaṃ yaḥ samācaret | niṣkāmasya tu
          muktiḥ syāt sakāmaḥ pʰalam aśnute ||
      - ab@verse[n=5]: niṣkāmeṇa tu yat kiṃ cit kartavyam iti vaidikam | tat sarvaṃ
          muktidaṃ jñeyaṃ parāparaparaṃ sukʰam ||
      - ab@verse[n=6]: na śokas tasya no vyādʰir na mr̥tyur na jarā tatʰā | na kṣudʰā
          na pipāsā ca amr̥tātmā sa tiṣṭʰati ||
  - pariśiṣṭa[n=24]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: vedilakṣaṇam [+ agnivarṇalakṣaṇam]
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om atʰa rṣiputrikāyāṃ tu spʰutaṃ sarveṣu karmasu | lakṣaṇaṃ
          hy agnivarṇānāṃ pravakṣyāmi yatʰākramam ||
      - ab@verse[n=2]: vāstukarmaṇy atʰotpāte pater nīrājane vidʰau | sarvanakṣatrahomeṣu
          grahātitʰyavidʰau tatʰā ||
      - ab@verse[n=3]: yātrodyāne vivāheṣu cūḍopanayaneṣu ca | sarveṣu cāgnihomeṣu
          vahnivarṇān nibodʰata ||
      - ab@verse[n=4]: mānenādʰyardʰaśīrsaṇyā trimadʰyā ṣaṇmukʰā smr̥tā | caturaśrā
          cakartavyā vediḥ śāntīṣṭikarmasu ||
      - ab@verse[n=5]: eṣā vai viparītā ca kāryā gʰoreṣu karmasu | karmaṇām anurūpāṃ
          tu vediṃ vakṣyāmy ataḥ param ||
      - ab@verse[n=6]: yatʰāvartanagocarmacakratalpeṣu saṃmitā | saṃmr̥jya prokṣya
          saṃstīrya vidʰivac copaśobʰayet ||
      - ab@verse[n=7]: ślakṣṇāḥ samāhitāḥ sarvāḥ prāgudakpravaṇāḥ śubʰāḥ | saṃmr̥jya
          prokṣya saṃstīrya vidʰivac copaśobʰayet ||
      - ab@verse[n=8]: dakṣiṇena tu yā vakrā yājñikaṃ sā vināśayet | yā ca vakrottareṇa
          syād yajamānaṃ vināśayet ||
      - ab@verse[n=9]: purastāt pr̥ṣṭʰato vāpi madʰyato viṣamā ca yā | puram antaḥpuraṃ
          cāpi nāyakaṃ ca hinasti sā ||
      - ab@verse[n=10]: eṣā saṃkṣepataḥ proktā vediḥ sāmānyalakṣaṇā | viśeṣatas tu
          teṣv eva karmasv evābʰidʰāsyate ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: prācīṃ saṃśodʰayed bʰūmiṃ yajñavāstu yatʰoditam | samitkuśāgnivarṇānāṃ
          lakṣaṇajño bʰaved guruḥ ||
      - ab@verse[n=2]: tatas tu yatnavān samyag agnāv upasamāhite | agnivarṇān parīkṣeta
          yatʰovācośanāḥ kaviḥ ||
      - ab@verse[n=3]: śabdaṃ varṇaṃ ca gandʰaṃ ca rūpaṃ snehaṃ prabʰāṃ gatim | sparśaṃ
          cāpi parīkṣeta agnāv iti viniścayaḥ ||
      - ab@verse[n=4]: svāhākārāvasāne tu svayam uttʰāya pāvakaḥ | havir yātrābʰilaṣati
          tad vidyād artʰasiddʰaye ||
      - ab@verse[n=5]: vr̥ṣavāraṇamegʰaugʰanemidundubʰiniḥsvanaḥ | mr̥ṇālapadmadūrvābʰakumudotpalagandʰamuk
          ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tatʰā mahātmā stanayan vāhakumbʰanibʰadyutiḥ | saṃhitajvālanikaraḥ
          pāvakaḥ pāpanāśanaḥ ||
      - ab@verse[n=2]: kuraṇṭākr̥tigokṣīrahemāruṇataḍitprabʰaḥ | protpʰullotpalakundendukumudābʰotpaladyutiḥ
          ||
      - ab@verse[n=3]: huto 'pi saṃjvalaty eva snigdʰo viprasya dakṣiṇaḥ | lelihānaḥ
          pramuditaḥ kr̥ṣṇavarṇo 'rtʰasidʰaye ||
      - ab@verse[n=4]: viśālamūlo hy amalo nīlaḥ pr̥tʰulamadʰyamaḥ | pradīptāgro 'malatato
          jvālāmālākulo 'nalaḥ ||
      - ab@verse[n=5]: pradakṣiṇaḥ prasannārcir arciṣmān arcitadyutiḥ | arcanīyaś
          ca nr̥pater arcito havyavāhanaḥ ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: paristaraṇayogāc ca yajñakāṇḍapariccʰadam | śāntiveśmārdʰvadīptārcir
          r̥tvijaś cānulimpati ||
      - ab@verse[n=2]: prahasann iva śabdena dyotayann iva tejasā | kr̥tapuṇyasya
          nr̥pater hūyamāno hutāśanaḥ ||
      - ab@verse[n=3]: karmaṇo 'vabʰr̥tʰe yasya haviṣo 'nte ca pārtʰivam | sugandʰābʰir
          adʰūmābʰiḥ śikʰābʰiḥ saṃspr̥śann iva ||
      - ab@verse[n=4]: arcibʰir jvālabʰāraiś ca pradahan dviṣatāṃ diśaḥ | vidʰūmaḥ
          kuṇḍalī yaḥ syād anulomaś ca siddʰaye ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kuraṇṭahemāruṇaśaṅkʰakundamuktāvalīndupratime hutāśe | samasvane
          siṃhavr̥ṣair gajendrabalāhakaugʰasvanadundubʰīnām ||
      - ab@verse[n=2]: viśālamūle pr̥tʰule ca madʰye jñeyānale saṃprati pīḍitāgre
          | mr̥ṇālapadmānilatulyagandʰe trisāgarāntā vasudʰā nr̥pasya ||
      - ab@verse[n=3]: ātaptapadmānilatulyagandʰe trisāgarāntā vasudʰā nr̥pasya |
          tasyārtʰabāndʰavavatī sakalā mahīyaṃ vīryāṃśujālavivarāhatarājaśabdā ||
      - ab@verse[n=4]: vibʰrājate tv akʰilarāgayuto hutāśo hastāvr̥taṃ katʰayatīva
          jayaṃ nr̥pasya | sūryāṃśubʰiḥ kr̥tavigʰaṭṭanahemapadmakiṃjalkacūrṇanikarāruṇatāmalāṃśuḥ
          ||
      - ab@verse[n=5]: kṣīrodaśuktipuṭagarbʰavikīrṇamuktāsaṃgʰātapāṇḍurarajo ratʰanemigʰoṣaḥ
          | dātā nr̥pāya vasudʰāṃ tu himāṃśumaulijyotsnāvikāśitasamudrajalāṃ hutāśaḥ
          ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: lakṣmīpradoharamr̥ṇālakapālaśubʰrasnigdʰānuvr̥ttaśikʰaraprakr̥tiś
          ca yatra | vaiśvānaro jvalati yasya viśuddʰamūrtiḥ sa prāpnuyān nr̥paśatādʰipatāṃ
          narendraḥ ||
      - ab@verse[n=2]: bālārkabodʰitasaroruhagarbʰagandʰas toyāvalambijaladastanitābʰirāmaḥ
          | rājño dadāti vasudʰāṃ hutabʰug gajendradantāgrakampitamahārṇavavīcivr̥kṣām
          ||
      - ab@verse[n=3]: yasyāṃ vasantaravimaṇḍalatulyabimbo vedyāṃ nr̥pasya paripūrṇamarīcijālaḥ
          | tasyānalākalitasāgaratoyavastrā mrāgaikṣavenir avanir vaśam abʰyupaiti
          ||
      - ab@verse[n=4]: yasyānalo jvalati kāñcanatulyagauro prajvālyamānavapur utpalakośagandʰaḥ
          | āyāti tasya bʰavanaṃ hy alidīptimālā savrīḍasūryakiraṇā kṣitipālalakṣmīr
          iti ||
  - pariśiṣṭa[n=25]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: kuṇḍalakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ śaunakaṃ tu sukʰāsīnaṃ bʰārgavaḥ paripr̥ccʰati | kuṇḍaṃ
          kasmin bʰavet kīdr̥k kasyāṃ vā diśi kiṃ pʰalam ||
      - ab@verse[n=2]: sa tasmā upasannāya ācaṣṭe bʰārgavāya tu | kuṇḍaṃ yasmin bʰaved
          yādr̥g yasyāṃ vā diśi yat pʰalam ||
      - ab@verse[n=3]: caturaśraṃ śapʰākr̥tyā ardʰacandraṃ trikoṇakam | vartulaṃ pañcakoṇaṃ
          ca padmābʰaṃ saptakoṇakam ||
      - ab@verse[n=4]: kuṇḍāny etāni pūrvādidikṣu aṣṭasu vinirdiśet | digdevatānāṃ
          cāṣṭānāṃ karmaṇi svamsvam ādiśet ||
      - ab@verse[n=5]: caturaśraṃ tu pūrvasyām aindreṣv api ca karmasu | śapʰākr̥ti
          tadāgneyyām āgneyeṣv api karmasu ||
      - ab@verse[n=6]: ardʰacandraṃ tu yāmyāyāṃ yāmyeṣv api ca karmasu | nairr̥tyāṃ
          ca trikoṇaṃ syād abʰicāravidʰau śubʰam ||
      - ab@verse[n=7]: vāruṇyāṃ vartulaṃ jñeyaṃ vāruṇyeṣv api karmasu | vāyavyāṃ pañcakoṇaṃ
          tu vāyavyeṣv api karman ||
      - ab@verse[n=8]: uttarasyāṃ tu padmābʰaṃ saumyeṣv api ca karmasu | aiśānyāṃ
          saptakoṇaṃ tu raudreṣv api yatʰoditam ||
      - ab@verse[n=9]: sarvakarmasu vijñeyaṃ kuṇḍaṃ padmanibʰaṃ tu yat | caturaśraṃ
          tu sarvatra samaṃ syād vijayāvaham ||
      - ab@verse[n=10]: sarvaśāntikaraṃ kuṇḍaṃ padmākāraṃ viśeṣataḥ | śāntike caturaśraṃ
          ca pauṣṭike vartulaṃ tatʰā ||
      - ab@verse[n=11]: abʰicāre trikoṇaṃ ca vaśyādau cārdʰacandrakam | ṣaṭkoṇaṃ māraṇādau
          ca vidveṣe cāṣṭakoṇakam ||
      - ab@verse[n=12]: mekʰalā sarvakuṇḍeṣu dvādaśāṅgulam iṣyate | caturaṅgulamānena
          pūrvāpūrvasamuccʰritā ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: na cet purastād dʰīnaṃ syāt sukʰaṃ yajñaḥ samāpyate | yat tu
          dakṣiṇato 'hīnaṃ tad rājñas tv abʰayapradam ||
      - ab@verse[n=2]: yatʰāhīnaṃ paścimena bʰavet tat siddʰidaṃ śubʰam | uttareṇa
          samamyat syāt tad rājño rājyavardʰanam ||
      - ab@verse[n=3]: madʰye samaṃ ca sukʰadaṃ digvidikṣu samaṃ tu yat | tad rājajanasaṃpatkr̥t
          sarvāṃś cārīn vināśayet ||
      - ab@verse[n=4]: na cet purastād ityādi ya eṣa katʰito vidʰiḥ | maṇḍapānāṃ gr̥hāṇāṃ
          ca māne śāntikaraḥ smr̥taḥ ||
      - ab@verse[n=5]: hastakuṇḍaṃ sadāhome ayute dvikaraṃ smr̥tam | lakṣahome catuṣpāṇi
          koṭyām aṣṭakaraṃ smr̥tam ||
  - pariśiṣṭa[n=26]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: samillakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ samidʰāṃ saṃpravakṣyāmi pramāṇaṃ lakṣaṇaṃ śubʰam | tatʰāśubʰaṃ
          ca tattvena yatʰāpʰalavibʰāgataḥ ||
      - ab@verse[n=2]: yajñakarmaṇi kartavyā[ḥ] śāntike pauṣṭike tatʰā | prādeśamātrīḥ
          samidʰaḥ proktāḥ sarveṣu karmasu ||
      - ab@verse[n=3]: tiryag yavodarāṇy aṣṭāv ūrdʰvā vā vrīhayas trayaḥ | aṅgulasya
          pramāṇena prādeśo dvādaśāṅgulaḥ ||
      - ab@verse[n=4]: ata ūrdʰvaṃ na kartavyā nāpi hrasvā na cordʰvataḥ | na vakrā
          caiva kartavyā nāpi grantʰisamanvitā ||
      - ab@verse[n=5]: ūrdʰvatas tu yato vakrā citradadruvicarcikāḥ | karoti yāge
          kṣipraṃ tu tasmāt tāṃ parivarjayet ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: dvipʰalā piṇḍavarjāpi
          tripʰalā vāpi yā bʰavet | ṣaṭpʰalā saptapʰalā yā caturaṅgaṃ vinaśyati ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: sapattrapuṣpasamidʰaḥ
          kalpayitvā vicakṣaṇaḥ | pauṣṭikaṃ karma kurvīta sidʰyate nātra saṃśayaḥ
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: pattrapuṣpayutā yās tu
          śāntadrumasamudbʰavāḥ | samidʰo goṣṭʰamadʰye tu praśastāḥ parikīrtitāḥ ||
      - ab@verse[n=4]: '[atʰāparaṃ pravakṣyāmi samidʰāṃ caiva lakṣaṇam] ||'
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: viśīrṇā dvidalā hrasvā
          vakrā caiva dvidʰāgrataḥ | kr̥śā ca dīrgʰā stʰūlā ca karmasiddʰivināśinī
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: '[yad yatra lakṣaṇaṃ proktaṃ
          yasmin kāle yatʰāvidʰi | tatra tenaiva siddʰiḥ syād viparīte tatʰā bʰayam]
          ||'
      - ab@verse[n=7]: samāhr̥tānāṃ samidʰāṃ tāsāṃ caiva pʰalaṃ śr̥ṇu ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: viśīrṇāyuḥkṣayaṃ kuryād
          dvidalā rogadā bʰavet | abʰimukʰagatamātrā sadyo hrasvā nivartayet ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: durbʰagaṃ kurute vakrā stʰānabʰraṃśaṃ dvidʰāgrataḥ | kr̥śā
          sarvavināśāya dīrgʰā nāśayate śriyam ||
      - ab@verse[n=2]: stʰūlā tu kurute vigʰnaṃ sarvakārye dvijasya tu | ataḥ pramāṇaṃ
          vividʰaṃ pʰalaṃ cāpi tatʰā śr̥ṇu ||
      - ab@verse[n=3]: latāpallavasaṃjātā dvādaśāṅgulakalpitā | kṣīrāktā śāntike home
          hotavyā tu viśeṣataḥ ||
      - ab@verse[n=4]: kevalaṃ muktisiddʰyartʰaṃ gʰr̥tāktā[m] homayeddvijaḥ | daśāṅgulapramāṇāṃ
          hi homayen mantrakarmaṇi ||
      - ab@verse[n=5]: navāṅgulā tu kartavyā tailābʰyaktābʰicārike | aṣṭāṅgulā vibʰūtyartʰe
          gʰr̥tadadʰnā tu homayet ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kevalaṃ madʰusaṃyuktā saptāṅguladalīkr̥tā | uccāṭane praśastā
          sā dvidalā ca na śāntaye ||
      - ab@verse[n=2]: vidveṣe kaṭutailāktā dvidalā tu ṣaḍaṅgulā | sarvato grantʰihīnā
          tu viprāṇāṃ syāt samic cʰubʰā ||
      - ab@verse[n=3]: avakrāgrantʰisaṃyuktā kṣatriyāṇāṃ jayāvahā | madʰye tu grantʰisaṃyuktā
          vaiśyānāṃ bʰūtisādʰanī ||
      - ab@verse[n=4]: trayāṇām api vakṣyante yā grāhyāḥ samidʰaḥ smr̥taḥ | nātyārdrā
          nātiśuṣkā vā naiva coṣarasaṃbʰavāḥ ||
      - ab@verse[n=5]: na dagdʰā na kr̥midaṣṭāḥ sarvadoṣavivarjitāḥ | samidʰām indʰanānāṃ
          ca tulyān vr̥kṣān bravīmy ataḥ ||
      - ab@verse[n=6]: śuṣukair yā indʰanaiḥ pūrvaṃ yajñavr̥kṣamayaiḥ śubʰaiḥ | ārdrāṇi
          homayec caiva śuṣkaiḥ kalahakarmaṇi | śuṣkāṇi hīndʰanāni syuḥ samidʰas tu
          yatʰoditāḥ ||
    - section[n=5]:
      - ab@verse[n=1]: puṣṭikāmaḥ palāśasya gr̥hṇīyāc cʰāntikarmaṇi udumbarasya vittārtʰī
          vaṭāśvattʰasya rājyadʰīḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: śrīkāmo bilvavr̥kṣasya
          kadambasya tatʰaiva ca | vidveṣaṃ kaṭukaiḥ kuryāt kaṇṭakair maraṇaṃ bʰavet
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: kakubʰaṃ kaṭabʰaṃ vr̥kṣaṃ
          kauvirālaṃ tu kauhakam | vaṃśaṃ vibʰītakaṃ śigruṃ vidyād uccāṭane hitān
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: stambʰane sarvasainyānāṃ
          vijayārtʰe jayaṃ diśet | apāmārgeṇa saubʰāgyam āyuṣkāmo hi dūrvayā ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: punnāgacampakau vr̥kṣā
          ye cānye kṣīriṇaḥ śubʰāḥ | yad yatra lakṣaṇaṃ proktaṃ yasmin kāle yatʰāvidʰi
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: tatra tenaiva siddʰiḥ
          syād viparīte tatʰā bʰayam | arkaḥ palāśo madʰuko nyagrodʰodumbaras tatʰā
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: plakṣo 'śvattʰo gomayānikuśāś
          ca samidʰaḥ kramāt | yatʰākrameṇa samidʰa ādityādigraheṣu ca ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: śataṃ sahasraṃ lakṣaṃ
          vā gāyatryā paramāhutiḥ | hūyamānaṃ tu yat kiṃ cit kr̥tānnaṃ yadi vā tilāḥ
          ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: grahanakṣatrapīḍāyāṃ sāvitryāpi
          hutaṃ hutam | eṣabʰedo mayākʰyātaḥ śubʰasya tv aśubʰasya ca ||
      - ab@verse[n=10]: yatʰoktam etad yaḥ kuryāt sa sarvapʰalam āpnuyād iti ||
  - pariśiṣṭa[n=27]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: sruvalakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ sauvarṇarājatais tāmraiḥ kāṃsyair draumais tatʰāyasaiḥ |
          sruvaiḥ sarvaguṇopetaiḥ karma kuryād yatʰākramam ||
      - ab@verse[n=2]: sauvarṇai rājatair yajñe tāmraiḥ śāntikapauṣṭike | kāṃsyena
          rudʰiraṃ māṃsaṃ nānyaj juhuvīta kiṃ cana ||
      - ab@verse[n=3]: sarve yajñe prayoktavyā varjayitvāyasaṃ sruvam | āyasaṃ kʰādiraṃ
          caiva abʰicāre prayojayet ||
      - ab@verse[n=4]: adʰunvaṃś caiva juhuyāt sruveṇāspʰuṭitāhutim | dʰunvan hi hanti
          putrān tu rākṣasā spʰuṭitāhutiḥ ||
      - ab@verse[n=5]: nānyat kiṃ cid abʰidʰyāyed uddʰr̥tyānyata āhutim | tad daivatam
          abʰidʰyāyed āhutir yasya hūyate ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: sruve pūrṇe japen mantram uttānaṃ śāntike karam | śāntike pauṣṭike
          caiva varjayet tu kanīnikām ||
      - ab@verse[n=2]: nātidīrgʰo nātihrasvo nātistʰūlaḥ kr̥śas tatʰā | aṣṭāviṃśatyaṅgulaḥ
          syāt kaniṣṭʰāgrapramāṇataḥ ||
      - ab@verse[n=3]: dīrgʰo hinasti rājānaṃ hrasva rtvijaṃ vināśayet | stʰūlaḥ sasyopagʰātāya
          kr̥śaḥ kṣayakaraḥ smr̥taḥ ||
      - ab@verse[n=4]: gopuccʰāgrākr̥tir daṇḍo maṇḍalāgra[m] śiro viduḥ | aṅguṣṭʰāgrapramāṇena
          nimnaṃ śirasi kʰānayet ||
      - ab@verse[n=5]: etal lakṣaṇam uddiṣṭaṃ sruvasya pʰalabʰedataḥ | gopatʰena yatʰāśāstram
          uddʰr̥taṃ śruticodanāt | sruveṇa kurute karma hastenāpi tatʰā śr̥ṇu ||
  - pariśiṣṭa[n=28]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: hastalakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ yadā juhoti hastena dakṣiṇenetareṇa vā | tadā vakṣye vidʰiṃ
          tasya śreyasī syād yatʰāhutiḥ ||
      - ab@verse[n=2]: yatʰā naśyati caivāsya karma guhyam ajānataḥ | tatʰāhaṃ saṃpravakṣyāmi
          gopatʰaḥ pāṭʰam iccʰatām ||
      - ab@verse[n=3]: kuśabalbajamauñjāṃ vā kr̥tvā veṣṭim anāmikām | homakarma tataḥ
          kuryāt spr̥ṣṭvā vāmena dakṣiṇam ||
      - ab@verse[n=4]: na riktapāṇir juhuyān nānipātitajānukaḥ | anipātitajānoś ca
          haranty āhutī rākṣasāḥ ||
      - ab@verse[n=5]: uddʰr̥tya samidʰo 'nnaṃ vā pañcabʰir juhuyād budʰaḥ | śanaiś
          ca nirvaped annaṃ madʰye 'gnau susamāhitaḥ ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: gr̥hakarmaṇi yajñe vā
          tatʰā pañcabʰir eva tu | śāntike pauṣṭike vaiva varjayet tu kanīnikām ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: tisr̥bʰir juhuyād annaṃ
          na tilān naiva taṇḍulān | yadābʰicārikaṃ kiṃ cit tasmin kāle prayojayet
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: vāmenābʰicāran nityaṃ
          tribʰir aṅgulibʰiḥ samaiḥ | nirdiṣṭaṃ tisr̥bʰiḥ śūlaṃ tena śatruṃ nipātayet
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: apasavyena hastena savyaṃ
          yadi juhoti tat | savyena cāpasavyaṃ tu [savyaṃ yadi juhoti tat] ||
      - ab@verse[n=5]: abʰicāras tu tat proktaḥ....ṣarvaśāntiṃ gamiṣyati ||
  - pariśiṣṭa[n=29]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: jvālālakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ br̥haspatiṃ sukʰāsīnam
          ātmavidyāparāyaṇam | praṇipatya mahartvijaṃ nāradaḥ paripr̥ccʰati ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: katʰayasva mahāprājña
          sarvaśāstraviśārada | aśubʰaṃ yac cʰubʰaṃ vāpi lakṣaṇaṃ pāvakasya tu ||
      - ab@verse[n=3]: sa pr̥ṣṭas tena tat sarvam ācacakṣe mahāmatiḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: hūyamānoyadā vahnir r̥jujvālaḥ
          pradr̥śyate | snigdʰaś ca kiṃśukābʰaś ca siddʰis tatra vinirdiśet ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: yatra bālārkavarṇābʰaḥ
          karmaṇy agniḥ pradr̥śyate | śāntiṃ labʰete tatrāśu yajamānapurohitau ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: aśokakusumābʰo 'pi kāñcanābʰas
          tatʰaiva ca | śāntiṃ karoty ākālena hūyamāno hutāśanaḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: adʰūmo jvalate kṣipraṃ kr̥tvāvartaṃ pradakṣiṇam | tadā śāntiṃ
          vijānīyād viparīte tatʰā bʰayam ||
      - ab@verse[n=2]: śvasate garjate caiva vispʰuliṅgāḥ samantataḥ | prāyaścittiṃ
          tadākuryād yad uktaṃ kauśikena tu ||
      - ab@verse[n=3]: atʰāpy āliṅgate bʰūmiṃ bʰramate ca samantataḥ | aśubʰaṃ katʰayet
          tatra hotre 'sau pāvakaḥ svayam ||
      - ab@verse[n=4]: kapilaḥ piṅgalas tāmro raktaḥ kāñcanasaprabʰaḥ | śubʰakr̥t
          pāvako jñeyo viparīto bʰayāvahaḥ ||
      - ab@verse[n=5]: yadāgnau lakṣaṇaṃ kiṃ cid aśubʰaṃ tu pradr̥śyate | hotā kleśam
          avāpnoti śāntiṃ tatra prayojayet ||
  - pariśiṣṭa[n=30]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: lagʰulakṣahomaḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ śaunakaṃ tu sukʰāsīnaṃ gautamaḥ paripr̥ccʰati | lakṣahomasya
          yat puṇyam āhutīnāṃ ca devatāḥ ||
      - ab@verse[n=2]: tasmai yatʰāvad ācaṣṭe śaunako jñānalocanaḥ | śr̥ṇuṣvāvahito
          bʰūtvā lakṣahomaṃ yatʰāvidʰi ||
      - ab@verse[n=3]: agnyāgārasya yā bʰūmis tāṃ pravakṣyāmy aśeṣataḥ | śuddʰākṣārā
          samā snigdʰā yā ca pūrvottaraplavā ||
      - ab@verse[n=4]: abʰasmāstʰyaṅgāratūṣā praśastā parikīrtitā | pramāṇaṃ bāhumātraṃ
          tu jaṅgʰāmātraṃ dviratnikam ||
      - ab@verse[n=5]: caturaśraṃ catuṣkoṇaṃ tulyaṃ sūtreṇa dʰārayet | brāhmaṇā vedasaṃpannā
          brahmakarmasamādʰayaḥ ||
      - ab@verse[n=6]: upoṣya caikarātraṃ ca gāyatryā ayutaṃ japet | upoṣya caiva
          gāyatryā japeyur ayutaṃ budʰāḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: te śuklavāsasaḥ snātāḥ sragbʰir gandʰair alaṃkr̥tāḥ | nirāhārās
          tatʰā dāntāḥ saṃtuṣṭāḥ sajitendriyāḥ ||
      - ab@verse[n=2]: kauśam āsanam āsīnāḥ prayuñjyur homam uttamam | ullikʰya cādbʰir
          abʰyukṣya saṃskr̥tya vidʰipūrvakam ||
      - ab@verse[n=3]: agne praihy agninā rayim ity upastʰāpya pāvakam | kuryād upasamādʰāya
          samās tvāgne samāhitaḥ ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: lakṣahoma@@kute pūrṇe dʰenuṃ dadyāt payasvinīm | anaḍvān kāñcanaṃ
          vastraṃ tuṣyeyur yena vā dvijāḥ ||
      - ab@verse[n=2]: yavais tu vipulān bʰogān dʰānyair āyuṣyam eva ca | tilair hutvā
          tu tejasvī āyuḥ kīrtiṃ ca vardʰate ||
      - ab@verse[n=3]: ādityaloko 'rkamayī pālāśī soma āpyate | āśvattʰī viṣṇulokasya
          brāhma audumbarī tatʰā ||
      - ab@verse[n=4]: anenaiva vidʰānena hūyate 'tra hutāśanaḥ | hutvaitāṃś caturo
          lakṣān brahmalokaṃ sa gaccʰati ||
      - ab@verse[n=5]: yāvaj jīvati kartāsau tāvat putrān dʰanaṃ śriyam | pūrṇe kāle
          vimānena nīyate paramaṃ padam ||
  - pariśiṣṭa[n=30b]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: br̥hallakṣahomaḥ
    - section[n=1]:
      - ab@verse[n=1]: om atʰa kāṅkāyano bʰagavantam atʰarvāṇaṃ papraccʰa || bʰagavan
          kena vidʰānena koṭihomaṃ lakṣahomam ayutahomaṃ vā prārambʰamāṇaḥ katʰam
          r̥tvijo vr̥ṇīte katʰaṃ ca kuryus tasmai sa hovāca ||
      - ab@verse[n=2]: brāhmaṇo vā rājā vā vaiśyo vā grāmo vā janapado vā śrīkāmaḥ
          śāntikāmaḥ koṭihomaṃ lakṣahomam ayutahomaṃ vāhaṃ kariṣyāmīti tasyā samāpter
          bʰavadbʰir amāṃsāśibʰir brahmacāribʰir haviṣyabʰugbʰir bʰavitavyam
      - ab@verse[n=3]: tais tatʰeti uktaḥ kuṇḍam ekahastaṃ dvihastaṃ caturhastam aṣṭahastaṃ
          vā [samastahastaṃ vā dīrgʰaṃ vā] daśahastaṃ kʰānayet tatʰā ca bādariḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: lakṣahome tu kartavyam
          aṣṭahastaṃ na saṃśayaḥ | dvihastaṃ vā prakurvīta caturhastam atʰāpi vā ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: kuṇḍaṃ vā daśahastaṃ tu
          dvivistāraṃ tatʰottaram | na cet purastād dʰīnaṃ syāt sukʰaṃ yajñaḥ samāpyate
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: atʰa dakṣiṇato hīnaṃ yajamānabʰayaṃkaram
          | paścimena vihīnaṃ syād yajñasyāsiddʰidaṃ dʰruvam ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: uttareṇa vinirdiṣṭaṃ rājño
          rājyaharaṃ bʰr̥śam | madʰye vihīnaṃ yad kuṇḍaṃ prajākṣayakaraṃ viduḥ ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: sraktihīnaṃ tu yat kuṇḍaṃ
          tad apy aśubʰadaṃ bʰavet | dvādaśāṅgulamānena mekʰalākṣetram ucyate ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: mekʰalātrayam uddʰiṣṭam
          ubʰayaṃ caturaṅgulam | caturaṅgulamānena pūrvāpūrvasamuccʰritā ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: pratʰamā sāttvikī proktā
          dvitīyā rājasī smr̥tā | tr̥tīyā tāmasī jñeyā mekʰalā vr̥ṣabʰadʰvajaḥ ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: caturdaśāṅgulāṃ tatra
          yoniṃ kurvīta sādʰakaḥ | aṣṭāṅgulaṃ bʰaved vr̥ttaṃ nirvāhas tu ṣaḍaṅgulaḥ
          ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: gajoṣṭʰasadr̥śākāra prājāpatyā
          ca sā ciduḥ | evaṃ kr̥tvā vidʰānena kuṇḍaṃ lakṣaṇalakṣitam ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: sarvalakṣaṇasaṃpūrṇaṃ
          sarvatas tu samāhitaḥ | kuṇḍaṃ siddʰikaraṃ jñeyam āyuḥkīrtivivardʰanam ||
      - ab@verse[n=14]: tasmād yatnena kuṇḍaṃ kʰātvādbʰir abʰyukṣya purastād agner
          ādityādīn grahān pratiṣṭʰāpyottarataḥ kr̥ttikādīni nakṣatrāṇi svāsu dikṣu
          lokapālān sarvāsu kuṇḍasraktiṣv agnyādidevān ratiṣṭʰāpya
      - ab@verse[n=15]: teṣāṃ pratimantram āvāhanādikaṃ kr̥tvā vilīnapūtam ājyaṃ gr̥hītvā
          sruvaṃ srucaṃ ca saṃmr̥jya pratapyedʰmam upasamādʰāyānvārabdʰāya vāstoṣpatyādibʰiś
          caturbʰir gaṇaiḥ śāntyudakaṃ kr̥tvā tataḥ kartāram ācāmayati ca saṃprokṣati
          ca ||
      - ab@verse[n=16]: atʰa samidʰo gʰr̥tāktās tilān vā svāhākāravatīḥ saṃkʰyāvatyo
          gāyatryā mahāvyāhr̥tibʰir vā sarva r̥tvijo juhvati ||
      - ab@verse[n=17]: śrīparṇamiśrāḥ śrīkāmasya śamīparṇamiśrāḥ śāntikāmasya karīrasaktumiśrā
          vr̥ṣṭikāmaysa badarādipʰalamiśrāḥ paśukāmasya ||
    - section[n=2]:
      - ab@verse[n=1]: aharahaḥ karmaṇo 'pavargād atʰa pūrṇāyāṃ koṭyāṃ lakṣe vāyute
          vānvārabdʰe yajamāne niśi mahābʰiṣEkaṃ kr̥tvā vasor dʰāraṃ juhvati ||
      - ab@verse[n=2]: audumbarīṃ srucaṃ śuraḥpramāṇāṃ brāhmaṇasya lalātapramāṇāṃ
          kṣatriyasya skandʰapramāṇāṃ vaiṣyasyāpramāṇāṃ janapadasya
      - ab@verse[n=3]: teṣām ante saraṇārtʰaṃ nimnaṃ kʰānayitvoṣṇodakena prakṣālyājyam
          ānīya vasor dʰārāṃ vaiśvānaraṃ prāpnoti ||
      - ab@verse[n=4]: tad yad ājyadʰānīṃ ca vaiśvānaraṃ prāpnoti atʰoccārayati ||
      - ab@verse[n=5]: ojaś ca me kṣatraṃ ca me ye agnayo amo devavadʰebʰyo bʰavāśarvau
          mr̥ḍataṃ prāṇāya nama iti hutvā argʰaṃ pradāya vastraṃ lodʰraṃ mālyaṃ pʰalādīni
          bʰājane kr̥tvā namas te astu paśyata iti svāhākāreṇāgnau prakṣipya yamyaṃ
          kāmaṃ kāmayate so 'smai kāmaḥ samr̥dʰyate ||
      - ab@verse[n=6]: samr̥ddʰihomādi samānaṃ svastyayanāni japet puṇyāhaṃ vācayed
          gobʰūtilasuvarṇaṃ vāsaś ca rtvigbʰyaḥ saṃpradāya praṇipatya visarjayet ||
      - ab@verse[n=7]: tasminn ahani vyatīte yadi strī mālyahastā śvetacandanāniliptā
          śvetapuṣpāṇy ādāya prayaccʰed gaurasarṣapān pāṇyādʰāre vā gr̥hītvā prāsādam
          ārohayet kuñjaraṃ vā pramattam aśvaṃ śvetaṃ vā parvataṃ govr̥ṣaṃ vā yānaṃ
          yuktaṃ vājibʰir yady ārohet svapnakāle samastasiddʰiṃ vidyān manaso yām
          abʰīṣṭām ||
      - ab@verse[n=8]: tasmāt tāṃ rātrīṃ prayataḥ svapet || svapnaṃ dr̥ṣṭvā rtvigbʰyo
          nivedayet || paro 'pehi yo na jībo 'si vidma te svapna yatʰā kalāṃ yatʰā
          śapʰam iti rājamukʰam abʰimantrya yatʰāgataṃ gaccʰeyus tad api ślokāḥ ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: divyāntarikṣabʰaumeṣu
          adbʰuteṣu na saṃśayaḥ | koṭihomaṃ viduḥ prājñā lakṣaṃ vāyutam eva vā ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: avijñātaṃ ca yat pāpaṃ
          sahasā caiva yat kr̥tam | tat sarvaṃ lakṣahomasya karaṇād dʰi vinaśyati
          ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: tasmāt sarveṣu kāryeṣu
          śāntikeṣu viśeṣataḥ | yaḥ kuryāt prayato nityaṃ na so 'nartʰān samaśnute
          ||
  - pariśiṣṭa[n=31]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: koṭihomaḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ devāś ca r̥ṣayaś caiva pīḍyamānā mahāsūraiḥ | mr̥tyunā vyādʰibʰiś
          caiva brahmāṇam idam abruvan ||
      - ab@verse[n=2]: karmaṇā kena deveśa mr̥tyur vyādʰiś ca jīyate | aiśvaryaṃ prāpyate
          vāpi stʰānaṃ ca paramaṃ prabʰo ||
      - ab@verse[n=3]: evam ukto mahātejā brahmā lokapitāmahaḥ | pratyuvāceśvaraḥ
          sarvān viprān devagaṇaiḥ saha ||
      - ab@verse[n=4]: śr̥ṇudʰvaṃ prayatāḥ sarve prāpyate yena karmaṇā | aiśvaryam
          āyur ārogyaṃ putrā vijaya eva ca ||
      - ab@verse[n=5]: savyāhr̥tiṃ sapraṇavāṃ gāyatrīṃ śirasā saha | ye japanti sadā
          tebʰyo na bʰayaṃ vidyate kva cit ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tayā homaś ca kartavyaḥ satataṃ siddʰim iccʰatā | yavais tilaiḥ
          samidbʰiś ca vrīhibʰiḥ sarṣapais tatʰā ||
      - ab@verse[n=2]: atʰa cen mahatīṃ siddʰiṃ prārtʰayedʰvaṃ surottamāḥ | purodʰasā
          kārayadʰvaṃ koṭihomaṃ mahāpʰalam ||
      - ab@verse[n=3]: yādr̥śaṃ kr̥tavān pūrvam atʰarvā tryambakasya tu | tādr̥śena
          vidʰānena koṭihomaḥ prayujyate ||
      - ab@verse[n=4]: mahattvaṃ prārtʰayamānaḥ śarvo 'tʰarvāṇam abravīt | kuruṣva
          mama tat karma mahattvaṃ yena labʰyate ||
      - ab@verse[n=5]: aiśvaryam āyur ārogyaṃ stʰānaṃ ca paramaṃ prabʰo | putrā lakṣmīr
          yaśo medʰā balaṃ pauruṣyam eva ca ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: evam ukto mahātejā atʰarvā mantradarśavit | gāyatrīṃ tapasā
          yuktām r̥caḥ padam itīti ha ||
      - ab@verse[n=2]: '[r̥caḥ padaṃ mātrayeti mantre vijñāyate hi sā] | gāyatrī vai
          tripād brahma viśvarūpā ca saṃstʰitā ||'
      - ab@verse[n=3]: prāṇadā sarvabʰūtānāṃ dʰāraṇī yāpi nityaśaḥ | iti niścitya
          manasā koṭihomaṃ prayojayat ||
      - ab@verse[n=4]: samidbʰiḥ śāntavr̥kṣasya gāyatryā susamāhitaḥ | tato mahattvam
          agamad aiśaryaṃ paramaṃ tatʰā ||
      - ab@verse[n=5]: mahādeva iti cāsya nāma lokeṣu viśrutam | upadravāś ca ye ke
          cid upagʰātās tatʰaiva ca | sarve 'sya praśamaṃ yātāḥ skandaṃ putraṃ ca
          labdʰavān ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tataḥ prītas tu bʰagavāñ śaṃkaraḥ paryapr̥ccʰata | atʰarvāṇaṃ
          mahāprājñaṃ koṭihomasya ko vidʰiḥ ||
      - ab@verse[n=2]: caturviṃśākṣaraṃ brahma tripādaṃ lokadʰāraṇam | sāvitraṃ tena
          homo 'yaṃ kr̥to me koṭisaṃmitaḥ ||
      - ab@verse[n=3]: vidʰiṃ cāsya pravakṣyāmi sarvalokahitāya vai | yatprayogād
          bʰavec cʰāntir vr̥ddʰiś ca paramā nr̥ṇām ||
      - ab@verse[n=4]: upadraveṣu bʰūtānām āpatsu vividʰāsu ca | koṭihomaḥ prayoktavyaḥ
          ketūnāṃ darśane tatʰā ||
      - ab@verse[n=5]: upasargabʰaye caiva paracakrabʰaye tatʰā | anāvr̥ṣṭibʰaye caiva
          koṭihomaṃ prayojayet ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: ārambʰaṃ tasya kurvīta śukle cāpi titʰau śubʰe | muhūrte vijaye
          caiva titʰicʰidrāṇi varjayet ||
      - ab@verse[n=2]: rohiṇyāṃ vaiṣṇave tvāṣṭre pauṣṇe maitrottareṣu ca | abʰijitpuṣyasaumyeṣu
          kuryāt puṇyeṣu vā budʰaḥ ||
      - ab@verse[n=3]: atʰa cet tvarate kartuṃ koṭihomaṃ mahāpʰalam | puṇyāhaṃ vācayitvāsya
          ārambʰaṃ kārayed budʰaḥ ||
      - ab@verse[n=4]: aṣṭahastaṃ tu nirdiṣṭaṃ koṭihomasya kʰātakam | tasyaivārdʰapramāṇena
          lakṣahome vidʰīyate ||
      - ab@verse[n=5]: trirātropoṣito brahmā kr̥tvā śāntiṃ caturgaṇīm | prokṣayet
          karmasiddʰyartʰaṃ vāstu śāntyudakena tu ||
      - ab@verse[n=6]: mahāśāntividʰānena nirmatʰyāgniṃ samāhitaḥ | tāvat kuryād budʰaḥ
          sarvaṃ yāvan no nairr̥taṃ kr̥tam ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tataḥ prabʰāte bahuśa uddʰr̥tyāgniṃ samāhitaḥ | nirmatʰya hāvayet
          tatra samidʰo brāhmaṇān bahūn ||
      - ab@verse[n=2]: śataṃ sahasraṃ koṭiṃ vā viṃśatir daśa vā dvijāḥ | juhuyuḥ śāntavr̥kṣasya
          samidʰo gʰr̥tasaṃyutāḥ ||
