          || prabaddʰasyaikapaśoḥ
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: ulūcī kālaśakuniḥ kṣipraśyeno
          'tʰa vartikā | ete dvijāḥ prādakṣiṇyāś cāṣaś cātra pradr̥śyate ||
      - ab@verse[n=4]: krauñcanakulapriyavr̥kṣacaityānāṃ nityaṃ vayasām ||
      - ab@verse[n=5]: tiryag nyag vādʰipatitaṃ viparītaṃ hīnāṅgāṅgātiriktaṃ vikr̥tanagnamuṇḍabaṇḍaś
          citraśyāmaśyāvadantakunakʰijaṭila{ḥ} kāṣāyāvikayoś [carmā]brāhmaṇayor
      - ab@verse[n=6]: eteṣāṃ kiṃ cid dr̥ṣṭvā na gaccʰed
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: yadi gaccʰed artʰino yanti
          ced artʰaṃ gaccʰān id daduṣo rātim | vavr̥jyus tr̥ṣyataḥ kāmam ity etāṃ
          japet ||
      - ab@verse[n=8]: ni ṣajyato dasyūṃś cʰādayann indreti vā
      - ab@verse[n=9]: stuhi śrutam iti vā
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: devīṃ vācam ajanayanta
          devās tāṃ viśvarūpāḥ paśavo vadanti | sā no mandreṣam ūrjaṃ duhānā dʰenur
          vāg asmān upa suṣṭutaitu iti gardabʰamukʰena pratinadati pratilomapratikr̥tyāsya
      - ab@verse[n=11]: sarvāś ca pāpikā vāco neṣṭā<ḥ> | kuceladarśanaṃ ca | anartʰā
          hiṃsārtʰam | taddarśanāya | pāpaṃ vā jihīrṣatāṃ siddʰiḥ ||
    - section[n=33]:
      - ab@verse[n=1]: atʰa rogaparimāṇāny
      - ab@verse[n=2]: uttarāsv aṣāḍʰāsūttarayoḥ proṣṭʰapadayor māsam |
      - ab@verse[n=3]: rohiṇyāṃ viṃśatirātram |
      - ab@verse[n=4]: punarvasor ūnaviṃśatirātraṃ pūrvāṇi dvandvinām |
      - ab@verse[n=5]: mr̥gaśirasi ṣoḍaśarātram abʰijiti śravaṇe ca
      - ab@verse[n=6]: ārdrāyāṃ pañcadaśarātram anūrādʰāśraviṣṭʰābʰaraṇīṣu ca |
      - ab@verse[n=7]: puṣye dvādaśarātraṃ haste svātau ca |
      - ab@verse[n=8]: śatabʰiṣaji navarātraṃ māse vākālaṃ kurute |
      - ab@verse[n=9]: jyeṣṭʰāyāṃ mūle cāṣṭarātram |
      - ab@verse[n=10]: revatyāṃ saptarātram |
      - ab@verse[n=11]: kr̥ttikāśleṣā magʰā uttare pʰālgunyau citrā viśākʰe aśvayujau
          ca saptasv eteṣu daśarātram ||
    - section[n=34]:
      - ab@verse[n=1]: atʰa balayaḥ
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: śukla upaśurasr̥peśuklosaptamūnmodanaḥ
          | aṣṭamaḥ palalodano dʰānāḥ saktavo 'tʰa śaṣkulī ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: citraś ca kr̥kavākuś ca
          śuklaḥ kambūkapiṇḍakaḥ | sarvabījāni mūlāni udapātraṃ ca pāyasau ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: paśu gʰr̥taṃ kaśīkā ca
          ārdramāṃsāni pāyasau | patʰyāyāṃ māṣasaktavaḥ pāyaso 'tʰa tilodanaḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: sarvatra gandʰapuṣpāṇi
          lājānulepikās tatʰā | anudvāraṃ ca nakṣatraṃ daivataṃ cātra yojayet ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: dīpāś ca maṇḍale dīptāḥ
          śuciś cāpi baliṃ haret | yo 'smin yas tvā mātur iti vipariharet ||
    - section[n=35,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: saśvetasaktu kaṃsaś ca prācīnārtʰasya maṅgalam | sravaṃ ca
          māṃsapeśī ca dakṣiṇārtʰasya maṅgalam ||
      - ab@verse[n=2]: kumārī dadʰikaṃsaś ca pratyagartʰasya maṅgalam | anaḍvān brahmacārī
          ca udagartʰasya maṅgalam ||
      - ab@verse[n=3]: kumārīṃ dadʰipātreṇa gr̥hītena svalaṃkr̥tām | pradakṣiṇāṃ tu
          tāṃ kuryād dʰruvaṃ syāt siddʰir iṣyate ||
    - section[n=36]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: senāṃ ced abʰyuttʰitāṃ
          mandraḥ pratigarjed rājā vāmātyo vā mariṣyatīti vidyāt tatra vāruṇīṃ japet
          | ud uttamaṃ varuṇa pāśam iti ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: senāṃ ced adbʰyuttʰitāṃ
          dʰūmo 'nugaccʰed vijeṣyatīti vidyāt | tveṣas te dʰūma ity anumantrayet ||
      - ab@verse[n=3]: senāṃ ced abʰyuttʰitāṃ vāto 'nuvāyād vijeṣyatīti vidyād vāta
          ā vatv ity anumantrayet ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: senāṃ ced abʰyuttʰitāṃ
          mr̥go vyabʰimr̥śed artʰaṃ tasyā vinaśyatīti vidyāt | mr̥go na bʰīmaḥ kucaro
          giriṣṭʰā ity anumantrayet ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: senāṃ ced abʰyuttʰitāṃ
          pakṣiṇo vyatipateyur māṃsodanaṃ ca tatra dadyāt | aliklavā jāṣkamadā gr̥dʰrā
          ity anumantrayet ||
      - ab@verse[n=6]: senāṃ ced abʰyuttʰitāṃ kapiñjalaḥ prativaded bʰadraṃ vadeti
          tisraḥ kāpiñjalāni stavanāni vadanti ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: yo abʰy u babʰruṇāyasi
          svapantam atsi puruṣaṃ śayānam agasvalam | ayasmayena brahmaṇāśmamayena
          varmaṇā pary asmān varuṇo dadʰad || ity abʰyavakāśe saṃviśati | abʰyavakāśe
          saṃviśati ||
    - section[n=37,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: agnir devo yajvanaḥ kr̥ṣṇavartmā vaiśvānaro jātavedā rasāgrabʰuk
          | sa nakṣatrāṇāṃ pratʰamena pāvakaḥ kr̥ttikābʰir jvalano no 'nuśāmyatām
          ||
      - ab@verse[n=2]: prajāpatir yaḥ sasr̥je prajā imā devānt sa sr̥ṣṭvā viniyoj{y}a
          karmasu | sa sarvabʰuk sarvayogeṣu rohiṇī śivāḥ kriyāḥ kr̥ṇutāṃ karmasiddʰaye
          ||
      - ab@verse[n=3]: vidyāvido ye abʰiśocamānavā arcanti śakraṃ saha devatāgaṇaiḥ
          | sa no yoge mr̥gaśiraḥ śivāḥ kriyāḥ śreṣṭʰarājaḥ kr̥ṇutāṃ karmasiddʰaye
          ||
      - ab@verse[n=4]: devaṃ bʰavaṃ paśupatiṃ haraṃ kr̥śaṃ mahādevaṃ śarvam ugraṃ
          śikʰaṇḍinam | sahasrākṣam aśaniṃ yaṃ gr̥ṇanti sa no rudraḥ paripātu na ārdrayā
          ||
      - ab@verse[n=5]: '....yā vipraiḥ kavibʰir namasyate dākṣāyaṇī devapurādibʰir
          nr̥bʰir | sā naḥ stutā pratʰamajā punarvasuḥ śivāḥ kriyāḥ kr̥ṇutāṃ karmasiddʰaye
          ||'
    - section[n=38,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yasya devā brahmacaryeṇa karmaṇā mahāsuraṃ tigmatayābʰicakrire
          | taṃ subudʰaṃ devaguruṃ br̥haspatim arcāmi pusyeṇa sahābʰipātu mā ||
      - ab@verse[n=2]: yā na{ḥ} stutaḥ parihiṇomi medʰayā tapyamānam r̥ṣibʰiḥ kāmaśocibʰiḥ
          | jaratkārasūnor r̥ṣibʰir manīṣibʰis tā aśleṣā abʰirakṣantu noragaiḥ ||
      - ab@verse[n=3]: ye devatvaṃ puṇyakr̥to 'bʰicakrire ye cāpare ye ca pare maharṣayaḥ
          | arcāmi sūnur yamarājagān pitr̥̄ṃś cʰivāḥ kriyāḥ kr̥ṇutāṃ ca no magʰā ||
      - ab@verse[n=4]: yo yojayan karmaṇā carṣaṇīdʰr̥to bʰūmiṃ ceti bʰaga{ḥ prajāḥ}
          prasādayan | taddevatye śivatamām alaṃkr̥te pʰalgunyor īḍe bʰajanaṃ ca pūrvayoḥ
          ||
      - ab@verse[n=5]: stutaṃ pūrvair aryamaṇaṃ manīṣibʰiḥ staumi devaṃ jagati vācam
          erayan | taddevatye śivatamām alaṃkr̥te pʰalgunyau na uttare devatātaye
          ||
    - section[n=39,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: ś[y]āvair yuktaḥ śitipād dʰiraṇyayo yasya ratʰaḥ patʰibʰir
          vartate sukʰaiḥ | sa no hastena savitā hiraṇyabʰug gʰiraṇyapāṇiḥ savitā
          [no] 'bʰirakṣatu ||
      - ab@verse[n=2]: tvaṣṭre namaḥ kṣitisr̥je manīṣiṇe bʰūtagoptre paramakarmakāriṇe
          | sā na{ḥ} stutā kr̥ṇutāṃ karmasiddʰaye citrāṃ devī saha yogena rūpabʰr̥t
          ||
      - ab@verse[n=3]: yaḥ prāṇināṃ jīvayan kʰāni sevate śivo bʰūtvā mātariśvā rasāgrabʰuk
          | dʰvajo 'ntarikṣasya sa sarvabʰūtabʰr̥d vāyur devaḥ svātinā no 'bʰirakṣatu
          ||
      - ab@verse[n=4]: yāv īḍitāv ātmavidbʰir maṇīṣibʰiḥ sahitau [yau] trīṇi savanāni
          sāmagau | indrāgnī varadau namaskr̥tau viśākʰayoḥ kurvatām āyuṣe śrīḥ ||
      - ab@verse[n=5]: viśve devā yam r̥ṣim āhur mitraṃ bʰaradvājam r̥ṣitaḥ prasāmavit
          | taṃ jagatyā gātʰayā staumy ugraiḥ sa mām anūrādʰābʰir [bʰr̥takaṇvo] 'bʰirakṣatu
          ||
    - section[n=40,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: śatakratur yo nijagʰāna śambaraṃ vr̥traṃ ca hatvā saritaḥ prasarjata[ḥ]
          | sa naḥ stutaḥ prītamanāḥ puraṃdaro marutsakʰā jyeṣṭʰayā no 'bʰirakṣatu
          ||
      - ab@verse[n=2]: yā dʰārayaty ojasātidevapadaṃ mātā pr̥tʰivī ca sā sarvabʰūtabʰr̥t
          | sā na{ḥ} stutā kr̥ṇutāṃ karmasiddʰaye mūlaṃ devī nirr̥tiḥ sarvakarmasu
          ||
      - ab@verse[n=3]: parjanyasr̥ṣṭās tisr̥ṇībʰir āvr̥taṃ yās tarpayanty abʰitaḥ
          pravr̥ddʰaye | tā{ḥ} staumy āpo vāruṇīḥ ... pūrvā āṣāḍʰā svadʰayāstu yojane
          ||
      - ab@verse[n=4]: yās triṃśataṃ trīṃś ca madanti devā devanāmno nirmitā{ṃ}ś ca
          bʰūyasaḥ | tā no 'ṣāḍʰā uttarā vaso viśve {śivāḥ} kriyāḥ kr̥ṇutāṃ suramatāḥ
          ||
      - ab@verse[n=5]: yaḥ sarvajñaḥ sarvakr̥t sarvabʰūtabʰr̥d yasmād anyan na paraṃ
          kiṃ canāsti | anirmitaḥ satyajitaḥ puruṣṭutaḥ sa no brahmābʰijitā no 'bʰirakṣatu
          ||
    - section[n=41,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: stʰānācyute stʰānam indrāya pātave devebʰyaś ca ya īrayaṃs
          [trir] vicakrame | taṃ svid dʰi svargaṃ nākapr̥ṣṭʰaṃ viśvaṃ viṣṇur devaḥ
          śravaṇenābʰirakṣatu ||
      - ab@verse[n=2]: aṣṭau śatāni śvetaketūnāṃ yāni tvaṃ ca sa tvaṃ nijagʰāna bʰūyasaḥ
          | anādeśenobʰaya[ta]ś ca vīḍitāḥ śraviṣṭʰābʰir no 'bʰirakṣantu vājinaḥ ||
      - ab@verse[n=3]: vājā devī devamr̥ṇānikākubʰāv ubʰāv ājasya natakarmaṇā śivā
          | tava vrājaṃ staumasi devabʰojanau pratyagbʰiṣak śatabʰiṣak śivau naḥ ||
      - ab@verse[n=4]: śunāsīrau naḥ pramumūtu jihmasau tautau pitr̥bʰyo dadatu{ḥ}
          stanau śubʰau | tau pūrvajau kr̥ṇutām ekapād ajaḥ pratiṣṭʰānau sarvakāmābʰayāya
          ca ||
    - section[n=40,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=5]: sarvārtʰāya kr̥ṇomi karmasiddʰaye gaviṣṭutāyānekakāriṇe namaḥ
          | so 'hir budʰnyaḥ kr̥ṇutām uttarau śivau pratiṣṭʰānau sarvakāmābʰayāya
          ca ||
    - section[n=41,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=6]: yaṃ mahāhemam r̥ṣitaḥ prasāmavid bʰaradvājaś candramasau divākaram
          | sajuṣṭānām aśvayujau bʰayāya ca sa naḥ pūṣā kr̥ṇutāṃ revatīṃ śivām ||
      - ab@verse[n=7]: jīrṇaṃ santaṃ yau yuvānaṃ hi cakratur r̥ṣiṃ dʰiyā cyavanaṃ
          somapau kr̥tau | tau naś cittibʰir bʰiṣajām asya satkarau .... prajām aśvinyām
          aśvinau śivau ||
      - ab@verse[n=8]: yasya śyāmaśabalau rakṣataḥ svadʰā duṣkr̥t sukr̥d vividʰā carṣaṇīdʰr̥tau
          | tau savitryā ca savitur dʰarmacāribʰir yamo rājā bʰaraṇībʰir no 'bʰirakṣatu
          ||
    - section[n=42,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: atʰa nakṣatrasnānānāṃ vidʰiṃ vakṣyāmi sāṃpadam | grahadaivatapūjāṃ
          ca yeṣu yatra yatʰāvidʰi ||
      - ab@verse[n=2]: nakṣatrayogakālajñaḥ kr̥tvā tantraṃ yatʰāvidʰi | yajed grahān
          haviṣyeṇa yatʰoktena ca devatāḥ ||
      - ab@verse[n=3]: praśastalakṣaṇaṃ kumbʰaṃ sasaṃbʰārajalaṃ budʰaḥ | saṃpātābʰihitaṃ
          kr̥tvā mantrair vidʰim anusmaran ||
      - ab@verse[n=4]: sāvitryā śāntisūktaiś ca mahāvyāhr̥tibʰis tatʰā | apāṃ stotraiḥ
          pavitraiś ca nakṣatrastutibʰis tatʰā ||
      - ab@verse[n=5]: nakṣatradaivatān mantrān pratinakṣatram āvapet | kāmyāṃś caivāvapen
          mantrān karmaliṅgavidʰānavit ||
      - ab@verse[n=6]: saṃpātyātʰābʰimantrya vā nakṣatrasnānakovidaḥ | snāpayed artʰinaṃ
          vāgbʰiḥ puṇyābʰir abʰimantritam ||
      - ab@verse[n=7]: eṣa eva vidʰir dr̥ṣṭaḥ sadasyebʰyaś ca dakṣiṇā | pūrvam āpyāyayed
          dehaṃ paścād dadyāt tu dakṣiṇām ||
      - ab@verse[n=8]: 'anena vidʰinā snātvā dadyāc caivātra dakṣiṇām | prāpnoty anunayaṃ
          puṃsaḥ sa vedapʰalam aśnute || [prāpnoty: prāpṇoty ed. (misprint)]'
      - ab@verse[n=9]: ātmānaṃ nirmalīkr̥tya devān iṣṭvā grahāṃs tatʰā | vidvadbʰyo
          dakṣiṇā deyā dvijān annena tarpayet ||
    - section[n=43,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kr̥ttikābʰiḥ śirīṣasya aśvattʰasya vaṭasya ca | snāpayet pattrabʰaṅgena
          ya iccʰed rājapūjitam ||
      - ab@verse[n=2]: rohiṇyāṃ snāpayed vaiśyaṃ sarvabījair alaṃkr̥tam | akṣatān
          antaraṃ kr̥tvā tatʰā saubʰāgyam arhati ||
      - ab@verse[n=3]: yadā mr̥gaśiro yujyet tadā snānaṃ vidʰīyate | muktāmaṇisuvarṇena
          dʰanārtʰī tena snāpayet ||
      - ab@verse[n=4]: śrīveṣṭakasarjarasatagarośīrapattrakaiḥ | ārdrāyāṃ vaṇijaḥ
          snātāḥ sulābʰāṃs tu labʰanti te ||
      - ab@verse[n=5]: punarvasubʰyāṃ gomārgād āhared agramr̥ttikām | gopīṭʰe snāpayed
          go 'rtʰī kṣipraṃ gomān bʰaviṣyati ||
      - ab@verse[n=6]: raktaśālisahasreṇa tāvadbʰir gaurasarṣapaiḥ | sahasravīryānantyā
          ca madayantīpriyaṅgubʰiḥ | trīn puṣyān brāhmaṇaḥ snātaḥ pārtʰivaṃ labʰate
          yaśaḥ ||
      - ab@verse[n=7]: aśleṣāsv āhārayed ubʰayataḥ kūlamr̥ttikāḥ | [aśv]ārohaṃ snāpayet
          tena kṣipravāhī bʰaviṣyati ||
      - ab@verse[n=8]: magʰābʰis tu tilaiḥ snāyād utpalaiḥ kamalais tatʰā | tasmiṃs
          tu māse sā kanyā kṣipraṃ ca labʰate patim ||
      - ab@verse[n=9]: atʰa pūrvayoḥ pʰalgunyoḥ śatapuṣpā priyaṅgavaḥ | madʰv eva
          ca tr̥tīyaṃ syāt saubʰāgyaṃ bʰogavardʰanam ||
      - ab@verse[n=10]: atʰottarayoḥ pʰalgunyor akṣatā gaurasarṣapāḥ | etat snānaṃ
          prayuñjīta prajāstʰāpanam uttamam ||
    - section[n=44,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: hastena sarvakārūṇāṃ caurāṇāṃ cāpi nityaśaḥ | nadīgiritaṭākeṣu
          mr̥ttikāsnānam uttamam ||
      - ab@verse[n=2]: citrāyāṃ citramālyais tu sarvagandʰair alaṃkr̥tam | yoṣārtʰī
          snāpayet tena kṣipraṃ sa labʰate priyām ||
      - ab@verse[n=3]: svātinā tu gandʰaiḥ snāyād utpalaiḥ kumudais tatʰā | tasmiṃs
          tu māse sā kanyā kṣipraṃ nirvyūhyate tataḥ ||
      - ab@verse[n=4]: kʰaḍgasya ca viṣāṇena gajasya r̥ṣabʰasya vā | viśākʰābʰyām
          abʰiṣikto [rājā] pr̥tʰivīm abʰiśāsayet ||
      - ab@verse[n=5]: anūrādʰāsv āhārayed valmīkaśatamr̥ttikāḥ | karṣaṇaṃ snāpayet
          tena dʰanadʰānyena vardʰate ||
      - ab@verse[n=6]: jyeṣṭʰāyāṃ jyaiṣṭʰyakāmaṃ tu abʰiṣiñcet purohitam | rasaiś
          ca miśradʰānyaiś cābʰiṣiktaḥ prāśayed rasān ||
      - ab@verse[n=7]: mūlena sarvatobʰadram upaviṣṭā varavarṇinī | śamīpattrasahasreṇa
          snānāt putraṃ prasūyate ||
      - ab@verse[n=8]: atʰa pūrvāsv aṣāḍʰāsu yā snāyād ahate paṭe | jātarūpeṇa kalyāṇī
          bʰogaṃ bʰuṅkte patipriyā ||
      - ab@verse[n=9]: atʰottarāsv aṣāḍʰāsu yaḥ snāyāc ced upoṣitaḥ | mahāhrada uśīreṇa
          dāsīdāsena vardʰate ||
      - ab@verse[n=10]: vacayotpalakuṣṭʰaiś ca brāhmī siddʰārtʰakais tatʰā | abʰijid
          brāhmaṇaḥ snātaḥ pārtʰivaṃ labʰate yaśaḥ ||
    - section[n=45,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: śravaṇena sravantīnāṃ yaḥ snāyāt saṃgameṣu ca | sa saṃgaccʰati
          svarṇena hiraṇyena dʰanena vā ||
      - ab@verse[n=2]: śraviṣṭʰābʰir dʰanakāmaṃ [tu] snāpayed yatra candanaiḥ | etat
          snānaṃ prayuñjāno dʰanadʰānyena vardʰate ||
      - ab@verse[n=3]: śatabʰiṣag bʰiṣakkāmo 'bʰiṣiñcec cʰāntikarmasu | so 'bʰiṣikto
          hatapāpmā sarvarogaiḥ pramucyate ||
      - ab@verse[n=4]: '[atʰa] pūrvayoḥ proṣṭʰapadayo rocanayāñjanena ca | snātā gajaviṣāṇena
          rājānaṃ janayet sutam ||'
      - ab@verse[n=5]: atʰottara[yoḥ] proṣṭʰapadayoḥ prasannāpadmakaṃ madʰu | gandʰarvaṃ
          snāpayet tena rājavāhī bʰaviṣyati ||
      - ab@verse[n=6]: kʰaḍgasya ca viṣāṇena jalena madʰusarpiṣā | revatyāṃ kṣatriyaḥ
          snāto [rājā] pr̥tʰivīm abʰiśāsate ||
      - ab@verse[n=7]: aśvinyāṃ svastikaṃ mālyaṃ madayantīpriyaṅgubʰiḥ | rūpājīvāyās
          tat snānaṃ saubʰāgyaṃ bʰogavardʰanam ||
      - ab@verse[n=8]: bʰaraṇībʰir bʰadramustais tv elāsiddʰartʰakais tatʰā | snātā
          patikulaṃ gaccʰed asapatnam akaṇṭakam ||
    - section[n=46]:
      - ab@verse[n=1]: sarvajñaḥ sarvaga śaṃsa nārada prajñānam anyasmād anūnaprajñāt
          svargasya lokasya dehādyairyāt patʰibʰir upapanno manuṣyaḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: upoṣitaḥ śuciśīlaḥ puṇyagandʰo
          yadā bʰavet | prāg astaṃgamanabʰojanād yad enaṃ nityam atandritaḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: samayācārapūrvābʰiḥ karmasiddʰiḥ
          praśasyate | [taṃ] kāmadugʰaṃ svargakāmaḥ paretya pratipadyate ||
    - section[n=47,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kr̥ttikābʰiḥ pāyasaṃ sarpiṣā saha bʰojayet | [taṃ] kāmadugʰaṃ
          svargakāmaḥ paretya pratipadyate ||
    - section[n=48]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: rohiṇyām akṣatair māṣaiḥ
          sarpirmiśraṃ sahaudanam | dugdʰānnapāna{ṃ} maṃheta so 'kṣato yamasādane
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: mr̥gaśirasi maṃheta ajāṃ
          dʰenuṃ payasvinīm | sāsmai sarvān kāmān dugdʰ[v]ā eti pūrvā payasvinī ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: ārdrāyāṃ kr̥saraṃ dadyāt
          tailamiśram upoṣitaḥ | punarvasubʰyāṃ maṃheta madʰvapūpāṃs tv anuttamān
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: rukmaṃ puṣyeṇa maṃheta
          so 'kṣato yamasādane | aśleṣā rajataṃ dadyāt saurabʰeyeṇa preṣitaḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: sarpān nirhanti pretasya
          paripantʰi sukʰād bʰayāt | magʰābʰis tu tilān dadyān madʰumiśrān smaran
          pitr̥̄n ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: kāmais tatropatiṣṭʰanti
          amī ye somayājinaḥ | [pʰāṇiteneṣṭakā miśrā dadyāt pūrvayoḥ pʰalgunyor madʰunottarayoḥ
          ||]
      - ab@verse[n=7]: pūrvottarayoḥ pʰalgunyor duhate madʰupʰāṇite ||
    - section[n=49]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: br̥haddʰastiratʰaṃ yuktaṃ
          hastena tu dadan naraḥ | savituḥ stʰānam āpnoti divyāṃ kāmajavāṃ sabʰām
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: citrāyāṃ vr̥ṣalīṃ dadyāt
          sarvapuṣpair alaṃkr̥tām | gandʰaiḥ śuśrūṣamāṇas tu dʰruve stʰāne [sugandʰiḥ]
          prapadyate ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: svātāv ekadʰanaṃ dadyād
          yadyad asya priyaṃ gr̥he | asajjamāno gaccʰeta aśarīro yatʰā manaḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: dʰenuṃ tu rūpasaṃpannām
          anaḍvāhau tu vā vahau | viśākʰābʰyāṃ madʰumantʰaṃ prāpayet stʰānam uttamam
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: anūrādʰāsu prāvaraṇam
          annaṃ tu śuci jyeṣṭʰāyāṃ ca | dadyāc cānnaṃ brāhmaṇebʰyo bʰakṣair uccāvacaiḥ
          saha ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: surā{ṃ} mūlena maṃhetābrāhmaṇībʰya
          upoṣitaḥ | mātus tenānr̥ṇo bʰavati saṃkarāc ca vimucyate ||
      - ab@verse[n=7]: udamantʰam aṣāḍʰāsu pūrvāsu madʰunottaram ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: abʰijid duhitaraṃ dadyān
          madʰuparkapurogamām | uttame brahmaṇaḥ stʰāne sarvakāmaiḥ pramodate ||
    - section[n=50]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: kambalaṃ śravaṇe dadyād
          vastrāntaram upoṣitaḥ | śraviṣṭʰābʰir vastrayugaṃ gandʰān śatabʰiṣag bʰavet
          ||
      - ab@verse[n=2]: ajaṃ saṃpacyodanaṃ dadyāt pūrvayoḥ proṣṭʰapadayor aurabʰreṇa
          sahottarayoḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: dʰenuṃ ca rūpasaṃpannāṃ
          gaur gr̥ṣṭiḥ pūrṇadohanīm | revatyāṃ trivatsāṃ dadyāc cʰubʰakāṃsyopadohinīm
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: vastreṇānaḍvāhau [saṃ]baddʰvā
          dadyād aśvayujo<r> naraḥ | daśa varṣasahasrāṇi lomnilomni mahīyate ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: aṣṭau varṣasahasrāṇi ajadʰenvā
          payo 'śnute | daśa varṣasahasrāṇi godʰenvā payo 'śnute ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: anaḍvāhaṃ tu yo dadyāt
          suhr̥daṃ sādʰuvāhinam | vīraṃ prajānāṃ bʰartāraṃ prāpnoti daśadʰenudam ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: '[yadā vatsasya pādau
          dvau śiras cāpi pradr̥śyate | tadā gauḥ pr̥tʰivī jñeyā yāvad garbʰaṃ na
          muñcati ||]'
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰaraṇībʰiḥ kr̥ṣṇatilāṃ
          dadyāt [tila]dʰenuṃ payasvinīm | tayā durgāṇi tarati kṣuradʰārāṃś ca parvatān
          ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: nakṣatrāṇāṃ yatʰā somo
          jyotiṣām iva bʰāskaraḥ | bʰāti divyaṃ divaṃ jyotiḥ pāvakaḥ śucir uttamaḥ
          ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: evam uktāṃ nakṣatradakṣiṇāṃ
          yo dadātīha jīvaloke | {a}pahatya tamaḥ sarvaṃ brahmaloke mahīyate | yatʰā
          yaṣṭus tatʰādʰyetur eṣā brāhmī pratiśrutir eṣā brāhmī pratiśrutir iti ||
  - pariśiṣṭa[n=1b]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: '[kr̥ttikārohiṇīmadʰye paippalādā
          mantrāḥ]'
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ yad rājānaṃ śakadʰūmaṃ
          nakṣatrāṇy akr̥ṇvata | bʰadrāham asmai prāyaccʰan tato rāṣṭram ajāyata ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰadrāham astu naḥ sāyaṃ
          bʰadrāhaṃ prātar astu naḥ | bʰadrāham asmabʰyaṃ tvaṃ śakadʰūma sadā kr̥ṇu
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: yo no bʰadrāham akaraḥ
          sāyaṃ prātar atʰo divā | tasmai te nakṣatrarāja śakadʰūma sadā namaḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: yad āhuḥ śakadʰūma{ṃ}
          mahānakṣatrāṇāṃ pratʰamajaṃ jyotir agre | tan naḥ śatīm abʰikr̥ṇotu rayiṃ
          ca naḥ sarvavīraṃ niyaccʰāt ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: yo 'smin yakṣma{ḥ} puruṣe
          praviṣṭa iṣitaṃ daivyaṃ sahaḥ | agniṣ ṭaṃ gʰr̥tabodʰano 'paskanda no vidūram
          asmat so 'nyena samr̥ccʰāt || tasmai prasuvāmasi ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: yas tvā mātur uta vā pituḥ
          parijāyamānam abʰisaṃbabʰūva | na tvad yam adʰināsayāma so 'nyasmai sayātaiḥ
          praviṣṭaḥ ||
      - ab@verse[n=7]: aliklavā gr̥dʰrāḥ kaṅkāḥ suparṇāḥ śvāpadāḥ patatriṇo vayāṃsi
          śakunayo 'muṣyāmusyāyaṇasyāmuṣyāḥ putrasyādahane carantu ||
      - ab@verse[n=col]: kr̥ttikārohiṇīmadʰye paippalādā mantrāḥ ||
  - pariśiṣṭa[n=2]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: rāṣṭrasaṃvargaḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om | brahmaṇe brahmavedāya rudrāya parameṣṭʰine | namaskr̥tya
          pravakṣyāmi śeṣam ātʰarvaṇaṃ vidʰim ||
      - ab@verse[n=2]: daivaṃ prabʰavate śreṣṭʰaṃ hetumātraṃ tu pauruṣam | daivena
          tu suguptena śakto jetuṃ vasuṃdʰarām ||
      - ab@verse[n=3]: daivāt puruṣakārāc ca daivam eva viśiṣyate | tasmād daivaṃ
          viśeṣeṇa pūjayet tu mahīpatiḥ ||
      - ab@verse[n=4]: daivakarmavidau tasmāt sāṃvatsarapurohitau | gr̥hṇīyāt satataṃ
          rājā dānasaṃmānarañjanaiḥ ||
      - ab@verse[n=5]: apitā tu yatʰā bālas tatʰāsāṃvatsaro nr̥paḥ | amātr̥ko yatʰā
          bālas tatʰātʰarvavivarjitaḥ || arimadʰye yatʰaikākī tatʰā vaidyavivarjitaḥ
          ||
      - ab@verse[n=6]: dʰarmeṇa pr̥tʰivīṃ kr̥tsnāṃ vijayiṣyan mahīpatiḥ | vidyālakṣaṇasaṃpannaṃ
          bʰārgavaṃ varayed gurum ||
      - ab@verse[n=7]: caturvidʰasya karmaṇo vedatattvena niścayam | prajāpatir atʰaiko
          hi na vedatrayam īkṣate ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: atʰarvabʰinnaṃ yac cʰāntaṃ tac cʰāntaṃ netarais tribʰiḥ | vijñānaṃ
          triṣu lokeṣu jāyate brahmavedataḥ ||
      - ab@verse[n=2]: atʰarvā sr̥jate gʰoram adbʰutaṃ śamayet tatʰā | atʰarvā rakṣate
          yajñaṃ yajñasya patir aṅgirāḥ ||
      - ab@verse[n=3]: divyāntarikṣabʰaumānām utpātānām anekadʰā | śamayitā brahmavedajñas
          tasmād rakṣitā bʰr̥guḥ ||
      - ab@verse[n=4]: brahmā śamayen nādʰvaryur na cʰandogo na bahvr̥caḥ | rakṣāṃsi
          rakṣati brahmā brahmā tasmād atʰarvavit ||
      - ab@verse[n=5]: senāyā rakṣaṇe tasmāt svarāṣṭraparivr̥ddʰaye | śāntyartʰaṃ
          ca mahīpālo vr̥ṇuyād bʰārgavaṃ gurum ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: gurave pārtʰivo dadyāt kotiṃ varaṇadakṣiṇām | ardʰamardʰaṃ
          mahībʰāgaṃ tr̥tīyaṃ tu tribʰāgataḥ ||
      - ab@verse[n=2]: evaṃ bʰūmipramāṇena koṭibʰāgaṃ vinirdiśet | yena vā parituṣyeta
          gurus tat pārtʰivaś caret ||
      - ab@verse[n=3]: gʰnanti daivopasargāś ca na ca devo 'bʰivarṣati | vīrās tatra
          na sūyante yad rāṣṭram apurohitam ||
      - ab@verse[n=4]: na haviḥ pratigr̥hṇanti devatāḥ pitaro dvijāḥ | tasya bʰūmipater
          yasya gr̥he nātʰarvavid guruḥ ||
      - ab@verse[n=5]: samāhitāṅgapratyaṅgaṃ vidyācāraguṇānvitam | paippalādaṃ guruṃ
          kuryāc cʰrīrāṣṭrārogyavardʰanam ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tatʰā śaunakinaṃ vāpi vedamantravipaścitam | rāṣṭrasya vr̥ddʰikartāraṃ
          dʰanadʰānyādibʰiḥ sadā ||
      - ab@verse[n=2]: ātʰarvaṇād r̥te nānyo niyojyo 'tʰarvavid guruḥ | nr̥peṇa jayakāmena
          nirmito 'gnir ivādʰvare ||
      - ab@verse[n=3]: bahvr̥co hanti vai rāṣṭram adʰvaryur nāśayet sutān | cʰandogo
          dʰananāśāya tasmād ātʰarvaṇo guruḥ ||
      - ab@verse[n=4]: ajñānād vā pramādād vā yasya syād bahvr̥co guruḥ | deśarāṣṭrapurāmātyanāśas
          tasya na saṃśayaḥ ||
      - ab@verse[n=5]: yadi vādʰvaryavaṃ rājā niyunakti purohitam | śastreṇa vadʰyate
          kṣipraṃ parikṣīṇārtʰavāhanaḥ ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yatʰaiva paṅgur adʰvānam apakṣī cāṇḍajo nabʰaḥ | evaṃ cʰandogaguruṇā
          rājā vr̥ddʰiṃ na gaccʰati ||
      - ab@verse[n=2]: purodʰā jalado yasya maudo vā syāt kadā cana | abdād daśabʰyo
          māsebʰyo rāṣṭrabʰraṃśaṃ sa gaccʰati ||
      - ab@verse[n=3]: palālakam idaṃ sarvam r̥gyajuḥsāmasaṃstʰitam | sāraṃ sāraparaṃ
          dʰānyam atʰarvāṅgiraso viduḥ ||
      - ab@verse[n=4]: trayo lokās trayo devās trayo vedās trayo 'gnayaḥ | ardʰamātre
          layaṃ yānti vedaś cātʰarvaṇaḥ smr̥taḥ ||
      - ab@verse[n=5]: na titʰir na ca nakṣatraṃ na graho na ca candramāḥ | atʰarvamantrasaṃprāptyā
          sarvasiddʰir bʰaviṣyati ||
    - section[n=6]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: guruṇā paippalādena vedamantravipaścitā
          | vardʰate dʰanadʰānyena rāṣṭram evaṃ na saṃśayaḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: stabdʰaṃ nr̥śaṃsaṃ pramattaṃ
          śraddʰāhīnam aśāstragam | bʰūmikāmo na yāceta dātāram api pārtʰivam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: sahasrāṇāṃ śataṃ japtvā
          gāyatryāyājyayājakaḥ | pūyate bʰrūṇahāpy evaṃ cāṇḍālānnāda eva ca ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: sarvadravyaparityāgāc
          cʰuddʰir anyair udāhr̥tā | anyaiś caturṇāṃ vedānām adʰītyādyottamā r̥caḥ
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: yajanād abʰicārād vā kva
          cid vā mantrakarmaṇi | pūtān eva dvijān prāhur agnikāñcanavarcasa iti ||
      - ab@verse[n=col]: iti rāṣṭrasaṃvargaḥ samāptaḥ ||
  - pariśiṣṭa[n=3]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: rājapratʰamābʰiṣekaḥ
    - section[n=1]:
      - ab@verse[n=1]: om atʰa rājapratʰamābʰiṣeke prakr̥tidravyāṇi parīkṣeta ||
      - ab@verse[n=2]: tad yatʰā ||
      - ab@verse[n=3]: ratʰasiṃhāsanāsicʰattracāmaradʰvajagajavājivastrālaṃkārasāṃvatsaracikitsakapurohitādīny
      - ab@verse[n=4]: upayuktāni nopayojayet ||
      - ab@verse[n=5]: śmaśānānaladevatāni nihitāni dravyāṇīty
      - ab@verse[n=6]: ācāryapurohitavajramukʰata ity āha durmatiḥ sa bʰāradvājo
      - ab@verse[n=7]: na hy agner ivopayuktasyopayogo vidyata iti parāśaro
      - ab@verse[n=8]: brahmā brahmāṇḍāgnir ivāprameyo
      - ab@verse[n=9]: nānyakulopayukto
      - ab@verse[n=10]: yasyānyakulopayuktaḥ purodʰāḥ śāntikapauṣṭikaprāyaścittīyābʰicārikanaimittikordʰvadehikāny
          atʰarvavihitāni karmāṇi kuryāt sa tasya pratyaṅgiro bʰūtvā hastyaśvaratʰapadātikaṃ
          prakr̥timukʰebʰyo ...
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: variṣyan na punaḥ kuryād
          anyaṃ rājā purohitam | nirmālyam iva taṃ rājā nānyo bʰūyaḥ samācaret ||
      - ab@verse[n=12]: svajasraṃ hy agnau hetur bʰagavato vyādʰitapatitonmattābʰiśastaprahīṇapradʰvastasaṃprasāraṇam
          r̥tvik ||
      - ab@verse[n=13]: tasmāt kulīnaṃ śrotriyaṃ bʰr̥gvaṅgirovidaṃ vinayākr̥tiśaucācārayuktam
          alolupaṃ vrataniyamacāritravr̥ttalakṣanaguṇasaṃpannaṃ saṃdʰivigrahacintakaṃ
          māhendrajālaprabʰr̥tikarmādiṣv abʰividakaṃ jitastʰānāsanaṃ himātapavarṣasahaṃ
          hrīdʰr̥tikam ārjavaṃ śamadamadayādānaśaktisaṃpannaṃ br̥haspatyuśanasoḥ stʰānākr̥tipramāṇaṃ
          varṇāśrutavapuṣā cānumeyaṃ tejasvinaṃ gambʰīraṃ sattvayuktaṃ guruṃ vr̥ṇīyād
          bʰūpatir iti ||
      - ab@verse[n=14]: madʰuparkādyena vidʰinā yatʰārtʰaṃ saṃpādya dakṣiṇāṃ dadyāt
      - ab@verse[n=15]: koṭimadʰyāt tr̥tīyaṃ bʰāgam
      - ab@verse[n=16]: yatʰābʰūmipramāṇena vā
      - ab@verse[n=17]: hastyaśvaṃ narayānaṃ divyam ābʰaraṇam ātapatraṃ hiraṇyaṃ kṣitigodʰanadʰānyaratnādikaṃ
          ca gurave dadyād
      - ab@verse[n=18]: yena vā parituṣyeta ||
      - ab@verse[n=19]: abʰiṣekaḥ saṃhitāvidʰau vyākʰyātaḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: hastyaśvaṃ gurave dadyān narayānaṃ tatʰaiva ca | divyam ābʰaraṇaṃ
          caiva ātapatrādim eva ca ||
      - ab@verse[n=2]: uccʰiṣṭārtʰaṃ na gr̥hṇīyān maṅgalārtʰaṃ mahīpatiḥ | mantrauṣadʰyo
          na sidʰyanti rājā tatra vinaśyati ||
      - ab@verse[n=3]: nātidīrgʰaṃ nātihrasvaṃ nātistʰūlaṃ kr̥śaṃ tatʰā | na ca hīnātiriktāṅgaṃ
          kva cit kuryāt purohitam ||
      - ab@verse[n=4]: hīnādʰikāṅgaṃ patitaṃ vivarṇaṃ stenaṃ jaḍaṃ klībam aśaktiyuktam
          | bʰinnasvaraṃ kāṇaṃ virūpanetraṃ dveṣyaṃ ca rājā guruṃ naiva kuryāt ||
      - ab@verse[n=5]: hīnādʰikāṅge purarāṣṭrahāniḥ kāṇe jaḍe vāhanakośanāśaḥ | stene
          tv aśakte ca samastadoṣāḥ klībe vivarṇe nr̥patir vinaśyet ||
    - section[n=3]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰinnasvare jāyate gātrabʰedo
          dveṣye gurau vipratipattim āhuḥ | vivarṇanetre patite tu putrān adʰvaryuṇā
          ca nihanti pautrān ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥ṣṇe kośakṣayaṃ vidyād
          rakte vāhanasaṃkṣayaḥ | piṅgalaḥ pārtʰivaṃ hanyād rāṣṭraṃ hanyāt tu kekaraḥ
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: bahvr̥caṃ hi niyuñjyād
          yaḥ paurohitye tu pārtʰivaḥ | sa tārapaṅke hastīva saha tenaiva majjati
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: adʰvaryuṃ hi niyuñjyād
          yaḥ paurohitye tu pārtʰivaḥ | uttitīrṣur ivāśmānam ādatte svavadʰāya saḥ
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: vadʰabandʰaparikleśaṃ
          kośavāhanasaṃkṣayaḥ | karoty etānvaye 'vastʰās tapoyukto 'pi sāmagaḥ ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: anvayākr̥tisaṃpannaṃ tasmād
          bʰr̥gvaṅgirovidam | gotrāṅgirasavāsiṣṭʰaṃ rājā kuryāt purohitam ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: makʰeṣu rāṣṭreṣu pureṣu
          caiva senāsu rājñāṃ svaniveśaneṣu | ya utpātās trividʰā gʰorarūpās tān sarvān
          śamayed brahmavedavit ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: tasmād guruṃ vedarahasyayuktaṃ
          caturvidʰe karmaṇi cāpramattam | śāntaṃ ca dāntaṃ ca jitendriyaṃ ca kuryān
          narendraḥ priyadarśanaṃ ca || priyadarśanaṃ ceti ||
      - ab@verse[n=col]: iti rājapratʰamābʰiṣekaḥ samāptaḥ ||
  - pariśiṣṭa[n=4]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: purohitakarmāṇi
    - section[n=1]:
      - ab@verse[n=1]: om atʰa purohitakarmāṇi || rājñaḥ prātar uttʰitasya kr̥tasvastyayanasya
      - ab@verse[n=2]: atʰa purohitaḥ snātānuliptaḥ śuciḥ śuklavāsāḥ soṣṇīṣaḥ savitā
          prasavānām iti vyākʰyātam ||
      - ab@verse[n=3]: imam indra vardʰayety uktam ||
      - ab@verse[n=4]: pari dʰatteti dvābʰyāṃ rājño vastram abʰimantrya prayaccʰet
          ||
      - ab@verse[n=5]: yad ābadʰnann ity alaṃkārān ||
      - ab@verse[n=6]: siṃhe vyāgʰra iti siṃhāsanam ||
      - ab@verse[n=7]: yas te gandʰa iti gandʰān ||
      - ab@verse[n=8]: ehi jīvaṃ trāyamāṇam ity akṣiṇī aṅkte ||
      - ab@verse[n=9]: vātaraṃhā ity aśvam ||
      - ab@verse[n=10]: hastivarcasam iti hastinam ||
      - ab@verse[n=11]: yat te mātā yat te piteti narayānam ||
      - ab@verse[n=12]: kʰaḍgaṃ cābʰimantrayāmīti kʰaḍgam ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: kʰaḍgaṃ cābʰimantrayāmi
          yaḥ śatrūn mardayiṣyati | marditāḥ śatravo 'nena vaśam āyāntu te sadeti
          ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: paryaṅkam āsanaṃ kʰaḍgaṃ
          dʰvajaṃ cʰattraṃ sacāmaram | ratʰam aśvagajaṃ śreṣṭʰaṃ dʰanur varma śareṣudʰim
          ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: āñjanaṃ gandʰamālyāni
          vastrāṇy ābʰaraṇāni ca | sarvān śāntyudakenaitān abʰyukṣyec cābʰimantrayet
          ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: dūrvādīn mūrdʰni nikṣipya
          svastyayanair abʰimantrayet | abʰayaṃ dyāvāpr̥tʰivīty abʰimantrito brāhmaṇān
          praṇipatya prāk ||
      - ab@verse[n=17]: yuṣmatprasādāc cʰāntim adʰigaccʰāmīti ||
      - ab@verse[n=18]: tatʰāstv ity ukto nirgaccʰed iti ||
      - ab@verse[n=19]: evaṃkr̥tyasvastyayano yad evāvalokayati ta sidʰyati ||
      - ab@verse[n=20]: tad api ślokāḥ ||
      - ab@verse[n=21,lg=san-Latn-x-vedic-metric-unacc-tld]: asuraiḥ pīḍyamānas tu
          purā śakro jagatprabʰuḥ | kārayām āsa vidʰivat purodʰastve br̥haspatim ||
      - ab@verse[n=22,lg=san-Latn-x-vedic-metric-unacc-tld]: sa vr̥to bʰayabʰītena
          śamanārtʰaṃ bubʰūṣatā | maṅgalāni sasarjāṣṭāv abʰayārtʰaṃ śatakratoḥ ||
      - ab@verse[n=23,lg=san-Latn-x-vedic-metric-unacc-tld]: proktāni maṅgalāny aṣṭau
          brāhmaṇo gaur hutāśanaḥ | bʰūmiḥ siddʰārtʰakāḥ sarpiḥ śamī vrīhiyavau tatʰā
          ||
      - ab@verse[n=24,lg=san-Latn-x-vedic-metric-unacc-tld]: etāni satataṃ puṇyāni
          saṃpaśyann arcayann api | na prāpnoty āpadaṃ rājā śriyaṃ prāpnoty anuttamām
          ||
    - section[n=2]:
      - ab@verse[n=1]: atʰa rājakarmāṇi
      - ab@verse[n=2]: viśvāvasau muhūrte snāto abʰiṣekamantrair abʰimantritaḥ ||
      - ab@verse[n=3]: anulepanair anuliptaḥ ||
      - ab@verse[n=4]: pūrvoktena vidʰinā vastrālaṃkārādibʰiḥ
      - ab@verse[n=5]: suvarṇaniṣkaṃ kr̥ṣṇalaṃ vā vāmahastena saṃgr̥hya ||
      - ab@verse[n=6]: yad duḥkr̥taṃ yac cʰabalaṃ sarvaṃ pāpmānaṃ dahatv ity
      - ab@verse[n=7]: anena mantreṇa suvarṇaṃ śarīre nigʰr̥ṣya dakṣiṇena hastena
          viprāya dadyād
      - ab@verse[n=8]: dʰenuṃ cārogām
      - ab@verse[n=9]: aparimitaguṇān tilān sauvarṇamaye tāmramaye vā pātre stʰāpayitvā
          yad ajñānād ity abʰimantrya viprāya dadyāt ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: yad ajñānāt tatʰā jñānād
          yan mayā śabalaṃ kr̥tam | tat sarvaṃ tiladānena dahyatām iti hi prabʰo ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰūmiś ca sasyasaṃpannā
          brāhmaṇe vedapārage | yatʰāśakti pradeyā hi br̥haspativaco yatʰā ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: sa bʰuktvā vividʰān bʰogān
          saptasāgaramekʰalām | pr̥tʰivīṃ prāpya modeta candravat pr̥tʰivīpatiḥ ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: annaṃ tu vividʰaṃ nityaṃ
          pradadyāt dvijātaye | tūryagʰoṣeṇa saṃyuktaḥ kr̥tasvastyayanas tatʰā ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: gr̥hadevāṃs tu saṃpūjya
          kāryaś cāpy utsavo gr̥he | cʰattrādīni ca yānāni pūjayed vidʰivat svayam
          ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: '[puṣpaiś ca vividʰaiḥ
          śubʰraiḥ pʰalaiś cāpy arcayed budʰaḥ] tasmāt sarvāṇi satataṃ dānāni tu mahīpatiḥ
          | dattvā śraddʰānvito viprair vr̥to bʰuñjīta vāgyataḥ ||'
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: atʰa piṣṭamayīṃ rātriṃ caturbʰir dīpakaiḥ saha | arcitāṃ gandʰamālyena
          stʰāpayet tasya cāgrataḥ ||
      - ab@verse[n=2]: namas kr̥tvā tato rātrim arcayitvā yatʰāvidʰi | dʰūpena cānnapānena
          stotreṇa ca samarcayet ||
      - ab@verse[n=3]: pāhi māṃ satataṃ devi sarāṣṭraṃ sasuhr̥jjanam | uṣase naḥ prayaccʰasva
          śāntiṃ ca kr̥ṇu me sadā | ye tvāṃ prapadyante devi na teṣāṃ vidyate bʰayam
          ||
      - ab@verse[n=4]: rātriṃ prapadye jananīṃ sarvabʰūtaniveśanīm | bʰadrāṃ bʰagavatīṃ
          kr̥ṣṇāṃ viśvasya jagato niśām ||
      - ab@verse[n=5]: saṃveśanīṃ saṃyamanīṃ grahanakṣatramālinīm | prapanno 'haṃ
          śivāṃ rātriṃ bʰadre pāram aśīmahi ||
      - ab@verse[n=6]: yāṃ sadā sarvabʰūtāni stʰāvarāṇi carāṇi ca | sāyaṃ prātar namasyanti
          sā māṃ rātry abʰirakṣatv iti ||
    - section[n=4]:
      - ab@verse[n=1]: ā rātri pārtʰivam iṣirā yoṣā trāyamāna ity rātryāṇi ||
      - ab@verse[n=2]: mamobʰā mahyam āpa iti sūktābʰyām anvālabʰya japet ||
      - ab@verse[n=3]: yo na{ḥ} sva iti pañcabʰiḥ sarṣapāñ juhuyāt ||
      - ab@verse[n=4]: yo 'smin yas tvā mātur iti dīpena nr̥pasyopari triṣ parihr̥tya
          praiṣakr̥te prayaccʰet ||
      - ab@verse[n=5]: abʰayam ity r̥cā catasraḥ śarkarāḥ pradakṣiṇaṃ pratidiśaṃ kṣipet
          ||
      - ab@verse[n=6]: ehy aśmānam ā tiṣṭʰeti pañcamīm adʰiṣṭʰāpayet ||
      - ab@verse[n=7]: na taṃ yakṣmā aitu deva iti guggulukuṣṭʰadūpaṃ dadyāt ||
      - ab@verse[n=8]: yas te gandʰas tryāyuṣam iti bʰūtiṃ prayaccʰet ||
      - ab@verse[n=9]: dūṣyā dūṣir asīti pratisaram ābadʰya
      - ab@verse[n=10]: agnir mā pātu vasubʰiḥ purastād iti śarkarān pradakṣiṇaṃ pratidiśaṃ
          kṣipet ||
      - ab@verse[n=11]: bahir niḥsr̥tyottareṇa gatvā bāhyenopaniṣkramya suhr̥de kuryāc
          cʰraddadʰate kuryāt ||
      - ab@verse[n=12]: naiśam abʰayaṃ karma mausalīputraḥ paiṭʰīnasiḥ ||
    - section[n=5]:
      - ab@verse[n=1]: atʰāto rātrisūktānāṃ vidʰim anukramiṣyāmaḥ ||
      - ab@verse[n=2]: śuciḥ śuklavāsāḥ purohitaḥ ||
      - ab@verse[n=3]: pārtʰivasya paścimāṃ saṃdʰyām upāsya darbʰaiḥ pavitrapāṇī rājānam
          abʰigamya
      - ab@verse[n=4]: piṣṭamayīṃ rātriṃ kr̥tvā ||
      - ab@verse[n=5]: annapānadʰūpadīpair arcayitvā mālyaiś ca ||
      - ab@verse[n=6]: prajvalitaiś caturbʰir dīpakair arcayitvā ||
      - ab@verse[n=7]: ā rātri pārtʰivam iṣirā yoṣeti sūktadvayena rātrim upastʰāya
          ||
      - ab@verse[n=8]: trāyamāṇe viśvajite ahne ca tveti rājānaṃ pradakṣiṇaṃ triḥ
          kr̥tvā
      - ab@verse[n=9]: rājaveśmani dvāre visarjayitvā ||
      - ab@verse[n=10]: na taṃ yakṣmā aitu deva iti guggulukuṣṭʰadʰūpaṃ dadyād
      - ab@verse[n=11]: yas te gandʰa iti bʰūtim abʰimantrya
      - ab@verse[n=12]: tryāyuṣam iti rājñe rakṣāṃ kr̥tvā ||
      - ab@verse[n=13]: asapatnam iti śarkarām abʰimantryāṅguṣṭʰāt pradakṣiṇaṃ pratidiśaṃ
          kṣipet ||
      - ab@verse[n=14]: śāntā dyaur iti japitvā rājānaṃ vāsagr̥haṃ nayet ||
      - ab@verse[n=15]: bʰūtinā rakṣāṃ kr̥tvā niṣkramya
      - ab@verse[n=16]: evamevam aharahaḥ kuryāt ||
    - section[n=6]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: yasya rājño janapade atʰarvā
          śāntipāragaḥ | nivasaty api tad rāṣṭraṃ vardʰate nirupadravam ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yasya rājño janapade sa
          nāsti vividʰair bʰayaiḥ | pīḍyate tasya tad rāṣṭraṃ paṅke gaur iva majjati
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: tasmād rājā viśeṣeṇa atʰarvāṇaṃ
          jitendriyam | dānasaṃmānasatkārair nityaṃ samabʰipūjayet ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: nityaṃ ca kārayec cʰāntiṃ
          grahar̥kṣāṇi pūjayet | bʰūmidohān prakurvīta devatāyataneṣu ca ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: catuspatʰeṣu goṣṭʰeṣu
          tīrtʰeṣv apsu ca kārayet | gotarpaṇaṃ ca vidʰivat sarvadoṣavināśanam ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: ya evaṃ kārayed rājā sarvakālaṃ
          jitendriyaḥ | anantaṃ sukʰam āpanoti kr̥tsnāṃ bʰuṅkte vasuṃdʰarām ||
      - ab@verse[n=col]: iti purohitakarmāṇi samāptāni ||
  - pariśiṣṭa[n=5]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: puṣyābʰiṣekaḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om atʰa puṣyābʰiṣekasya vidʰiṃ vakṣyāmi sāṃpadam | dʰarmārtʰakāmasaṃyuktaṃ
          rājā kuryāt purohitam ||
      - ab@verse[n=2]: sauvarṇarājatais tāmraiḥ kalaśaiḥ pārtʰivair api | sahasreṇa
          śatenātʰa toyagrahaṇam iṣyate ||
      - ab@verse[n=3]: caturṇāṃ sāgarāṇāṃ tu nadīnāṃ ca śatasya tu | abʰiṣekāya rājñas
          tu toyam āhr̥tya yatnataḥ ||
      - ab@verse[n=4]: ekadvitricaturṇāṃ vā sāgarasya tu pañcamam | oṣadʰīs teṣu sarveṣu
          kalaśeṣūpakalpayet ||
      - ab@verse[n=5]: sahā ca dahadevī ca balā cātibalā tatʰā | madayantī vacā śvetā
          vyāgʰradantī sumaṅgalā ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: śatāvarī jayantī ca śatapuṣpā sacandanā | priyaṅgū rocano aśīram
          amr̥tā ca sasārikā ||
      - ab@verse[n=2]: aśvattʰaplakṣabilvānāṃ nyagrodʰapanasasya ca | śirīṣāmrakapittʰānāṃ
          pallavaiḥ samalaṃkr̥tān ||
      - ab@verse[n=3]: hemaratnauṣadʰībilvapuṣpagandʰādʰivāsitān | āccʰāditān sitair
          vastrair abʰimantrya purohitaḥ ||
      - ab@verse[n=4]: sāvitry ubʰayataḥ kuryāc cʰaṃ no devī tatʰaiva ca | hiraṇyavarṇāḥ
          sūktaṃ ca anuvākādyam eva ca ||
      - ab@verse[n=5]: dʰaraṇī pādapīṭʰaṃ syād dūrvāmūlāṅkurān śubʰān | tasyopari
          nyaset pīṭʰaṃ haimaṃ raupyam atʰāpi vā ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: anaḍudvyāgʰrasiṃhānāṃ mr̥gasya ca yatʰākramam | catvāri carmāṇy
          etāni pūrvād ārabʰya vinyaset ||
      - ab@verse[n=2]: cāturhotravidʰānena juhuyāc ca purohitaḥ | caturdikṣu stʰitair
          viprair vedavedāṅgapāragaiḥ ||
      - ab@verse[n=3]: bilvāhāraḥ pʰalāhāraḥ payasā vāpi vartayet | saptarātraṃ gʰr̥tāśī
          va tato homaṃ prayojayet ||
      - ab@verse[n=4]: gavyena payasā kuryāt sauvarṇena sruveṇa tu | vedānām ādibʰir
          mantrair mahāvyāhr̥tipūrvakaiḥ ||
      - ab@verse[n=5]: śarmavarmā gaṇaś caiva tatʰā syād aparājitaḥ | āyuṣyaś cābʰayaś
          caiva tatʰā svastyayano gaṇaḥ ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: etān pañca gaṇān hutvā vācayeta dvijottamān | hiraṇyenākṣatārgʰeṇa
          pʰalaiś ca madʰusarpiṣā ||
      - ab@verse[n=2]: puṇyāhaṃ vācayitvāsya ārambʰaṃ kārayed budʰaḥ | tiṣyanakṣatrasaṃyukte
          mahūrte karaṇe śubʰe ||
      - ab@verse[n=3]: uccairgʰoṣa iti tūryāṇy abʰimantrya purohitaḥ | sarvatūryaninādena
          abʰiṣikto hy alaṃkr̥taḥ ||
      - ab@verse[n=4]: siṃhāsanaṃ samāruhya pīṭʰikāṃ vā yatʰākramam | cāmaracʰattrasaṃyuktaṃ
          pratihāravibʰūṣitam ||
      - ab@verse[n=5]: mattadvipacatuṣkaṃ ca caturdikṣu prakalpayet | upaviṣṭas tato
          rājā prajānāṃ kārayed dʰitam | akarā brāhmaṇā gāvaḥ strībālajaḍarogiṇaḥ
          ||
    - section[n=5]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: tatas tu darśanaṃ deyaṃ
          brāhmaṇānāṃ nr̥peṇa tu | śreṇīprakr̥timukʰyānāṃ strījanaṃ ca namaskaret
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: āśiṣas te hi dāsyanti
          tuṣṭā janapadā bʰuvi | evaṃ prajānurajyeta pr̥tʰivī ca vaśā bʰavet ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: purohitaṃ mantriṇaṃ ca
          senādʰyakṣaṃ tatʰaiva ca | aśvādʰyakṣaṃ gajādʰyakṣaṃ koṣṭʰāgārapatiṃ tatʰā
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰāṇḍāgārapatiṃ vaidyaṃ
          daivajñaṃ ca yatʰākramam | yatʰārheṇa ca yogena sarvān saṃpūjayen nr̥paḥ
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: rājyaṃ purohite nyasya
          śeṣāṇāṃ ca yatʰākramam | stʰānāntarāṇi cānyāni dattvā sukʰam avāpnuyāt ||
      - ab@verse[n=6]: dūrvāsiddʰārtʰakān sarpiḥ śamīr vrīhiyavau tatʰā śuklāni caiva
          puṣpāṇi mūrdʰni dadyāt purohitaḥ ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: atʰarvavihito hy eṣa vidʰiḥ
          puṣyābʰiṣecane | rājā snāto mahīṃ bʰuṅkte śakralokaṃ sa gaccʰati ||
      - ab@verse[n=col]: iti puṣyābʰiṣekaḥ ||
  - pariśiṣṭa[n=6]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: piṣṭarātryāḥ kalpaḥ
    - section[n=1]:
      - ab@verse[n=1]: om atʰātaḥ piṣṭarātryāḥ kalpaṃ vyākʰyāsyāmaḥ ||
      - ab@verse[n=2]: ahatavāsāḥ purastāt talpasya gomayena stʰaṇḍilam upalipya
      - ab@verse[n=3]: ahatavastreṇa siṃhāsanam avacʰādya ||
      - ab@verse[n=4]: yāṃ devāḥ prati nandantīti rātrim āvāhayet ||
      - ab@verse[n=5]: saṃvatsarasya pratimām iti piṣṭamayīṃ pratikr̥tiṃ kr̥tvodanmukʰīm
          upaveśayet ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: cʰattraṃ hiraṇmayaṃ dadyād
          āsanaṃ ca hiraṇmayam | dadyāc cʰubʰrāṇi vāsāṃsi śubʰraṃ caivānulepanam ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: śubʰram annam atatʰā dadyāt
          prabʰūtāṃś caiva modakān | dʰūpaṃ ca vividʰaṃ nityaṃ pradīpāṃś ca prakalpayet
          ||
      - ab@verse[n=8]: ā mā puṣṭe ca poṣe cety etābʰir upastʰāya ||
      - ab@verse[n=9]: rakṣogʰnair mantraiḥ sarṣapān abʰimantrya
      - ab@verse[n=10]: āvatas ta iti japan samantāt talpasyāvakīrya
      - ab@verse[n=11]: ayaṃ pratisara iti pratisaram ābadʰya śarkarān pratidiśaṃ
          kṣipet ||
      - ab@verse[n=12]: dʰūpaśeṣaṃ rājñe dadyād ||
      - ab@verse[n=13]: abʰayapradaṃ karma ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: paścāt sarveṣu koneṣu
          dvimukʰīm ekamukʰīṃ vā | sarvato vijayāṃ rakṣām ekāṃ vā teṣu caturmukʰīm
          ||
      - ab@verse[n=15]: ekamukʰīṃ vā sarvatrāpratiratʰajapa ity eke
      - ab@verse[n=16]: sarvatra śarkarākṣepaś ceti ||
    - section[n=2]:
      - ab@verse[n=1]: gr̥hītvā piṣṭarātriṃ tu veśmadvāre visarjayet
      - ab@verse[n=2]: vanaspatir aso madʰya iti guggulukuṣṭʰadʰūpaṃ dadyād
      - ab@verse[n=3]: yas te gandʰa iti bʰūtim abʰimantrya
      - ab@verse[n=4]: tryāyuṣam iti rājñe rakṣāṃ kr̥tvā
      - ab@verse[n=5]: asapatnam iti śarkarān abʰimantryāṅguṣṭʰād [abʰi]pradakṣiṇaṃ
          pratidiśaṃ kṣipet ||
      - ab@verse[n=6]: śāntā dyaur iti japitvā rājānaṃ vāsagr̥haṃ nayet ||
      - ab@verse[n=7]: bʰūtinā rakṣāṃ kr̥tvā niṣkramya
      - ab@verse[n=8]: evamevam ahar ahaḥ kuryād iti || piṣṭarātryāḥ kalpaḥ samāptaḥ
          ||
  - pariśiṣṭa[n=7]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: ārātrikam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ na suṣvāpa purā śakro dānavānāṃ purodʰasā | prayuktair auṣadʰair
          yogair mantrāṇāṃ japahomataḥ ||
      - ab@verse[n=2]: praṇipatya br̥haspatim atʰarvāṇaṃ puraṃdaraḥ | dānavaiḥ paribʰūto
          'haṃ trāhi mām ity uvāca ha ||
      - ab@verse[n=3]: tato 'sāv evam uktas tu prabʰūtabalavardʰanam | ārogyadaṃ bʰūtikaraṃ
          kṣudropadravanāśanam ||
      - ab@verse[n=4]: ārātrikaṃ hi kartavyaṃ tasya trātum idaṃ tadā | kr̥tvā piṣṭamayaṃ
          dīpaṃ suvartisnehasaṃyutam ||
      - ab@verse[n=5]: ati nihaḥ prānyān iti dvābʰyām enaṃ pradīpayet | pātre sapuṣpe
          saṃstʰāpya sarṣapāṃś ca sahākṣataiḥ ||
      - ab@verse[n=6]: priyaṅguṃ śatapuṣpāṃ ca dūrvāṃ caiva śatāvarīm | sapāpahāriṇīṃ
          bʰūtiṃ tatraiva ca baliṃ nyaset ||
      - ab@verse[n=7]: apsarobʰiḥ parivr̥to gurur gatvā puraṃdaram | prāptasattvaṃ
          sumanasam āsane prānmukʰaṃ stʰitam ||
      - ab@verse[n=8]: preto yantv ekaśataṃ ca dīpaṃ samabʰimantrayet | triḥ paribʰrāmayed
          rājño mantreṇātʰa sumaṅgalam ||
      - ab@verse[n=9]: śāmyanty asya tato rogā grahā vigʰnavināyakāḥ | svasty astu
          nrparāṣṭrāya svasti gobrāhmaṇāya ca ||
      - ab@verse[n=10]: tatas tu śaṅkʰadʰvaninā dīpaṃ gr̥hītvā satoyadʰārāṃ prayato
          'pi nirharet | purohito jyotiṣiko 'pi vā svayaṃ hitaiṣinī dʰātry atʰarvo
          (pakāritā ||
      - ab@verse[n=11]: ācāmyātʰa ha rājānam ācamyādau purohitaḥ | brāhmaṇāya yatʰāśakti
          rukmaṃ prātaḥ pradāpayet ||
      - ab@verse[n=12]: mūlakarmādikaṃ tasya pañcaguhyakakāritam | bʰayaṃ rājño na
          bʰavati tejo vīryaṃ ca vardʰate ||
      - ab@verse[n=13]: evaṃ vidʰānam akʰilaṃ vihitaṃ yatʰāvad etat samastaśubʰadaṃ
          gaditaṃ nrpāṇām | naivāpadaḥ samupayānti nr̥paṃ kadā cid ārātrikaṃ pratiniśaṃ
          kriyate tu yasya || ity ārātrikaṃ samāptam ||
  - pariśiṣṭa[n=8]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: gʰr̥tāvekṣaṇam
    - section[n=1]:
      - ab@verse[n=1]: om atʰa gʰrtāvekṣaṇaṃ vakṣyāmaḥ ||
      - ab@verse[n=2]: prātaḥprātaḥ śaṅkʰadundubʰinādena brahmagʰoṣeṇa vā prabodʰito
          rājā śayanagr̥hād uttʰāyāparājitāṃ diśam abʰiniṣkramyopādʰyāyaṃ pratīkṣeta
          ||
      - ab@verse[n=3]: atʰa purohitaḥ snātānuliptaḥ śuciḥ śuklavāsāḥ krtamaṅgalaviracitoṣṇīṣī
          śāntigr̥haṃ praviśya devānāṃ namaskāraṃ kr̥tvā svastivācanam anujñāpya vinītavad
          upaviśet ||
      - ab@verse[n=4]: yamasya lokād yatʰā kalāṃ yo na jīvo 'sīti svastyayanaṃ kr̥tvollikʰyābʰyukṣya
          paristīrya śantātīyena tilān gʰr̥tāktān juhuyāt ||
      - ab@verse[n=5]: tān hutvā sauvarṇarājatam audumbaraṃ vā pātraṃ gʰr̥tapūrṇaṃ
          sahiraṇyaṃ gʰr̥tasya jūtiḥ sahasraśr̥ṅgo yamasya lokād uru viṣṇo vi kramasvety
          abʰimantryājyaṃ teja iti tadālabʰate ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: ājyaṃ tejaḥ samuddiṣṭam
          ājyaṃ pāpaharaṃ param | ājyena devās trpyanti ājye lokāḥ pratiṣṭʰitāḥ ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: bʰaumāntarikṣadivyaṃ vā
          yat te kalmaṣam āgatam | sarvaṃ tad ājyasaṃsparśāt praṇāśam upagaccʰatv
          iti ||
      - ab@verse[n=8]: tasmin gʰr̥tapātrastʰaṃ hi sarvam ātmānaṃ ca paśyet ||
      - ab@verse[n=9]: dadʰnā śiro hr̥dayam anvālabʰya japet ||
      - ab@verse[n=10]: uccā patantam iti dvābʰyām
      - ab@verse[n=11]: sūryasyāvr̥tam iti pradakṣiṇam āvr̥tya śeṣaṃ kārayed ity
      - ab@verse[n=12]: atra ślokāḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: ayaṃ gʰr̥tāvekṣaṇasya prokto vidʰir atʰarvaṇā | upāsyo nityakālaṃ
          tu rājñā vijayakāṅkṣiṇā ||
      - ab@verse[n=2]: etat samāharet sarvaṃ prayatas tu samāhitaḥ | rājā vijayate
          rāṣṭraṃ naśyante tasya śatravaḥ ||
      - ab@verse[n=3]: dvijottamāya kapilāṃ rājā dadyāt tu gāṃ śubʰām | āśīrvādaṃ
          tatas tena śrutvā tanmukʰaniḥsr̥tam ||
      - ab@verse[n=4]: guruṇā vācito yasmād dīrgʰam āyur avāpnuyāt | putrān pautrāṃś
          ca maitrāṃś ca labʰate nātrasaṃśayaḥ ||
      - ab@verse[n=5]: āyuṣyam atʰa varcasyaṃ saubʰāgyaṃ śatrutāpanam | duḥsvapnanāśanaṃ
          puṇyaṃ gʰr̥tāsyāvekṣaṇaṃ smr̥tam iti || iti gʰr̥tāvekṣaṇaṃ samāptam || śrīsāmba
          | yamasya lokād adʰy ābabʰūvitʰa iti r̥caḥ 6, yatʰā kalāṃ yatʰā śapʰam iti
          r̥caḥ 6, gʰr̥tasya jūtir iti r̥caḥ 4 gʰr̥tāvekṣaṇamadʰye paippalādā mantrāḥ
          ||
  - pariśiṣṭa[n=9]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: tiladʰenuvidʰiḥ
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om atʰa tiladʰenuṃ pravakṣyāmi sarvapāpapraṇāśanīm | tilāḥ
          śvetās tilāḥ kr̥ṣṇās tilā gomūtravarṇakāḥ ||
      - ab@verse[n=2]: tilānāṃ tu vicitrāṇāṃ dʰenuṃ vatsaṃ ca kārayet | droṇasya vatsakaṃ
          kuryāc caturdroṇā tu gauḥ smr̥tā ||
      - ab@verse[n=3]: suvāsāyāṃ śucau bʰūmau dʰūpapuṣpair alaṃkrtā | kr̥ṣṇājine tu
          kartavyā bahūnāṃ vāpi kārayet ||
      - ab@verse[n=4]: karṇau ratnamayau kuryāc cakṣuṣī dīpakau tatʰā | gʰrāṇe tu
          sarvagndʰāṃs tu jihvāyāṃ śāradaṃ gʰr̥tam ||
      - ab@verse[n=5]: danteṣu mauktikaṃ dadyāl lalāṭe tāmrabʰājanam | ūdʰasi tu madʰūśīram
          apāne ca gʰr̥taṃ madʰu ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: hr̥daye candanaṃ dadyāj
          jaṅgʰayor ikṣukāṇḍakam | suvarṇaśr̥ṅgī raupyakʰurī raupyalāṅgūladakṣiṇā
          ||
      - ab@verse[n=2]: vastracʰannā tu dātavyā kāṃsyapātraṃ tu dohanī |
      - ab@verse[n=3]: prajāpatiś cety abʰimantrya viprāya dadyāt
      - ab@verse[n=4]: tatra ślokāḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: dʰenuṃ vatsaṃ ca yo dadyād
          vinātʰarvābʰimantritām | vinānena vidʰānena devatvaṃ nopajāyate ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: viśvarūpāḥ stʰitāḥ sarvā
          dʰenavaḥ parikīrtitāḥ | dʰenutvaṃ na sa prayāti vinā sūktābʰimantritām |
          niṣpʰalaṃ naśyate sarvaṃ vinābʰimantritaṃ satām ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: bālatve yac ca kaumāre
          yat pāpaṃ yauvane kr̥tam | vayaḥpariṇatau yac ca yac ca janmāntareṣu ca
          ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: yan niśāyāṃ tatʰā prātar
          yan madʰyāhnāparāhṇayoḥ | saṃdʰyayor yat kr̥taṃ pāpaṃ karmaṇā manasā girā
          ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: prasūyamānāṃ yo dʰenuṃ dadyād brāhmaṇapuṃgave | kr̥ṣṇājinaṃ
          guḍadʰenuṃ gʰr̥tadʰenuṃ tatʰaiva ca ||
      - ab@verse[n=2]: suvarṇaratnadʰenuṃ ca jaladʰenuṃ tatʰā parām | kṣīradʰenuṃ
          madʰudʰenuṃ śarkarālavaṇaṃ tatʰā ||
      - ab@verse[n=3]: rasādidʰenūḥ sarvānyā anena vidʰinā smr̥tāḥ | yat tu bālye
          kr̥taṃ pāpaṃ yauvane caiva yat kr̥tam ||
      - ab@verse[n=4]: mānakūṭaṃ tulākūṭaṃ kanyānr̥tagavānr̥tam | udake ṣṭʰīvitaṃ
          caiva musalaṃ cāpi laṅgʰitam ||
      - ab@verse[n=5]: vr̥ṣalīgamanaṃ caiva gurudārāniṣevaṇam | surāpānasya yat pāpaṃ
          tiladʰenuḥ praśāmyati ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yā sa yamapure gʰore nadī vaitaraṇī smr̥tā | yatra lohamukʰāḥ
          kākāḥ śvānaś caiva bʰayāvahāḥ ||
      - ab@verse[n=2]: vālukāntāḥ stʰalāś caiva pacyante yatra duṣkr̥taḥ | asipattravanaṃ
          yatra śālūkāḥ śālmalī tatʰā ||
      - ab@verse[n=3]: tān sukʰena vyatikramya dʰarmarājāśramaṃ vrajet | svāgataṃ
          te mahābʰāga svasti te 'stu mahāmate ||
      - ab@verse[n=4]: vimānam etad yogyaṃ te maṇiratnavibʰūṣitam | atrāruhya naraśreṣṭʰa
          gaccʰa tvaṃ paramāṃ gatim ||
      - ab@verse[n=5]: mā ca cārabʰaṭe dadyān mā ca dadyāt purohite | mā ca kāṇe virūpe
          ca kuṣṭʰivyaṅge tatʰaiva ca ||
      - ab@verse[n=6]: vedāntagāya dātavyā vedāntagasutāya vā | ekaikasmai ca dātavyā
          māgʰamāse tu pūrṇimām ||
      - ab@verse[n=7]: ya imāṃ paṭʰate nityaṃ yaś cemāṃ śr̥ṇuyād api | devalokam atikramya
          sūryalokaṃ sa gaccʰati || sūryalokaṃ sa gaccʰatīti || iti tiladʰenuvidʰiḥ
          samāptaḥ ||
  - pariśiṣṭa[n=10]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: bʰūmidānam
    - section[n=1]:
      - ab@verse[n=1]: om atʰa rohiṇyāṃ sakalāyām upoṣito brahmā sarvabījarasaratnagandʰāvakīrṇaṃ
          tīrtʰodakapūrṇakalaśam ādāyātisr̥ṣṭo apām ity abʰiṣekamantrair yatʰoktair
          dātāram abʰiṣiñcati ||
      - ab@verse[n=2]: vratena tvaṃ vratapata iti vratam upaiti
      - ab@verse[n=3]: yācitāradātārāv ayācitāśināv adʰahśāyinau bʰavato
      - ab@verse[n=4]: vratopacāram
      - ab@verse[n=5]: yatʰāśaktyaikarātraṃ pañcarātraṃ dvādaśarātraṃ vā vrataṃ caritvā
      - ab@verse[n=6]: śvo bʰūte tantram ājyabʰāgāntaṃ kr̥tvānvārabʰyātʰa juhuyāt
          ||
      - ab@verse[n=7]: kāmasūktaṃ kālasūktaṃ puruṣasūktaṃ mahāvyāhr̥tibʰiḥ saṃkʰyāpūrvikābʰiḥ
          sarva r̥tvijo juhvaty
      - ab@verse[n=8]: atʰa suvarṇamayīṃ bʰūmiṃ bʰūmeḥ pratikr̥tiṃ gocarmamātrāṃ kr̥tvā
      - ab@verse[n=9]: maṇḍapavedyāṃ samānīya vedyuttarato yasyāṃ vedim ity upastʰāpya
      - ab@verse[n=10]: girayas te parvatā iti parvatān avastʰāpya
      - ab@verse[n=11]: hiraṇyarajatamaṇimuktāpravālādibʰir upaśobʰayed yad adaḥ saṃprayatīr
          iti
      - ab@verse[n=12]: sā mandasāneti nadīḥ kalpayitvā rasaiś ca paripūrayed
      - ab@verse[n=13]: apām agram asi samudraṃ vo 'bʰyavasr̥jāmīti samudrān
