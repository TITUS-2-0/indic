      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: dʰruvāyāṃ diśi vāsukī
          rājā nāgānām ādʰipatyam iti | daṃṣṭrayā praharaṇeneti ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: ūrdʰvāyāṃ diśi somo rājā
