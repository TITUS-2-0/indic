          meḍiḥ | sūryā | sarasvatī | nivit | svāhā | vagnuḥ | upabdiḥ | kākuḥ | māyuḥ
          | jihvā | gʰoṣaḥ | ślokaḥ | śabdaḥ | svaraḥ | svanaḥ | r̥k | hotrā | gīḥ
