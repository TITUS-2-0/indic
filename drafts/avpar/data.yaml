          tvā yadi hutām
      - ab@verse[n=5]: sūrya enaṃ yo yajñasyābodʰy agniḥ kr̥ṣṇāyāḥ putro annādyena
          yaśasā brahmāparaṃ pra budʰyasvainaṃ śraddʰā ahnā pratyaṃ śakvarī stʰa vasyobʰūyāya
          ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: vratair bʰr̥gvaṅgiraḥproktair ānupūrvyād vidʰānataḥ | upasanne
          guruḥ kuryād vratavid brahmacāriṇi ||
      - ab@verse[n=2]: grāmād yatʰoktaṃ bāhyena stʰaṇḍile 'gniṃ praṇīya tu | nityenopasamādʰāya
          saṃskr̥tya juhuyādd haviḥ ||
      - ab@verse[n=3]: aupagavyā vyāhr̥tayaḥ sāvitrī śāntir eva ca | vrātapatyaḥ samāsau
          ca tanmantrāṃhomucaiḥ saha ||
      - ab@verse[n=4]: kūṣmāṇḍyaḥ kāmasūktaṃ ca brahmavatyo 'tʰa devatāḥ | vratādeśe
          tatʰotsarge homaḥ kṣīrodanaḥ smr̥taḥ ||
      - ab@verse[n=5]: utsarge kāmasūktaṃ ca pūrvāṃ cāhutim uddʰaret | nivedya vrātapatyo
          'nte idāvatsara eva ca ||
    - section[n=8]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: āvartanāntaṃ sāmānyaṃ
          vyāhr̥tyādy ubʰayor api | etat sāmāsikaṃ proktam ādeśoddīkṣaṇaṃ budʰaiḥ
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: vrateṣu dakṣiṇā dʰenuḥ
          kalyāṇī taruṇī ca yā | anaḍvān vā dʰuraṃdʰaras tatsamaṃ vāpi kāñcanam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: sāvitryā atʰa vedasya
          kalpānāṃ tadanantaram | mailaṃ mailottaraṃ caiva ṣaṣṭʰaṃ saṃmitam ucyate
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: ṣaḍvrataṃ brāhmaṇaṃ vidyāt
          trivrataṃ kṣatriyaṃ viduḥ | dvivratas tu bʰaved vaiśya etad ācāryaśāsanam
          ||
      - ab@verse[n=5]: viṣāsahiṃ sahamānam agnir mā goptā o cit sakʰāyam ita eta udāruhan
          dʰanur hastād etad ā roha candramā apsv iti ||
    - section[n=9]:
      - ab@verse[n=1]: om āṅgirasānām ādyaiḥ pañcānuvākaiḥ svāhā ||
      - ab@verse[n=2]: ṣaṣṭʰāya svāhā ||
