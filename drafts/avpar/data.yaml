  - pariśiṣṭa[n=47]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: varṇapaṭalam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ varṇān pūrvaṃ vyākʰyāsyāmaḥ
          prākr̥tā ye ca vaikr̥tāḥ | śrutinirvacanāt sarve vivadante vivr̥ttiṣu ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: vr̥ttiḥ karaṇaṃ varṇānāṃ
          karṇayos tu śrutir yatʰā | śrutipradeśād vimatas tad yatʰā varṇa ucyate
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: samānasaṃdʰyakṣarāṇi sparśā
          antaḥstʰā ūṣmāṇaḥ | etair anye na dr̥śyante etāvān varṇasaṃcayaḥ ||
      - ab@verse[n=4]: '[yeṣāṃ ca śrutisaṃhitāyāṃ vibʰāge asadr̥śī syāt || tān eva
          varnān virudrādaye ca pradise kr̥taḥ] ||'
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: ye varṇābʰyāṃ śrūyante
          ca yeṣāṃ nāsti vibʰāgataḥ | mānasāṃś cāpi saṃgrāhyān upadeśena vartayet
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: krāntān bahir nidʰānasya
          yamāṃś cānanunāsikān | savyākṣepaṃ tato varṇān upadeśena vartayet ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: iti varṇāḥ svarāḥ proktās
          teṣām ādyāś caturdaśa | samānākṣarāṇy ucyante śeṣaḥ saṃdʰyakṣarāṇi tu ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: anavarṇasvaro nāmi kādayo
          vyañjanaṃ smr̥tam | pañcaviṃśatir ādyaiṣāṃ sparśā vargāś ca pañcakāḥ ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: catvāro yādayo 'ntaḥstʰāḥ
          śādir ūṣmāṣṭako gaṇaḥ | ayogavāhā vartante teṣām ādyāḥ pr̥tʰagvidʰāḥ ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: visarjanīyo 'nusvāro
          jigvāmūlīya [ity adʰaḥ] | upadʰmānīya ity ete catvāro 'tʰa pare yamāḥ ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: nāsikyābʰinidʰānau ca
          vidyate yena pūraṇam | pañcaṣaṣṭir iyān vāco rāśir yo vedalokayoḥ ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: mukʰanāsike ye varṇā
          ucyante te 'nunāsikāḥ | samānāsyaprayatnā ye te savarṇā iti smr̥tāḥ ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: hrasvo 'varṇaparas tasya
          savarṇasya ca vācakaḥ | hrasvottaras tu dīrgʰo 'pi tasmāt tasmāt tasyaiva
          vācakaḥ ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: vargāntaras tu vargādir
          vargasya grāhako mataḥ | vargāṇāṃ ca yatʰāsaṃkʰyaṃ pratʰamāditvam iṣyate
          ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: akāreṇocyate 'tas tu
          kāro yasmāt paro bʰavet | tasya tad grahaṇaṃ bodʰyaṃ kakāro 'tra nidarśanam
          ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: vyañjanaṃ gʰoṣavatsaṃjñam
          antaḥstʰā haḥ parau yamau | trayastrayaś ca vargāntyā agoṣaḥ śeṣa ucyate
          ||
      - ab@verse[n=17,lg=san-Latn-x-vedic-metric-unacc-tld]: śaṣasāś ca yamau dvau
          ca dvitīyāḥ pratʰamāś ca ye | agʰoṣā vyañjanaśeṣaṃ gʰoṣavad dr̥śyate budʰaiḥ
          ||
      - ab@verse[n=18,lg=san-Latn-x-vedic-metric-unacc-tld]: ataḥ stʰānāni varṇānāṃ
          kaṇṭʰo 'varṇahakārayoḥ | vosarjanīya ai au ca svādyayor mātrayoḥ smr̥taḥ
          ||
      - ab@verse[n=19,lg=san-Latn-x-vedic-metric-unacc-tld]: śeṣas tālvoṣṭʰayor bodʰyaḥ
          sa yatʰāsaṃkʰyam iṣyate | dvistʰānaṃ yamayoś cāpi vargāntyānāṃ ca śiṣyate
          ||
      - ab@verse[n=20,lg=san-Latn-x-vedic-metric-unacc-tld]: jihvāmūlām r̥varṇasya
          kavargasya ca bʰāṣyate | yaś caiva jihvāmūlīya Lvarṇaś ceti ca smr̥taḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tālv eyaśacavargāṇām ivarṇasya ca bʰāṣyate | mūrdʰā stʰānaṃ
          ṣakārasya ṭavargasya tatʰā mataḥ ||
      - ab@verse[n=2]: dantā lasatavargāṇām uvarṇas tv oṣṭʰya ucyate | upadʰmānīya
          okāro vaḥ pavargaś ca tatʰā matāḥ ||
      - ab@verse[n=3]: nāsikye nāsikā stʰānaṃ tatʰānusvāra iṣyate | yamā vargottamāś
          cāpi yatʰoktaṃ caiva te matāḥ ||
      - ab@verse[n=4]: repʰasya dantamūlāni pratyag vā tebʰya iṣyate | iti stʰānāni
          varṇānāṃ kīrtitāni yatʰākramam ||
      - ab@verse[n=5]: apara āha | hanumūle tu repʰaḥ syād dantamūleṣu vā punaḥ |
          pratyag vā dantamūlebʰyo mūrdʰanya iti cāpare ||
      - ab@verse[n=6]: uraḥstʰo gʰoṣo visr̥ṣṭaḥ kaṇṭʰadeśe nihanyate | tato nādo vitiṣṭʰate
          tasya vikr̥tir akṣaram ||
      - ab@verse[n=7]: pūrvābʰir aṇumātrābʰiḥ kaṇṭʰyaṃ saṃsevyate 'kṣaram | uttarābʰis
          tu mātrābʰir mukʰavikr̥tir ucyate ||
      - ab@verse[n=8]: api prayogasya hetoḥ saṃyogaḥ saha dʰāryate | avyavahito 'kṣareṇa
          nānāvarṇaḥ svarodayaḥ ||
      - ab@verse[n=9]: dvitīyeṣu tatʰoṣmaṇāṃ tr̥tīyeṣu ca gʰoṣāṇām | caturtʰeṣu gʰoṣoṣmaṇām
          upadeśena vartayet ||
      - ab@verse[n=10]: uttameṣu tu nāsikyam antaḥstʰeṣu gʰoṣaṃ smr̥tam | hakārasya
          gʰoṣoṣmāṇāv upadeśena vartayet ||
    - section[n=3]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: r̥kārākṣarayo repʰam aṇumātra
          sarva... | svaritasya dvaidʰībʰāve upadeśena vartayet ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: r̥varṇadeśasaṃdeho 'svaraḥ
          syāt syād anantaram | paro vā yadi vā pūrvo repʰam eva tu viddʰi tam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: akāraś ca ikāraś ca ukāra
          r̥kāra eva ca | hrasvadīrgʰaplutāḥ sarve Lvarṇe nāsti dīrgʰatā ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: ekāraś ca tatʰāikāra okāra
          aukāra eva ca | dīrgʰamātraplutās teṣāṃ saṃjjā saṃdʰyakṣarāṇi ca ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: udāttaś cānudāttāś ca
          svaritāḥ kampitāś ca ye | anunāsikās tatʰā śuddʰā dr̥śyate hrasvatā budʰaiḥ
          ||
      - ab@verse[n=6]: varṇāḥ pañcaṣaṣṭiḥ svarā dvāviṃśatiḥ samānākṣarāṇi caturdaśa
          aṣṭau saṃdʰyakṣarāṇy ekonaviṃśatir nāminas tricatvāriṃśad vyañjanānisparśāḥ
          pañcaviṃśatiś catvāras tv antaḥstʰāḥ catvāro yamāś cāṣṭāv ūṣmāṇo 'yogavāhā
          daśāyogavāhā daśa ||
  - pariśiṣṭa[n=48]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: kautsavyaniruktanigʰaṇṭuḥ
    - section[n=1]:
      - p: om atʰarvaṇe namaḥ ||
    - section[n=2]:
      - p: '[pacati | pacate | aśanaśi | sisrate | gameḥ | vāyi | cāyi ||1 || vyāpi
          | cakri | devā caṣṭe | ava cākaśat | vyānaśe | triṣi niṣāmayatyoḥ | yoṣṭiḥ
          sapte ca ||2 || riñjati] |'
    - section[n=3]:
      - p: vaśmi | vaśmi | uśmasi | ava veti | vāñcʰati | veṣṭi | vanoti | juṣate
          | haryati | ācake | uśik | manyate | acʰāntsuḥ ||3 || cʰantsat | cākanat
          | cakamānaḥ | kanati | kāniṣat | kāme ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - p: mimeti ||4 || nardati | dʰvanati ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - p: dʰvaṃsate | [kr̥ṇati | kiṃśakte ||]
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - p: vanati | bʰanati | [starṣati |] spʰūrjati ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - p: hlādate | [nirr̥te |] hlādayati ||
    - section[n=8]:
      - p: śabdayati ||
    - section[n=9]:
      - p: arcati | arcati | rebʰati | gāyati | jalpati | stobʰati | stauti | yauti
          | rauti | nauti | gadati | nadati | bʰanati | bʰanate | [tatrate |] paṇate
          | paṇasyati | paṇāyate | bʰandate | [yatrasyate. kr̥kr̥mdʰampāt] kr̥paṇyati
          | dʰamati | sapati | papr̥kṣāḥ | gūrdʰayati | vedayati | vādayati ||5 ||
          valgūyati | mahayati | mantrayate | sevate | pr̥ccʰati ||6 || cʰandati |
          śaśamānaḥ | jarate | [cʰarati |] venati | vandate ||
    - section[n=10]:
      - p: irajati | irajyati ||7 ||vidʰema | duvasyati | namasyati | vivāsati | r̥dʰnoti
          | r̥ṇaddʰi | r̥ccʰati ||
    - section[n=11]:
      - p: pari srava | parisrava ||8 || pavasva | abʰy arṣa | āśiṣaḥ ||
    - section[n=12]:
      - p: īmahe | īmahe | yāmi | manmahe | daddʰi | pūrdʰi | śagdʰi | mimīhi | rirīhi
          | ririḍʰḍʰi | mimiḍʰḍʰi | pīparat | yantāraḥ | iṣudʰyati | vanemahi | manāmahe
          | yācate ||
    - section[n=13]:
      - p: <dāsati |> dāsati ||9 || dāśati | śikṣati | mahate | pr̥ṇāti | rāti | rāsati
          | prāti | tuñjati | [matsyati |] dadāti ||
    - section[n=14]:
      - p: yryṣyati | uruṣyati ||10 || piparti | pārayati | pāti | pāsati | prāti
          | tuñjati | pr̥ṇāti | rakṣe ||
    - section[n=15]:
      - p: <ā vayati |> ā vayati | bʰarvati | babʰasti | venati | veti | veveṣṭi |
          aviṣyan | [praga] psāti | bapsati | bʰasatʰaḥ | babdʰām |
    - section[n=16]:
      - p: '[vadati | ādeti | tirati | tviṣyati | hinoti | vr̥ddʰeḥ ||]'
    - section[n=17]:
      - p: '[utpapīti | utpapīti ||11 || tapati | pippahu | sahoti | yugbʰidī bʰedayojanayoś
          ca ||]'
    - section[n=18]:
      - p: heḍate | heḍate ||12 || bʰāmate | hr̥ṇīyate | bʰrīṇāti | bʰreṣate | dodʰati
          | heḍaḥ | haraḥ | hr̥ṇiḥ | tyajaḥ | bʰāmaḥ | manyuḥ | krodʰe nāmāni ca krodʰasya
          ||
    - section[n=19]:
      - p: śnatʰati | śnatʰati ||13 || [dovati | kurvati |] tūrvati | [manuṣyati |
          dʰanuṣyati |] śr̥ṇāti | mr̥ṇāti | bʰr̥jjati | amati | tr̥ṇeḍʰi | dabʰnoti
          | [śūṣati |] dʰvarati | dʰūrvati | kr̥ntati | śvasati | snehayati | mr̥dnāti
          | [sradʰnāti |] dāsati | str̥ṇute | starate | [kr̥ṇāti |] ni tojati | ni
          vapati | [amati | riti |] yātayate | ākʰaṇḍala | taḍit | hiṃsāyām ||
    - section[n=20]:
