  - pariśiṣṭa[n=32]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: gaṇamālā
    - section[n=1]:
      - p: oṃ bʰūs tat savituḥ śaṃ no devīḥ śāntā dyauḥ śaṃ na indrāgnī śaṃ no vāto
          vātu uṣā apa svasus tama iti śāntigaṇaḥ ||
    - section[n=2]:
      - p: kr̥tyāpratiharaṇo dūṣyā dūṣir asi īśānāṃ tvā samaṃ jyotir uto asy abandʰukr̥d
          ye purastāt suparṇas tvā yāṃ te cakruḥ pratīcīnapʰalo yad duṣkr̥tam ayaṃ
          pratisaro yāṃ kalpayantīti kr̥tyāpratiharaṇāni || iti kr̥tyāgaṇaḥ ||
    - section[n=3]:
      - p: cātanaḥ stuvānam idaṃ havir ye 'māvāsyām upa prāgān niḥsālām arāyakṣayaṇaṃ
          śaṃ no devī pr̥śniparṇy ā paśyati tānt satyaujās tvayā pūrvaṃ purastād yukto
          antardāve juhuta prāgnaye rakṣohaṇam ity anuvākaś cātanāni || iti cātanagaṇaḥ
          ||
    - section[n=4]:
      - p: mātr̥nāmā divyo gandʰarva ā paśyatīmaṃ me agne yau te māteti mātr̥nāmāni
          || iti mātr̥gaṇaḥ ||
    - section[n=5]:
      - p: vāstoṣpatīya āśānām āśāpālebʰya ihaiva dʰruvām r̥dʰaṅmantro yonim uta putraḥ
          pitaram indrasya gr̥ho 'sīti catasro dive svāhāśamavarma me pr̥tʰivyai śrotrāyeti
          dʰanvānīti dve ūrjaṃ bibʰrad iti ṣaṭsatyaṃ br̥had ity anuvāko vāstoṣpatīyāni
          || iti vāstugaṇaḥ ||
    - section[n=6]:
      - p: pāpmahā vi devā jarasāvr̥tam apa naḥ śośucad agʰam ava mā pāpmann iti pāpmahā
          || iti pāpmahā gaṇaḥ ||
    - section[n=7]:
      - p: takmanāśano jarāyujaḥ pratʰamo yad agnir ud agātāṃ daśavr̥kṣa muñca kṣetriyāt
          tvā hariṇasya ragʰuṣyado muñcāmi tvā bʰavāśarvau manve vāṃ yo giriṣu dive
          svāhāgnis takmānam agner ivāsyāva mā pāpmant sr̥jāva jyām iva varaṇo vārayātā
          imaṃ yavaṃ vidradʰasya balāsasya namo rūrāyeti dve śīrṣaktiṃ śīrṣāmayam
          iti takmanāśanāni || iti takmanāśanagaṇaḥ ||
    - section[n=8]:
      - p: duḥsvapnanāśanāni dauṣvapnyaṃ daurjīvityaṃ paro 'paihi yo na jīvo 'si pary
          āvarte duṣvapnyād yat svapne annam aśnami yo na stāyad dipsati yo naḥ suptāṃ
          jāgrato yan me manso duṣvapnyaṃ kāma svapnaṃ suptvā vidma te svapneti trayaḥ
          paryāyā duḥsvapnanāśanāni || iti duḥsvapnanāśanagaṇaḥ ||
    - section[n=9]:
      - p: āyuṣyo yatʰā dyauḥ prāṇāpānāv ojo 'si tubʰyam evākṣībʰyāṃ te muñcāmi tvota
          devā āvatas ta upa priyam antakāya mr̥tyava ā rabʰasva prāṇāya namo viṣāsahim
          ity āyuṣyāṇi || iti āyuṣyagaṇaḥ ||
    - section[n=10]:
      - p: varcasyo ye triṣaptā asmin vasu prātar agniṃ hastivarcasaṃ siṃhe vyāgʰre
          yaśo havir yaśasaṃ mendro girāv aragarāṭeṣu yatʰā somaḥ prātaḥsavane yac
          ca varco akṣeṣu yena mahānagʰnyā jagʰanam iti varcasyāni || iti varcasyagaṇaḥ
          ||
    - section[n=11]:
      - p: svastyayano amūḥ pāre pātaṃ na indrāpūṣaṇā tvaṣṭā me daivyaṃ yena soma
          namo devavadʰebʰyo 'bʰayaṃ mitrāvaruṇāv upa prāgāt sahasrākṣo 'namitraṃ
          no adʰarād yamomr̥tyur br̥haspatir naḥ pari pātu tyam ū ṣu trātāram indraḥ
          sutrāmā sa sutrāmā ā mandrair indra marmāṇi te varma me dyāvāpr̥tʰivī aindrāgnaṃ
          varma girayas te yat te madʰyaṃ yās te prācīr mā naḥ paścād iti svastyayanāni
          || iti svastyayanagaṇaḥ ||
    - section[n=12]:
      - p: abʰayaḥ svastidā viśāṃ brāhmaṇena paryuktāsi na tā arvā reṇukakāṭo abʰayaṃ
          mitrāvaruṇāv abʰayaṃ dyāvāpr̥tʰivī asmai grāmāya hataṃ tardaṃ pūṣemā āśā
          indraḥ sutrāmā maitaṃ pantʰāṃ svastidā viśāṃ patir nama te gʰoṣiṇībʰya ā
          te rāṣṭram idam uc cʰreyo yata indra bʰayāmaha ity abʰayāni || ity abʰayagaṇaḥ
          ||
    - section[n=13]:
      - p: aparājito vidmā śarasya mā no cidann adārasr̥t svastidā saṃśitaṃ me tvayā
          manyo yas te manyo etā devasenā avamanyur nirhastaḥ pari vartmāny abʰibʰūr
          indro jāyaty abʰi tvendrety aparājitāni || ity aparājitagaṇaḥ ||
    - section[n=14]:
      - p: śarmavarmā yaḥ sapatna itaś ca yad amutaś cāpendra dviṣato yūyaṃ naḥ pravata
          imam agna āyuṣe tisro devīr uruvyacā no indrasya śarmāsīti uttamāṃ varjayitvā
          yena devā asurāṇām anaḍudbʰyas tvam iti dve tanūṣ ṭe vājin vājasya nu prasave
          devānāṃ patnīr adʰi brūhi rakṣohaṇaṃ vājinaṃ ye srāktyaṃ varma me dyāvāpr̥ṭʰivī
          aindrāgnaṃ varma bahulaṃ varma mahyam ayaṃ mitraḥ pr̥tʰivyod akrāmad aspatnaṃ
          purastād iti śarmavarmā || iti śarmavarmā gaṇaḥ ||
    - section[n=15]:
      - p: devapurā ye purastād brahma jajñānaṃ sahasradʰāra evāgnir mā pātu agniṃ
          te vasuvantaṃ mitraḥ pr̥tʰivyod akrāmad apa ny adʰuḥ pauruṣeyaṃ vadʰaṃ jitam
          asmākam iti devapurīyaḥ || iti devapurīyagaṇaḥ ||
    - section[n=16]:
      - p: rudro ye 'syāṃ prācī dig itirudragaṇaḥ || iti rudragaṇaḥ ||
    - section[n=17]:
      - p: raudro rudra jalāṣabʰeṣaja ye 'syāṃ prācī dig ud itas trayo akraman bʰavāśarvau
          manve vāṃ brahma jajñānam anāptā ye sahasradʰāra eva grīṣmo hemanto anaḍudbʰyas
          tvaṃ mahyam āpo vaiśvānaro yamo mr̥tyur yāṃ te rudra yo agnau rudro bʰavāśarvau
          mr̥ḍataṃ bʰavāśarvāv idaṃ brūmo yas te sarpo vr̥ścikas tasmai prācyā diśo
          antardeśād iti raudragaṇaḥ || iti raudragaṇaḥ ||
    - section[n=18]:
      - p: citrāgaṇo mā no vidann adārasr̥t svastidā viśām amūhoāre agʰadviṣṭā agne
          yat te tapa iti pañca sūktāni rudra jalāṣabʰeṣaja ye 'syāṃ prācī dig vi
          devā uta devā agner manva itiprabʰr̥tīni mr̥gārasūktāny uttamaṃ varjayitvāpa
          naḥ śośucad agʰaṃ pr̥tʰivyām agnaye mamāgne vrahma jajñānam anāptā ye sahasradʰāre
          savitā prasavānāṃ nava prāṇān pātaṃ nas tvaṣṭā me yena soma namo devavadʰebʰyo
          'bʰayaṃ mitrāvaruṇāv upa prāgāt sahasrākṣaḥ siṃhe vyāgʰre 'bʰayaṃ dyāvāpr̥tʰivī
          grīṣmo hemanto 'naḍudbʰyas tvaṃ mahyam āpo vaiśvānaro yamo mr̥tyur abʰi
          tvendra viśvajit trāyamāṇāyai imaṃ me agne viṣāṇā pāśān śakadʰūmaṃ somārudreti
          dve br̥haspatir nas tyam ū ṣu trātāram indraḥ sutrāmā ā mandrair indra marmāṇi
          te antakāya mr̥tyavā ā rabʰasvāyaṃ pratisaro 'yaṃ me varaṇo bʰavāśarvau
          mr̥ḍataṃ prāṇāya namo 'gniṃ brūma ity artʰasūktaṃ satyaṃ br̥had iti dve
          pratʰame girayas te yat te madʰyaṃ yās te prācīr mā naḥ paścād grīṣmas te
          bʰūme varṣāṇy upastʰās te bʰūme mātaḥ sahasraśr̥ṅgo vr̥ṣabʰo jātavedā mā
          pra gāma patʰo yo yajñasya tasmai prācyā diśo antardeśād iti paryāyaś citrāgaṇaḥ
          || iti citrāgaṇaḥ ||
    - section[n=19]:
      - p: patnīvanto aditir dyauḥ sinīvāli kuhūṃ devīm iti trīṇi sūktāni patnīvantaḥ
          || iti patnīvantagaṇaḥ ||
    - section[n=19b]:
      - p: svasti mātra indra juṣasvāyā viṣṭʰā śive te stāṃ pādābʰyāṃ te saṃ te śirṣṇo
          vatso virāja ity ekā uccā patantam iti dve bʰūyān indro viṣāsahiṃ sahamānam
          ity ādityagaṇaḥ ||
    - section[n=20]:
      - p: śaṃ no devī śaṃ na indrāgnī śaṃ no vāto vātu śāntā dyauḥ pippalādiśāntigaṇaḥ
          || iti pippalā[di]śāntigaṇaḥ ||
    - section[n=21]:
      - p: gane yad iti pañca sūktāni pañcāpatyāni bʰavanti pāñcajanyāni bʰavanti
          pāñcāpatyo gaṇaḥ || iti pañcāpatyagaṇaḥ ||
    - section[n=22]:
      - p: ambayo yanti śambʰumayobʰubʰyāṃ brahma jajñānam asya vāmasya yo rohita
          ud asya krtavo mūrdʰāham iti dve sūkte viṣāsahim iti salilagaṇaḥ || iti
          salilagaṇaḥ ||
    - section[n=23]:
      - p: ye triṣaptā iti viśvakarmā gaṇaḥ ||
    - section[n=24]:
      - p: agʰadviṣṭā devajātā śaṃ no devī varaṇo vārayā[tai] pippalī vidradʰasya
          yā babʰrava iti gaṇakarmā gaṇo bʰaisajyaś ca bʰavati || iti bʰaiṣajyagaṇaḥ
          ||
    - section[n=25]:
      - p: ayaṃ te yonir ā no bʰara dʰītī vā ya ity artʰasūktam uttʰāpano gaṇaḥ ||
          ity uttʰāpanagaṇaḥ ||
    - section[n=26]:
      - p: ambayo yanti śambʰumayobʰū hiraṇyavarṇā niḥsālāṃ ye agnayo brahma jajñānam
          ity ekaita devā mr̥gārasūktāny uttamaṃ varjayitvāpa naḥ śośucad agʰaṃ punantu
          mā sasruṣīr himavataḥ pra sravanti vāyog pūtaḥ pavitreṇa śaṃ ca no mayaś
          ca no 'naḍudbʰyas tvaṃ mahyam āpo vaiśvānaro raśmibʰir yamo mr̥tyur viśvajit
          saṃjñānaṃ no yady antarikṣe punar maitv indriyaṃ śivā naḥ śaṃ no vāto vātu
          agniṃ brūmo vanaspatīn iti śāntigaṇaḥ || iti sarvaiḥ sūktaiḥ kauśikoktabr̥haccʰāntigaṇaḥ
          ||
    - section[n=27]:
      - p: ambayo yanti śambʰumayobʰū hiraṇyavarṇā uta devā yady antarikṣe punar naitv
          indriyaṃ śivā naḥ śaṃ no vāto vātv agniṃ brūmo vanaspatīn iti śāntātīyo
          lagʰuśāntigaṇaḥ ||
    - section[n=28]:
      - p: ye triṣaptā mamāgne varcaḥ prātar agniṃ girāv aragarāṭeṣu divas pr̥tʰivyā
          hastivarcasaṃ siṃhe vyāgʰre yaśo havir yas te gandʰa iti tisr̥bʰir varcasyagaṇaḥ
          ||
    - section[n=29]:
      - p: yā asurā manuṣyā mā no vidan namo devavadʰebʰya ity abʰayagaṇaḥ ||
    - section[n=30]:
      - p: bʰūto bʰūteṣv iti rājānam abʰiṣekagaṇaḥ ||
    - section[n=31]:
      - p: '[ya] āśānām āśāpālebʰyo agner manva iti sapta sūktāni yā oṣadʰayaḥ somarājñīr
          vaiśvānaro na ā gamac cʰumbʰanī dyāvāpr̥tʰivī yad arvācī[na]m agniṃ brūmo
          vanaspatīn iti muñcantu nā bʰavāśārvā yā devīr yan mātalī ratʰakrītam ity
          etāś catasro varjayitvā aṃholiṅgagaṇaḥ ||'
  - pariśiṣṭa[n=33]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: gʰr̥takambalam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ brahmaṇe brahmavedāya
          namaskr̥tvā svayaṃbʰuve | gʰr̥takambalaṃ pravakṣyāmi brahmaṇo nigado yatʰā
          ||
      - ab@verse[n=2]: br̥haspatir mahendrāya cakāra gʰr̥takambalam ||
      - ab@verse[n=13]: atʰendro ha vā asuraiḥ parājitaś cintām āpede
      - ab@verse[n=4]: taṃ savitābravīt prāyaścittaṃ kuruṣvāpratiruddʰo bʰaviṣyasīti
      - ab@verse[n=5]: tam indro 'bravīt || bʰagavan tvam evāpratiruddʰaḥ prāyaścittaṃ
          kurv iti ||
      - ab@verse[n=6]: sa prāyaścittam akarot
      - ab@verse[n=7]: puṇye nakṣatre bārhaspatye muhūrte 'bʰijity audumbaraṃ kumbʰaṃ
          droṇena sāḍʰakena pūrayitvā tasminn eva vāsaprabʰr̥tayaḥ oṣadʰayo darbʰaprabʰr̥tayaś
          ca bilvagaurasarṣapāś cety etān saṃbʰārān saṃbʰr̥tya gʰr̥takumbʰaṃ barhiṣy
          ādʰāyaitair gaṇair ājyaṃ juhuyāt ||
      - ab@verse[n=8]: pra pateta ity ekenāṅgādaṅgāc cʰamalam avalikʰya sapatnaṃ bʰrātr̥vyaṃ
          hr̥daye imarmaṇi vāsināvidʰya gomayena kāṣāyeṇa vāccʰādya śānter apratigʰātakaṃ
          karma tato jyeṣṭʰaṃ gʰr̥takambalaṃ brahmaṇaḥ putram akarot
      - ab@verse[n=9]: tasya ha vā etasya gʰr̥takambalasya sāvitrīgaṇaśarīrasya śantātīyaḥ
          śiraḥ triṣaptīyo mukʰaṃ rudraraudrau cakṣuṣī gʰr̥taliṅga āsyaṃ nairr̥to
          jihvā dantoṣṭʰāv abʰayāparājitau kr̥tyādūṣaṇacātanau śrotre śarmavarmasvastyayanau
          bāhū mātr̥nāmavāṣṭoṣpatyau pādau....pāyuś ca bʰaiṣajyaṃ nyāyaḥ prāṇāpānāv
          iti mīmāṃsata ity
      - ab@verse[n=10]: eṣa ha vai jyeṣṭʰo gʰr̥takambalo brahmaṇaḥ putro 'parājitagaṇeneṣṭvendro
          'surān ajayan mr̥tyum alakṣmīm arātiṃ duḥsvapnadurbʰūtāny ajayad
      - ab@verse[n=11]: yatʰā caivaṃvidvān gʰr̥takambalaṃ kurute sarvakāmān āpnoti
          sarvavyādʰirahito bʰavati brahmalokam avāpnotīti brāhmaṇam ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: yadā sarvam idaṃ vyāptam asurair nāvaśeṣitam | stʰātuṃ devāḥ
          parābʰūtās te 'tʰarvāṇam upāgatāḥ ||
      - ab@verse[n=2]: karmādy ekaṃ kuruṣva tvaṃ yad bʰr̥gvaṅgirasor matam | asurāṇāṃ
          vadʰārtʰāyety uktaḥ kartātʰa so 'bʰavat ||
      - ab@verse[n=3]: paracakropasr̥ṣṭasya rājño vijayam iccʰataḥ | pratiruddʰasya
          vā bʰūyaḥ śrīkāmasyeccʰataḥ śriyam ||
      - ab@verse[n=4]: prādurbʰāvādbʰutānāṃ ca grahāṇāṃ vigrahe tatʰā | śaṅkamāno
          'bʰicārād vā kārayed gʰr̥takambalam ||
      - ab@verse[n=5]: gʰr̥tamātrā tu vijñeyā māgadʰaprastʰasaṃmitā | śatāni pañca
          droṇānāṃ palaikaśatam eva vā ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: '[sarvapāpapraṇāśāya sarvakāmārtʰasiddʰaye | sarvarogakṣayārtʰāya
          prayojyo gʰr̥takambalaḥ] ||'
      - ab@verse[n=2]: gʰr̥tapramāṇaṃ vakṣyāmi māṣakaṃ pañcakr̥ṣṇalam | māṣakāṇi catuhṣaṣṭiḥ
          palam ekaṃ vidʰīyate ||
      - ab@verse[n=3]: dvātriṃśatpalakaṃ prastʰaṃ māgadʰaiḥ parikīrtitam | āḍʰakaṃ
          tu catuḥprastʰaṃ caturbʰir droṇam āḍʰakaiḥ ||
      - ab@verse[n=4]: droṇapramāṇaṃ vijñeyaṃ brahmaṇā nirmitaṃ purā | dvādaśābʰyadʰikair
          nityaṃ palānāṃ pañcabʰiḥ śataiḥ ||
      - ab@verse[n=5]: '[gʰr̥tamātrā tu vijñeyā māgadʰaprastʰasaṃmitā | śatāni pañca
          droṇānāṃ palānāṃ vā śatottare] ||'
      - ab@verse[n=6]: gʰr̥tadroṇaśatenokta eko droṇavaras tatʰā | yatʰāśakti prayuñjīta
          gʰr̥taṃ kr̥tvātʰa bʰāgaśaḥ ||
      - ab@verse[n=7]: caturbʰāgo 'bʰiṣekāya caturbʰāgas tu hūyate | bʰāgo deyaḥ sadasyebʰyaḥ
          kartā bʰāgena yujyate ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: puṣye prayogaṃ kurvīta prājāpatye 'tʰa mārute | vaiṣṇave pūṣadaivatye
          uttareṣv atʰa vā triṣu ||
      - ab@verse[n=2]: taptakr̥cʰrāvasāne vā sarvakr̥cʰrasya cāntataḥ | yasmin vā
          snātakā brūyus tatra kuryād vicakṣaṇaḥ ||
      - ab@verse[n=3]: pākayajñavidʰānena kr̥tvopakramaṇaṃ budʰaḥ | niśākāle bahirgrāme
          kuryād agniniveśanam ||
      - ab@verse[n=4]: yajeta nirr̥tiṃ tatra kr̥ṣṇavāsāś catuṣpatʰe | yatʰoktaṃ nairr̥tair
          mantrair havirbʰiś ca yatʰākramam ||
      - ab@verse[n=5]: tr̥tīyena tu sūktena nivedya balim antataḥ | yatʰāvyāvartane
          caiva yad uktaṃ tat samācaret ||
    - section[n=5]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: tataḥ snātaḥ śuklavāsāḥ
          prāśya śāntyudakaṃ śuciḥ | paryukṣyopasamādʰāya gʰr̥tasaṃskāra iṣyate ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: pūrvaṃ mahāvyāhr̥tibʰiḥ
          sāvitryā tadanantaram | śāntiś ca brahma jajñānaṃ brahma bʰrājad itīti ca
          ||
      - ab@verse[n=3]: agne gobʰir agne 'bʰyāvartinn agne jātavedaḥ saha rayyā punar
          ūrjeti ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: agnim īLe purohitam agna
          ā yāhi vītaye | br̥haspatir na ity ekā br̥haspate yuvaṃ tatʰā ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: etair ājyaṃ ca juhuyāt
          saṃpātān ānayed gʰr̥te | kr̥tyādūṣaṇamantraiś ca kuryāc cʰāntyudake vidʰim
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃpātān ānayet tatra
          cātanair mātr̥nāmabʰiḥ | vāstoṣpatyair vāṣṭoṣpatāv ānayet samadūṣaṇam ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: nidʰāya havir āsādya gʰr̥takumbʰaṃ
          susaṃskr̥tam | gʰr̥tabʰāgau tu yāv anyau pūrveṇāgner nidʰāpayet ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: darbʰādīn tu vāsādīṃś
          ca saṃbʰārān gaurasarṣapān | bilvaṃ ca kumbʰe nidʰāyāpareṇāgner nidʰāpayet
          ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: sāvitraḥ śantātīyaś ca kr̥tyādūṣaṇa eva ca | abʰayāparājitāyuṣyā
          varcasyaś ca tataḥ paraḥ ||
      - ab@verse[n=2]: saṃsaktīyaḥ suṣuptīyaḥ svastyayanaḥ śarmavarma ca | cātano
          mātr̥nāmāni bʰaiṣajyaṃ nyāya eva ca ||
      - ab@verse[n=3]: gʰr̥taliṅgau tatʰā raudrau saṃpātān ānayed gʰr̥te | gaṇānteṣu
          yatʰāśakti brāhmaṇān svastivācayet ||
      - ab@verse[n=4]: yo 'sminn akṣībʰyāṃ te sahasrākṣaṃ brahma jajñānam | brahma
          bʰrājad ud agād idam āpas tatʰāpaś ca ||
      - ab@verse[n=5]: abʰiṣiñcet sarvamantrair āyuṣyair abʰayais tatʰā | mr̥ṇmayaś
          cātra bʰavati dveṣyasya ca parākr̥tiḥ ||
      - ab@verse[n=6]: abʰiṣiñcet sarvamantrair āyuṣyair abʰayais tatʰā | mr̥ṇmayaś
          cātra bʰavati dveṣyasya ca parākr̥tiḥ ||
      - ab@verse[n=7]: tasyopariṣṭād abʰiṣicya kuryān mātrātalekʰanīm | aṅgādaṅgād
          atʰānyena pra pateti catasr̥bʰiḥ ||
      - ab@verse[n=8]: bʰrātr̥vyaham iti vaiśvānaroyanty avasānena | dyāvādinā paryāyeṇa
          samalaṃkr̥ṭam ullikʰet ||
      - ab@verse[n=9]: dviṣantaṃ me parāvad vi dviṣantaṃ nir dahantu me | bʰrātr̥vyatān
          iti dvābʰyāṃ paryāyāś ca trayaḥ parāḥ ||
      - ab@verse[n=10]: anvālabʰya tu kartāram upaviṣṭa udaṅmukʰaḥ | svapnatakmāṣṭanayanaiḥ
          saubʰāgyair varmabʰis tatʰā ||
      - ab@verse[n=11]: rudraraudraparair mantrair ājyahomo vidʰīyate | srāktyaṃ vā
          yadi vāśvattʰam audumbaram atʰāpi vā ||
      - ab@verse[n=12]: śaṅkʰaṃ ca maṇim ābadʰya pratisarair abʰimantrayet | anvārabʰyābʰiṣekaṃ
          tu raudrābʰyāṃ juhuyāt tataḥ ||
    - section[n=7]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: yat te vāsa [iti] paridʰānaṃ
          yatʰoktaṃ paridʰāpayet | rocanā guggulu gʰr̥tam abʰyañjanam atʰāñjanam ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: tata etair alaṃkr̥tya
          īkṣayetādarṣe mukʰam | daśa gā dakṣiṇāṃ dadyād vr̥ṣabʰaṃ gʰr̥tam eva ca
          ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: brāhmaṇān svastivācyātʰa
          prāṅmukʰaḥ saṃviśet tataḥ | rakṣohaṇam [ity] anuvākaṃ japet kartātʰa r̥tvijaḥ
          ||
      - ab@verse[n=4]: śarmavarmaitad uktaṃ snātasya rakṣobʰyo 'bʰayaṃkaram iti ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: na rākṣasā na gandʰarvā
          na piśācā na cāsurāḥ | krūrāḥ puruṣamarmajñā na hiṃsanti gʰr̥tārcitam ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: siddʰābʰiṣeko naiśaś ca
          gʰr̥takambalam eva ca | lakṣaḥ puṣyābʰiṣekaś ca pradʰānāvabʰr̥tas tatʰā
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: mahāśāntitrayastriṃśat
          tatra ṣaṭ prastaraiḥ saha | niyatānyevadr̥cʰāyā kartavyā bʰūtim iccʰatā
          ||
  - pariśiṣṭa[n=34]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: anulomakalpaḥ
    - section[n=1]:
      - ab@verse[n=0]: oṃ namo 'tʰarvavedāya ||
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: akṣarāni vilomāni na svaraṃ
          pratilomayet | pratyārambʰanigʰāteṣu stʰānāny anyāni nirdiśet ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yakāras tu takārānto antyasvaritasaṃjñitaḥ
          | sa tūdāttaḥ sa evādau dakāraḥ śiṣyate guruḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: dakārāt svaryate nīcam
          upodātte pra yojayet | anyāni tu yatʰāpūrvam udāttapracitāni tu ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: pratʰamo 'ṣṭākṣaro 'rdʰarco
          dvitīyaḥ ṣoḍaśākṣaraḥ | ādāv ante ca vijñeyā vyāhr̥tiś cāpy atʰarvaṇām ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: raktavarṇā vilomā ca yamena
          parikīrtitā | sarvaśatruvināśāya sarvakarmārtʰasiddʰaye ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: mr̥tyuś ca devatā cāsyā
          nicʰannaṃ cʰanda ucyate | svāhākāre tu pʰaṭkāraḥ koṭihome vidʰiḥ smr̥taḥ
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: anulomāṃ vilomāṃ vā gāyatrīṃ
          yaḥ paṭʰet sadā | sarvārtʰās tasya sidʰyanti na cānartʰān samaśnute ||
      - ab@verse[n=8]: t yā da co pra naḥ yo yo dʰi || hi ma dʰī sya va de rgo bʰa
          yam ṇī re rva tu vi tsa ta t ||
  - pariśiṣṭa[n=35]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: āsurīkalpaḥ
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ kaṭuke kaṭukapattre
          subʰage āsuri rakte raktavāsase | atʰarvaṇasya duhite agʰore agʰorakarmakārike
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: amukaṃ hanahana dahadaha
          pacapaca matʰamatʰa | tāvad daha tāvat paca yāvan me vaśam ānayasi svāhā
          ||
      - ab@verse[n=3]: śayyāvastʰitāyās tāvaj japed yāvat svapiti || prastʰitāyā gatiṃ
          daha svāhā || upaviṣṭāyā bʰagaṃ daha svāhā || suptāyā mano daha svāhā prabuddʰāyā
          gr̥dayaṃ daha svāheti ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: atʰāta āsurīkalpam upadeśād
          atʰarvaṇaḥ | nāsyās titʰir na nakṣatraṃ nopavāso vidʰīyate ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: gʰr̥tādidravyasarveṣu
          āsurī śatajāpitā | pattrādyavayavaś cāsyā jikaiṣā cānuyāyinī ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: hantukāmo hi śatrūṃś ca
          vaśīkurvaṃś ca bʰūpatīn | āsurīślakṣṇapiṣṭājyaṃ juhuyād ākr̥tiṃ budʰaḥ ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: arkendʰanāgniṃ prajvālya
          cʰittvāstreṇākr̥tiṃ tu tām | pādāgrato 'ṣṭasahasraṃ juhuyād yasya vaśy asau
          ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: gʰr̥tāktayā strī vaśinī
          pālāśāgnau dvijottamāḥ | guḍāktayā kṣatriyās tu vaiśyās tu dadʰimiśrayā
          ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: śūdrās tu lavaṇamiśrai
          rājikāṃ piṣṭayed budʰaḥ | ā saptāhāt sarva ete āsurīhomato vaśāḥ ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: kaṭutailena trisaṃdʰyaṃ
          kuloccʰedaṃ karoti hi | śunāṃ tu lomabʰiḥ sārdʰam apasmārī tribʰir dinaiḥ
          ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: nivr̥ttiḥ kṣīramadʰvājyair
          lavaṇena tu sajvarī | arkaidʰaḥsamidagnau tu kāryo vispʰoṭasaṃbʰavaḥ ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: teṣām upaśamaṃ vidyāt
          surāśvaryā gʰr̥tena ca | arkakṣīrāktayār̥kāgnāv akṣiṇī spʰoṭayed dviṣaḥ
          ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: gatāsumāṃsaṃ tasyaiva
          nirmālyaṃ citibʰasma ca | eṣāṃ cūrṇena saṃspr̥ṣṭo hāsyaśīlo 'bʰijāyate ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: ajākṣīrāktayā homāt tasya
          mokṣo vidʰīyate | tagaraṃ kuṣṭʰamāṃsī ca tasyāḥ pattrāṇi caiva hi ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: etaiḥ ślakṣṇais tu saṃspr̥ṣṭaḥ
          pr̥ṣṭʰataḥ paridʰāvati | tasyāḥ pʰalāni mūlāni surabʰīhastimedasā ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: sūkṣmāt taddravyasaṃsparśād
          anudʰāvaty acetasaḥ | acʰidrapattrāṇy asita uśīraḥ sarṣapās tatʰā ||
      - ab@verse[n=17]: etacśūrṇāt pūrvapʰalaṃ gʰr̥te caivāparājayaḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kusumāni manahśilāpriyaṅgutagarāṇi ca | gajendramadasaṃyuktaṃ
          kiṃ kurvāṇas tv akr̥d varam ||
      - ab@verse[n=2]: yāś ca striyo 'bʰigaccʰanti tā vaśāḥ padālepataḥ | sapuṣpāṃ
          tāṃ samādāya añjanaṃ nāgakeśaram ||
      - ab@verse[n=3]: anenāktābʰyām akṣibʰyāṃ yamyaṃ paśyet sa kiṃkaraḥ | añjanaṃ
          tagaraṃ kuṣṭʰaṃ devījaṃ kāṣṭʰam eva ca ||
      - ab@verse[n=4]: māṇsī ca sarvabʰūtānāṃ saubʰāgyasya tu kāraṇam | tatsamidʰāṃ
          lakṣahomān nidʰānaṃ paśyate mahat ||
      - ab@verse[n=5]: sarpirdadʰimadʰvaktapattrāṇāṃ vr̥ddʰaputrī sahasrataḥ | rājyaṃ
          tu labʰate vaśyaṃ tatpattratrisahasrataḥ ||
      - ab@verse[n=6]: svarṇasahasrasyāptis tu tatpuṣpāṇāṃ tu lakṣataḥ | sahasrajāpāc
          ca tadvad udake kṣīrabʰakṣiṇaḥ ||
      - ab@verse[n=7]: vāripūrṇe 'tʰa kalaśe lokeśīpallavān kṣipet | snānād alakṣmyā
          mucyeta sauvarṇakalaśe 'pi tu ||
      - ab@verse[n=8]: vināyakebʰyaḥ snānato daurbʰāgyāc caiva durbʰagāt | pr̥ṣṭʰataś
          cānudʰāvanti saṃspr̥ṣṭa udakena tu ||
      - ab@verse[n=9]: uśīraṃ tagaraṃ kuṣṭʰaṃ mustā tatpattrasarṣapāḥ | cūrṇenābʰihatas
          tūrṇam īśvaro 'pi vaśo bʰavet ||
      - ab@verse[n=10]: tulasībʰūmahādevīcūrṇaspr̥ṣṭas tatʰā vaśī | rājābʰayaṃ sureśvarīmārjanād
          bʰāraṇāt tatʰā ||
      - ab@verse[n=11]: na syāt tasyādbʰutaṃ kiṃ cin na kṣudropadravas tatʰā | nānaiśvaryaṃ
          nāprajatvaṃ yasya devy āsurī gr̥he ||
  - pariśiṣṭa[n=36]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: uccʰuṣmakalpaḥ
    - section[n=1]:
      - ab@verse[n=1]: oṃ nama uccʰuṣmebʰyaḥ
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: '....śikʰāṃ devīṃ prapadye
          śaṃkarāyaṇīṃ | sarvārtʰasādʰanīṃ vibʰvīṃ sarveśīṃ brahmacāriṇīm ||'
      - ab@verse[n=3]: te iṣṭakākārakarālam aticaturmukʰam || caturvidʰais tu rūpaṃ
          dʰyānam ||
      - ab@verse[n=4]: śive jaṭile brahmacāriṇi stambʰani jambʰani mohani huṃ pʰaṭ
          namaḥ svāhā ||
      - ab@verse[n=5]: ātmarakṣā ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: prācyāṃ diśīndro rājā
          devānām ādʰipatyaṃ kurute | taṃ devaṃ bʰagavantaṃ sagaṇaṃ sānucaraṃ saparivāraṃ
          saśirāḥ praṇipatya vijñāpayati | vajreṇa praharaṇenemāṃ diśaṃ vidiśaṃ ca
          sarvakalikaluṣam aśubʰaṃ praśamayoṃ namaḥ svāhā ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: dakṣiṇasyāṃ diśi yamo
          rājā pretānām ādʰipatyam iti | daṇḍena praharaṇeneti ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: pratīcyāṃ diśi varuṇo
