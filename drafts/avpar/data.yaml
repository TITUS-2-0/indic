      - ab@verse[n=12]: atʰoccʰuṣmahr̥dayam || dyurudyuru daradara vidārayavidāraya
          milimili namaḥ svāhā ||
      - ab@verse[n=13]: uccʰuṣmaśikʰā || śive jaṭila iti pratʰamaḥ ||
      - ab@verse[n=14]: kurukuru murumuru mahā muñca mahā muñca viduvidu namaḥ svāhā
