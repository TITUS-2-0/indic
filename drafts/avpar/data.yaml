      - p: āryaḥ | āryaḥ | rāṣṭrī | niyutvān | inaḥ | īśvarasya ||63 ||
    - section[n=115]:
      - p: saṃyogaḥ | saṃyogaḥ | āśuśukṣaṇiḥ | jahā | śitāma | mehanā | mūṣaḥ | mandū
          | īrmāntāsaḥ | [vājarāndʰyam |] kāyamānaḥ | vidradʰe | tugvani | [nodʰāt
          | nadaḥ |] cyavanaḥ | kaśyapaḥ | nū cit | akūpārasya | aprāyuvaḥ | rajaḥ
          | juhure | krāṇā | viṣuṇaḥ | jāmiḥ | jasuriḥ | cayase | andʰaḥ | dugdʰam
          | āhanaḥ | nadaḥ | arkaḥ | sacā | cit | pavitram | pr̥tʰujrayāḥ | kāṇukā
          | adʰriguḥ | āṅgūṣaḥ | āpāntamanyuḥ | śmaśā | vājagandʰyam | [jarādʰya |]
          pākastʰāmā kaurayāṇaḥ | vrandī | niṣṣapī | kṣumpam | nicumpuṇaḥ | [majāyema
          | dʰr̥ruḥ |] joṣavākam | kuṭasya | kepayaḥ | salalūkam | askr̥dʰoyuḥ | niśr̥mbʰāḥ
          | [dʰruvadrakṣam |] upalaprakṣiṇī | upasi | savīmani | vidatʰāni | śrāyanta
          iva | amūraḥ | vijāmātuḥ | amavān | amīvā | amatiḥ | riśādasaḥ | ānuṣak
          | girvaṇāḥ | amyak | yādr̥śmin | śurudʰaḥ | apratiṣkutaḥ | dvibarhāḥ | urāṇaḥ
          | javāru | tatanuṣṭim | ilībiśaḥ | [irāviṇaḥ |] kiyedʰāḥ | turīpam | pratadvasū
          | diviṣṭiṣu | dūtaḥ | r̥cīṣamaḥ | anarśarātim ||64 || anarvā | [anarvā |
          cāṇḍā | vālhā] jaḍʰavaḥ | bakuraḥ | [vaktāraḥ] bekanāṭān | abʰi dʰetana
          | sadānve | parāśaraḥ | karūḍatī | danaḥ ||
    - section[n=116]:
      - p: ikṣuṇā | kīlālam | vijāmni | doṣā | [aṣṭamartyaḥ] ||65 || jyeṣṭʰam | [jyeṣṭʰam
          | asipakva |] viśvāhā | vivasavān | vāte | [tanyantaḥ | vrālma | kāmpīvakaṃsam
          | jasyatyam | jalālī |] andʰaḥ | vipaśyan | ayā ciṣṭʰā | [āṃsā | rantu |
          tamāyīvayaḥ |] śamopyāt | gulpʰaḥ | biṣkale kʰargalā | pratodaḥ | vedaḥ
          | [yatrāsmannataḥ | radʰraḥ | cikriḥ | nuluḥ |] puccʰadʰau | [suniḥ |] apāṣṭʰaḥ
          | medī | [jyenā |] maryaḥ | [saptagʰnetaḥ |] vālini | yātāram | [ruṣaṃkiḥ
          | siktaḥ |] sagaṇāḥ | [muḍimnānā | liṅgakāḥ | nādinā |] malvaḥ | amnaḥ |
          [juguḥ |] nīlāgalasālā | ailabaḥ | [daridraḥ |] nīlalohitaḥ | śvāpadaḥ |
          kunakʰī | kurīram | [upasaḥ |] tāduri | [kamatʰa | rumatʰā | sarvartebʰyaḥ
          | idam | adʰvaryuḥ | dyumnī | kuvitaḥ | damnanā |] duroṇe | [parektauti]
          | titau | [utpavādʰata |] kimīdī | vāmasya | ekacakram | amatiḥ | sumatiḥ
          | [dayate | dayanti | vrīhi | vr̥tte] ||66 || īḍe | īḍe | kṣayati | tapati
          | rajati | anekārtʰāḥ ||
