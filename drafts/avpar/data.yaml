    - section[n=24,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: śastraṃ japtam upādāya raṇe grasto na jīyate | kʰanakʰanāyeti
          mantraḥ pūrvasevārtʰa ucyate ||
      - ab@verse[n=2]: uttarasyā viśeṣād vā cedānīm ata uttaram | kʰādiratryaktasamidʰāṃ
          pūrvasevā sahasrataḥ | atasīsamidʰām evaṃ medʰāvī viduṣāṃ prabʰuḥ ||
    - section[n=25,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: gocarmamātraṃ stʰaṇḍilaṃ gomayenopalepayet | tatrāgniṃ trikapāleṣu
          jvālayitvā praṇamya ca ||
      - ab@verse[n=2]: śirasā vānareṇātʰa mukʰavādyaṃ tu kārayet | yatra tac cʰrūyate
          tatra āgaccʰanti varastriyaḥ ||
      - ab@verse[n=3]: damṣṭrāgʰaṇṭāninādās tu jvālāmukʰabʰayānakāḥ | yat tvaṃ kāmayase
          putra tat sarvaṃ dadmahe vayam ||
      - ab@verse[n=4]: iti bruvatyaḥ sarvās tā yatra homaḥ kr̥to bʰavet | tadbʰasmanā
          tu saṃspr̥ṣṭāś cʰāgalyaḥ suprabʰāvataḥ ||
    - section[n=26,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: lakṣajāpottaraṃ gatvā nadīm udadʰigāminīm | vālukāstʰaṇḍile
          liṅgaṃ tanmayaṃ tajjasadmani ||
      - ab@verse[n=2]: padmāṣṭaśatam āhr̥tya pūjayitvā vidʰānataḥ | udake nābʰimātre
          ca suprabʰātaṃ punar japet ||
      - ab@verse[n=3]: tato māṇḍaliko rājā dīnārāṇāṃ gavāṃ śatam | praṇamya śraddʰayā
          tasmai dadyād uddʰara mām iti ||
    - section[n=27,lg=san-Latn-x-vedic-metric-unacc-tld]:
