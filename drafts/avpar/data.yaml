      - ab@verse[n=3]: mr̥dudʰruvograkṣipreṣu sādʰāraṇacareṣu ca | dāruṇeṣu ca r̥kṣeṣu
          sādʰāraṇacareṣu ca | dāruṇeṣu ca r̥kṣeṣu vidyāt tatsadr̥śaṃ pʰalam ||
      - ab@verse[n=4]: yatʰādiṣṭaṃ yatʰāvarṇaṃ yatʰāvargaparigraham | sarva evoditā
          hanyuḥ sarva eva mahāgrahāḥ ||
      - ab@verse[n=5]: mr̥tyoḥ kālasya sūryasya brahmaṇas tryambakasya ca | bʰaumasya
          rāhor agneś ca prajātā ye sudāruṇāḥ ||
    - section[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: prajāpateś ca dʰarmasya somasya varuṇasya ca | pītādyāś ca
          diśāṃ putrā vijñeyā mr̥dudāruṇāḥ ||
      - ab@verse[n=2]: kaśyapasya ca marīcer uddālakar̥ṣes tatʰā | putrā mandapʰalā
          jñeyās teṣām amr̥tasaṃbʰavāḥ ||
      - ab@verse[n=3]: śukrādīnāṃ ca ye putrā grahāṇāṃ parikīrtitāḥ | teṣāṃ vīryāṇi
          jāniyāt pitr̥bʰyaḥ sādʰikāni tu ||
      - ab@verse[n=4]: nāradātreyagargāṇāṃ guror uśanasas tatʰā | grahāṇāṃ saṃgraho
          hy evam eṣa kārtsnyena kīrtitaḥ ||
      - ab@verse[n=5]: anekaśatasāhasra anekaśatalakṣaṇaḥ | devalabdʰavarākāśe prāha
          sarvān pr̥tʰakpr̥tʰak ||
      - ab@verse[n=6]: etaduttʰe tu sarvasmin bʰaye 'tʰa samupastʰite | mahāśāntiṃ
          prakurvīta rājā rāṣṭrasya rakṣaṇe ||
      - ab@verse[n=7]: tat prayāti śamaṃ sarvaṃ prajānāṃ tu sukʰaṃ bʰavet | rājāno
          muditās tatra pālayanti vasuṃdʰarām ||
  - pariśiṣṭa[n=53]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: rāhucāraḥ
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: om upetya yaś candramasaṃ
          raviṃ vā gr̥hṇāti sūnor asurasya putraḥ | nibodʰataitasya śubʰāśubʰāni grahasya
          mr̥tyoḥ praticeṣṭitāni ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: yadā tu rāhuḥ śaśino raver
          <vā> [grahe] grahītukāmo bʰavati prasahya | tadā karoty adbʰutadarśanāni
          yair jñāyate rāhur upaiṣyatīti ||
      - ab@verse[n=3]: udvepate tadā candro yadā rāhuḥ pradr̥śyate || pāṇḍur vā jāyate
          klībaḥ śaśo vāsya vivardʰate ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: rekʰāntarāpurārāṇi kalmaṣāṇi
          divākare | vadanti ca bʰar̥śaṃ śvāno vānti vātāś ca bʰīṣaṇāḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃdʰyayor ubʰayoś colkā
          gavāṃ prakṣīyate payaḥ | kṣīriṇām aiva vr̥kṣāṇāṃ tad ahar naśyate payaḥ
          ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: apsu snigdʰāni dr̥śyante kākābadʰnanti maṇḍalam | ūrdʰvaṃ vadati
          gomāyur yadā rāhuḥ pradr̥śyate ||
      - ab@verse[n=2]: candragrahanimittāni śuklapakśāṣṭamīparam | ā paurṇamāsyā dr̥śyeran
          sūryasya ca tatʰobʰayoḥ ||
      - ab@verse[n=3]: udito gr̥hyamāṇas tu hanti vedavido janān | bālāṃś ca jaṭilān
          hanti ye ca kāṣāyavāsasaḥ ||
      - ab@verse[n=4]: yauvanastʰāṃś ca pūrvāhṇe hanti yajñavido janān | audakāni
          ca sarvāṇi nāgendrāś cātra duḥkʰitāḥ ||
      - ab@verse[n=5]: atʰa madʰyapatʰaṃ prāptaḥ śūdrān hanti ca taskarān | parivr̥kto
          nr̥paṃ hanti candraś caraṇacāraṇān ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: pralambaḥ pramadān hanti kṣatraṃ rāṣṭraṃ ca sarvaśaḥ | traigartāś
          cātra pīḍyante ye ca daṇḍabʰr̥to janāḥ ||
      - ab@verse[n=2]: uparakto yadodeti yadā vā pratitiṣṭʰati | ayogakṣemam ādiśyet
          triṣu lokeṣu dāruṇam ||
      - ab@verse[n=3]: śāradaṃ trīṇi varṣāṇi sasyaṃ jātaṃ na pacyate | naidāgʰenātra
          jīvanti prajā mūlapʰalena vā ||
      - ab@verse[n=4]: sarvaṃ saṃgrasate jyotiś ciram antardadʰāti vā | hanti spʰītāni
          rāṣṭrāṇi pradʰānaṃ ca mahīpatim ||
      - ab@verse[n=5]: yadi <tu> rāhur ubʰau śaśibʰāskarau grasati pakṣam anantaram
          antataḥ | puruṣaśoṇitakardamavāhinī bʰavati bʰūr na ca varṣati mādʰavaḥ
          ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: gr̥hītvā bʰāskaraṃ pūrvaṃ gr̥hṇāti śaśinaṃ yadi | taṃ tu somottaraṃ
          nāśas tatra rdʰyante hi devatāḥ ||
      - ab@verse[n=2]: vayasāṃ maraṇaṃ cʰidre prakīrṇe rakṣasāṃ vadʰaḥ | nāgānāṃ tu
          mahānāge cʰidre devo na varṣati ||
      - ab@verse[n=3]: śveto varṇo brāhmaṇānāṃ kṣatriyāṇāṃ tu lohitaḥ | vaiśyānāṃ
          pītako varṇaḥ śūdrāṇāṃ kr̥ṣṇa ucyate ||
      - ab@verse[n=4]: eteṣāṃ yena varṇena rāhuś carati bʰāskare | yā jātis tasya
          varṇasya tāṃ sa pīḍayate grahaḥ ||
      - ab@verse[n=5]: śyāmo bʰavati vātāya draukṣo bʰavati vr̥ṣṭaye | haridraḥ sarvadʰānyānāṃ
          kopaṃ sr̥jati dāruṇam ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: tāmro bʰavati śastrāya śastrāya rūkṣo bʰavati mr̥tyave | bahvākāras
          tu bʰūtānāṃ gʰoraṃ janayate jvaram ||
      - ab@verse[n=2]: dʰūmavarṇo 'gnivarṇo vā grāmeṣu nagareṣu vā | agnyutpātān gr̥hastʰānāṃ
          karotīha mahāgrahaḥ ||
      - ab@verse[n=3]: nīlalohitaparyanto rāhuś carati bʰāskare | amātyo hanti rājānaṃ
          rājā vāmātyam ātmaha ||
      - ab@verse[n=4]: yasya rājñaś ca nakṣatre svarbʰānur uparajyati | rājyabʰraṃśaṃ
          suhr̥nnāśaṃ maraṇaṃ cātra nirdiśet ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: snigdʰavarṇo yadārciṣmān parvastʰaḥ snehavān grahaḥ | kṣipraṃ
          vāpy uditaṃ brūhi sarvabʰūtabʰayāya vai ||
      - ab@verse[n=2]: pradakṣiṇe tu somasya apasavye tu vigrahaḥ | raśmibʰede bʰayaṃ
          gʰoram ullekʰe mantriṇāṃ vadʰaḥ ||
      - ab@verse[n=3]: darśayitvā tu rūpāṇi yadā rāhur na dr̥śyate | śastradurbʰikṣasaṃpātair
          bʰayaṃ gʰoraṃ vinirdiśet ||
      - ab@verse[n=4]: gr̥hītāstamitayos tu na bʰuñjīran dvijātayaḥ | ā punardarśanāt
          tābʰyāṃ japahomau vivartayet ||
      - ab@verse[n=5]: candrasūryagrahe nādyād adyāt snātvā tu muktayoḥ | amuktayor
          astaṃgayor adyāt snātvā pare 'hani ||
      - ab@verse[n=6]: tataḥ ṣaṭsu tataḥ ṣaṭsu tato 'dʰyardʰeṣū vā punaḥ | ardʰavarṣeṣu
          māseṣu ādityasya tato grahaḥ ||
      - ab@verse[n=7]: tataḥ ṣaṭsu tataḥ ṣaṭsu triṣu varṣeṣu vā punaḥ | etāvad eva
          rāhos tu cāram āhur manīṣiṇaḥ ||
  - pariśiṣṭa[n=54]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: ketucārāḥ
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ bʰārgavas tu purovāca
          maharṣīn bʰagavān r̥ṣiḥ | ketusaṃcāraṃ śr̥ṇuta uttʰānaṃ caiva yādr̥śam ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: nimittani ca vakṣyāmitasyoktāni
          hi yāni tu | tāni sarvāṇi jāniyād utpātajñānakovidaḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: viprāñ śvetākr̥tir hanti
          kṣatriyān hanti lohitaḥ | vaiśyāṃs tu pītako hanti śūdrān hanti tatʰāsitaḥ
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: itarān pīḍayet ketur anyavarṇo
          yadā bʰavet | ṣaṇmāsābʰyantare rājño maraṇaṃ ca tadādiśet ||
      - ab@verse[n=5]: śvetaḥ śastrākulaṃ kuryāl lohitas tv agnito bʰayam. kṣudbʰayaṃ
          pītakaḥ kuryāt kr̥ṣṇo rogam atʰolbaṇam ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: yasmin deśe śiras tasya
          sa deśaḥ pīḍyate bʰr̥śam | madʰye tu madʰyamā pīḍā yato puccʰaṃ tato jayaḥ
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: śaktyākāro 'tināśāya duḥkʰāya
          musalākr̥tiḥ | dīrgʰaḥ sūkṣmaḥ sukʰāyaiva hrasvaḥ stʰūlo vināśakr̥t ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: uttʰānaṃ caiva ketūnāṃ
          vināśāyaiva hi smr̥tam | tasmād ātʰarvaṇair mantraiḥ śamanam ārayed budʰaḥ
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: māhendrūn anr̥tān raydrūn
          vauśvadevīm atʰāpi vā | utpāteṣu mahāśāntiṃ kārayed bahudakṣiṇām ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: ārādʰitāḥ śamaṃ yānti
          tadutpātā na saṃśayaḥ | homair japyaiś ca vividʰair dānaiś cabahurūpakaiḥ
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: tasya yatra śiro deśe
          tata uttʰāya vāvrajet | dʰanaṃ vā sarvam utsr̥jya mr̥tyor mucyetā vā na
          vā ||
      - ab@verse[n=7]: dattvā vā pr̥tʰivīṃ sarvāṃ rājā śāntiṃ niyaccʰati ||
  - pariśiṣṭa[n=55]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: r̥tuketulakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: om r̥tuketūn pravakṣyāmi
          yatʰāvad anupūrvaśaḥ | yāvanto yasya putrāḥ syuḥ kuryur yac coditā divi
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: sarve te dʰaraṇījātā māsā
          ye devanirmitāḥ | ādityaraśmibʰir baddʰāḥ saure tiṣṭʰanti maṇḍale ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: daśa vai vāruṇās tatra
          sūryaputrās tu viṃśatiḥ | caturviṃśatir āgneyā yamaputrā nava smr̥tāḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: aṣṭādaśa ca kauberā vāyuputrās
          tu viṃśatiḥ | eṣā saṃkʰyā tu ketūnāṃ śatam ekottaraṃ smr̥tam ||
      - ab@verse[n=5]: śrāvaṇaprauṣṭʰapadayor vāruṇāṃs tu vinirdiśet ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: '[ārādʰitāḥ śamaṃ yānti
          tadutpātā na saṃśayaḥ | homair jāpaiś ca vividʰair dānaiś ca bahurūpakaiḥ
          ||]'
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: āvāhayet tato megʰān pūrṇāṃ
          kuryād vasuṃdʰarām | unmattāḥ sarito yānti jalavegasamāhitāḥ ||
      - ab@verse[n=8]: dʰānyaṃ samargʰatāṃ yāti ītayo na bʰavanti hi udaye vāruṇānāṃ
          tu etad bʰavati lakṣaṇam ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: aśvayuji kārttike ca sūryaputrān vinirdiśet | teṣāṃ caiva tu
          karmāṇi lakṣaṇaiḥ śr̥ṇu yādr̥śaiḥ ||
      - ab@verse[n=2]: tato dahati dīptāṃśuḥ sarvānnāni divākaraḥ | mriyante ca tatʰā
          gāvaḥ śvāpadāś ca viśeṣataḥ ||
      - ab@verse[n=3]: viṣaṃ ca prabalaṃ tatra sarvadamṣṭriṣu dāruṇam | udaye sūryaputrāṇām
          etad bʰavati lakṣaṇam ||
    - section[n=3]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: mārgaśīrṣe ca pauṣe ca
          agniputrān vinirdiśet | teṣāṃ caiva tu karmāṇi lakṣaṇaiḥ śr̥ṇu yādr̥śaiḥ
          ||
      - ab@verse[n=2]: agnir dahati rāṣṭrāṇi haritāni vanāni ca vidravanti tato deśāḥ
          samantād bʰayapīḍitāḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: kasmiṃś cij jāyate kṣemaṃ
          kasmiṃś cij jāyate bʰayam | udaye hy agniputrāṇām etad bʰavati lakṣaṇam
          ||
    - section[n=4]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: māgʰapʰālbunayor madʰye
          yamaputrān vinirdiśet | teṣāṃ caiva tu karmāṇi lakṣaṇaiḥ śr̥ṇu yādr̥śaiḥ
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: śīgʰraṃ bʰavati durbʰikṣaṃ
          hāhābʰūtam acetanam | cʰardijvarātisārāś ca glāniś caivākṣivedanā ||
      - ab@verse[n=3]: udaye yamaputrāṇām etad bʰavati lakṣaṇam ||
    - section[n=5]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: caitravaiśākʰayor madʰye
          kauberāṃs tu vinirdiśet | teṣāṃ caiva tu karmāṇi lakṣaṇaiḥ śr̥ṇu yādr̥śaiḥ
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: uccʰritair dʰvajavedībʰir
          uccʰritair dʰvajatoraṇaiḥ | havirdʰūmākulā tatra dr̥śyate vasudʰā tadā ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: triviṣṭapaṃ samāpannas
          tadā śakro mahīpatiḥ | evaṃ prajñās tu manyante kubere graham āgate ||
      - ab@verse[n=4]: udaye tu kuberāṇām etad bʰavati lakṣaṇam ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: jyaiṣṭʰe caiva tatʰāṣāḍʰe vāyuputrān vinirdiśet | teṣāṃ caiva
          tu karmāṇi lakṣaṇaiḥ śr̥ṇu yādr̥śaiḥ ||
      - ab@verse[n=2]: vāyanti ca mahāvātā mahāyuddʰaṃ mahābʰayam | bʰajyante ca mahāvr̥kṣās
          toraṇāṭṭālakāni ca ||
      - ab@verse[n=3]: gr̥hāṇi rāmaṇīyāni kṣayaṃ yānti jalāni ca | udaye vāyuputrāṇām
          etad bʰavati lakṣaṇam ||
      - ab@verse[n=4]: r̥tugatam udayanam eṣāṃ mahaujasāṃ vāruṇādiketūnām | jānāti
          yaḥ pʰalaṃ ca protkr̥ṣṭāḥ saṃpadas tasya ||
  - pariśiṣṭa[n=56]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: kūrmavibʰāgaḥ
    - section[n=1]:
      - ab@verse[n=1]: oṃ kr̥ttikārohiṇīsaumyaṃ madʰyaṃ kūrmasya nirdiśet || śeṣān
          r̥kṣavibʰāge tu trikaṃ prati vinirdiśet ||
      - ab@verse[n=2]: sāketamitʰile mekalālayāv ahicʰattranāgapuraṃ kāśipāriyātrakurupāñcālāḥ
          || atʰa kosalakauśāmbītīraṃ pāṭaliputraṃ kaliṅgapurapr̥tʰivīmaṇḍalamadʰye
          'bʰihate 'bʰihanyāt ||
      - ab@verse[n=3]: aṅgavaṅgakaliṅgamāgadʰamahendragavasam ambaṣṭʰāḥ || bʰāgāḥ
          pūrvasamudrāḥ śirasy abʰihate 'bʰihanyāt ||
      - ab@verse[n=4]: kʰaśabʰadrā samataṭasamavardʰamānakavaidehā gāndʰārāḥ || kosalatosalaveṇātaṭasajjapurā
          mādreyatāmaliptā dakṣiṇapūrve hate 'bʰihanyāt ||
      - ab@verse[n=5]: āvantyakā vidarbʰā matsyā cakorabʰīma[gam]ratʰā yavanavalayakāntīsiṃhalalaṅkuṇanāsikyakarmaṇoyāmimahi^narmadabʰr̥gukaccʰā
          dakṣiṇapaścād dʰate 'bʰihanyāt ||
      - ab@verse[n=6]: sahyagirivaijayantī kuṇkuṇanāsikyakarmaṇoyāmimahinarmadabʰr̥gukaccʰā
          dakṣiṇapaścād dʰate 'bʰihanyāt ||
      - ab@verse[n=7]: saurāṣṭrasindʰusauvīramālavā rāmarāṣṭrakānvītān || ānartagaccʰayantrān
          puccʰe 'bʰihate 'bʰihanyāt ||
      - ab@verse[n=8]: sārasvatāṃs trigartān matsyān nānvārabālhikān || matʰurāpuraṃgadeśān
          uttarabʰāge hate 'bʰihanyāt ||
      - ab@verse[n=9]: brahmāvartaṃ śatadruhimavantaṃ parvataṃ ca mainākaṃ kāśmīraṃ
          caiva tatʰā uttarapārśve hate 'bʰihanyāt ||
      - ab@verse[n=10]: nepālakāmarūpaṃ ca videhodumbaraṃ tatʰā || tatʰāvantyaḥ kaikayaś
          ca uttarapūrve hate 'bʰihanyāt ||
  - pariśiṣṭa[n=57]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: maṇḍalāni
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: viśākʰe kr̥ttikāḥ puṣyaḥ pūrvau proṣṭʰapadau tatʰā | bʰaraṇyaś
          ca magʰāś caiva pʰalgunyau pratʰame tatʰā ||
      - ab@verse[n=2]: yady atra calate bʰūmir nirgʰātolkāsta eva vā | aśarīrāś ca
          nardante kampante daivatāni ca ||
      - ab@verse[n=3]: ādityo vātra gr̥hyeta somo vāpy uparajyate | āgneyaṃ tad vijānīyād
          durbʰikṣaṃ cātra nirdiśet ||
      - ab@verse[n=4]: alpakṣīrās tatʰā gāvo agner vyādʰiś ca jāyate | purāṇi deśā
          grāmāś ca pīḍyante hy agninā tadā ||
      - ab@verse[n=5]: pīḍyante cāgnikarmāṇo agniveśāś ca ye narāḥ | pittajvaras tatʰā
          śvāsaha prajāḥ pīḍayate tadā ||
      - ab@verse[n=6]: akṣirogās tatʰā gʰorāḥ puruṣāṇāṃ viśeṣataḥ | āpagāś cātra śuṣyanti
          na ca sasyavatī mahī ||
      - ab@verse[n=7]: tapyate ca tadā bʰūmir na ca devo 'bʰivarṣati | nīlalohitaparyaktā
          apʰalāḥ pādapās tatʰā ||
      - ab@verse[n=8]: durbʰikṣaṃ marako vyādʰiḥ paracakrabʰayaṃ tatʰā | etai rūpais
          tu vijñeyam āgneyaṃ caladarśanam ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: hasto 'śvinyau tatʰā citrā r̥kṣam aryamadaivatam | brāhmaṃ
          mr̥gaśiraḥ svātir vāyavyaṃ maṇḍalaṃ smr̥tam ||
      - ab@verse[n=2]: yady atra calate bʰūmir nirgʰātolkāsta eva vā | aśarīrāś ca
          nardante kampante daivatāni ca ||
      - ab@verse[n=3]: ādityo vātra gr̥hyeta somo vāpy uparajyate | vāyavyaṃ tad vijānīyād
          akṣemaṃ cātra nirdiśet ||
      - ab@verse[n=4]: pāṃsuvarṣaṃ tadā gʰoraṃ kṣīre sarpir na vidyate | prāsādatoraṇādīni
          prapatanti mahītale ||
      - ab@verse[n=5]: madrakā yavanāś caiva śakāḥ kāmbojabālhikāḥ | gandʰārāś ca
          vinaśyanti etaiḥ sārdʰaṃ tatʰā kila ||
      - ab@verse[n=6]: gajā vājina uṣṭrāś ca vr̥kā nakulaceṭakāḥ | pīḍyante vyādʰinā
          sarve ye ca śastropajīvinaḥ ||
      - ab@verse[n=7]: pure śreṣṭʰā vinaśyanti gaṇeṣu guṇasaṃmitāḥ | gr̥hāṇi ramaṇīyāni
          viśīryante ca sarvaśaḥ ||
      - ab@verse[n=8]: āyāsaś colbaṇas tatra śastrabʰrāmaḥ samantataḥ | etai rūpais
          tu vijñeyaṃ vāyavyaṃ caladarśanam ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: ārdrāśleṣās tatʰā mūlan pūrvāṣāḍʰās tatʰaiva ca | vāruṇaṃ revatī
          caiva sūryadaivatyam eva ca ||
      - ab@verse[n=2]: yady atra calate bʰūmir nirgʰātolkāsta eva vā | aśarīrāś ca
          nardante kampante daivatāni ca ||
      - ab@verse[n=3]: ādityo vātra gr̥hyeta somo vāpy uparajyate | vāruṇaṃ tad vijānīyāt
          subʰikṣaṃ cātra nirdiśet ||
      - ab@verse[n=4]: bahukṣīrās tatʰā gāvo nāgāś ca pʰalinas tatʰā | śāntārayaḥ
          prajāḥ sarvā gomino jaṅgalaṃ payaḥ ||
      - ab@verse[n=5]: jalopajīvinaḥ sarve prāpnuvanty r̥ddʰim uttamām | kʰecarāś
          cātra dr̥śyante snigdʰavarṇāḥ samantataḥ ||
      - ab@verse[n=6]: nyastaśastrāś ca rājāno brahmakṣatraṃ ca vardʰate | etai rūpais
          tu vijñeyaṃ vāruṇaṃ caladarśanam ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: jyeṣṭʰānurādʰā śravaṇaḥ śraviṣṭʰāś ca punarvasū | prājāpatyam
          āṣāḍʰāś ca māhendraṃ maṇḍalaṃ smr̥tam ||
      - ab@verse[n=2]: yady atra calate bʰūmir nirgʰātolkāsta eva vā | aśarīrāś ca
          nardante kampante daivatāni ca ||
      - ab@verse[n=3]: ādityo vātra gr̥hyeta somo vāpy uparajyate | māhendraṃ tad
          vijānīyāt sukṣemaṃ cātra nirdiśet ||
      - ab@verse[n=4]: gāvaḥ samagravatsāś ca striyaḥ putrasamanvitāḥ | kīṭā vyālā
          mriyante ca ye cānye svedajantavaḥ ||
      - ab@verse[n=5]: vedādʰyayanayajñeṣu brāhmaṇā niratāḥ sadā | viṭkṣatriyāḥ svakarmāṇaḥ
          śūdrāḥ śuśrūṣakārakāḥ ||
      - ab@verse[n=6]: viṃśatiśataṃ tv āgneyaṃ vāyavyaṃ navatiṃ calet | aśītiṃ calate
          tv aindraṃ vāruṇaṃ saptatiṃ calet ||
      - ab@verse[n=7]: āgneyo bʰūmikampo yaḥ sa dvimāsād vipacyate | vāruṇas tu pʰalaṃ
          sadyo vāyavyas tu trimāsikaḥ || māhendrasya pʰalaṃ vidyān māsam ardʰaṃ tatʰaiva
          ca ||
  - pariśiṣṭa[n=58]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: digdāhalakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: om ata ūrdʰvaṃ ca digdāhān
          kīrtyamānān nibodʰata | yatʰā diśaḥ pradahyante tāsāṃ dāhapʰalaṃ ca yat
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: indro 'gnir marutaś caiva
          pradahanti diśo daśa | śubʰāśubʰāya lokānāṃ kr̥tāntenābʰicoditāḥ ||
      - ab@verse[n=3]: yadāstamita āditye vahner jvālā pradr̥śyate. diśāṃ dāhaṃ tu
          tad vidyād bʰārgavasya vaco yatʰā ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: nānārāgasamuttʰānāṃ nānāvidʰapʰalodayāḥ
          | pāṃśuneva ca saṃcʰannā digdāhāyogam āśritāḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: diśaḥ sarvāḥ pradahyante
          akṣemāya pʰalāya ca | avadāhād r̥te dāhaṃ yadi snigdʰāḥ pradarśanāḥ ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: tamodʰūmarajaskā ye dīptadvijamr̥gāvr̥tāḥ
          | pradīptalakṣaṇāḥ satyāḥ sarva evāhitāvahāḥ ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: tatʰā kanakakiṃjalkataḍitkalpāḥ
          śivāś ca ye | rūkṣāḥ kr̥ṣṇātʰa māñjiṣṭʰā bandʰujīvakavac ca ye ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: śvetā raktāś ca pītāś
          ca dāhāḥ kr̥ṣṇāś ca varṇataḥ | brahmakṣatriyaviṭśūdravināśāya prakīrtitāḥ
          ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: raktāḥ śastrabʰayaṃ kuryur
          pītā vyādʰiprakopanāḥ | agnivarṇās tatʰā kuryur agniśastrabʰayaṃ mahat ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: sapītaparuṣaśyāmā ye
          ca vāruṇasaṃnibʰāḥ | sarva eva kṣudʰārogamr̥tyuśastrāgnikopanāḥ ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: r̥tau tu varṣaṃ tīvraṃ
          syāt sainyavidravam eva ca | bʰr̥śam uddyotanī saṃdʰyā kurute vā grahāgamam
          ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: dikṣu dagdʰāsu pīḍyante
          yatʰādig deśabʰaktayaḥ | śakunajñānanirdiṣṭā ye ca tatrādʰikārakāḥ ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: yatʰoktā tu mahāśāntir
          yatʰoktavidʰinā kr̥tā | sarvaṃ digdāhajaṃ gʰoraṃ śamayet sā sadakṣiṇā ||
  - pariśiṣṭa[n=58b]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: ulkālakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: om ulkādayo hi nirdiṣṭā nirgʰātās tu purātra ye | teṣām idānīṃ
          vakṣyāmi viśeṣāṃs tu pr̥tʰakpr̥tʰak ||
      - ab@verse[n=2]: aṅgānām āntarikṣāṇāṃ yad aṅgam abʰipūjitam | tad ulkālakṣaṇaṃ
          śrīmad aṅgaṃ kārtsnyena vakṣyate ||
      - ab@verse[n=3]: apradʰr̥ṣyāṇi yāni syuḥ śarīrāṇīndriyair dr̥ḍʰaiḥ | kṣamāvanti
          viśuddʰāni satyavratarātāni ca ||
      - ab@verse[n=4]: tāny etāni prakāśante bʰābʰir vitimiraṃ nabʰaḥ | samantāj jvalayantīha
          yasmād asukaraṃ nabʰaḥ ||
      - ab@verse[n=5]: tāni bʰāvakṣayād bʰūyaḥ pracyutāni nabʰastalāt | kṣitau salakṣaṇāny
          eva nipatantīha bʰārgava
      - ab@verse[n=6]: teṣāṃ nipatatāṃ tatra yatrayatropalakṣyate | tatratatraiva
          vividʰaṃ prajānāṃ jāyate bʰayam ||
      - ab@verse[n=7]: rūpavarṇaprabʰāsnehapramaṇākr̥tisaṃgamaiḥ | teṣāṃ balābalaṃ
          jñātvā guṇadoṣaḥ pravakṣyate ||
      - ab@verse[n=8]: tārā dʰiṣṇyās tatʰolkāś ca vidyuto 'śanayas tatʰā | vikalpāḥ
          pañcadʰā caiṣāṃ parasparabalottarāḥ ||
      - ab@verse[n=9]: tatra śabdenba mahatā visvareṇa vikarṣiṇā | mahācakram ivāgaccʰad
          āyatākṣā nabʰastalāt ||
      - ab@verse[n=10]: manuṣyamr̥gahastyaśvavr̥kṣāśmapatʰaveśmasu | patanty aśanayo
          dīptāḥ spʰoṭayantyo dʰarātalam ||
    - section[n=2]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: sahasaivopapanneṣu bʰr̥śaṃ
          tadanuyāyinā | sattvavibʰraṃśinātyartʰaṃ śabdenodvegakāriṇā ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: jvālābʰāravisarpiṇyaḥ
          prakr̥tyā duḥkʰadarśanāḥ | vidyuto nipatanty āśu jīveṣu vanarāśiṣu ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: tīkṣṇaśūlaviśālāgrā patantī
          cāpi vardʰate | prakr̥tyā pauruṣī tūlkā tasyā bʰedān nibodʰata ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥śā nārīva dīptā syāc
          cʰikʰā sāṅgāravarṣiṇī | uddyotayantī gaganaṃ kāñcanenaiva varmaṇā ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: pītena pāṇḍunā vāpi dʰūmadʰūmāruṇena
          vā | viśīryatā mahābʰreṇa mahatā cānuṣaṅgiṇā ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: vaṃśagulmanibʰāś cāpi
          kāś cid indradʰvajopamāḥ | kāś cid indrāyudʰaprakʰyāḥ kāś cin maṇḍalasaṃstʰitāḥ
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: cʰattravac cāpu dr̥śyante
          cakravan nipatanti ca | daṇḍavac cāpi tiṣṭʰanti pradʰāvanti ca sarpavat
          ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: prakīrṇena kalāpena kʰe
          gaccʰantīva barhiṇaḥ | abʰyuccʰritena puccʰena yāti kā cid dʰarātalam ||
      - ab@verse[n=9]: tejāṃsi vikiranty anyāḥ pradʰāvanti ca golavat ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: pranr̥ttapretamārjātavarāhānugatās tatʰā | sasvanā niḥsvanāś
          cāpi patanti dʰaraṇītale ||
      - ab@verse[n=2]: etāsāṃ pʰalam ulkānāṃ pravakṣyāmi pr̥tʰakpr̥tʰak | tantunaiva
          hi saṃbaddʰā uhyamāneva vāyunā ||
      - ab@verse[n=3]: patantī dr̥śyate kā cit kā cid bʰramati cāmbare | ulkāsaṃgʰaiḥ
          parivr̥tā kā cid yāti dʰarātalam ||
      - ab@verse[n=4]: sāmānyaṃ tu pʰalaṃ tāsāṃ tat samāsena vakṣyate | varāhapretaśārdūlasiṃhamārjāravārāiḥ
          ||
      - ab@verse[n=5]: tulyā bʰayāvahā ulkā nikr̥ṣṭāhinibʰā ca yā | śūlapaṭṭiśaśaktyr̥ṣṭimudgarāsiparaśvadʰaiḥ
          ||
      - ab@verse[n=6]: vr̥ṣṭyākāreṇa tulyāś ca vr̥kṣābʰāś ca vigarhitāḥ | padmaśaṅkʰenduvajrāhimatsyadʰvajanibʰāḥ
          śubʰāḥ ||
      - ab@verse[n=7]: śrīvr̥kṣasvastikāvārtahaṃsadviradavarcasaḥ | jvalitāṅgārasaṃkāśā
          jihmagā atʰa śīgʰragāḥ ||
      - ab@verse[n=8]: vinā puccʰāvakāśena hrasvenātikr̥śena vā | daśāntarāṇi dʰanuṣaḥ
          puccʰaṃ cāpi pradr̥śyate ||
      - ab@verse[n=9]: ulkāvikāro boddʰavyo dʰiṣṇya ity abʰisaṃjñitaḥ | yas tu śuklena
          varṇena vapuṣā pelavena vā ||
      - ab@verse[n=10]: padmatantunikāśena dʰūmarājīnibʰena vā | ulkāvikāraḥ so 'py
          uktas tārakā nāmanāmataḥ ||
      - ab@verse[n=11]: evaṃ pañcavidʰā hy etāḥ śaunakena prakīrtitāḥ | svargacyutānāṃ
          patatāṃ lakṣaṇaṃ puṇyakarmaṇām ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: etāsām indraśirasi patanaṃ nr̥pater bʰayam | devatārcāsu patane
          rājarāṣṭrabʰayaṃ bʰavet ||
      - ab@verse[n=2]: puradvare purakṣobʰa indrakīle janakṣayaḥ | brahmāyatanagʰāteṣu
          brāhmaṇānām upadravaḥ ||
      - ab@verse[n=3]: caityavr̥kṣābʰigʰāteṣu satkr̥tyānāṃ mahad bʰayam | dvāre cāyuḥkṣayaṃ
          vidyād gr̥he tu svāmino bʰayam ||
      - ab@verse[n=4]: goṣṭʰeṣu gomināṃ vidyāt karṣakāṇāṃ kʰaleṣu ca | gr̥heṣu rājñāṃ
          jānīyād bʰeṣu tadbʰaktināṃ bʰayam ||
      - ab@verse[n=5]: āśāgrahopagʰāteṣu taddeśyānāṃ tapasvinām | adʰomukʰīnr̥paṃ
          hanyād brāhmaṇān ūrdʰvagāminī ||
      - ab@verse[n=6]: tiryaggā rājapatnīṃ ca śreṣṭʰinaḥ pratilomanī | vaṃśagulmanibʰā
          rāṣṭraṃ nr̥pam indradʰvajopamā ||
      - ab@verse[n=7]: gajam indrāyudʰaprakʰyā puraṃ maṇḍalasaṃstʰitā | mantriṇaś
          cakrasaṃstʰānā cʰattrākārā purodʰasam ||
      - ab@verse[n=8]: mayūrapuccʰānugatā kuryād ulkā jalakṣayam | vilīyamānā nabʰasi
          pibaty ulkā payodʰarān ||
      - ab@verse[n=9]: spʰuliṅgān visr̥jantyo yāḥ pradʰāvanti samantataḥ | golavac
          ca pradʰāvanti tāsu rāṣṭrabʰayaṃ bʰavet ||
      - ab@verse[n=10]: ulkāsaṃgʰaiḥ parivr̥tā yāḥ patanti nabʰastalāt | anusāriṇya
          ulkās tā rājarāṣṭrabʰayāvahāḥ ||
      - ab@verse[n=11]: pretānugatamārgāś ca varāhānugatāś ca yāḥ | kravyāgnivyālarūpāś
          ca tā janakṣayakārikāḥ ||
      - ab@verse[n=12]: kṣeveḍitāspʰoṭitotkruṣṭā gītavāditranisvanāḥ | ulkāpāteṣu
          boddʰavyā rājarāṣṭrabʰayāvahāḥ ||
      - ab@verse[n=13]: sasvanā dāruṇāḥ saṃdʰyāvāyoś ca pratilomagāḥ | nabʰo madʰyaṃ
          ca yā yānti yāś ca kuryur gatāgatam ||
      - ab@verse[n=14]: hinasti śuklā śirasā madʰyena kṣatajaprabʰā | pārśvābʰyāṃ
          pītakā hanti kr̥ṣṇolkā puccʰayoginī ||
      - ab@verse[n=15]: śuklā devanr̥pān hanyāt kṣatriyān kṣatajaprabʰā | pītā vaiśyopagʰātāya
          śūdrān hanyāt sitetarā ||
      - ab@verse[n=16]: patantyo nopalakṣyante karma tāsāṃ prakāśate | kṣitāv aśanayo
          yatra tatra nāsti bʰayāgamaḥ ||
      - ab@verse[n=17]: satārā nipatanty anyā mārutapratilomagāḥ | bʰavanti vidyuto
          neṣṭā iṣṭāś ca syur ato 'nyatʰā ||
      - ab@verse[n=18]: tārā dʰiṣṇyāś ca boddʰavyāś cirān mr̥dupʰalodayāḥ | tāsām
          api ca bʰūyiṣṭʰaṃ patanaṃ doṣakārakam ||
      - ab@verse[n=19]: yatoyato vikārāḥ syur nipatanty atimātraśaḥ | tatastato nr̥po
          yāyād daivo mārgaḥ sa ucyate ||
      - ab@verse[n=20]: nimitteṣu mahāśāntim ulkāyāṃ ca viśeṣataḥ | kr̥tvā siddʰim
          avāpnoti ulkādoṣāc ca mucyate ||
  - pariśiṣṭa[n=59]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: vidyullakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: ata ūrdʰvaṃ pravakṣyāmi
          vidyullakṣaṇam uttamam | varṇarūpavikārāṃś ca deśabʰāgāñ śubʰāśubʰān ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: caturtʰīṃ pañcamīṃ caiva
          pratīkṣeta sadā śuciḥ | āṣāḍʰaśuddʰe niyataṃ vidyuddarśanam adbʰutam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: ativr̥ṣṭim anāvr̥ṣṭiṃ
          bʰāvābʰāvau tatʰaiva ca | sarvasasyeṣu niṣpattir vidyuto darśane naraḥ ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: aindryāṃ cet syandate
          vidyud aindrastʰaś cāpi mārutaḥ | subʰikṣaṃ kṣemam ārogyaṃ nirītiṃ ca vinirdiśet
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: āgneyyāṃ ced ubʰau syātāṃ
          bʰayaṃ śastrāgnivr̥ṣṭihtaḥ | yāmyāyāṃ viṣamāriś ca vyādʰimr̥tyubʰayaṃ tatʰā
          ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: kanīyasī tu nairr̥tyāṃ
          tatʰā bahvītikā samā | madʰyamā sasyasaṃpattir vāruṇyāṃ vyādʰisaṃkulā ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: pataṃgadaṃśamaśakā vāyavyāṃ
          madʰyasapadaḥ | ativāribʰayaṃ vidyāt saumyāyāṃ bʰūrisaṃpadaḥ ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: nirītiḥ sasyasaṃpat tu
          pradʰānāiśyāṃ manoramā | pratilomeṣu vāteṣu ītibāhulyam ādiśet ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: anulomeṣu vāteṣu nirītiṃ
          tu samādiśet | śubʰāyāṃ syandamānāyām aniṣṭā syandate yadi ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃpadyate mahāsasyān
          mahāṃś cet syād avagrahaḥ | aśubʰā syandate pūrvaṃ yadi paścāc ca śobʰanā
          ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: suvr̥ṣṭim eva tatrāhur
          na ca sasyaṃ samr̥dʰyati | yadā tu sarvāḥ syandante viṣamāṃ vr̥ṣṭim ādiśet
          ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: bahulāyāṃ vidyuti tu
          bahuvāribʰayaṃ bʰavet | savidyutaḥ sastanito darśayanti yadā śubʰām ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: pūrvottarāṃ diśaṃ megʰāḥ
          suvr̥ṣṭiṃ tāṃ vijānate | pūrvataḥ pūrvavarṣeṣu dr̥śyante yadi toyadāḥ ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: pradakṣiṇāvartaśubʰāḥ
          suvr̥ṣṭim iti nirdiśet | āgneyeṣv ativr̥ṣṭiḥ syāt sasyaṃ cāpi vipadyate
          ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: viṣamā vr̥ṣṭir yāmyeṣu
          vyādʰiṃ mr̥tyuṃ ca nirdiśet | bahvītikā nairr̥teṣu samūlapʰaladāyinī ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: vāruṇeṣu payodeṣu madʰyamaṃ
          sasyam ādiśet | vāyavyāṃ pratʰamaṃ varṣaṃ yatra varṣati vāsavaḥ ||
      - ab@verse[n=17,lg=san-Latn-x-vedic-metric-unacc-tld]: tatrātivr̥ṣṭir bʰavati
          svalpabījāni vāpayet | varṇasnebʰopapannās tu pūrvavr̥ṣṭyāṃ payodʰarāḥ ||
      - ab@verse[n=18]: saumyāṃ yatra pravarṣeyus tatra sarvavr̥ṣṭyāṃ payodʰarāḥ ||
      - ab@verse[n=19,lg=san-Latn-x-vedic-metric-unacc-tld]: ity etat pūrvavarṣeṣu
          lakṣaṇaṃ vidyutāṃ spʰuṭam | varṣārāvagataṃ sarvaṃ yatʰāvat parikīrtitam
          ||
      - ab@verse[n=20,lg=san-Latn-x-vedic-metric-unacc-tld]: śubʰeṣv api mahāśāntir
          avigʰātāya vocyate | aśubʰeṣu samargʰāya tasmāt sarveṣu śāntikam iti ||
  - pariśiṣṭa[n=60]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: nirgʰātalakṣaṇam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: aṣṭau bʰavanti nirgʰātās teṣām indraḥ praśasyate | pūrveṇa
          vr̥ṣṭiṃ sasyaṃ ca rājavr̥ddʰiṃ ca nirdiśet ||
      - ab@verse[n=2]: pūrvottare subʰikṣaṃ tu bʰūmilābʰas tatʰottare | aparottare
          caurabʰayaṃ vājināṃ cāpy upadravaḥ ||
      - ab@verse[n=3]: paścimāyāṃ bʰayaṃ rājño jalajātiś ca pīḍyate | nairr̥te sasyagostrīṇāṃ
          gaṇānāṃ ca mahad bʰayam ||
      - ab@verse[n=4]: dakṣiṇe rājapīḍā syād āyuś cātra vinirdiśet | ānartasya bʰayaṃ
          vidyād yadi syāt pūrvadakṣiṇaḥ ||
      - ab@verse[n=5]: sa yojanaparaḥ śabdo nirgʰātasya viśāmyati | sarvatra ca bʰayaṃ
          vidyāt tatra yatra viśāmyati ||
      - ab@verse[n=6]: bʰaye raudrīṃ prakurvīta abʰayāṃ vābʰayapradām | tayā śāmyanti
          cotpātāḥ sukʰaṃ cātyantikaṃ bʰavet ||
  - pariśiṣṭa[n=61]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: pariveṣalakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: om atʰātaḥ pariveṣāṇāṃ
          lakṣaṇaṃ caiva vakṣyate | vr̥ddʰagargo yatʰā pūrvam uvāca mama suvrata ||
      - ab@verse[n=2]: svāyaṃbʰuvaniyogena vikāraṃ kurute 'malaḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: śvetaḥ śyāmo hariḥ kr̥ṣṇa
          iti varṇā vyavastʰitāḥ | proktā megʰeṣu catvāro vyaktāḥ snigdʰāḥ supūjitāḥ
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: snigdʰeṣu pariveṣeṣu vaturṣv
          eteṣu nārada | saṃdʰyāyām atra varṇeṣu vr̥ṣṭiṃ teṣv abʰinirdiśet ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: kācanīlāñjanāriṣṭāśanisarpanibʰeṣu
          ca | raupyadravasamābʰeṣu megʰas triṣv api varṣati ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: nimagnā tu yadā saṃdʰyā
          bʰavaty etat suvr̥ṣṭaye | ebʰyaś ca viparītā ye te 'vr̥ṣṭibʰayadā gʰanāḥ
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: varāhair makarair uṣṭrair
          vr̥kaiḥ kaṅkais tatʰā kʰaraiḥ | śaśakākr̥tayaḥ kuryuḥ saṃdʰyāyāṃ jaladā
          bʰayam ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: hemapāvakavarṇāś ca vipulaṃ
          ca janakṣayam | śabdaṃ śvakʰaragomāyugr̥dʰravāyasasaṃstʰitāḥ ||
      - ab@verse[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]: pūrvāparāsu saṃdʰyāsu
          saṃgrāmaṃ prāhur unmukʰāḥ | aśvastʰā vāraṇastʰāś ca yeṣu yodʰā narā iva
          ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: megʰeṣu saṃpradr̥śyante
          ye pāśāṅkuśasaṃnibʰāḥ | tatʰā savāraṇāś caiva vinigʰnantaḥ parasparam ||
      - ab@verse[n=11,lg=san-Latn-x-vedic-metric-unacc-tld]: kravyādbʰir bʰakṣyamāṇāś
          ca gr̥dʰragomāyuvāyasaiḥ | udyudʰyante yadā yuktā rāñjaḥ saṃśayakārakāḥ
          ||
      - ab@verse[n=12,lg=san-Latn-x-vedic-metric-unacc-tld]: mayūrāṭṭālapadmendukāśanīlanibʰāni
          tu | saṃdʰyāsv abʰrāṇi dr̥śyante tīvraṃ varṣam upastʰitam ||
      - ab@verse[n=13,lg=san-Latn-x-vedic-metric-unacc-tld]: savidyut sadʰanuṣkaś
          ca sagʰoṣaḥ śikʰisaṃnibʰaḥ | saṃdʰyāsv abʰrāṇi dr̥śyante tīvraṃ varṣam upastʰitam
          ||
      - ab@verse[n=14,lg=san-Latn-x-vedic-metric-unacc-tld]: nīlalohitaparyantaṃ kr̥ṣṇagrīvaṃ
          savidyutam | vivarṇaṃ parigʰaṃ dr̥ṣṭvā vidyād udakavāhakam ||
      - ab@verse[n=15,lg=san-Latn-x-vedic-metric-unacc-tld]: trivarṇe parigʰe vāpi
          trivarṇair vā balāhakaiḥ | udayāstamayam iyād yadi sūryaḥ kadā cana ||
      - ab@verse[n=16,lg=san-Latn-x-vedic-metric-unacc-tld]: pr̥tʰivyāṃ rājavaṃśyānāṃ
          mahad bʰayam upastʰitam | lokakṣayakaraṃ vidyād yadi devo na varṣati ||
      - ab@verse[n=17,lg=san-Latn-x-vedic-metric-unacc-tld]: matsyarūpī sādr̥śyena
          yady uttiṣṭʰeta bʰāskaraḥ | spʰuṭaraśmis tadādityaḥ sa nirdahati medinīm
          ||
      - ab@verse[n=18,lg=san-Latn-x-vedic-metric-unacc-tld]: etad dr̥ṣṭvā mahad rūpam
          āditye samupastʰite | vispaṣṭaṃ jyotir vispaṣṭaṃ sadyovarṣasya lakṣaṇam
          ||
      - ab@verse[n=19,lg=san-Latn-x-vedic-metric-unacc-tld]: grahasaṃcʰādanaṃ cāpi
          garjanaṃ pratigarjanam | paraspareṇa kurvanti megʰā vegasamīritāḥ ||
      - ab@verse[n=20,lg=san-Latn-x-vedic-metric-unacc-tld]: tasmiṃś caturvidʰe yuddʰe
          megʰānāṃ vyomacārinām | utpadyante trayo bʰāvās tan me nigadataḥ śr̥ṇu ||
      - ab@verse[n=21,lg=san-Latn-x-vedic-metric-unacc-tld]: garjamāneṣu megʰeṣu vāraṇaḥ
          pratigarjati | tāṃ diśaṃ yojayet snenāṃ garjanaṃ yatra mīyate ||
      - ab@verse[n=22,lg=san-Latn-x-vedic-metric-unacc-tld]: vidyuto 'bʰravikāreṣu
          śakrāyudʰanibʰāyudʰāḥ | spʰoṭitāśanigʰaṇṭāś ca yāṃ diśaṃ megʰavāraṇāḥ ||
      - ab@verse[n=23,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃgʰaṭṭeṣu samudbʰutāḥ
          parasparajigʰāṃsavaḥ | tāṃ diśaṃ yojayet senāṃ rājā jayati tāṃ diśam ||
      - ab@verse[n=24,lg=san-Latn-x-vedic-metric-unacc-tld]: grahaṇācʰādane caiva
          garjane pratigarjane | evam eva vidʰir jñeyaḥ sarvaś caiva viniścayaḥ ||
      - ab@verse[n=25,lg=san-Latn-x-vedic-metric-unacc-tld]: parimāṇaṃ na śakyaṃ tat
          samīritum aśeṣataḥ | aparābʰravikārāṇāṃ ratnānām iva sāgare ||
      - ab@verse[n=26,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃdʰyā yojanabʰāk proktā
          stanitaṃ tu dviyojanam | parigʰaḥ pañcayojanyaḥ pratyādityas triyojanaḥ
          ||
      - ab@verse[n=27,lg=san-Latn-x-vedic-metric-unacc-tld]: nirgʰātaḥ ṣaṭ tatʰā vidyut
          pariveṣo dviṣaḍyataḥ | dāhaṃ yojanakaṃ cāpi ulkā tv amitabʰāginī ||
      - ab@verse[n=28,lg=san-Latn-x-vedic-metric-unacc-tld]: daśasaṃstʰā samāptāni
          śāyāṅgāni pramāṇataḥ | aṅgāni tv āntarikṣāṇi vijñeyāni samāsataḥ ||
  - pariśiṣṭa[n=62]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: bʰūmikampalakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ catvāro bʰumikampās
          tu gargaḥ provāca buddʰimān | agnir vāyus tatʰāpaś ca caturtʰas tv indra
          ucyate ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: teṣāṃ rūpaṃ vikārāṃś ca
          vyākʰyāsyāmo 'nupūrvaśaḥ | yaj jñātvā buddʰimān dʰīro nirdiśed vividʰaṃ
          pʰalam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: prakampitāyāṃ bʰūmau cet
          saptāhābʰyantareṇā tu | [bʰaveyur atra saṃgrāmā rājñāṃ mr̥tyubʰayapradāḥ
          ||
      - ab@verse[n=4]: rājñāṃ virodʰo bʰavati maraṇāni bʰavanti ca |] tāmraḥ sūryaś
          ca candraś ca pītāś ca mr̥gapakṣiṇaḥ ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: diśaḥ sarvā bʰaveyuś ca
          sūryodayasamaprabʰāḥ | yad etallakṣaṇopetaṃ vidyād agniprakampitam ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: tasmin bʰavati nirdeśaḥ
          śaunakasya vaco yatʰā | hiraṇyaṃ ca suvarṇaṃ ca yac cānyad vidyate gr̥he
          ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: sarvam etat parityajya
          kartavyo dʰānyasaṃgrahaḥ | rāṣṭrāṇi saṃdahed agnir grāmāṃś ca nagarāṇi ca
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃgrāmāś cātra vartante
          māṃsaśoṇitakardamāḥ | rājānaś ca virudʰyante devaś cātra na varṣati ||
      - ab@verse[n=9]: evam etatprakampānāṃ garhitam agnikampitam ||
    - section[n=2]:
      - ab@verse[n=1]: prakampitāyāṃ bʰūmau ced iti ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: atipracaṇḍo bahulo vāyur
          bʰavati dāruṇaḥ | śarkarākarṣaṇaś cāpi dikṣu caiva vidikṣu ca ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: tad etallakṣaṇopetaṃ vidyād
          vāyuprakampitam | śastrair āvaraṇaṃkuryāt prākāraṃ parikʰāṃ tatʰā ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: na tadā pravased grāmaṃ
          jñātvātmānaṃ tu gopayet | saṃgrāmāś cātra vardʰante māṃsaśoṇitakardamāḥ
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: virudʰyante ca rājāno
          maraṇāni bʰavanti hi | rājaputrasahastrāṇāṃ bʰūmiḥ pibati śoṇitam ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: māsaṃ viṃśatirātraṃ vā
          devas tatra na varṣati | dvābʰyāṃ gatābʰyāṃ māsābʰyāṃ paraṃ syād bahulaṃ
          jalam ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: daṣṭaṃ dūṣayate cātra
          kṣatabaddʰāni cādʰikam | eṣām eva tu kampānāṃ garhitaṃ vāyukampitam ||
    - section[n=3]:
      - ab@verse[n=1]: prakampitāyāṃ bʰūmau ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: varṣantas tu samāyānti
          mahāmegʰāḥ samantataḥ | nakrāś ca śiśumārāś ca kūrmā makarasaṃstʰitāḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: abʰrākr̥tiṣu dr̥śyante
          grasantaś candrabʰāskarau | tad etallakṣaṇopetaṃ vidyād ambuprakampitam
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: parvateṣu vaped bījam
          ūṣare jāṅgale tatʰā | tatroptaṃ nandate bījam anyatra bʰuvi naśyati ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: udajāni tu puṣpāṇi mūlāni
          ca pʰalāni ca | gaccʰanti tatra vr̥ddʰiṃ ca sattvāny udakajāni ca ||
      - ab@verse[n=6]: '[kṣemaṃ subʰikṣam ārogyaṃ suvr̥ṣṭiṃ cātra nirdiśet] ||'
    - section[n=4]:
      - ab@verse[n=1]: prakampitāyāṃ bʰūmau ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: gambʰīraṃ garjamānas tu
          megʰa āyāti pārtʰivaḥ | snigdʰo hy añjanasaṃkāśaḥ sumahatparvatopamaḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: vitrāsayan diśaḥ sarvā
          drutaṃ cāpi pravarṣati | indrāyudʰaṃ bʰavec cātra vidyut stanitam eva ca
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: suvr̥ṣṭiṃ kṣemam ārogyaṃ
          subʰikṣaṃ paramā mudaḥ | yajñodbʰavais tu modante ānandair moditāḥ prajāḥ
          ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: eteṣāṃ bʰūmikampānāṃ praśastaṃ
          hīndrakampanam | jānīyāl lakṣaṇair etaiḥ sarvam eva śubʰāśubʰam ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: eteṣu triṣu kampeṣu atʰarvā
          śāstrakovidaḥ | māhendrīm amr̥tāṃ vāpi kuryāc cʰāntiṃ sadakṣiṇām ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: indrakampe tu vidʰivad
          aindrair mantrair vidʰānavit | tatohalasya pradʰānārtʰaṃ juhuyāc ca japet
          tatʰā ||
  - pariśiṣṭa[n=63]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: nakṣatragrahotpātalakṣaṇam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: om atʰa paraṃ pravakṣyāmi
          vakṣatreṣu graheṣu ca | pariveṣān bahuvidʰān nānāvidʰapʰalodayān ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: aindravāruṇakauberān raktapāṇḍuramecakān
          | pāṇḍūn babʰrūṃś ca pītāṃś cānīlānalayamātmanaḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: prājāpatyāṃś ca raudrāṃś
          ca nairr̥tyāṃś cāpi bʰārgava | hariśabalakāpotān pariveṣān uvāca ha ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: navaite pariveṣāṇāṃ varṇā
          daivatayonayaḥ | bahutvam ete gaccʰanti anyonyaguṇasaṃśrayāt ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: gr̥hītvābʰrarajaḥ sūkṣmaṃ
