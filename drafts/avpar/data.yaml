    - section[n=26]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: yāni nakṣatrāṇi divy antarikṣe
          apsu bʰūmau yāni nageṣu dikṣu | prakalpayaṃś candramā yāny eti sarvāṇi mamaitāni
          śivāni santu ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: aṣṭāviṃśāni śivāni śagmāni
          saha yogaṃ bʰajantu me | yogaṃ prapadye kṣemaṃ ca kṣemaṃ prapadye yogaṃ
          ca namo 'horātrābʰyām astu ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: svastitaṃ me suprātaḥ
          susāyaṃ sudivaṃ sumr̥gaṃ suśakunaṃ me astu | suhavam agne svasty amartyaṃ
          gatvā punar āyābʰinandan ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: anuhavaṃ parihavaṃ parivādaṃ
          parikṣavam | sarvair me riktakumbʰān parā tānt savitaḥ suva ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: apapāpaṃ parikṣavaṃ puṇyaṃ
          bʰakṣīmahi kṣavam | śivā te pāta nāsikāṃ puṇyagaś cābʰimehatām ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: imā yā brahmaṇaspate viṣūcīr
          vāta īrate | sadʰrīcīr indra tāḥ kr̥tvā mahyaṃ śivatamās kr̥dʰi ||
      - ab@verse[n=7]: svasti no astv abʰayaṃ no astu namo 'horātrābʰyām astu ||
    - section[n=27]:
      - ab@verse[n=1]: dadʰyodanaṃ bʰuktvā kr̥ttikābʰir abʰyudiyāt siddʰārtʰo haiva
          punar āgaccʰati ||
      - ab@verse[n=2]: ārṣabʰena māṃsena rohiṇyāṃ mr̥gamāṃsair mr̥gaśirasi rudʰiram
          ārdrāyāṃ gr̥hapatibʰaktaṃ punarvasvoḥ gʰr̥tapāyasaṃ puṣye sarpir māṃsair
          aśleṣāsu
      - ab@verse[n=3]: etāni kʰalu prāgdvārāṇi nakṣatrāṇi bʰavanti ||
      - ab@verse[n=4]: sa yatraiva prācīṃ diśam abʰyuttʰitaḥ śastrahastena vā kaṇṭʰahastena
          vā vadʰyagʰātena vā sameyān nivartetārvāk kʰalv etat krośād ūrdʰvaṃ krośād
          avyāgʰātukam artʰasya bʰavati ||
    - section[n=28]:
