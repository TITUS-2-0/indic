      - ab@verse[n=15]: oṃ namo mahāpiṅgalāya siṃhanādanādine namaḥ svāhā || ity astramantraḥ
          ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: eṣām uccʰuṣmarudrāṇām ataḥ kalpo nigadyate | atʰarvavedodbʰavānāṃ
          titʰyr̥kṣādyayogataḥ ||
      - ab@verse[n=2]: grāme vātʰāpy araṇye vā pracareta yatʰāvidʰi | sadyaḥsiddʰikarā
          hy ete uccʰuṣmāḥ parikīrtitāḥ ||
      - ab@verse[n=3]: ātmarakṣāṃ diśāṃ bandʰaṃ śikʰābandʰaṃ ca sarvadā | etair eva
          yatʰāyogam ādau kuryād vicakṣaṇaḥ ||
      - ab@verse[n=4]: kʰadirasyodumbarasya tatʰā bilvapalāśayoḥ | dadʰisarpirmadʰuyujāṃ
          śāntānāṃ vāpi bilvataḥ ||
      - ab@verse[n=5]: samitsahasratritayaṃ hutvā śāntir gavāṃ bʰavet | tīkṣṇāsr̥gviṣayuktānāṃ
          pʰaṭkāraś ca vināśane ||
      - ab@verse[n=6]: prayogād apy asiddʰiś cet tatkarmedaṃ samārabʰet | uccʰuṣmarūpī
          bʰakṣayaṃs tīkṣṇaḥ saktūdakāni tu ||
    - section[n=3]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: abʰīṣṭāṃ vā striyaṃ gatvā
          dʰyātvā vā reta utsr̥jet | mūtrāṃ purīṣaṃ cotsr̥jya gokaṅkālādʰirohaṇam
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: kr̥tvā mantraṃ niśi japed
          yāvad gośr̥ṅgataś caret | jvālābʰaṅgaṃ tatas tasya karmasiddʰiṃ samādiśet
          ||
      - ab@verse[n=3]: '[dadʰimadʰugʰr̥tāktānām iti śeṣaḥ] ||'
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: saptakṣīrāñjaligrāsaḥ sruvo hy asmin praśasyate | kṣīraṃ tenātʰa
          juhuyād dʰanakāmasya nityaśaḥ ||
      - ab@verse[n=2]: gʰr̥tena tejaskāmasya āyuḥkāmasya dūrvayā | kukusaṃ tumbaraṃ
          vāpi vidyād uccāṭakarmaṇi ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: brāhmaṇaṃ tu vaśīkartuṃ śālipiṣṭamayīṃ tanum | kr̥tvā catuṣpatʰaṃ
          gatvā gr̥hītvā śastram uttamam ||
      - ab@verse[n=2]: aṣṭottarasahasreṇa kr̥tvā tadabʰimantraṇam | aṣṭāṅgaṃ tena
          tāṃ cʰitvā mantrato vaśam ānayet ||
      - ab@verse[n=3]: aṣṭottarasahasraṃ vā prakr̥te juhuyād budʰaḥ | brāhmaṇīṃ tu
          vaśīkartuṃ kuryān māṣamayīṃ tanum ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: sarpirdadʰimadʰvaktānāṃ lājānām āhutīḥ śubʰāḥ | kanyākāmo 'ṣṭasahasraṃ
          hutvā kanyām avāpnuyāt ||
      - ab@verse[n=2]: api vā piṣṭamayyāḥ prāg juhuyāt saṃdʰyayāhutīḥ | darbʰeṣīkāṃ
          vābʰimantrya tadgr̥he niścalāṃ nyaset ||
      - ab@verse[n=3]: tāvad udvejayet sā tu vajrabʰūtā hi tadgr̥ham | kanyāyāḥ sādʰanīyāyās
          [tu] yāval lābʰas tato bʰavet ||
    - section[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: pradʰānam anyaṃ vā kiṃ cid vaśīkartuṃ narottamam | samidʰaḥ
          kʰadirādīnām audumbaryaś ca homayet ||
      - ab@verse[n=2]: śmaśānakʰaṭvāṅgamayīṃ homayen mantrasādʰane | palāṇḍulaśunaprastʰaṃ
          hutvā mastaṃ na saṃśayaḥ ||
      - ab@verse[n=3]: śirīṣāṅgamayīṃ rājño balis trimadʰureṇa tu | brāhmaṇe pāyasamayīṃ
          kṣatriyasya viṣāṇikām ||
      - ab@verse[n=4]: vaiśyasya sādʰane homyāś cūrṇaiḥ surabʰisaṃskr̥tāḥ | catuṣpatʰe
          tu śūdrasya padminyutkaraṇena tu ||
    - section[n=8]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: likʰitvā nāma saṃgr̥hya
          karāgrāṅgulipīḍitām | śiraḥpīḍā jvaraḥ śūlaṃ vimatiḥ svastyasaṃgatiḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: balyādyā vā prayoktavyā
          brāhmaṇādicatuṣṭaye | evaṃ saty abʰicāraś ca caturṇām api darśitaḥ ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: liṅgaṃ vā rājasarṣapaiḥ
          samālikʰyātʰa dʰūpayet | gaurair argʰaṃ tatʰā dadyān mriyate sāpy asaṃśayam
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: abʰakṣabʰakṣo hy asvāstʰyaṃ
          sarvarogaprakopanam | niḥsaṃjñatā piṇḍapāto japāvr̥ttyā bʰavanti hi ||
      - ab@verse[n=5]: ekādaśaṃ na japtavyaṃ kulotsādas tato bʰavet ||
    - section[n=9]:
      - ab@verse[n=1]: oṃ namo mahāpiṅgalāya trivr̥te trivr̥te namaḥ svāhā ||
      - ab@verse[n=2]: namaḥ sarāntitevatevasu trivr̥te trivr̥te triparvaṇe triśīrṣāya
