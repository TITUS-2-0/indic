      - ab@verse[n=5]: yadā śīte bʰavaty uṣṇam uṣṇe śītam atīva ca | navamāsāt paraṃ
          vidyāt teṣu deśeṣu vai bʰayam ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
