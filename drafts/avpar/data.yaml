    - section[n=132]:
      - p: agniḥ | jātavedāḥ | vaiśvānaraḥ | draviṇodāḥ | vanaspatir iti sūktabʰāñji
          ||
    - section[n=133]:
      - p: idʰmaḥ | [viṣṇuḥ |] tanūnapāt | narāśaṃsaḥ | devīr dvāraḥ | uṣāsānaktā
          | daivyā hotārā | tisro devīḥ | tvaṣṭā | vanaspatiḥ | svāhākr̥taya iti nipātabʰāñji
          ||
    - section[n=134]:
      - p: indraḥ | viṣṇuḥ | somaḥ | parjanyaḥ | r̥tuḥ | agnāyī | pr̥tʰivī | iḍā |
          bʰr̥gavaḥ | atʰarvāṇa iti saṃstavikās tasyaikavad bahuvat strīvac ca ||
    - section[n=135]:
      - p: vahanam <ca haviṣām āvāhanaṃ ca> devānāṃ yac ca dāeṣṭiviṣayikaṃ tad asya
          karma ||
    - section[n=136]:
      - p: ayaṃ lokaḥ | vasantaḥ | prātaḥsavanam | gāyatrī trivr̥d ratʰaṃtaram iti
          tadbʰaktīni ||67 ||
    - section[n=137]:
      - p: vāyuḥ | varuṇaḥ | indraḥ | rudraḥ | parjanyaḥ | br̥haspatiḥ | brahmaṇaspatiḥ
          | vāstoṣpatiḥ | kṣetrasya patiḥ | kaḥ | yamaḥ | apāṃ napāt | mitraḥ | viśvakarmā
          | manyuḥ | tārkṣyaḥ | dadʰikrāḥ | sarasvān | agniḥ | asunītiḥ | vājaḥ |
          kutaḥ | vātaḥ | r̥taḥ | mr̥tyuḥ | dʰātā | vidʰātā | purūravāḥ | gandʰarvāḥ
          | anaḍvān | prāṇāḥ | stambʰaḥ | vrātya iti sūktabʰāñji ||
    - section[n=138]:
      - p: prajāpatiḥ | candramāḥ | somaḥ | induḥ | aditiḥ | dʰenavaḥ | ahir budʰnya
          iti nipātabʰāñji ||
    - section[n=139]:
      - p: sarasvatī | vāk | aditiḥ | urvaśī | gauḥ | dʰenuḥ | saramā | uṣā | indrāṇī
          | pr̥tʰivī | dasya | godʰukasā | virāṭ | agʰnyā | sinīvālī | kuhūḥ | anumatiḥ
          | rākā | yamī | saraṇyūḥ | patʰyā | rodasī | devapatnyaḥ | marutaḥ | rudrāḥ
          | r̥bʰavaḥ | aṅgirasaḥ | bʰr̥gavaḥ | atʰarvāṇa iti saṃstavikās tasyaikavad
          bahuvat strīvac ca ||
    - section[n=140]:
      - p: snehānupradānaṃ vr̥travadʰo yā cakā ca balakr̥tis tad asya karma ||
    - section[n=141]:
      - p: antarikṣalokaḥ | grīṣmaḥ | madʰyaṃdinaṃ savanam | triṣṭup pañcadaśaḥ |
          br̥had iti tadbʰaktīni ||68 ||
    - section[n=142]:
      - p: ādityaḥ | savitā | bʰagaḥ | sūryaḥ | pūṣā | viṣṇuḥ | keśī | viśvānaraḥ
          | vr̥ṣākapiḥ | kālaḥ | brahmacārī | rohita iti sūktabʰāñji ||
    - section[n=143]:
      - p: dadʰyaṅ | atʰarvā | yamaḥ | aja ekapāt | manuḥ | vivasvān | dakṣaḥ | aryamā
          | vaiśvānaraḥ | suparṇa iti nipātabʰāñji ||
    - section[n=144]:
      - p: uṣāḥ | sūryā | vr̥ṣākapāyī | sādʰyāḥ | vasavaḥ | ādityā | sapta r̥ṣayaḥ
          | vājinaḥ | viśve devā iti saṃstavikās tasyaikavad bahuvat strīvac ca ||
    - section[n=145]:
      - p: <rasādānam> raśmibʰiś ca rasādʰāraṇaṃ yac ca <pravalhitam> tad asta karma
          ||
    - section[n=146]:
      - p: asya lokaḥ | varaṣās | tr̥tīyasavanam | jagatī | saptadaśaḥ | vairūpām
          iti tadbʰaktīni ||
    - section[n=147]:
      - p: eteṣām eva lokānām r̥tucʰandaḥstomapr̥ṣṭʰānām ānupūrveṇa bʰaktiśeṣo 'nukalpo
    - section[n=148]:
      - p: devatādvandve ca pūrvasyāparaḥ saṃstavikaḥ || pūrvasyāparaḥ saṃstavikaḥ
          ||69 ||
  - pariśiṣṭa[n=49]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: caraṇavyūhaḥ
    - section[n=1]:
      - ab@verse[n=1]: om atʰātaś caraṇavyūhaṃ vyākʰyāsyāmaḥ ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: tatra catvāro vedā bʰavanti
          | r̥gvedo yajurvedaḥ sāmavedo brahmavedaś ceti ||
      - ab@verse[n=3]: tatra r̥gvedasyārtʰaśāstram upavedaḥ | yajurvedasya dʰanurvedopavedaḥ
          | sāmavedasya gāndʰarvavedopavedaḥ | brahmavedasyāyurvedopavedaḥ | abʰicārakārtʰaśāstram
          ity ucyate ||
      - ab@verse[n=4]: r̥gveda ātreyasagotro 'gnir devatā | yajurvedaḥ kāśyapasagotro
          vāyur devatā | sāmavedo bʰāradvājasagotro viṣṇur devatā | brahmavedo vaitāyanasagotro
          brahmā devatā ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: atʰāta r̥gvedaḥ pītavarṇaḥ
          padmapattrākṣaḥ suvibʰaktagrīvaḥ kuñcitakeśaśmaśruḥ supratiṣṭʰitajānujaṅgʰaḥ
          | pramāṇena sa vitastayaḥ pañca ||
      - ab@verse[n=6]: tatra r̥gvedasya sapta śākʰā bʰavanti | tad yatʰā | āśvalāyanāḥ
          | śāṅkʰāyanāḥ | sādʰyāyanāḥ | śākalāḥ | bāṣkalāḥ | audumbarāḥ | māṇḍūkāś
          ceti ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: teṣām adʰyayanam | r̥cāṃ
          daśa sahasrāṇi r̥cāṃ pañca śatāni ca | r̥cām aśītiḥ pādaś ca etat pāraṇam
          ucyate ||
    - section[n=2]:
      - ab@verse[n=1]: tatra yajurvedasya caturviṃśatir bʰedā bʰavanti || tad yatʰā
          | kāṇvāḥ | mādʰyaṃdināḥ | jābālāḥ | śāpeyāḥ | śvetāḥ | śvetatarāḥ | tāmrāyaṇīyāḥ
          | paurṇavatsāḥ | āvaṭikāḥ | paramāvaṭikāḥ | hauṣyāḥ | dʰauṣyāḥ | kʰāḍikāḥ
          | āhvarakāḥ | carakāḥ maitrāḥ | maitrāyaṇīyāḥ | hāritakarṇāḥ | śālāyanīyāḥ
          | marcakaṭʰāḥ | prācyakaṭʰāḥ | kapiṣṭʰalakaṭʰāḥ | upalāḥ | taittirīyāś ceti
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: teṣām adʰyayanam | dve
          sahasre śate nyūne vede vājasaneyake | sakalaṃ parisaṃkʰyātaṃ brāhmaṇaṃ
          tu caturguṇam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: aṣṭādaśa śatāni bʰavanti
          | tāny eva triguṇam adʰītya kramapāro bʰavati | saptasu vīrāś ceti ||
      - ab@verse[n=4]: śākʰās tisro bʰavanti | tad yatʰā | vārcikam artʰādʰyayanīyāḥ
          | pāraścaryāḥ | pāraśramaṇīyāḥ | pārakramavaṭaḥ | kramapāraś ceti ||
      - ab@verse[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]: ṣaḍ aṅgāny adʰītya ṣaḍaṅgavid
          bʰavati | śikṣā kalpo vyākaraṇaṃ niruktaṃ cʰando jyotiṣam iti ṣaḍ aṅgāni
          ||
      - ab@verse[n=6]: atʰa yajurvedaḥ prāṃśuḥ pralambajaṭʰaraḥ stʰūlagalakapālo rakto
          varṇena prādeśāḥ ṣaḍ dīrgʰatvena yajurvedasyaitad rūpaṃ bʰavati ||
    - section[n=3]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: tatra sāmavedasya śākʰāsahasram
          āsīd anadʰyāyeṣv adʰīyānāḥ sarve te śakreṇa vinihatāḥ | [pravilīnās]
      - ab@verse[n=2]: tatra ke cid avaśiṣṭāḥ pracaranti | tad yatʰā | rāṇāyanīyāḥ
          | sādyamugrāḥ | kālapāḥ | mahākālapāḥ | kautʰumāḥ | lāṅgalikāś ceti ||
      - ab@verse[n=3]: kautʰumānāṃ ṣaḍ bʰedā bʰavanti | tad yatʰā | sārāyaṇīyāḥ |
          vātarāyaṇīyāḥ | vaitadʰr̥tāḥ | prācīnās tejasāḥ | aniṣṭakāś ceti ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: teṣām adʰyayanam | aṣṭau
          sāmasahasrāṇi sāmāni ca caturdaśa | sohyāni sarahasyāni etat sāmagaṇaṃ smr̥tam
          ||
      - ab@verse[n=5]: atʰa sāmavedaḥ suvarcāḥ sugandʰis tejasvī mr̥duvaktā brahmaṇyaḥ
          pralambabāhur duścarmī kr̥ṣṇo varṇena kātaraḥ svareṇeti ||
      - ab@verse[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]: ṣaḍaratniḥ pramāṇena ca
          smr̥taḥ | stuvanty r̥ṣayo brahmā sāmāni tiṣṭʰati saṃnidʰau sa bʰagavān sāmavedo
          maheśvarabʰaktaḥ ||
    - section[n=4]:
      - ab@verse[n=1]: tatra brahmavedasya nava bʰedā bʰavanti | tad yatʰā | paippalādāḥ
          | staudāḥ | maudāḥ | śaunakīyāḥ | jājalāḥ | jaladāḥ | brahmavadāḥ | devadarśāḥ
          | cāraṇavaidyāś ceti |
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: teṣām adʰyayanam | r̥cāṃ
          dvādaśa sahasrāṇy aśītis triśatāni ca | paryāyikaṃ dvisahasrāṇy anyāṃs caivārcikān
          bahūn ity
      - ab@verse[n=3]: etadgrāmyāraṇyakāni ṣaṭ sahasrāṇi bʰavanti ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: tatra brahmavedasyāṣṭāviṃśatir
          upaniṣado bʰavanti | muṇḍakā praśnakā brahmavidyā kṣurikā cūlikā atʰarvaśiro
          atʰarvaśikʰā garbʰopaniṣan mahopaniṣad brahmopaniṣat prāṇāgnihotraṃ māṇḍukyaṃ
          nādabindu brahmabindu amr̥tabindu dʰyānabindu tejobindu yogaśikʰā yogatattvaṃ
          nīlarudraḥ pañcatāpinī ekadaṇḍī saṃnyāsavidʰiḥ aruṇiḥ haṃsaḥ paramahaṃsaḥ
          nārāyaṇopaniṣad vaitatʰyaṃ ceti ||
      - ab@verse[n=5]: tatra gopatʰaḥ śataprapāṭʰakaṃ brāhmaṇam āsīt tasyāvaśiṣṭe
          dve brāhmaṇe pūrvam uttaraṃ ceti ||
      - ab@verse[n=6]: tatra ṣaḍ aṅgāny adʰītya ṣaḍaṅgavid bʰavati ṣaḍ aṅgāni bʰavanti,
          śikṣā kalpo vyākaraṇaṃ niruktaṃ cʰando jyotiṣam iti ||
      - ab@verse[n=7,lg=san-Latn-x-vedic-metric-unacc-tld]: paKca kalpā bʰavanti |
          nakṣatrakalpo vaitānakalpas tr̥tīyaḥ saṃhitāvidʰiḥ | caturtʰa āṅgirasaḥ
          kalpaḥ śāntikalpas tu pañcamaḥ ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: lakṣaṇagrantʰā bʰavanti
          | caturādʰyāyikā prātiśākʰyaṃ pañcapaṭalikā dantyoṣṭʰavidʰir br̥hatsarvānukramaṇī
          ceti ||
      - ab@verse[n=9]: tatra dvāsaptatiḥ pariśiṣṭāni bʰavanti kauśikoktāni | kr̥ttikārohiṇī
          | rāṣṭrasaṃvargaḥ | rājapratʰamābʰiṣekaḥ | purohitakarmāṇi | puṣyābʰiṣekaḥ
          | piṣṭarātryāḥ kalpaḥ | ārātrikam | gʰr̥tāvekṣaṇam | tiladʰenuḥ | bʰūmidānam
          | tulāpuruṣaḥ | ādityamaṇḍakaḥ | hiraṇyagarbʰaḥ | hastiratʰaḥ | aśvaratʰaḥ
          | gosahasradānam | hastidīkṣā | aśvadīkṣā | vr̥ṣotsargaḥ | indrotsavaḥ |
          brahmayāgaḥ | skandayāgāḥ | saṃbʰāralakṣaṇam | araṇilakṣaṇam | yajñapātralakṣaṇam
          | vedilakṣaṇam | kuṇḍalakṣaṇam | samillakṣaṇam | sruvalakṣaṇam | hastalakṣaṇam
          | jvālālakṣaṇam | lakṣahomaḥ | kāṅkāyanokto br̥hallakṣahomaḥ | koṭihomaḥ
          | gaṇamālā | gʰr̥takambalam | anulomakalpaḥ | āsurīkalpaḥ | uccʰuṣmakalpaḥ
          | samuccayaprāyaścittāni | brahmakūrcavidʰiḥ | paiṭʰīnasitaḍāgavidʰiḥ |
          pāśupatavratavidʰiḥ | saṃdʰyopāsanavidʰiḥ | snānavidʰiḥ | tarpaṇavidʰiḥ
          | śrāddʰavidʰiḥ | agnihotravidʰiḥ | uttamapaṭalam | varṇapaṭalam | nigʰaṇtuḥ
          | caraṇavyūhaḥ | candraprātipadikam | grahayuddʰam | grahasaṃgrahaḥ | rāhucāraḥ
          | ketucāraḥ | r̥tuketulakṣaṇam | kūrmavibʰāgaḥ | maṇḍalāni | digdāhalakṣaṇam
          | ulkālakṣaṇam | vidyullakṣaṇam | nirgʰātalakṣaṇam | pariveṣalakṣaṇam |
          bʰūmikampalakṣaṇam | nakṣatragrahotpātalakṣaṇam | utpātalakṣaṇam | sadyovr̥ṣṭilakṣaṇam
          | gośāntiḥ | adbʰutaśāntiḥ | svapnādʰyāyaḥ | atʰarvahr̥dayam | bʰārgavīyagārgyabārhaspatyośanasādbʰutāni
          | mahādbʰutāni br̥hatsarvānukramaṇī ceti ||
      - ab@verse[n=10]: tatra pañcadaśopaniṣado bʰavanti | muṇḍakā | praśnakā | brahmavidyā
          | kṣurikā | cūlikā | atʰarvaśiraḥ | atʰarvaśikʰā | garbʰopaniṣat | mahopaniṣat
          | brahmopaniṣat | prāṇāgnihotram | māṇḍūkyam | vaitatʰyam | advaitam | alātaśāntiś
          ceti ||
      - ab@verse[n=11]: tatra brahmavede 'ṣṭādaśa vratāni cariṣyan sāvitrīvratam |
          vedavratam | vedottaravratam | mailavratam | mailottaravratam | mr̥gāravratam
          | rohitavratam | viṣāsahivratam | yamavratam | śāntivratam | śikʰivratam
          | gaṇavratam | śirovratam | śikʰāvratam | marudvratam | adʰivratam | aṅgirovratam
          | pāśupatavrataṃ caret ||
      - ab@verse[n=12]: kr̥ccʰram | taptakr̥ccʰram | atikr̥ccʰram | sarvakr̥ccʰram
          | maundabʰāyaḥ | tulāpuruṣaḥ | sāṃtapanam | mahāsāṃtapanaṃ ceti ||
    - section[n=5]:
      - ab@verse[n=1]: yo vai brahmavedeṣūpanītaḥ sa sarvavedeṣūpanito
      - ab@verse[n=2]: yo vai brahmavedeṣv anupanītaḥ sa sarvavedeṣv anupanītaḥ ||
      - ab@verse[n=3]: anyavede dvijo yo brahmavedam adʰītukāmaḥ sa punar upaneyo
      - ab@verse[n=4]: devāś ca r̥ṣayaś ca brahmāṇam ūcuḥ ||
      - ab@verse[n=5]: ko no [smo] jyeṣṭʰaḥ | ka upanetā | ka ācāryaḥ | ko brahmatvaṃ
          ceti ||
      - ab@verse[n=6]: tān brahmābravīt ||
      - ab@verse[n=7]: atʰarvā vo jyeṣṭʰo 'tʰarvopanetātʰarvācāryo 'tʰarvā brahmatvaṃ
          ceti ||
      - ab@verse[n=8,lg=san-Latn-x-vedic-metric-unacc-tld]: tad apy etad r̥coktam
          | brahmajyeṣṭʰeti etayā |
      - ab@verse[n=9]: iti tasyārhaṃ brahmavedaś caturṇāṃ vedānāṃ sāṅgopāṅgānām [tam]
          savākovākyānāṃ setihāsapurāṇānām ||
      - ab@verse[n=10,lg=san-Latn-x-vedic-metric-unacc-tld]: atʰāto brahmavedaḥ kapilo
          varṇena tīkṣṇaḥ pracaṇḍaḥ kāmarūpī viśvātmā jitendriyaḥ | sa tasmin bʰagavati
          durvārajvālaḥ |
      - ab@verse[n=11]: kṣudrakarmā sa ca bʰagavān brahmavedaś caturmukʰo dvipakṣo
          dānto dʰarmī balavān prājñaḥ kr̥tottʰāpanīyaḥ krūraḥ ṣaḍrātrāṇi vimr̥śī
          [ṣaḍrātrāṇi ṣaḍ] vaitāyano gotreṇa
      - ab@verse[n=12]: ya ekaikasmin vedānāṃ nāmavarṇagotrarūpapramāṇaṃ ca kīrtayed
          yo vidvān jātismaro bʰavati mr̥taḥ sa brahmalokaṃ gaccʰati ||
  - pariśiṣṭa[n=50]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: candraprātipadikam
    - section[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: oṃ vr̥ttaṃ prātar amāvāsyāṃ paścād dr̥śyeta candramāḥ | tasya
          varṇaṃ gatiṃ rūpaṃ stʰānaṃ caivoccanīcatām ||
      - ab@verse[n=2]: hrāsavr̥ddʰiṃ ca śr̥ṅgāṇāṃ nakṣatraṃ yac ca yojayet | tāni
          lakṣeta somasya varṣāvarṣaṃ bʰayābʰayam ||
      - ab@verse[n=3]: pratʰame darśane tv indoḥ samāsādya yadā graham | uttaraṃ vardʰate
          śr̥ṅgaṃ nīcībʰavati dakṣiṇam ||
      - ab@verse[n=4]: evam eva śraviṣṭʰābʰyas teṣām ante ca candramāḥ | udyaccʰed
          dakṣiṇaṃ śr̥ṅgaṃ nīcībʰavati cottaram ||
      - ab@verse[n=5]: anupaśyeta rāṣṭraṃ ca antargirimahāgirim | vidarbʰān madrakāṃś
          caiva bʰaratāṃś cāpi sarvataḥ ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: sārāṇāṃ vijarāṇāṃ ca samudre ye ca dakṣiṇe | etāñ janapadān
          hanti yadā syād uttaronnataḥ ||
      - ab@verse[n=2]: kāśmīrān daradān darvāñ śūrasenān yayāvarān | śālvānāṃ ca virājānāṃ
          samudre ye ca paścime ||
      - ab@verse[n=3]: etāj janapadān hanti yadā syād dakṣinonnataḥ | puruṣaḥ strīnr̥paṃ
          hanti aparānto vinaśyati ||
      - ab@verse[n=4]: bālhikān yavanakāmbojāñ śālvān madrān uśīnarān | godʰāṃś ca
          bʰadrakāṃś caiva madʰyaṃ ca kurubʰiḥ saha ||
      - ab@verse[n=5]: saurāṣṭrān sindʰusauvīrān vāneyāṃś cāpi siṃsakān | kṣudrakān
          mālavān matsyān mleccʰān saha pulindakaiḥ ||
      - ab@verse[n=6]: śastropajījikuḍyāṃś ca brāhmaṇā yodʰinaś ca ye | etāñ janapadān
          hanti somaḥ puruṣalakṣaṇaḥ ||
    - section[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: lakṣaṇād vā bʰavet stʰūlaḥ kāye śr̥ṅge ca hīyate | alpe śarīre
          durbʰikṣaṃ bʰayaṃ rogaṃ vinirdiśet ||
      - ab@verse[n=2]: yadā pratipadaś candraḥ prakr̥tyā vikr̥to bʰavet | anudbʰinno
          vilūno vā rājamr̥tyuṃ vinirdiśet ||
      - ab@verse[n=3]: ṣaṣṭʰyāṃ madʰyaṃ yadā gaccʰed rājā vadʰyeta pārtʰivaḥ | avantīnāṃ
          ca pūrvārdʰaṃ māgadʰāś ca viśeṣataḥ ||
      - ab@verse[n=4]: paraṃ kumāreṣv aṣṭamyāṃ rājānaṃ daśamī param | evaṃ ca pakṣāpacaye
          madʰye dr̥śyeta dvādaśī ||
      - ab@verse[n=5]: hanti pañcanadaṃ tatra rājānaṃ sumahadbalam | sarvāṃś ca kuryād
          rājñas tu tasminn utpātadarśane ||
    - section[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: adbʰutāni ca dr̥śyante tasminn utpātadarśane | vaiśvānarapatʰaṃ
          prāptaḥ samudram api śoṣayet ||
      - ab@verse[n=2]: kr̥ttikānāṃ magʰānāṃ ca rohiṇyāś ca viśākʰayoḥ | eteṣām uttaro
          mārgo rājavītʰīti tāṃ viduḥ ||
      - ab@verse[n=3]: yadīmaṃ mārgam āstʰāya candramā vinivartate | nāvarṣā uttamā
          jñeyā yogakṣemaṃ tatʰaiva ca ||
      - ab@verse[n=4]: gajavītʰīṃ nāgavītʰīṃ yadi gaccʰati candramāḥ | ..... govītʰīti
          tadāpy āhur gargasya vacanaṃ yatʰā ||
      - ab@verse[n=5]: aṣṭau stʰānāni candrasya kroṣṭukir yāni veda vai | naustʰāyī
          lāṅgalī caiva tr̥tīyaś cottaronnataḥ ||
      - ab@verse[n=6]: daṇḍastʰāyī caturtʰas tu daṇḍaśāyī tu pañcamaḥ | ṣaṣtʰas tu
          yūpastʰāyī syāt pārśvaśāyī tu saptamaḥ ||
      - ab@verse[n=7]: aṣṭamo 'vāṅśirāś caiva pʰalam asya nibodʰata | rājānaḥ sveṣu
          rāṣṭreṣu yuktadaṇḍāḥ praśāsati ||
    - section[n=5,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: lāṅgalī grasate lokān yugāntaṃ pratipādayet | mārīṃ samadʰikām
          āhur yadā syād uttaronnataḥ ||
      - ab@verse[n=2]: daṇḍastʰāyī tv amātyānāṃ bʰayaṃ rogaṃ vinirdiśet | śakticʰedā
          grantʰicʰedā gostenāḥ pāradārikāḥ ||
      - ab@verse[n=3]: ete deśān vilumpanti daṇḍastʰāyī yadā bʰavet | daṇḍaśāyī tu
          viprāṇāṃ bʰayaṃ tatra vinirdiśet ||
      - ab@verse[n=4]: yūpastʰāyī tu dʰānyānāṃ bʰayaṃ tatra vinirdiśet | harite śarīre
          somasya paśūnāṃ vadʰam ādiśet ||
      - ab@verse[n=5]: kr̥ṣṇe śarīre somasya śūdrāṇāṃ vadʰam ādiśet | pīte śarīre
          somasya vaiśyānāṃ vadʰam ādiśet
      - ab@verse[n=6]: rakte śarīre somasya rājñāṃ tu vadʰam ādiśet | śukle śarīre
          somasya brahmavr̥ddʰiṃ vinirdiśet ||
    - section[n=6,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: snigdʰaḥ pītaḥ suvarṇābʰaḥ pakṣādau yadi candramāḥ | gostʰāyī
          saṃpradr̥śyeta vipravr̥ddʰiṃ vinirdiśet ||
      - ab@verse[n=2]: uccastʰāne yadā pītaḥ samaśr̥ṅgaḥ śaśī bʰavet | nāgavītʰīgataḥ
          snigdʰaḥ sa sarvaguṇapūjitaḥ ||
      - ab@verse[n=3]: dʰūmrābʰo lāṅgalastʰāyī śrīmān salakṣmamaṇḍalaḥ | pakṣādau
          yadi dr̥śyeta brahmakṣatrasukʰāvaḥ ||
      - ab@verse[n=4]: rājavītʰīṃ tu saṃprāpta ugradaṇḍī yadā bʰavet | haridrākuṅkumābʰaś
          ca śmaśānam avalokayet ||
      - ab@verse[n=5]: mr̥tyuṃ saṃyojayet somo bālākr̥tir avāṅcʰirāḥ | lākṣārudʰirasaṃkāśo
          dʰanuḥstʰāyī yadā bʰavet ||
    - section[n=7]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: saṃgrāmaṃ yojayet somo
          loke tu tumulaṃ bʰayam | dvicandraṃ gaganaṃ dr̥ṣṭvā brūyād brahmavadʰo mahān
          ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: dvau sūryau vā yadā syātāṃ
          tadā kṣatravadʰo mahān | dr̥ṣṭvā tu caturaḥ sūryān uditān sarvatodiśam ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: śastreṇa janamāreṇa tad
          yugāntasya lakṣaṇam | āditye pāṇḍuraṃ cʰattraṃ saṃdʰyāvelāṃ yadā bʰavet
          ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: deśasya vidravaṃ sūryo
          rājamr̥tyuṃ vinirdiśet | ādityasya ratʰaḥ śvetaḥ saṃdʰyāvelāṃ yadā bʰavet
          ||
      - ab@verse[n=5]: pratyāsannaṃ bʰayaṃ vidyāt tasminn utpātadarśane ||
    - section[n=8]:
      - ab@verse[n=1]: ādityaḥ sarvataś cʰinno dvaidʰībʰutaḥ pradr̥śyate. deśasya
          vidravaṃ sūryo rājamr̥tyuṃ vinirdiśet ||
    - section[n=9,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: kṣemaṃ vikukṣile brūyāt stʰālīpiṭʰarasaṃstʰite | saṃkṣipte
          kṣīyate loko durbʰikṣaṃ vajrasaṃstʰite ||
      - ab@verse[n=2]: divā hy asmin pataty ulkā satataṃ kampate mahī | aparvāśaninirgʰoṣāḥ
          saṃdʰyā ca jvalanaccʰavā ||
      - ab@verse[n=3]: nakṣatrapātasyotpattir dʰūmasya rajaso 'pi vā | śr̥ṅgaṃ bʰavaty
          ādityasya tr̥ṇakāṣṭʰaṃ ca śuṣyati ||
      - ab@verse[n=4]: rājāno hy aśivās tatra citraṃ varṣati mādʰavaḥ | dvādaśānāṃ
          tu māsānāṃ madʰye naśyati pārtʰivaḥ ||
      - ab@verse[n=5]: kārttikyāṃ śuklapakṣasya bahulasya trayodaśīm | vidyāt tu svātisaṃpātaṃ
          divasān ekaviṃśatim ||
      - ab@verse[n=6]: saptāhaṃ tu bʰaved goṣu saptāhaṃ mr̥gapakṣiṣu | mānuṣeṣu ca
          saptāhaṃ tataḥ śreyas tu kalpayet ||
  - pariśiṣṭa[n=51]:
    - head:
      - foreign[lg=san-Latn-x-vedic-prose-accented-tld]: grahayuddʰam
    - section[n=1]:
      - ab@verse[n=1,lg=san-Latn-x-vedic-metric-unacc-tld]: oṃ ke cid grahā nārarān
          āśrayante ke cid grahā [jyotiṣi] saṃgrahe ca | graho graheṇaiva hataḥ katʰaṃ
          syād vijñāya tattvaṃ bʰagavān bravītu ||
      - ab@verse[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]: evaṃ sa pr̥ṣṭo munibʰir
          mahātmā provāca gargo grahayuddʰatantram | parājayaṃ caiva jayaṃ ca teṣāṃ
          śubʰāsubʰam(aśubʰamñ) caiva jagaddʰitāya ||
      - ab@verse[n=3,lg=san-Latn-x-vedic-metric-unacc-tld]: arko jātaḥ kaliṅgeṣu yavaneṣu
          ca candramāḥ | aṅgārakas tv avantyāyāṃ magadʰāyāṃ budʰas tatʰā ||
      - ab@verse[n=4,lg=san-Latn-x-vedic-metric-unacc-tld]: br̥haspatiḥ saindʰaveṣu
          mahārāṣṭre tu bʰārgavaḥ | śanaiścaraḥ surāṣṭrāyāṃ rāhus tu giriśr̥ṅgajaḥ
          | ketur malayake jāta ity etad grahajātakam ||
      - ab@verse[n=5]: yasmin deśe tu yo jātaḥ sa grahaḥ pīḍyate yadā taṃ deśaṃ gʰātitaṃ
          vidyād durbʰikṣeṇa bʰayena vā ||
    - section[n=2,lg=san-Latn-x-vedic-metric-unacc-tld]:
      - ab@verse[n=1]: divākaraś caiva śanaiścaras tatʰā br̥haspatiś caiva budʰaś
          ca nāgarāḥ | prajāpatiḥ ketur atʰāpi candramās tatʰaiva rāhūśanasau ca yāyinaḥ
          ||
      - ab@verse[n=2]: yadā graho nagara eva nāgaraṃ vijeṣyate yāyy atʰa vāpi yāyinam
          | tadā nr̥po nāgara eva nāgaraṃ vijeṣyate vāyy atʰa vāpi yāyinam ||
      - ab@verse[n=3]: ārohaṇaṃ ca bʰedaś ca lekʰanaṃ savyadakṣiṇam | raśmisaṃsarjanaṃ
          caiva grahayuddʰaṃ caturvidʰam ||
      - ab@verse[n=4]: prasavye vigrahaṃ brūyāt saṃgrāmaṃ raśmisaṃgame | lekʰane 'mātyapūḍā
          syād bʰedane tu janakṣayaḥ ||
